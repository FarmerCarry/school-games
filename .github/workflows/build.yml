# Test source and the fast build before publishing the verified _site artifact.
# GitHub Actions is the recommended Pages source. Existing main:/ sites also work,
# but their separate built-in Pages workflow can publish source before these checks.
name: Build fast site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test source and fast build
    # Pinned: ubuntu-latest becomes Ubuntu 26 from 19 October 2026. Move on deliberately,
    # once Playwright's --with-deps install supports the new image.
    runs-on: ubuntu-24.04
    # The checks take about 48 minutes. On 22 October 2026 the --with-deps install alone took
    # 11 minutes instead of 18 seconds on two runs in a row, and both hit a 60-minute limit
    # in the last test step. 90 leaves room for slow package mirrors.
    # Each step has its own limit as well. On 23 October 2026 the shared-rules step (normally
    # ~41s) was still running after 30 minutes and would only have failed at this job limit,
    # which also blocks the Pages deploy.
    timeout-minutes: 90
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - name: Verify GitHub Pages publishing source
        if: >-
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        uses: actions/github-script@v8
        with:
          script: |
            const { data: site } = await github.rest.repos.getPages(context.repo);
            const source = site.source || {};
            const configuration = JSON.stringify({ build_type: site.build_type, source });
            core.info(`Current Pages configuration: ${configuration}`);
            if (site.build_type === 'workflow') return;
            if (site.build_type === 'legacy' && source.branch === 'main' && source.path === '/') {
              core.warning('Pages publishes from main. This main-origin deployment is supported, but the separate built-in Pages workflow can publish source before checks pass. Select GitHub Actions as the Pages source to make all updates depend on these checks. No settings were changed.');
              return;
            }
            core.setFailed(`This workflow deploys from main and supports Pages source GitHub Actions or main:/(root). Found ${configuration}. No settings were changed.`);
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install development tools
        timeout-minutes: 10
        run: npm ci
      - name: Install Chromium and its system dependencies
        # 11 minutes has happened when the package mirror stalled. 25 fails a hung install
        # and still covers that day.
        timeout-minutes: 25
        run: npx playwright install --with-deps --no-shell chromium
      - name: Smoke-test all source games
        timeout-minutes: 15
        run: npm run check
        env:
          SG_ARTIFACT_DIR: .work/smoke-source
      - name: Test shared rules, build safety and harnesses once
        # Normally ~41s (54s on the slower green run). The harness names a stuck test after
        # 10 minutes; 20 lets that failure print, and kills a wedged process before the job limit.
        timeout-minutes: 20
        run: node tools/ci-run.mjs npm run test:shared
      - name: Verify Block Burst balance when its levels or rules change
        # Seeded play is about 4 minutes. 20 covers a slow run.
        timeout-minutes: 20
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Seeded play of every level against every balance threshold takes about
          # 4 minutes, so a pull request skips it when its merge commit leaves the
          # game's folder (levels, rules, verifier) and this workflow unchanged
          # against the base branch. Pushes and manual runs always run it: a push
          # compared only with the commit it replaced would skip a Block Burst change
          # whose own run was cancelled or failed, and deploy it unchecked.
          base=
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --quiet --depth=2 origin "$GITHUB_SHA" && base=HEAD^1
          fi
          if [ -n "$base" ] && changed=$(git diff --name-only "$base" HEAD -- games/block-burst .github/workflows/build.yml) && [ -z "$changed" ]; then
            echo "Block Burst and this workflow are unchanged since $base; the full balance check is skipped."
          else
            [ -n "${changed:-}" ] && printf 'Changed since %s:\n%s\n' "$base" "$changed"
            node tools/ci-run.mjs node games/block-burst/verify-levels.js
          fi
      - name: Test source gameplay and portal regressions
        # About 14 to 17 minutes on green runs.
        timeout-minutes: 45
        run: node tools/ci-run.mjs npm run test:browser
      - name: Test local board games and computer opponents
        timeout-minutes: 10
        run: npm run test:board-games
        env:
          SG_BOARD_SCREENSHOTS: .work/boards-source
      - name: Build the fast site
        timeout-minutes: 10
        run: npm run build
        env:
          # The telemetry ingest address, without names (docs/TELEMETRY.md): the school's
          # Cloudflare Worker, unless the SG_TELEMETRY_URL repository variable names another
          # server.
          SG_TELEMETRY_URL: ${{ vars.SG_TELEMETRY_URL || 'https://school-games-telemetry.services-agreement137.workers.dev/v1/batch' }}
          # The address a downloaded folder's teacher page names: where GitHub Pages publishes
          # this repository, unless the SG_SITE_URL repository variable names another (a
          # custom domain, or a repository named <owner>.github.io).
          SG_SITE_URL: ${{ vars.SG_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - name: Check built asset performance budgets
        timeout-minutes: 5
        run: npm run perf:assets -- --report artifacts/asset-budgets.json
      - name: Upload asset performance report
        if: always() && hashFiles('artifacts/asset-budgets.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: asset-performance-budgets
          path: artifacts/asset-budgets.json
          if-no-files-found: error
      - name: Measure software-rendered startup and active frames (informational)
        continue-on-error: true
        timeout-minutes: 8
        run: node tools/perf.mjs --samples 5 --seconds 5 --json artifacts/runtime-performance.json portal hoop-heads splat-strike
        env:
          SG_ROOT: _site
      - name: Upload informational runtime performance report
        if: always() && hashFiles('artifacts/runtime-performance.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: runtime-performance-software-${{ github.sha }}
          path: artifacts/runtime-performance.json
          if-no-files-found: error
          retention-days: 14
      - name: Test board games in the single-file fast build
        timeout-minutes: 10
        run: npm run test:board-games
        env:
          SG_ROOT: _site
          SG_BOARD_SCREENSHOTS: .work/boards-built
      - name: Smoke-test all built games
        timeout-minutes: 15
        run: npm run check
        env:
          SG_ROOT: _site
          SG_ARTIFACT_DIR: .work/smoke-built
      - name: Test optimized gameplay and portal regressions
        # About 12 to 15 minutes on green runs.
        timeout-minutes: 45
        run: node tools/ci-run.mjs npm run test:browser
        env:
          SG_ROOT: _site
      - name: Test offline installation, updates and the kill switch
        timeout-minutes: 10
        run: npm run test:offline
      - name: Upload smoke-test screenshots and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gameplay-smoke-${{ github.run_attempt }}
          path: |
            .work/smoke-source
            .work/smoke-built
            .work/boards-source
            .work/boards-built
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the verified fast site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  classroom-windows:
    name: Test downloaded folder on Windows Edge
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: msedge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install development tools
        run: npm ci
      - name: Ensure Microsoft Edge is available
        run: npx playwright install msedge
      - name: Test downloaded source with spaces and Arabic paths
        run: node tools/test-classroom.mjs
        env:
          SG_ARTIFACT_DIR: .work/classroom-source
      - name: Build the fast site
        run: npm run build
        env:
          SG_TELEMETRY_URL: ${{ vars.SG_TELEMETRY_URL || 'https://school-games-telemetry.services-agreement137.workers.dev/v1/batch' }}
          SG_SITE_URL: ${{ vars.SG_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      # Test the teachers' offline download (README) as they get it: unzipped on Windows.
      # tools/tests/offline-download.test.mjs proves it holds the built files byte for byte.
      - name: Unzip the offline download
        run: Expand-Archive -Path _site/school-games-offline.zip -DestinationPath .work/offline-download
      - name: Test the unzipped fast build with spaces and Arabic paths
        run: node tools/test-classroom.mjs
        env:
          SG_ROOT: .work/offline-download/school-games
          SG_ARTIFACT_DIR: .work/classroom-built
      - name: Upload classroom screenshots and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: classroom-windows-${{ github.run_attempt }}
          path: |
            .work/classroom-source
            .work/classroom-built
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy verified fast site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, classroom-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that the telemetry server accepts wire version 3
        # The portal sends wire version 3. A server that does not accept it answers those
        # batches with 400, and the PCs drop them for good, so the site is published only
        # once the server's /v1/health says it accepts 3 (docs/TELEMETRY.md "Turning it on";
        # deploy server/ first, server/README.md).
        timeout-minutes: 3
        env:
          SG_TELEMETRY_URL: ${{ vars.SG_TELEMETRY_URL || 'https://school-games-telemetry.services-agreement137.workers.dev/v1/batch' }}
        run: |
          curl -fsS --retry 3 --max-time 20 "${SG_TELEMETRY_URL%/v1/batch}/v1/health" -o health.json
          node -e '
            const a = JSON.parse(require("fs").readFileSync("health.json", "utf8")).accepts;
            if (!Array.isArray(a) || !a.includes(3)) {
              console.error("The telemetry server does not accept wire version 3 yet; deploy server/ first (server/README.md).");
              process.exit(1);
            }
            console.log("The telemetry server accepts wire versions " + a.join(", ") + ".");'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
