# Test source and the fast build before publishing the verified _site artifact.
# In repository Settings > Pages, select GitHub Actions as the publishing source.
name: Build fast site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test source and fast build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install development tools
        run: npm ci
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test build and harness helpers
        run: npm run test:tooling
      - name: Smoke-test all source games
        run: npm run check
      - name: Test source gameplay regressions
        run: npm run test:regressions
      - name: Build the fast site
        run: npm run build
      - name: Smoke-test all built games
        run: npm run check
        env:
          SG_ROOT: _site
      - name: Test built gameplay regressions
        run: npm run test:regressions
        env:
          SG_ROOT: _site
      - name: Test offline installation, updates and the kill switch
        run: npm run test:offline
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload the verified fast site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy verified fast site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
