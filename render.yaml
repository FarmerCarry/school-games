# Optional multiplayer host. The website itself continues to use GitHub Pages.
# One process owns the temporary lobbies; do not scale this service horizontally.
services:
  - type: web
    name: school-games-multiplayer
    runtime: node
    plan: free
    region: frankfurt
    # Deploy updates between classes: restarting clears active matches.
    autoDeployTrigger: 'off'
    buildCommand: npm ci --prefix multiplayer-server
    startCommand: npm --prefix multiplayer-server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ALLOWED_ORIGINS
        value: https://farmercarry.github.io
      - key: MAX_ROOM_PLAYERS
        value: 100
      - key: MAX_CONNECTIONS
        value: 240
      - key: MAX_SESSIONS
        value: 400
