<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سلّة الفواكه</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Picture icons: every button can be understood without reading. -->
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <symbol id="i-play" viewBox="0 0 64 64"><path d="M22 11 Q18 9 18 14 L18 50 Q18 55 22 53 L52 35 Q56 32 52 29 Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 64 64"><rect x="15" y="12" width="12" height="40" rx="5"/><rect x="37" y="12" width="12" height="40" rx="5"/></symbol>
  <symbol id="i-again" viewBox="0 0 64 64"><path d="M50 30 A19 19 0 1 1 41 15" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><path d="M33 4 L52 13 L37 27 Z"/></symbol>
  <symbol id="i-home" viewBox="0 0 64 64"><path d="M8 32 L32 10 L56 32 L49 32 L49 54 L37 54 L37 40 L27 40 L27 54 L15 54 L15 32 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-crown" viewBox="0 0 64 64"><path d="M8 48 L4 18 L20 30 L32 10 L44 30 L60 18 L56 48 Z" stroke="#4a2a12" stroke-width="4" stroke-linejoin="round"/><rect x="8" y="48" width="48" height="8" rx="3" stroke="#4a2a12" stroke-width="4"/></symbol>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 5 L39 23.3 L58.6 24.4 L43.4 36.7 L48.5 55.6 L32 45 L15.5 55.6 L20.6 36.7 L5.4 24.4 L25 23.3 Z" stroke-linejoin="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 64 64"><path d="M20 28 L20 20 A12 12 0 0 1 44 20 L44 28" fill="none" stroke="currentColor" stroke-width="7"/><rect x="12" y="28" width="40" height="30" rx="7"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 64 64"><path d="M37 3 L12 36 L29 36 L24 61 L52 25 L34 25 Z" stroke="#4a2a12" stroke-width="4" stroke-linejoin="round"/></symbol>
  <symbol id="i-jar" viewBox="0 0 64 64"><rect x="12" y="10" width="40" height="8" rx="4" fill="#ffffff" stroke="#4a2a12" stroke-width="4"/><path d="M14 18 L14 52 Q14 58 20 58 L44 58 Q50 58 50 52 L50 18 Z" fill="#bfe8ff" stroke="#4a2a12" stroke-width="4"/><circle cx="25" cy="47" r="7" fill="#ff4f6d"/><circle cx="39" cy="47" r="7" fill="#ffc43a"/><circle cx="32" cy="35" r="7" fill="#6fd447"/></symbol>
  <symbol id="i-mouse" viewBox="0 0 48 64"><rect x="6" y="4" width="36" height="56" rx="18" fill="#ffffff" stroke="#4a2a12" stroke-width="4"/><path d="M24 4 L24 26 M6 26 L42 26" stroke="#4a2a12" stroke-width="4"/><path d="M8 24 L8 20 Q8 6 22 6 L22 24 Z" fill="#ffd23f"/></symbol>
</svg>

<canvas id="gl" tabindex="0" aria-label="سلّة الفواكه: حرّك الغيمة بالفأرة أو بالأسهم وانقر أو اضغط مسافة لتُسقط الفاكهة. فاكهتان متشابهتان تصيران فاكهة أكبر."></canvas>

<!-- A 1280x720 layer laid exactly over the 3D picture (scaled by game.js). -->
<div id="ui">
  <div id="hud" hidden>
    <button type="button" id="btnPause" class="jd-btn jd-round" aria-label="استراحة" title="استراحة (Esc)"><svg aria-hidden="true"><use href="#i-pause"/></svg></button>
    <div id="scoreBox" aria-label="النقاط"><b id="score">0</b><span class="best"><svg aria-hidden="true"><use href="#i-crown"/></svg><i id="best">0</i></span></div>
    <div id="nextTag" aria-hidden="true">التالي</div>
    <button type="button" id="btnBlast" class="jd-btn" aria-label="هزّة السلّة" title="هزّة السلّة (S)"><svg aria-hidden="true"><use href="#i-bolt"/></svg><span class="count" id="blastCount">1</span><span class="sg-key">S</span></button>
    <div id="dangerGlow" aria-hidden="true"></div>
    <div id="floats" aria-hidden="true"></div>
    <div id="toast" aria-hidden="true" hidden></div>
  </div>

  <section id="scrTitle" class="screen" aria-label="سلّة الفواكه">
    <h1 class="logo"><span class="l1">سلّة</span><span class="l2">الفواكه</span></h1>
    <button type="button" id="btnPlay" class="jd-btn jd-play ring" aria-label="العب"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
    <div class="howto" aria-label="طريقة اللعب">
      <svg class="mouse" viewBox="0 0 48 64" aria-hidden="true"><use href="#i-mouse"/></svg>
      <span dir="ltr"><span class="sg-key">←</span><span class="sg-key">→</span></span>
      <span class="sep">•</span>
      <span>انقر</span>
      <span dir="ltr"><span class="sg-key">مسافة</span></span>
    </div>
    <div class="chip" id="titleBest" aria-label="أفضل نتيجة"><svg aria-hidden="true"><use href="#i-crown"/></svg><b>0</b></div>
    <button type="button" id="btnSkins" class="jd-btn jd-round side" aria-label="الجِرار"><svg aria-hidden="true"><use href="#i-jar"/></svg><i class="dot" hidden></i></button>
  </section>

  <section id="scrPause" class="screen dim" aria-label="استراحة" hidden>
    <div class="card">
      <button type="button" id="btnResume" class="jd-btn jd-go" aria-label="تابع"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
      <div class="row">
        <button type="button" id="btnHome" class="jd-btn jd-round big" aria-label="البداية"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
        <button type="button" id="btnRestart" class="jd-btn jd-round big" aria-label="ابدأ من جديد"><svg aria-hidden="true"><use href="#i-again"/></svg></button>
      </div>
    </div>
  </section>

  <section id="scrResult" class="screen dim" aria-label="النتيجة" hidden>
    <div class="card result">
      <div class="res-fruit"><i id="resFruit"></i><span id="resFruitName"></span></div>
      <div class="stars3" id="resStars" aria-hidden="true"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
      <div class="res-score"><b id="resScore">0</b></div>
      <div class="ribbons"><span class="ribbon best" id="resBest" hidden>رقم جديد!</span><span class="ribbon open" id="resOpen" hidden><svg aria-hidden="true"><use href="#i-jar"/></svg>جرّة جديدة!</span></div>
      <div class="row">
        <button type="button" id="resHome" class="jd-btn jd-round big" aria-label="البداية"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
        <button type="button" id="resAgain" class="jd-btn jd-go ring" aria-label="مرة أخرى"><svg aria-hidden="true"><use href="#i-again"/></svg></button>
      </div>
      <p class="keys-hint"><span dir="ltr"><span class="sg-key">Enter</span></span> مرة أخرى</p>
    </div>
  </section>

  <section id="scrSkins" class="screen dim" aria-label="الجِرار" hidden>
    <div class="card skins">
      <div id="skinList" role="group" aria-label="الجِرار"></div>
      <button type="button" id="skinsBack" class="jd-btn jd-go small" aria-label="رجوع"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
    </div>
  </section>

  <section id="scrError" class="screen dim" hidden>
    <div class="card"><h2>تعذّر تشغيل الرسوم ثلاثية الأبعاد على هذا الجهاز.</h2></div>
  </section>
  <div id="contextNotice" class="notice" role="status" hidden>توقفت الرسوم لحظة… انتظر قليلًا.</div>

  <!-- The wordless coach: the mouse slides left and right, then clicks. -->
  <div id="ghost" aria-hidden="true" hidden>
    <svg class="g-mouse" viewBox="0 0 48 64"><use href="#i-mouse"/></svg>
    <span class="g-keys" dir="ltr"><span class="sg-key">←</span><span class="sg-key">→</span><span class="sg-key">مسافة</span></span>
  </div>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="../../shared/kit.js"></script>
<script src="../../shared/webgl.js"></script>
<script src="../../shared/juice.js"></script>
<script src="../../lib/three/three.min.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
