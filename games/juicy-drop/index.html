<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سلة الفواكه</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <symbol id="i-play" viewBox="0 0 64 64"><path d="M22 11 Q18 9 18 14 L18 50 Q18 55 22 53 L52 35 Q56 32 52 29 Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 64 64"><rect x="15" y="12" width="12" height="40" rx="5"/><rect x="37" y="12" width="12" height="40" rx="5"/></symbol>
  <symbol id="i-again" viewBox="0 0 64 64"><path d="M50 30 A19 19 0 1 1 41 15" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><path d="M33 4 L52 13 L37 27 Z"/></symbol>
  <symbol id="i-home" viewBox="0 0 64 64"><path d="M8 32 L32 10 L56 32 L49 32 L49 54 L37 54 L37 40 L27 40 L27 54 L15 54 L15 32 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 5 L39 23.3 L58.6 24.4 L43.4 36.7 L48.5 55.6 L32 45 L15.5 55.6 L20.6 36.7 L5.4 24.4 L25 23.3 Z" stroke-linejoin="round"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 64 64"><path d="M18 10 H46 V26 C46 36 39 42 32 42 C25 42 18 36 18 26 Z" fill="#ffd23f" stroke="#1b1640" stroke-width="4"/><path d="M18 15 H10 C10 26 14 31 19 31 M46 15 H54 C54 26 50 31 45 31" fill="none" stroke="#ffd23f" stroke-width="5" stroke-linecap="round"/><rect x="28" y="42" width="8" height="10" fill="#ffd23f" stroke="#1b1640" stroke-width="3"/><rect x="20" y="51" width="24" height="7" rx="3" fill="#ffd23f" stroke="#1b1640" stroke-width="3"/></symbol>
  <symbol id="i-shop" viewBox="0 0 64 64"><path d="M12 24 H52 L48 54 H16 Z" fill="#fff" stroke="#1b1640" stroke-width="4" stroke-linejoin="round"/><path d="M8 24 L14 10 H50 L56 24 Z" fill="#ff3d6e" stroke="#1b1640" stroke-width="4" stroke-linejoin="round"/><circle cx="25" cy="39" r="5" fill="#1b1640"/><circle cx="39" cy="39" r="5" fill="#1b1640"/><path d="M26 47 Q32 52 38 47" fill="none" stroke="#1b1640" stroke-width="3.5" stroke-linecap="round"/></symbol>
  <symbol id="i-bomb" viewBox="0 0 64 64"><circle cx="30" cy="36" r="19" fill="#ff3d6e" stroke="#1b1640" stroke-width="4.5"/><path d="M38 19 Q45 10 53 14" fill="none" stroke="#ffe033" stroke-width="5" stroke-linecap="round"/><circle cx="54" cy="14" r="5" fill="#ffe033"/><circle cx="23" cy="29" r="5" fill="#fff" opacity=".7"/></symbol>
  <symbol id="i-shake" viewBox="0 0 64 64"><rect x="18" y="14" width="28" height="38" rx="9" fill="#38bdf8" stroke="#1b1640" stroke-width="4.5"/><path d="M8 20 Q2 32 8 44 M56 20 Q62 32 56 44" fill="none" stroke="#ffe033" stroke-width="5.5" stroke-linecap="round"/><path d="M26 33 L32 23 L34 33 L40 27" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-swap" viewBox="0 0 64 64"><path d="M14 24 H48 L38 14 M50 40 H16 L26 50" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 64 64"><path d="M36 6 L14 36 H31 L26 58 L50 26 H33 Z" fill="#ffe033" stroke="#1b1640" stroke-width="4" stroke-linejoin="round"/></symbol>
  <symbol id="i-crate" viewBox="0 0 64 64"><rect x="10" y="10" width="44" height="44" rx="9" fill="#f59e0b" stroke="#1b1640" stroke-width="4.5"/><path d="M12 32 H52 M32 12 V52 M14 14 L50 50" stroke="#1b1640" stroke-width="4"/></symbol>
</svg>

<canvas id="game" tabindex="0" aria-label="سلة الفواكه"></canvas>

<div id="ui">
  <div id="hud" hidden>
    <button type="button" id="btnPause" class="jd-btn jd-round" aria-label="استراحة" title="استراحة">
      <svg aria-hidden="true"><use href="#i-pause"/></svg>
      <span class="sg-key key-mini" dir="ltr" aria-hidden="true">P</span>
    </button>

    <div class="gadgets" aria-label="أدوات القوة">
      <button type="button" id="btnBomb" class="jd-btn gad gad-bomb" aria-label="قنبلة العصير">
        <svg aria-hidden="true"><use href="#i-bomb"/></svg>
        <span class="gad-txt"><b>قنبلة العصير</b><small>تفجير 3 صغار</small></span>
        <b class="gad-cnt" id="cntBomb" dir="ltr">1</b>
        <span class="sg-key gad-key" dir="ltr" aria-hidden="true">1</span>
      </button>
      <button type="button" id="btnShake" class="jd-btn gad gad-shake" aria-label="زلزال السلة">
        <svg aria-hidden="true"><use href="#i-shake"/></svg>
        <span class="gad-txt"><b>زلزال السلة</b><small>رجّ ودمج سريع</small></span>
        <b class="gad-cnt" id="cntShake" dir="ltr">1</b>
        <span class="sg-key gad-key" dir="ltr" aria-hidden="true">2</span>
      </button>
      <button type="button" id="btnSwap" class="jd-btn gad gad-swap" aria-label="تبديل">
        <svg aria-hidden="true"><use href="#i-swap"/></svg>
        <span class="gad-txt"><b>تبديل</b><small>غيّر الفاكهة</small></span>
        <b class="gad-cnt" id="cntSwap" dir="ltr">2</b>
        <span class="sg-key gad-key" dir="ltr" aria-hidden="true">3</span>
      </button>
    </div>
  </div>

  <section id="scrTitle" class="screen" aria-label="سلة الفواكه">
    <div class="top-chips">
      <div class="chip" id="titleCoins" aria-label="العملات"><i class="coin"></i><b dir="ltr">0</b></div>
      <div class="chip" id="titleBest" aria-label="أعلى نتيجة"><svg aria-hidden="true"><use href="#i-trophy"/></svg><b dir="ltr">0</b></div>
    </div>

    <header class="hero-head">
      <span class="hero-tag">خلاط الوحوش التوربو</span>
      <h1 class="logo">سلة الفواكه</h1>
    </header>

    <div class="mode-grid" role="group" aria-label="أطوار اللعب">
      <button type="button" class="jd-btn mode-card active" data-mode="classic" id="modeClassic">
        <span class="mode-ico"><svg aria-hidden="true"><use href="#i-trophy"/></svg></span>
        <b>الدمج الكلاسيكي</b>
        <small>نقاط بلا حدود والبطيخة الخارقة!</small>
      </button>
      <button type="button" class="jd-btn mode-card" data-mode="crates" id="modeCrates">
        <span class="mode-ico"><svg aria-hidden="true"><use href="#i-crate"/></svg></span>
        <b>تحطيم الصناديق</b>
        <small>ادمج قرب الصناديق المصفّحة لتفجيرها!</small>
      </button>
      <button type="button" class="jd-btn mode-card" data-mode="rush" id="modeRush">
        <span class="mode-ico"><svg aria-hidden="true"><use href="#i-bolt"/></svg></span>
        <b>سباق الـ 90 ثانية</b>
        <small>سرعة مضاعفة وحماس ناري لـ 3 نجوم!</small>
      </button>
    </div>

    <div class="diff-bar" role="group" aria-label="مستوى التحدي">
      <span class="diff-lbl">التحدي:</span>
      <button type="button" class="jd-btn diff-pill" data-diff="easy" id="diffEasy">سهل</button>
      <button type="button" class="jd-btn diff-pill active" data-diff="mid" id="diffMid">متوسط</button>
      <button type="button" class="jd-btn diff-pill" data-diff="hero" id="diffHero">بطل</button>
    </div>

    <div class="title-actions">
      <button type="button" id="btnPlay" class="jd-btn btn-launch ring" aria-label="العب">
        <svg aria-hidden="true"><use href="#i-play"/></svg>
        <span>ابدأ اللعب!</span>
      </button>
      <button type="button" id="btnShop" class="jd-btn btn-shop" aria-label="متجر الخلاط">
        <svg aria-hidden="true"><use href="#i-shop"/></svg>
        <span>متجر الخلاط</span>
      </button>
    </div>

    <div class="ctrl-hint" aria-label="طريقة التحكم">
      <span>صوّب بالماوس أو <span class="sg-key" dir="ltr">← →</span></span>
      <span>أفلت الفاكهة <span class="sg-key" dir="ltr">Space</span></span>
      <span>الأدوات <span class="sg-key" dir="ltr">1</span> <span class="sg-key" dir="ltr">2</span> <span class="sg-key" dir="ltr">3</span></span>
    </div>
  </section>

  <section id="scrShop" class="screen dim" aria-label="متجر الخلاط" hidden>
    <div class="card shop-modal">
      <div class="shop-head">
        <h2>متجر الخلاط</h2>
        <div class="chip static-chip" id="shopCoins"><i class="coin"></i><b dir="ltr">0</b></div>
        <button type="button" id="btnShopClose" class="jd-btn jd-round" aria-label="رجوع"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
      </div>
      <h3 class="shelf-lbl">قاذف الفواكه</h3>
      <div class="shelf" id="shelfDroppers"></div>
      <h3 class="shelf-lbl">تصميم الخلاط</h3>
      <div class="shelf" id="shelfTanks"></div>
    </div>
  </section>

  <section id="scrPause" class="screen dim" aria-label="استراحة" hidden>
    <div class="card panel">
      <h2>استراحة</h2>
      <div class="row">
        <button type="button" id="btnResume" class="jd-btn btn-wide btn-green" aria-label="متابعة">
          <svg aria-hidden="true"><use href="#i-play"/></svg><span>متابعة</span>
        </button>
        <button type="button" id="btnRestart" class="jd-btn btn-wide btn-amber" aria-label="إعادة">
          <svg aria-hidden="true"><use href="#i-again"/></svg><span>إعادة</span>
          <span class="sg-key key-badge" dir="ltr" aria-hidden="true">R</span>
        </button>
      </div>
      <button type="button" id="btnPauseHome" class="jd-btn btn-sub" aria-label="القائمة الرئيسية">
        <svg aria-hidden="true"><use href="#i-home"/></svg><span>القائمة الرئيسية</span>
      </button>
    </div>
  </section>

  <section id="scrEnd" class="screen dim" aria-label="النتيجة" hidden>
    <div class="card panel result">
      <div class="ribbon" id="endBest" hidden>رقم قياسي جديد!</div>
      <h2 id="endTitle">انتصار ساحق!</h2>
      <div class="stars3" id="endStars" aria-hidden="true" hidden>
        <svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg>
      </div>
      <div class="facts">
        <span class="fact" id="endScore"><svg aria-hidden="true"><use href="#i-trophy"/></svg><b dir="ltr">0</b></span>
        <span class="fact" id="endMonster"><b id="endMonsterTxt">توت النينجا</b></span>
        <span class="fact" id="endCoins"><i class="coin"></i><b dir="ltr">+0</b></span>
      </div>
      <div class="row">
        <button type="button" id="btnEndAgain" class="jd-btn btn-wide btn-green ring" aria-label="العب مجدداً">
          <svg aria-hidden="true"><use href="#i-again"/></svg><span>العب مجدداً</span>
        </button>
        <button type="button" id="btnEndHome" class="jd-btn btn-wide btn-sub-solid" aria-label="القائمة الرئيسية">
          <svg aria-hidden="true"><use href="#i-home"/></svg><span>الرئيسية</span>
        </button>
      </div>
    </div>
  </section>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="../../shared/kit.js"></script>
<script src="../../shared/artkit.js"></script>
<script src="../../shared/juice.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
