<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2c1654"/>
      <stop offset="0.65" stop-color="#6e2860"/>
      <stop offset="1" stop-color="#25103a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#ffe066" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="melon" cx="0.35" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#a8f0c0"/>
      <stop offset="0.45" stop-color="#2ecc71"/>
      <stop offset="1" stop-color="#146c38"/>
    </radialGradient>
    <radialGradient id="orange" cx="0.35" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#ffe0b2"/>
      <stop offset="0.5" stop-color="#ff8f1f"/>
      <stop offset="1" stop-color="#c45100"/>
    </radialGradient>
    <radialGradient id="pom" cx="0.35" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#ffc1d6"/>
      <stop offset="0.5" stop-color="#e62662"/>
      <stop offset="1" stop-color="#880e39"/>
    </radialGradient>
    <radialGradient id="lemon" cx="0.35" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#fff9c4"/>
      <stop offset="0.55" stop-color="#ffe033"/>
      <stop offset="1" stop-color="#c79600"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#sun)"/>

  <!-- Cozy wooden orchard table -->
  <rect x="0" y="308" width="400" height="92" fill="#7c481e"/>
  <rect x="0" y="308" width="400" height="7" fill="#b06d35"/>
  <line x1="0" y1="308" x2="400" y2="308" stroke="#1e1538" stroke-width="5"/>
  <ellipse cx="200" cy="316" rx="142" ry="11" fill="#130b24" opacity="0.48"/>

  <!-- Glass jar interior tint -->
  <path d="M74 88 V284 Q74 308 98 308 H302 Q326 308 326 284 V88 Z" fill="#bae6fd" fill-opacity="0.16"/>
  <rect x="86" y="92" width="14" height="206" rx="7" fill="#ffffff" opacity="0.16"/>

  <!-- Dotted drop guide from helper cloud -->
  <line x1="204" y1="58" x2="204" y2="128" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3.5" stroke-dasharray="6 7" stroke-linecap="round"/>

  <!-- Giant Smiling Watermelon (bottom right-center) -->
  <g transform="translate(226 238)">
    <path d="M0 -64 C-6 -78 14 -78 9 -68" fill="none" stroke="#66bb6a" stroke-width="5" stroke-linecap="round"/>
    <circle r="64" fill="url(#melon)" stroke="#1e1538" stroke-width="6"/>
    <g fill="none" stroke="#115e30" stroke-width="7.5" stroke-linecap="round">
      <path d="M-36 -48 Q-46 0 -36 48"/>
      <path d="M-12 -60 Q-18 0 -12 60"/>
      <path d="M14 -60 Q20 0 14 60"/>
      <path d="M38 -46 Q46 0 38 46"/>
    </g>
    <ellipse cx="-24" cy="-26" rx="14" ry="7" transform="rotate(-35 -24 -26)" fill="#ffffff" opacity="0.65"/>
    <circle cx="-24" cy="10" r="6.5" fill="#ff5a8c" opacity="0.55"/>
    <circle cx="24" cy="10" r="6.5" fill="#ff5a8c" opacity="0.55"/>
    <ellipse cx="-16" cy="-2" rx="9" ry="11" fill="#ffffff" stroke="#1e1538" stroke-width="3"/>
    <ellipse cx="16" cy="-2" rx="9" ry="11" fill="#ffffff" stroke="#1e1538" stroke-width="3"/>
    <circle cx="-14" cy="-2" r="5.5" fill="#1e1538"/>
    <circle cx="18" cy="-2" r="5.5" fill="#1e1538"/>
    <circle cx="-16" cy="-5" r="2.2" fill="#ffffff"/>
    <circle cx="16" cy="-5" r="2.2" fill="#ffffff"/>
    <path d="M-13 12 Q0 28 13 12 Z" fill="#1e1538"/>
    <path d="M-7 19 Q0 25 7 19" fill="#ff6b9d"/>
  </g>

