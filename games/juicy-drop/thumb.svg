  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72 86 V284 Q72 310 98 310 H302 Q328 310 328 284 V86" stroke="#1e1538" stroke-width="18"/>
    <path d="M72 86 V284 Q72 310 98 310 H302 Q328 310 328 284 V86" stroke="#7dd3fc" stroke-width="10"/>
    <path d="M72 86 V284 Q72 310 98 310 H302 Q328 310 328 284 V86" stroke="#e0f7ff" stroke-width="3.5"/>
  </g>
  <rect x="59" y="74" width="26" height="16" rx="8" fill="#e0f7ff" stroke="#1e1538" stroke-width="4"/>
  <rect x="315" y="74" width="26" height="16" rx="8" fill="#e0f7ff" stroke="#1e1538" stroke-width="4"/>

  <!-- Arabic Title -->
  <g font-family="Fredoka, 'Segoe UI', Tahoma, sans-serif" font-weight="700" text-anchor="middle" direction="rtl">
    <text x="200" y="376" font-size="60" fill="#1e1538" stroke="#1e1538" stroke-width="16" stroke-linejoin="round" paint-order="stroke">سلّة الفواكه</text>
    <text x="200" y="376" font-size="60" fill="#ffffff">سلّة الفواكه</text>
  </g>
</svg>
