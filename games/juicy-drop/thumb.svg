    <circle cx="8" cy="-1" r="4.8" fill="#ffffff" stroke="#1e1538" stroke-width="2"/>
    <circle cx="-8" cy="-1" r="2.7" fill="#1e1538"/>
    <circle cx="8" cy="-1" r="2.7" fill="#1e1538"/>
    <path d="M-6 8 Q0 14 6 8" fill="none" stroke="#1e1538" stroke-width="3" stroke-linecap="round"/>
