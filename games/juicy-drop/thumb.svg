  <!-- Sparkles -->
  <g fill="#ffe066" stroke="#1e1538" stroke-width="2" stroke-linejoin="round">
    <path d="M196 144 L201 155 L213 158 L202 164 L199 176 L193 165 L181 162 L192 156 Z"/>
    <path d="M338 118 L341 126 L349 128 L342 132 L340 140 L336 132 L328 130 L335 126 Z"/>
    <path d="M52 146 L55 154 L63 156 L56 160 L54 168 L50 160 L42 158 L49 154 Z"/>
