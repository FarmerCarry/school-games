  <g transform="translate(142 172)">
    <ellipse cx="9" cy="-38" rx="9" ry="5" transform="rotate(25 9 -38)" fill="#2ecc71" stroke="#1e1538" stroke-width="3"/>
    <circle r="35" fill="url(#orange)" stroke="#1e1538" stroke-width="5"/>
    <ellipse cx="-12" cy="-14" rx="8" ry="4" transform="rotate(-35 -12 -14)" fill="#ffffff" opacity="0.68"/>
    <circle cx="-9" cy="-1" r="5.5" fill="#ffffff" stroke="#1e1538" stroke-width="2.2"/>
    <circle cx="9" cy="-1" r="5.5" fill="#ffffff" stroke="#1e1538" stroke-width="2.2"/>
    <circle cx="-8" cy="-1" r="3.2" fill="#1e1538"/>
    <circle cx="10" cy="-1" r="3.2" fill="#1e1538"/>
    <path d="M-7 9 Q0 16 7 9" fill="none" stroke="#1e1538" stroke-width="3.2" stroke-linecap="round"/>
