  <g transform="translate(204 42)">
    <g fill="#1e1538">
      <circle cx="-24" cy="4" r="17"/><circle cx="24" cy="4" r="17"/>
      <circle cx="-12" cy="-5" r="19"/><circle cx="12" cy="-5" r="19"/><circle cx="0" cy="-2" r="21"/>
    </g>
    <g fill="#ffffff">
      <circle cx="-24" cy="4" r="13.5"/><circle cx="24" cy="4" r="13.5"/>
      <circle cx="-12" cy="-5" r="15.5"/><circle cx="12" cy="-5" r="15.5"/><circle cx="0" cy="-2" r="17.5"/>
