<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#1e295e"/>
      <stop offset="0.65" stop-color="#2e1d64"/>
      <stop offset="1" stop-color="#140f34"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="melon" cx="0.34" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#a9dfbf"/>
      <stop offset="0.5" stop-color="#2ecc71"/>
      <stop offset="1" stop-color="#145a32"/>
    </radialGradient>
    <radialGradient id="orange" cx="0.34" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffcc80"/>
      <stop offset="0.5" stop-color="#ff8f1f"/>
      <stop offset="1" stop-color="#bf360c"/>
    </radialGradient>
    <radialGradient id="kiwi" cx="0.34" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#c5e1a5"/>
      <stop offset="0.5" stop-color="#7cb342"/>
      <stop offset="1" stop-color="#33691e"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Lab pedestal counter -->
  <rect x="0" y="308" width="400" height="92" fill="#231b47"/>
  <line x1="0" y1="308" x2="400" y2="308" stroke="#1b1640" stroke-width="5"/>

  <!-- Turbo Reactor Glass Interior -->
  <rect x="66" y="76" width="268" height="218" rx="20" fill="#0f1738" fill-opacity="0.68"/>
  <rect x="80" y="88" width="12" height="190" rx="6" fill="#ffffff" opacity="0.16"/>

  <!-- Laser Aim Line -->
  <line x1="200" y1="58" x2="200" y2="148" stroke="#ffe033" stroke-width="4" stroke-dasharray="7 7" stroke-linecap="round"/>
  <circle cx="200" cy="148" r="6" fill="#ffe033"/>

  <!-- Robo Claw Dropper + Spark Cherry -->
  <g transform="translate(200 40)">
    <path d="M-24 22 Q-32 2 -14 -4 M24 22 Q32 2 14 -4" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    <rect x="-24" y="-20" width="48" height="24" rx="10" fill="#ffd23f" stroke="#1b1640" stroke-width="4.5"/>
    <circle cx="-8" cy="-8" r="4" fill="#38bdf8"/>
    <circle cx="8" cy="-8" r="4" fill="#38bdf8"/>
    <g transform="translate(0 30)">
      <circle r="19" fill="#ff3d6e" stroke="#1b1640" stroke-width="4.5"/>
      <circle cx="-6" cy="-2" r="4" fill="#fff" stroke="#1b1640" stroke-width="2"/>
      <circle cx="6" cy="-2" r="4" fill="#fff" stroke="#1b1640" stroke-width="2"/>
      <circle cx="-5" cy="-2" r="2" fill="#1b1640"/>
      <circle cx="7" cy="-2" r="2" fill="#1b1640"/>
      <path d="M-6 6 Q0 13 6 6 Z" fill="#1b1640"/>
    </g>
  </g>

  <!-- Super Watermelon Monster (bottom right) -->
  <g transform="translate(232 224)">
    <path d="M-20 -54 L-14 -76 L-4 -60 L0 -80 L4 -60 L14 -76 L20 -54 Z" fill="#ffd23f" stroke="#1b1640" stroke-width="4.5" stroke-linejoin="round"/>
    <circle r="64" fill="url(#melon)" stroke="#1b1640" stroke-width="6.5"/>
    <g fill="none" stroke="#114b2b" stroke-width="7.5" stroke-linecap="round">
      <path d="M-36 -48 Q-46 0 -36 48"/>
      <path d="M-12 -58 Q-18 0 -12 58"/>
      <path d="M14 -58 Q20 0 14 58"/>
      <path d="M38 -46 Q46 0 38 46"/>
    </g>
    <ellipse cx="-24" cy="-28" rx="14" ry="7" transform="rotate(-32 -24 -28)" fill="#fff" opacity="0.68"/>
    <circle cx="-18" cy="-4" r="11" fill="#fff" stroke="#1b1640" stroke-width="3.2"/>
    <circle cx="18" cy="-4" r="11" fill="#fff" stroke="#1b1640" stroke-width="3.2"/>
    <circle cx="-16" cy="-3" r="6" fill="#1b1640"/>
    <circle cx="20" cy="-3" r="6" fill="#1b1640"/>
    <circle cx="-18" cy="-6" r="2.5" fill="#fff"/>
    <circle cx="18" cy="-6" r="2.5" fill="#fff"/>
    <path d="M-28 -18 L-8 -12 M28 -18 L8 -12" stroke="#1b1640" stroke-width="5" stroke-linecap="round"/>
    <path d="M-22 14 Q0 40 22 14 Z" fill="#1b1640"/>
    <path d="M-14 15 L-8 23 L-2 15 M2 15 L8 23 L14 15" fill="#fff"/>
  </g>

  <!-- Karate Orange Monster (bottom left) -->
  <g transform="translate(122 246)">
    <circle r="43" fill="url(#orange)" stroke="#1b1640" stroke-width="5.5"/>
    <rect x="-41" y="-24" width="82" height="11" fill="#1b1640"/>
    <circle cx="-13" cy="-2" r="8.5" fill="#fff" stroke="#1b1640" stroke-width="2.6"/>
    <circle cx="13" cy="-2" r="8.5" fill="#fff" stroke="#1b1640" stroke-width="2.6"/>
    <circle cx="-11" cy="-2" r="4.8" fill="#1b1640"/>
    <circle cx="15" cy="-2" r="4.8" fill="#1b1640"/>
    <path d="M-15 12 Q0 28 15 12 Z" fill="#1b1640"/>
    <path d="M-9 13 L-4 19 L1 13" fill="#fff"/>
  </g>

  <!-- Spiky Kiwi Monster (mid left) -->
  <g transform="translate(128 158)">
    <path d="M-16 -26 L-12 -39 L-4 -29 L0 -41 L4 -29 L12 -39 L16 -26 Z" fill="#dce775" stroke="#1b1640" stroke-width="3.5" stroke-linejoin="round"/>
    <circle r="31" fill="url(#kiwi)" stroke="#1b1640" stroke-width="5"/>
    <circle cx="-10" cy="-2" r="6.5" fill="#fff" stroke="#1b1640" stroke-width="2.4"/>
    <circle cx="10" cy="-2" r="8" fill="#fff" stroke="#1b1640" stroke-width="2.4"/>
    <circle cx="-9" cy="-2" r="3.6" fill="#1b1640"/>
    <circle cx="11" cy="-2" r="4.2" fill="#1b1640"/>
    <path d="M-10 10 Q0 20 10 10 Z" fill="#1b1640"/>
  </g>

  <!-- Rainbow Lightning Sparks -->
  <g fill="#ffe033" stroke="#1b1640" stroke-width="2.5" stroke-linejoin="round">
    <path d="M352 110 L334 140 H348 L340 166 L364 134 H350 Z"/>
    <path d="M46 118 L30 146 H43 L36 170 L58 140 H45 Z"/>
  </g>

  <!-- Turbo Reactor Tank Walls & Pedestal -->
  <path d="M66 74 V276 Q66 294 84 294 H316 Q334 294 334 276 V74" fill="none" stroke="#1b1640" stroke-width="18" stroke-linecap="round"/>
  <path d="M66 74 V276 Q66 294 84 294 H316 Q334 294 334 276 V74" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round"/>
  <rect x="52" y="294" width="296" height="28" rx="12" fill="#334155" stroke="#1b1640" stroke-width="5"/>
  <circle cx="170" cy="308" r="5.5" fill="#38bdf8" stroke="#1b1640" stroke-width="2.5"/>
  <circle cx="200" cy="308" r="5.5" fill="#4ade80" stroke="#1b1640" stroke-width="2.5"/>
  <circle cx="230" cy="308" r="5.5" fill="#ffe033" stroke="#1b1640" stroke-width="2.5"/>

  <!-- Arabic Title -->
  <g font-family="Fredoka, 'Segoe UI', Tahoma, sans-serif" font-weight="700" text-anchor="middle" direction="rtl">
    <text x="200" y="376" font-size="60" fill="#1b1640" stroke="#1b1640" stroke-width="16" stroke-linejoin="round" paint-order="stroke">سلة الفواكه</text>
    <text x="200" y="376" font-size="60" fill="#ffffff">سلة الفواكه</text>
  </g>
</svg>
