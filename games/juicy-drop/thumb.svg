    <circle cx="-4.5" cy="0" r="2.4" fill="#1e1538"/>
    <circle cx="4.5" cy="0" r="2.4" fill="#1e1538"/>
  </g>
  <g transform="translate(204 72)">
    <path d="M0 -16 Q8 -30 16 -26" fill="none" stroke="#43a047" stroke-width="3.5" stroke-linecap="round"/>
    <circle r="19" fill="#ff3d6e" stroke="#1e1538" stroke-width="4"/>
    <circle cx="-5.5" cy="-1" r="3" fill="#ffffff"/>
    <circle cx="5.5" cy="-1" r="3" fill="#ffffff"/>
    <circle cx="-5.5" cy="-1" r="1.8" fill="#1e1538"/>
    <circle cx="5.5" cy="-1" r="1.8" fill="#1e1538"/>
    <circle cx="0" cy="6" r="2.8" fill="#1e1538"/>
