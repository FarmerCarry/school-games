    <path d="M-15 -39 L-11 -54 L-3 -44 L0 -56 L3 -44 L11 -54 L15 -39 Z" fill="#e62662" stroke="#1e1538" stroke-width="4" stroke-linejoin="round"/>
    <circle r="44" fill="url(#pom)" stroke="#1e1538" stroke-width="5.5"/>
    <ellipse cx="-16" cy="-18" rx="10" ry="5" transform="rotate(-35 -16 -18)" fill="#ffffff" opacity="0.65"/>
    <circle cx="-17" cy="8" r="5" fill="#ff80ab" opacity="0.6"/>
