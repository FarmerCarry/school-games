    <circle cx="-11" cy="-1" r="6.5" fill="#ffffff" stroke="#1e1538" stroke-width="2.5"/>
    <circle cx="11" cy="-1" r="6.5" fill="#ffffff" stroke="#1e1538" stroke-width="2.5"/>
    <circle cx="-10" cy="-1" r="3.8" fill="#1e1538"/>
    <circle cx="12" cy="-1" r="3.8" fill="#1e1538"/>
    <path d="M-8 10 Q0 18 8 10" fill="none" stroke="#1e1538" stroke-width="3.8" stroke-linecap="round"/>
