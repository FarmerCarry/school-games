    <rect x="-16" y="-4" width="34" height="26" rx="7" fill="#3b3f4f"/>
    <path d="M30 -24 L2 4 L-24 -10" fill="none" stroke="#9e1b1b" stroke-width="6"/>
    <path d="M-12 -16 L-70 -24 L-66 -14 L-30 -2 L-8 -4Z" fill="#ff3b3b"/>
    <ellipse cx="-30" cy="-8" rx="11" ry="7" fill="#ffffff"/>
    <text x="-30" y="-4" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="10" text-anchor="middle" fill="#9e1b1b">7</text>
    <path d="M-20 -22 L-8 -3 L2 12" fill="none" stroke="#1d3f9e" stroke-width="11"/>
    <line x1="-40" y1="-20" x2="-2" y2="-17" stroke="#1f2029" stroke-width="9"/>
    <path d="M-6 -20 L18 -28 L32 -22 L28 -8 L0 -6Z" fill="#ff3b3b"/>
