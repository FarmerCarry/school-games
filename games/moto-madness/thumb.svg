  <path d="M0 318 Q120 300 230 318 Q320 332 400 312" fill="none" stroke="#4cc437" stroke-width="12"/>
  <path d="M0 314 Q120 296 230 314 Q320 328 400 308" fill="none" stroke="#8be35a" stroke-width="4"/>
  <g fill="#83502a"><ellipse cx="60" cy="350" rx="10" ry="6"/><ellipse cx="170" cy="340" rx="8" ry="5"/><ellipse cx="300" cy="352" rx="12" ry="7"/><ellipse cx="360" cy="338" rx="7" ry="4"/></g>
