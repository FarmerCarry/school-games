    <circle cx="318" cy="52" r="18"/><circle cx="342" cy="42" r="24"/><circle cx="368" cy="54" r="17"/><rect x="318" y="52" width="50" height="19"/>
  </g>
  <!-- far mountains -->
  <path d="M0 262 L60 196 L104 236 L160 170 L220 238 L270 190 L330 244 L400 186 L400 300 L0 300Z" fill="#9ccbe8"/>
  <path d="M160 170 L182 195 L170 192 L160 202 L150 193 L140 196Z M400 186 L380 208 L392 206Z M60 196 L78 216 L66 214 L56 222 L46 212Z" fill="#ffffff"/>
