    <path d="M30 -6 Q50 -14 70 -4 L66 0 Q50 -8 34 -1Z" fill="#ff3b3b"/>
    <rect x="30" y="-36" width="12" height="18" rx="4" fill="#ffd23f"/>
    <line x1="30" y1="-28" x2="26" y2="-40" stroke="#2b2d3a" stroke-width="4"/>
    <line x1="2" y1="12" x2="12" y2="13" stroke="#1f2029" stroke-width="6"/>
    <path d="M-17 -24 L12 -6 L2 10" fill="none" stroke="#2f6bff" stroke-width="12"/>
    <line x1="-17" y1="-24" x2="-21" y2="-48" stroke="#2f6bff" stroke-width="16"/>
    <line x1="-16" y1="-28" x2="-20" y2="-45" stroke="#ffffff" stroke-width="5"/>
    <path d="M-21 -48 L4 -35 L25 -38" fill="none" stroke="#2f6bff" stroke-width="9"/>
    <circle cx="25" cy="-38" r="5" fill="#1f2029"/>
    <g transform="translate(-17 -64)">
      <circle r="14" fill="#ffffff"/>
      <path d="M-14 -2 Q0 -18 14 -4 L10 -8 Q0 -14 -12 -6Z" fill="#ff3b3b"/>
      <rect x="2" y="-5" width="13" height="10" rx="4" fill="#1f2a44"/>
      <rect x="5" y="-3" width="8" height="4" rx="2" fill="#a0e6ff"/>
      <path d="M8 -12 L22 -10 L12 -6Z" fill="#ff3b3b"/>
    </g>
