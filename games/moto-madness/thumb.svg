      <circle cx="-44" cy="24" r="13" fill="#ffd23f"/><circle cx="-44" cy="24" r="10" fill="#1f2029"/><circle cx="-44" cy="24" r="4" fill="#ffd23f"/>
      <circle cx="46" cy="24" r="21" fill="#1f2029"/>
      <circle cx="46" cy="24" r="19" fill="none" stroke="#3a3c48" stroke-width="5" stroke-dasharray="4 4"/>
      <circle cx="46" cy="24" r="13" fill="#ffd23f"/><circle cx="46" cy="24" r="10" fill="#1f2029"/><circle cx="46" cy="24" r="4" fill="#ffd23f"/>
    </g>
