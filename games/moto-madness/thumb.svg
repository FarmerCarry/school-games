<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8fff"/>
      <stop offset="0.6" stop-color="#6cc8ff"/>
      <stop offset="1" stop-color="#c8f0ff"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8683a"/>
      <stop offset="1" stop-color="#6e4020"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f4a" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#1b1f4a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1b1f4a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <!-- sun burst -->
  <g transform="translate(215 150)" fill="#ffffff" opacity="0.16">
    <path d="M0 0 L-40 -300 L40 -300Z"/><path d="M0 0 L-40 -300 L40 -300Z" transform="rotate(30)"/>
    <path d="M0 0 L-40 -300 L40 -300Z" transform="rotate(60)"/><path d="M0 0 L-40 -300 L40 -300Z" transform="rotate(90)"/>
    <path d="M0 0 L-40 -300 L40 -300Z" transform="rotate(120)"/><path d="M0 0 L-40 -300 L40 -300Z" transform="rotate(150)"/>
    <path d="M0 0 L-40 -300 L40 -300Z" transform="rotate(180)"/><path d="M0 0 L-40 -300 L40 -300Z" transform="rotate(210)"/>
    <path d="M0 0 L-40 -300 L40 -300Z" transform="rotate(240)"/><path d="M0 0 L-40 -300 L40 -300Z" transform="rotate(270)"/>
    <path d="M0 0 L-40 -300 L40 -300Z" transform="rotate(300)"/><path d="M0 0 L-40 -300 L40 -300Z" transform="rotate(330)"/>
  </g>
  <!-- clouds -->
