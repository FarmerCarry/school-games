  <!-- sparkles -->
  <g fill="#ffe14d" stroke="#b45309" stroke-width="2" stroke-linejoin="round">
    <path d="M318 112 l6 13 14 2 -10 9 3 14 -13 -7 -13 7 3 -14 -10 -9 14 -2Z"/>
    <path d="M52 128 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1Z"/>
    <path d="M352 204 l3 7 8 1 -6 5 2 8 -7 -4 -7 4 2 -8 -6 -5 8 -1Z"/>
  </g>
  <!-- title -->
  <rect x="0" y="300" width="400" height="100" fill="url(#band)"/>
  <g font-family="Arial Black, 'Segoe UI Black', Impact, Arial, sans-serif" font-weight="900" text-anchor="middle" transform="rotate(-4 200 340)">
    <text x="200" y="344" font-size="62" fill="#ffd23f" stroke="#7c2d12" stroke-width="12" paint-order="stroke" letter-spacing="1">MOTO</text>
    <text x="200" y="388" font-size="44" fill="#ff3b3b" stroke="#ffffff" stroke-width="9" paint-order="stroke" letter-spacing="1">MADNESS</text>
  </g>
