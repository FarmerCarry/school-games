<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>جنون الدراجات</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../shared/game.css">
<style>
  body { background: #0d1030; }
  .mm-ov { background: transparent; }
  .mm-ov.dim { background: rgba(10, 12, 34, 0.55); }
  .mm-round {
    position: fixed; top: 10px; right: 62px; left: auto; z-index: 20; width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.35); color: #fff; font: 700 16px var(--sg-font);
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .mm-round:hover { background: rgba(0,0,0,0.55); }
  .mm-round[hidden], .sg-btn[hidden] { display: none; }

  /* ---------- title ---------- */
  #title { flex-direction: column; background: linear-gradient(180deg, rgba(10,12,40,0.10) 0%, rgba(10,12,40,0.05) 45%, rgba(10,12,40,0.65) 100%); }
  .mm-logo { display: flex; flex-direction: column; align-items: center; line-height: 0.86; transform: rotate(-4deg); animation: mm-bob 2.4s ease-in-out infinite; will-change: transform; }
  .mm-logo span { font-weight: 700; color: #fff; -webkit-text-stroke: 0; }
  .mm-logo .l1 { font-size: min(15vh, 12vw); color: #ffd23f;
    text-shadow: 0 0.06em 0 #c2410c, 0 0.1em 0 #7c2d12, 0 0.16em 0.12em rgba(0,0,0,0.45), 0.03em 0 0 #7c2d12, -0.03em 0 0 #7c2d12, 0 -0.03em 0 #7c2d12; }
  .mm-logo .l2 { font-size: min(11vh, 9vw); color: #ff3b3b; margin-top: 0.05em;
    text-shadow: 0 0.06em 0 #7f1d1d, 0 0.11em 0 #450a0a, 0 0.17em 0.12em rgba(0,0,0,0.45), 0.035em 0 0 #fff, -0.035em 0 0 #fff, 0 -0.035em 0 #fff, 0 0.035em 0 #fff; }
  .mm-tag { margin: 3vh 0 2vh; font-size: min(3.2vh, 22px); font-weight: 700; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,0.5); }
  .mm-big { font-size: min(5vh, 34px); padding: 0.35em 1.6em; animation: mm-pulse 1.3s ease-in-out infinite; will-change: transform; }
  .mm-row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .mm-howto { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 2.4vh; font-size: min(2.6vh, 17px);
    background: rgba(12,14,40,0.7); padding: 10px 18px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.15); }
  .mm-howto div { white-space: nowrap; }
  .mm-stat { margin-top: 1.6vh; font-size: min(3vh, 20px); font-weight: 700; color: #ffd23f; text-shadow: 0 2px 0 rgba(0,0,0,0.5); }

  /* ---------- panels ---------- */
  .mm-panel { background: rgba(16, 20, 50, 0.92); border: 3px solid rgba(255,255,255,0.18); border-radius: 24px; padding: 2.2vh 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; animation: mm-in 0.3s cubic-bezier(.2,1.5,.4,1); max-height: 96vh; }
  .mm-h { margin: 0 0 1.2vh; font-size: min(6vh, 40px); font-weight: 700; text-shadow: 0 4px 0 rgba(0,0,0,0.4); }

  /* ---------- level select ---------- */
  #levels .mm-panel { width: min(96vw, 900px); }
  .mm-world { display: grid; grid-template-columns: 128px repeat(5, 1fr); gap: 8px; align-items: stretch; margin-bottom: 1vh; }
  .mm-wname { display: flex; flex-direction: column; justify-content: center; text-align: right; font-weight: 700; font-size: min(2.6vh, 17px); line-height: 1.15; }
  .mm-wname small { color: #ffd23f; font-size: min(2.3vh, 15px); }
  .mm-tile { position: relative; height: min(11.5vh, 84px); border-radius: 14px; border: 3px solid rgba(255,255,255,0.25); cursor: pointer; color: #fff;
    font: 700 min(3vh, 20px) var(--sg-font); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.35); transition: transform 0.08s ease; text-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  .mm-tile:hover, .mm-tile.sel { transform: translateY(-3px) scale(1.05); border-color: #fff; box-shadow: 0 0 0 3px #ffd23f, 0 6px 0 rgba(0,0,0,0.35); }
  .mm-tile .nm { font-size: min(1.8vh, 12px); font-weight: 500; opacity: 0.95; white-space: nowrap; overflow: hidden; max-width: 100%; }
  .mm-tile .st { font-size: min(2.4vh, 16px); letter-spacing: 1px; }
  .mm-tile .st .off { color: rgba(0,0,0,0.35); text-shadow: none; }
  .mm-tile .st .on { color: #ffe14d; }
  .mm-tile .bt { font-size: min(1.7vh, 11px); opacity: 0.9; }
  .mm-tile.locked { filter: grayscale(0.9) brightness(0.55); cursor: not-allowed; }
  .mm-tile.next::after { content: 'جديد'; position: absolute; top: -10px; left: -6px; background: #ff3b3b; color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 8px; }

  /* ---------- garage ---------- */
  #garage .mm-panel { width: min(96vw, 760px); }
  #preview { width: 100%; max-width: 420px; height: auto; aspect-ratio: 420 / 200; display: block; margin: 0 auto; border-radius: 16px;
    background: radial-gradient(ellipse at 50% 90%, #3a4a8a 0%, #1a1f48 70%); }
  .mm-swrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0.8vh 0 1.4vh; }
  .mm-sw { width: min(8vh, 58px); height: min(8vh, 58px); border-radius: 14px; border: 3px solid rgba(255,255,255,0.25); cursor: pointer; position: relative;
    display: flex; align-items: flex-end; justify-content: center; font: 700 12px var(--sg-font); color: #fff; padding-bottom: 2px; text-shadow: 0 1px 2px #000; }
  .mm-sw.cur { border-color: #fff; box-shadow: 0 0 0 3px #ffd23f; }
  .mm-sw.locked { cursor: not-allowed; }
  .mm-sw.locked::before { content: ''; position: absolute; inset: 0; background: rgba(10,12,30,0.62); border-radius: 11px; }
  .mm-sw span { position: relative; }
  .mm-glabel { font-weight: 700; font-size: min(2.8vh, 18px); margin-top: 0.6vh; }
  .mm-gname { color: #ffd23f; }

  /* ---------- complete ---------- */
  #complete .mm-panel { min-width: min(92vw, 460px); }
  .mm-stars { display: flex; gap: 14px; justify-content: center; margin: 0.6vh 0 1vh; }
  .mm-star { font-size: min(11vh, 76px); line-height: 1; color: rgba(255,255,255,0.15); text-shadow: 0 4px 0 rgba(0,0,0,0.3); transform: scale(0.6); }
  .mm-star.on { color: #ffd23f; text-shadow: 0 0 20px rgba(255,210,63,0.8), 0 5px 0 #b45309; animation: mm-starpop 0.45s cubic-bezier(.2,1.8,.4,1) forwards; }
  .mm-star:nth-child(2) { margin-top: -18px; }
  .mm-time { font-size: min(7vh, 48px); font-weight: 700; margin: 0; }
  .mm-sub { font-size: min(2.6vh, 17px); opacity: 0.9; margin: 0.4vh 0; }
  .mm-best { display: inline-block; background: #ff3b3b; color: #fff; font-weight: 700; padding: 3px 14px; border-radius: 999px; margin: 0.6vh 0; animation: mm-pulse 0.8s ease-in-out infinite; }
  .mm-unlock { margin: 0.8vh auto; background: linear-gradient(90deg, #7c3aed, #db2777); padding: 6px 14px; border-radius: 12px; font-weight: 700; font-size: min(2.6vh, 17px); }
  .mm-next { font-size: min(2.3vh, 15px); color: #ffd23f; margin-top: 0.4vh; }
  .mm-keys { font-size: min(2.2vh, 14px); opacity: 0.75; margin-top: 0.8vh; }

  @keyframes mm-in { from { transform: scale(0.88); } to { transform: scale(1); } }
  @keyframes mm-bob { 0%, 100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(-2deg) translateY(-6px); } }
  @keyframes mm-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes mm-starpop { 0% { transform: scale(0.2) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<button id="pauseBtn" class="mm-round" type="button" aria-label="إيقاف مؤقت" hidden><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="1" width="4.5" height="14" rx="1.5" fill="#fff"/><rect x="9.5" y="1" width="4.5" height="14" rx="1.5" fill="#fff"/></svg></button>

<div id="title" class="sg-overlay mm-ov">
  <div class="mm-logo"><span class="l1">جنون</span><span class="l2">الدراجات</span></div>
  <div class="mm-tag">انطلق، تشقلب، اهبط بثبات… واسبق الوقت!</div>
  <div class="mm-row">
    <button class="sg-btn mm-big" id="btnPlay" type="button">▶ العب</button>
    <button class="sg-btn secondary" id="btnGarage" type="button">🏍️ المرآب</button>
  </div>
  <div class="mm-howto">
    <div><span dir="ltr"><span class="sg-key">↑</span><span class="sg-key">W</span></span> انطلق</div>
    <div><span dir="ltr"><span class="sg-key">↓</span><span class="sg-key">S</span></span> فرامل</div>
    <div><span dir="ltr"><span class="sg-key">←</span><span class="sg-key">→</span></span> مَيَلان وشقلبة</div>
    <div><span class="sg-key">R</span> إعادة</div>
    <div><span dir="ltr"><span class="sg-key">P</span><span class="sg-key">Esc</span></span> إيقاف مؤقت</div>
  </div>
  <div class="mm-stat" id="titleStat"></div>
</div>

<div id="levels" class="sg-overlay mm-ov dim" hidden>
  <div class="mm-panel">
    <h2 class="mm-h">اختر مرحلة</h2>
    <div id="levelGrid"></div>
    <div class="mm-row">
      <button class="sg-btn secondary" id="btnLvBack" type="button">▶ رجوع</button>
      <button class="sg-btn secondary" id="btnLvGarage" type="button">🏍️ المرآب</button>
      <span class="mm-stat" id="lvStars" style="margin:0 8px 0 0"></span>
    </div>
  </div>
</div>

<div id="garage" class="sg-overlay mm-ov dim" hidden>
  <div class="mm-panel">
    <h2 class="mm-h">المرآب</h2>
    <canvas id="preview" width="840" height="400"></canvas>
    <div class="mm-glabel">لون الدراجة: <span class="mm-gname" id="paintName"></span></div>
    <div class="mm-swrow" id="paintRow"></div>
    <div class="mm-glabel">بدلة السائق: <span class="mm-gname" id="suitName"></span></div>
    <div class="mm-swrow" id="suitRow"></div>
    <div class="mm-row"><button class="sg-btn good" id="btnGarageBack" type="button">✔ تم</button><span class="mm-stat" id="gStars" style="margin:0 8px 0 0"></span></div>
  </div>
</div>

<div id="pause" class="sg-overlay mm-ov dim" hidden>
  <div class="mm-panel">
    <h2 class="mm-h">استراحة</h2>
    <div class="mm-row" style="flex-direction:column">
      <button class="sg-btn good" id="btnResume" type="button">▶ تابع اللعب</button>
      <button class="sg-btn" id="btnRestart" type="button">↻ أعد المرحلة</button>
      <button class="sg-btn secondary" id="btnPauseLevels" type="button">☰ المراحل</button>
    </div>
    <div class="mm-keys"><span class="sg-key">P</span> متابعة &nbsp; <span class="sg-key">R</span> إعادة</div>
  </div>
</div>

<div id="complete" class="sg-overlay mm-ov dim" hidden>
  <div class="mm-panel">
    <h2 class="mm-h" id="cTitle">أنهيت المرحلة!</h2>
    <div class="mm-stars" id="cStars"><div class="mm-star">★</div><div class="mm-star">★</div><div class="mm-star">★</div></div>
    <p class="mm-time" id="cTime">0:00.0</p>
    <div id="cBest"></div>
    <p class="mm-sub" id="cInfo"></p>
    <div id="cUnlock"></div>
    <div class="mm-next" id="cNext"></div>
    <div class="mm-row" style="margin-top:1vh">
      <button class="sg-btn good" id="btnNext" type="button">التالي ◀</button>
      <button class="sg-btn" id="btnRetry" type="button">↻ أعد المحاولة</button>
      <button class="sg-btn secondary" id="btnCLevels" type="button">☰ المراحل</button>
    </div>
    <div class="mm-keys" id="cKeys"><span class="sg-key">Enter</span> التالي &nbsp; <span class="sg-key">R</span> إعادة &nbsp; <span class="sg-key">Esc</span> المراحل</div>
  </div>
</div>

<script src="../../shared/kit.js"></script>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="render.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
