<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ضربة إلى الفضاء</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="ملعب ضربة إلى الفضاء"></canvas>
  <main id="ui" data-phase="title">
    <div id="hud" class="hud" hidden>
      <div class="hud-left">
        <div class="chip run-coins" aria-label="عملات هذه الضربة"><i class="coin-ico" aria-hidden="true"></i><b id="run-coins">0</b></div>
        <div id="rockets" class="rockets" aria-label="الصواريخ"></div>
      </div>
      <div id="distance" class="distance"><b id="meters" dir="ltr">0</b><span>متر</span></div>
      <div id="altimeter" class="altimeter" aria-hidden="true">
        <span class="alt-goal">الفضاء</span>
        <div class="alt-track"><div id="alt-fill" class="alt-fill"></div><i id="alt-ball" class="alt-ball"></i></div>
        <span class="alt-value"><b id="alt-meters">0</b> م</span>
      </div>
      <p id="hint" class="hint" hidden></p>
    </div>
    <button id="pause" class="round-button pause-button" type="button" aria-label="إيقاف مؤقت" title="إيقاف مؤقت (P / Esc)" hidden><i class="pause-icon" aria-hidden="true"></i></button>
    <div id="toast" class="toast" role="status" hidden></div>

    <section id="title-screen" class="title-screen">
      <h1 class="logo"><span class="logo-top">ضربة إلى</span><span class="logo-main">الفضاء</span></h1>
      <div class="title-stats">
        <span class="chip"><i class="coin-ico" aria-hidden="true"></i><b id="coins">0</b></span>
        <span class="chip">أفضل مسافة: <b id="best-meters" dir="ltr">0</b> م</span>
      </div>
      <button id="play" class="button primary play" type="button">العب<i class="play-icon" aria-hidden="true"></i></button>
      <div class="title-actions">
        <button id="open-shop" class="button secondary" type="button">المتجر</button>
        <button id="open-worlds" class="button secondary" type="button">العوالم <small id="world-label"></small></button>
      </div>
      <ul class="howto">
        <li><span dir="ltr"><span class="sg-key">مسافة</span> <span class="sg-key">انقر</span></span> اضرب عندما يصل المضرب إلى <b class="gold">الذهبي</b></li>
        <li>في الهواء: <b>صاروخ</b> · قرب الأرض: <b>قفزة خارقة</b></li>
      </ul>
      <p id="journey" class="journey"></p>
    </section>

    <section id="modal" class="modal" hidden aria-modal="true" role="dialog" aria-labelledby="modal-heading">
      <div id="panel" class="panel">
        <button id="close-modal" class="close-button" type="button" aria-label="رجوع">×</button>
        <h2 id="modal-heading"></h2>
        <div id="result-content" hidden>
          <p id="result-note" class="result-note"></p>
          <div class="result-distance"><b id="result-meters" dir="ltr">0</b><span>متر</span></div>
          <div id="result-coins" class="result-coins"></div>
          <p id="result-unlock" class="result-unlock" hidden></p>
        </div>
        <div id="shop-content" hidden>
          <div class="shop-wallet chip"><i class="coin-ico" aria-hidden="true"></i><b id="shop-coins">0</b></div>
          <div id="upgrades" class="upgrades"></div>
          <div id="skins-content"><h3>شكل الكرة</h3><div id="skins" class="skins"></div></div>
        </div>
        <div id="worlds-content" class="worlds" hidden></div>
        <div id="pause-content" hidden>
          <p class="pause-copy">خذ نفسًا… الكرة تنتظرك!</p>
          <button id="resume" class="button primary" type="button">تابع اللعب</button>
          <button id="restart" class="button secondary" type="button">ضربة جديدة</button>
        </div>
        <div class="modal-actions">
          <button id="again" class="button primary" type="button" hidden>ضربة أخرى</button>
          <button id="menu" class="button text-button" type="button">القائمة الرئيسية</button>
        </div>
        <p id="modal-tip" class="modal-tip"></p>
      </div>
    </section>
    <p id="announce" class="sr-only" aria-live="polite"></p>
  </main>
  <script src="../../shared/kit.js"></script>
  <script src="physics.js"></script>
  <script src="art.js"></script>
  <script src="game.js"></script>
</body>
</html>
