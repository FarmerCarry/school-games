<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#090724"/>
<stop offset="0.52" stop-color="#281b6e"/>
<stop offset="1" stop-color="#2b95f0"/>
</linearGradient>
<linearGradient id="flame" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#ff1744"/>
<stop offset="0.55" stop-color="#ff9100"/>
<stop offset="1" stop-color="#fff59d"/>
</linearGradient>
<radialGradient id="ball" cx="0.35" cy="0.3" r="0.7">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="0.65" stop-color="#eef4ff"/>
<stop offset="1" stop-color="#b8c6e6"/>
</radialGradient>
</defs>
<rect width="400" height="400" rx="44" fill="url(#sky)"/>
<!-- Stars -->
<g fill="#fff9db">
<circle cx="48" cy="46" r="2.5"/><circle cx="116" cy="34" r="2"/><circle cx="196" cy="52" r="3"/>
<circle cx="272" cy="32" r="2"/><circle cx="348" cy="58" r="2.8"/><circle cx="72" cy="118" r="2"/>
<circle cx="338" cy="138" r="2.2"/><circle cx="154" cy="96" r="1.8"/>
</g>
<!-- Ringed Space Planet -->
<g transform="translate(88,88) rotate(-16)">
<ellipse cx="0" cy="0" rx="52" ry="13" fill="none" stroke="#ffd9a0" stroke-width="7"/>
<circle cx="0" cy="0" r="28" fill="#ff8f4d" stroke="#1b1640" stroke-width="5"/>
<path d="M-52,0 A52,13 0 0,0 52,0" fill="none" stroke="#ffd9a0" stroke-width="7"/>
</g>
<!-- Alien UFO Drone -->
<g transform="translate(310,118) rotate(11)">
<path d="M-24,-4 A24,22 0 0,1 24,-4 Z" fill="#b3e5fc" stroke="#1b1640" stroke-width="4.5"/>
<circle cx="0" cy="-12" r="7" fill="#69f0ae"/>
<ellipse cx="0" cy="2" rx="44" ry="15" fill="#ab47bc" stroke="#1b1640" stroke-width="5"/>
<circle cx="-22" cy="3" r="5" fill="#76ff03" stroke="#1b1640" stroke-width="2.5"/>
<circle cx="0" cy="5" r="5" fill="#ffd600" stroke="#1b1640" stroke-width="2.5"/>
<circle cx="22" cy="3" r="5" fill="#00e5ff" stroke="#1b1640" stroke-width="2.5"/>
</g>
<!-- Green Hills & Launch Ground -->
<path d="M0,318 Q105,278 215,312 T400,296 L400,400 L0,400 Z" fill="#359e56" stroke="#1b1640" stroke-width="5"/>
<path d="M0,342 Q125,314 260,346 T400,334 L400,400 L0,400 Z" fill="#5ad949" stroke="#1b1640" stroke-width="5"/>
<!-- Exploding TNT Crate -->
<g transform="translate(88,284) rotate(-12)">
<polygon points="0,-46 14,-18 44,-26 22,-2 42,22 12,18 0,44 -14,18 -42,24 -22,-2 -40,-26 -12,-18" fill="#ffd600" stroke="#1b1640" stroke-width="4"/>
<rect x="-26" y="-24" width="52" height="48" rx="8" fill="#e53935" stroke="#1b1640" stroke-width="4.5"/>
<rect x="-26" y="-9" width="52" height="18" fill="#fff3cd" stroke="#1b1640" stroke-width="3.5"/>
<text x="0" y="5" text-anchor="middle" direction="rtl" font-family="Fredoka, sans-serif" font-weight="700" font-size="13" fill="#1b1640">ديناميت</text>
</g>
<!-- Turbo Booster Ring -->
<g transform="translate(206,192) rotate(32)">
<ellipse cx="0" cy="0" rx="22" ry="54" fill="none" stroke="#1b1640" stroke-width="15"/>
<ellipse cx="0" cy="0" rx="22" ry="54" fill="none" stroke="#00e5ff" stroke-width="8"/>
</g>
<!-- Rocket Flame Trail + Fiery Golf Ball -->
<path d="M88,284 Q158,236 246,154 L222,130 Q144,218 88,284 Z" fill="url(#flame)" stroke="#1b1640" stroke-width="5" stroke-linejoin="round"/>
<g transform="translate(248,144)">
<circle cx="0" cy="0" r="42" fill="url(#ball)" stroke="#1b1640" stroke-width="6"/>
<path d="M-36,-18 H36 M-36,18 H36" stroke="#ff3d57" stroke-width="9" stroke-linecap="round"/>
<circle cx="-12" cy="-14" r="9" fill="#ffffff" opacity="0.8"/>
<circle cx="10" cy="-2" r="10" fill="#00e5ff" stroke="#1b1640" stroke-width="4"/>
</g>
<!-- Gold Coins -->
<g stroke="#1b1640" stroke-width="4" fill="#ffd000">
<circle cx="152" cy="148" r="12"/><circle cx="326" cy="212" r="13"/>
</g>
<!-- Arabic RTL Title Banner -->
<rect x="24" y="324" width="352" height="58" rx="22" fill="#25175c" stroke="#1b1640" stroke-width="5"/>
<text x="200" y="363" text-anchor="middle" direction="rtl" font-family="Fredoka, 'Noto Sans Arabic', sans-serif" font-weight="700" font-size="36" fill="#ffd000" stroke="#1b1640" stroke-width="7" paint-order="stroke fill">ضربة إلى الفضاء</text>
</svg>
