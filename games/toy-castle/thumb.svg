<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="68%" stop-color="#9be7ff"/>
      <stop offset="100%" stop-color="#fff4c4"/>
    </linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52cf58"/>
      <stop offset="100%" stop-color="#2ea843"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2be78"/>
      <stop offset="100%" stop-color="#c9853b"/>
    </linearGradient>
  </defs>

  <!-- Sunny playroom sky & clouds -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.92">
    <rect x="34" y="44" width="84" height="28" rx="14"/>
    <circle cx="62" cy="44" r="18"/><circle cx="88" cy="48" r="14"/>
    <rect x="278" y="34" width="90" height="28" rx="14"/>
    <circle cx="308" cy="36" r="18"/><circle cx="336" cy="40" r="14"/>
  </g>

  <!-- Parachute energy crate floating in center sky -->
  <g transform="translate(200,98)">
    <path d="M-28 0 Q0 -34 28 0 Z" fill="#ff595e" stroke="#1e2342" stroke-width="4"/>
    <path d="M-10 -2 Q0 -32 10 -2 Z" fill="#ffe066"/>
    <line x1="-22" y1="0" x2="-9" y2="24" stroke="#1e2342" stroke-width="2.5"/>
    <line x1="22" y1="0" x2="9" y2="24" stroke="#1e2342" stroke-width="2.5"/>
    <rect x="-15" y="22" width="30" height="28" rx="6" fill="#ffbe0b" stroke="#1e2342" stroke-width="4"/>
    <path d="M2 27 L-6 38 H1 L-2 46 L7 35 H0 Z" fill="#38f2ff" stroke="#1e2342" stroke-width="1.5"/>
  </g>

  <!-- Tabletop & checkered battle playmat -->
  <rect x="0" y="278" width="400" height="122" fill="url(#wood)"/>
  <rect x="0" y="254" width="400" height="36" fill="url(#mat)" stroke="#1e2342" stroke-width="4"/>
  <rect x="0" y="264" width="400" height="18" fill="#ffe680"/>
  <g fill="#fff5cc">
    <rect x="20" y="264" width="36" height="18"/><rect x="92" y="264" width="36" height="18"/>
    <rect x="164" y="264" width="36" height="18"/><rect x="236" y="264" width="36" height="18"/>
    <rect x="308" y="264" width="36" height="18"/>
  </g>

  <!-- Left Blue Plastic-Brick Toy Castle + Cork Cannon -->
  <g transform="translate(8,108)">
    <!-- Brick studs on keep roof -->
    <rect x="40" y="64" width="14" height="10" rx="3" fill="#ffd23f" stroke="#1e2342" stroke-width="3"/>
    <rect x="86" y="64" width="14" height="10" rx="3" fill="#ffd23f" stroke="#1e2342" stroke-width="3"/>
    <!-- Left turret & flag -->
    <rect x="4" y="52" width="36" height="110" rx="6" fill="#3b82f6" stroke="#1e2342" stroke-width="4.5"/>
    <polygon points="0,54 22,12 44,54" fill="#1d4ed8" stroke="#1e2342" stroke-width="4.5" stroke-linejoin="round"/>
    <line x1="22" y1="12" x2="22" y2="-10" stroke="#1e2342" stroke-width="4"/>
    <polygon points="22,-10 50,-2 22,8" fill="#ffd23f" stroke="#1e2342" stroke-width="3"/>
    <!-- Main brick keep & drawbridge -->
    <rect x="30" y="72" width="76" height="90" rx="8" fill="#3b82f6" stroke="#1e2342" stroke-width="4.5"/>
    <rect x="30" y="102" width="76" height="14" fill="#ffd23f" stroke="#1e2342" stroke-width="3.5"/>
    <path d="M54 162 V128 Q68 114 82 128 V162 Z" fill="#7a4924" stroke="#1e2342" stroke-width="4"/>
    <!-- Top Cork Cannon -->
    <g transform="translate(74,64) rotate(-24)">
      <rect x="-12" y="-12" width="44" height="24" rx="10" fill="#1d4ed8" stroke="#1e2342" stroke-width="4"/>
      <rect x="24" y="-14" width="10" height="28" rx="4" fill="#ffd23f" stroke="#1e2342" stroke-width="3.5"/>
      <circle cx="-14" cy="0" r="8" fill="#ff4d6d" stroke="#1e2342" stroke-width="3"/>
    </g>
  </g>

  <!-- Right Red Plastic-Brick Rival Castle -->
  <g transform="translate(284,108)">
    <rect x="8" y="64" width="14" height="10" rx="3" fill="#ff9f1c" stroke="#1e2342" stroke-width="3"/>
    <rect x="54" y="64" width="14" height="10" rx="3" fill="#ff9f1c" stroke="#1e2342" stroke-width="3"/>
    <rect x="68" y="52" width="36" height="110" rx="6" fill="#ef4444" stroke="#1e2342" stroke-width="4.5"/>
    <polygon points="64,54 86,12 108,54" fill="#b91c1c" stroke="#1e2342" stroke-width="4.5" stroke-linejoin="round"/>
    <line x1="86" y1="12" x2="86" y2="-10" stroke="#1e2342" stroke-width="4"/>
    <polygon points="86,-10 58,-2 86,8" fill="#ff9f1c" stroke="#1e2342" stroke-width="3"/>
    <rect x="2" y="72" width="76" height="90" rx="8" fill="#ef4444" stroke="#1e2342" stroke-width="4.5"/>
    <rect x="2" y="102" width="76" height="14" fill="#ff9f1c" stroke="#1e2342" stroke-width="3.5"/>
    <path d="M26 162 V128 Q40 114 54 128 V162 Z" fill="#5e3214" stroke="#1e2342" stroke-width="4"/>
    <!-- Rival Cork Cannon -->
    <g transform="translate(34,64) rotate(24)">
      <rect x="-32" y="-12" width="44" height="24" rx="10" fill="#b91c1c" stroke="#1e2342" stroke-width="4"/>
      <rect x="-34" y="-14" width="10" height="28" rx="4" fill="#ff9f1c" stroke="#1e2342" stroke-width="3.5"/>
    </g>
  </g>

  <!-- Dotted cork cannon arc & flying cork -->
  <path d="M114 156 Q165 112 195 128" fill="none" stroke="#fff3b0" stroke-width="6" stroke-dasharray="9 9" stroke-linecap="round"/>
  <g transform="translate(154,132) rotate(-18)">
    <rect x="-11" y="-8" width="22" height="16" rx="5" fill="#d89e5a" stroke="#1e2342" stroke-width="3.5"/>
  </g>

  <!-- Cute Chunky Foam Knight (Blue) charging right -->
  <g transform="translate(128,204)">
    <rect x="8" y="30" width="32" height="32" rx="8" fill="#3b82f6" stroke="#1e2342" stroke-width="4"/>
    <rect x="8" y="10" width="32" height="24" rx="8" fill="#3b82f6" stroke="#1e2342" stroke-width="4"/>
    <path d="M18 2 Q28 -4 36 8 L18 10 Z" fill="#ffd23f" stroke="#1e2342" stroke-width="3"/>
    <rect x="16" y="18" width="20" height="10" rx="4" fill="#ffd6a5"/>
    <circle cx="23" cy="23" r="2.5" fill="#1e2342"/><circle cx="31" cy="23" r="2.5" fill="#1e2342"/>
    <circle cx="8" cy="46" r="13" fill="#ffd23f" stroke="#1e2342" stroke-width="4"/>
    <rect x="42" y="14" width="10" height="36" rx="4" fill="#7be0ff" stroke="#1e2342" stroke-width="3.5"/>
  </g>

  <!-- Cute Wind-Up Dino Tank (Red) charging left -->
  <g transform="translate(208,200)">
    <path d="M46 12 L56 2 L66 12 L56 22 Z" fill="#ffd23f" stroke="#1e2342" stroke-width="3.5"/>
    <rect x="20" y="20" width="40" height="28" rx="9" fill="#ef4444" stroke="#1e2342" stroke-width="4"/>
    <rect x="2" y="12" width="24" height="24" rx="7" fill="#ef4444" stroke="#1e2342" stroke-width="4"/>
    <path d="M4 17 L-8 12 L2 25 Z" fill="#fff" stroke="#1e2342" stroke-width="3"/>
    <circle cx="12" cy="21" r="4" fill="#fff"/><circle cx="11" cy="21" r="2" fill="#1e2342"/>
    <rect x="4" y="46" width="56" height="15" rx="7.5" fill="#2c2b47" stroke="#1e2342" stroke-width="3.5"/>
    <circle cx="16" cy="53.5" r="4" fill="#ff9f1c"/><circle cx="32" cy="53.5" r="4" fill="#ff9f1c"/><circle cx="48" cy="53.5" r="4" fill="#ff9f1c"/>
  </g>
</svg>
