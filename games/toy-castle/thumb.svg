<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="fortB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="fortR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="mechB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="flare" cx="52%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky & Battle Glow -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="212" cy="195" r="145" fill="url(#flare)"/>

  <!-- Distant Mountains -->
  <path d="M0 305 L65 235 L130 285 L205 215 L285 280 L345 230 L400 290 L400 330 L0 330 Z" fill="#172554" opacity="0.8"/>

  <!-- Meteor Streak in Sky -->
  <g transform="rotate(28 245 78)">
    <rect x="175" y="68" width="82" height="20" rx="10" fill="#f97316"/>
    <circle cx="252" cy="78" r="14" fill="#fef08a" stroke="#1b1640" stroke-width="4"/>
  </g>

  <!-- River / Energy Trench -->
  <rect x="0" y="318" width="400" height="82" fill="#0284c7"/>
  <rect x="36" y="352" width="76" height="8" rx="4" fill="#7dd3fc" opacity="0.45"/>
  <rect x="178" y="368" width="92" height="8" rx="4" fill="#7dd3fc" opacity="0.45"/>
  <rect x="296" y="346" width="68" height="8" rx="4" fill="#7dd3fc" opacity="0.45"/>

  <!-- Snap-Brick Battle Bridge -->
  <g stroke="#1b1640" stroke-width="4.5" stroke-linejoin="round">
    <rect x="78" y="316" width="34" height="84" rx="6" fill="#334155"/>
    <rect x="184" y="316" width="34" height="84" rx="6" fill="#334155"/>
    <rect x="288" y="316" width="34" height="84" rx="6" fill="#334155"/>
    <!-- Snap studs -->
    <rect x="108" y="290" width="22" height="12" rx="4" fill="#facc15"/>
    <rect x="148" y="290" width="22" height="12" rx="4" fill="#facc15"/>
    <rect x="188" y="290" width="22" height="12" rx="4" fill="#38bdf8"/>
    <rect x="228" y="290" width="22" height="12" rx="4" fill="#fb923c"/>
    <rect x="268" y="290" width="22" height="12" rx="4" fill="#fb923c"/>
    <rect x="-8" y="298" width="416" height="28" rx="6" fill="#64748b"/>
  </g>
  <rect x="0" y="301" width="400" height="8" fill="#ffffff" opacity="0.24"/>

  <!-- Left Cobalt Fortress & Roof Cannon -->
  <g stroke="#1b1640" stroke-width="4.5" stroke-linejoin="round">
    <!-- Banner -->
    <line x1="34" y1="66" x2="34" y2="122" stroke="#1b1640" stroke-width="5"/>
    <path d="M36 68 L84 76 L72 88 L84 98 L36 104 Z" fill="#facc15"/>
    <!-- Tower & Battlements -->
    <rect x="-6" y="118" width="78" height="184" rx="10" fill="#1e3a8a"/>
    <rect x="4" y="102" width="20" height="22" rx="5" fill="#facc15"/>
    <rect x="30" y="102" width="20" height="22" rx="5" fill="#facc15"/>
    <rect x="56" y="102" width="20" height="22" rx="5" fill="#facc15"/>
    <rect x="6" y="152" width="96" height="150" rx="12" fill="url(#fortB)"/>
    <rect x="22" y="176" width="26" height="38" rx="12" fill="#090e1f"/>
    <rect x="27" y="182" width="16" height="26" rx="8" fill="#38bdf8" stroke="none"/>
    <rect x="58" y="226" width="38" height="76" rx="18" fill="#0f172a"/>
    <!-- Roof Cannon -->
    <rect x="46" y="134" width="50" height="20" rx="7" fill="#facc15"/>
    <g transform="rotate(-14 72 126)">
      <rect x="58" y="108" width="56" height="26" rx="8" fill="#0284c7"/>
      <rect x="104" y="104" width="14" height="34" rx="5" fill="#fde047"/>
      <circle cx="64" cy="121" r="14" fill="#1e293b"/>
      <circle cx="64" cy="121" r="6" fill="#38bdf8" stroke="none"/>
    </g>
  </g>

  <!-- Right Crimson Rival Fortress -->
  <g stroke="#1b1640" stroke-width="4.5" stroke-linejoin="round">
    <rect x="330" y="128" width="76" height="174" rx="10" fill="#7f1d1d"/>
    <rect x="328" y="112" width="20" height="22" rx="5" fill="#fb923c"/>
    <rect x="354" y="112" width="20" height="22" rx="5" fill="#fb923c"/>
    <rect x="380" y="112" width="20" height="22" rx="5" fill="#fb923c"/>
    <rect x="308" y="160" width="94" height="142" rx="12" fill="url(#fortR)"/>
    <rect x="314" y="230" width="36" height="72" rx="17" fill="#0f172a"/>
  </g>

  <!-- Cannon Shot Blast Arc -->
  <circle cx="152" cy="104" r="9" fill="#fef08a" stroke="#1b1640" stroke-width="3.5"/>
  <circle cx="132" cy="110" r="5" fill="#38bdf8"/>

  <!-- Hero Mega-Mech Champion (Center-Left) -->
  <g transform="translate(116 176)" stroke="#1b1640" stroke-width="4.5" stroke-linejoin="round">
    <!-- Legs -->
    <rect x="18" y="88" width="22" height="34" rx="6" fill="#334155"/>
    <rect x="54" y="88" width="22" height="34" rx="6" fill="#334155"/>
    <!-- Shoulder Rocket Pod -->
    <rect x="8" y="6" width="34" height="20" rx="6" fill="#475569"/>
    <circle cx="35" cy="16" r="6" fill="#fde047"/>
    <!-- Armored Chest -->
    <rect x="12" y="24" width="72" height="68" rx="18" fill="url(#mechB)"/>
    <rect x="18" y="29" width="60" height="18" rx="8" fill="#ffffff" opacity="0.28" stroke="none"/>
    <!-- Visor -->
    <rect x="34" y="36" width="38" height="18" rx="8" fill="#090e1f"/>
    <rect x="39" y="40" width="28" height="10" rx="5" fill="#fde047" stroke="none"/>
    <!-- Core -->
    <circle cx="48" cy="70" r="11" fill="#facc15"/>
    <!-- Giant Power Fist -->
    <rect x="70" y="50" width="34" height="30" rx="10" fill="#facc15"/>
  </g>

  <!-- Clash Starburst -->
  <path d="M236 226 L246 208 L254 227 L274 222 L260 239 L275 253 L254 252 L247 271 L237 253 L217 256 L229 239 L216 223 Z" fill="#fef08a" stroke="#1b1640" stroke-width="4" stroke-linejoin="round"/>

  <!-- Rival Armored Dino-Mech (Center-Right) -->
  <g transform="translate(244 206)" stroke="#1b1640" stroke-width="4.5" stroke-linejoin="round">
    <rect x="20" y="64" width="18" height="28" rx="5" fill="#1e293b"/>
    <rect x="52" y="64" width="18" height="28" rx="5" fill="#1e293b"/>
    <!-- Crown Horns -->
    <path d="M18 28 L2 14 L18 42 Z" fill="#fef08a"/>
    <rect x="16" y="20" width="58" height="48" rx="14" fill="#dc2626"/>
    <rect x="22" y="30" width="28" height="14" rx="6" fill="#090e1f"/>
    <rect x="26" y="34" width="20" height="6" rx="3" fill="#fb923c" stroke="none"/>
    <rect x="4" y="42" width="24" height="22" rx="8" fill="#fb923c"/>
  </g>
</svg>
