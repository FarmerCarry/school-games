<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قلعة الألعاب — حصار الآليين والفرسان</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <symbol id="i-play" viewBox="0 0 64 64"><path d="M21 11 Q17 9 17 14 L17 50 Q17 55 21 53 L53 35 Q57 32 53 29 Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 64 64"><rect x="15" y="12" width="12" height="40" rx="5"/><rect x="37" y="12" width="12" height="40" rx="5"/></symbol>
  <symbol id="i-again" viewBox="0 0 64 64"><path d="M50 30 A19 19 0 1 1 41 15" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><path d="M33 4 L52 13 L37 27 Z"/></symbol>
  <symbol id="i-levels" viewBox="0 0 64 64"><rect x="7" y="10" width="21" height="20" rx="5"/><rect x="36" y="10" width="21" height="20" rx="5"/><rect x="7" y="36" width="21" height="20" rx="5"/><rect x="36" y="36" width="21" height="20" rx="5"/></symbol>
  <symbol id="i-home" viewBox="0 0 64 64"><path d="M8 32 L32 10 L56 32 L49 32 L49 54 L37 54 L37 40 L27 40 L27 54 L15 54 L15 32 Z"/></symbol>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 5 L39 23.3 L58.6 24.4 L43.4 36.7 L48.5 55.6 L32 45 L15.5 55.6 L20.6 36.7 L5.4 24.4 L25 23.3 Z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 64 64"><path d="M36 6 L14 35 H31 L26 58 L50 27 H33 Z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 64 64"><path d="M32 6 L54 15 V32 C54 46 44 55 32 60 C20 55 10 46 10 32 V15 Z"/></symbol>
  <symbol id="i-two" viewBox="0 0 64 64"><circle cx="21" cy="21" r="10"/><path d="M7 51 C7 38 35 38 35 51 Z"/><circle cx="44" cy="21" r="10"/><path d="M30 51 C30 38 58 38 58 51 Z"/></symbol>
  <symbol id="i-cannon" viewBox="0 0 64 64"><g transform="rotate(-22 30 34)"><rect x="10" y="21" width="38" height="20" rx="7"/><rect x="42" y="18" width="12" height="26" rx="4"/></g><circle cx="23" cy="48" r="10"/></symbol>
  <symbol id="i-meteor" viewBox="0 0 64 64"><path d="M56 8 L34 22 L42 12 L20 28 C11 35 11 48 19 54 C27 60 40 57 46 47 L58 22 L48 28 Z"/></symbol>
  <symbol id="i-sword" viewBox="0 0 64 64"><path d="M48 10 L54 16 L28 42 L22 36 Z"/><path d="M16 32 L32 48 L27 53 L11 37 Z"/><path d="M13 45 L19 51 L12 58 L6 52 Z"/></symbol>
  <symbol id="i-rocket" viewBox="0 0 64 64"><path d="M46 10 C54 18 50 32 38 44 L20 26 C32 14 40 8 46 10 Z"/><path d="M18 28 L10 32 L16 40 Z"/><path d="M36 46 L32 54 L24 48 Z"/><circle cx="38" cy="24" r="5" fill="#0f172a"/></symbol>
  <symbol id="i-dino" viewBox="0 0 64 64"><path d="M12 44 L18 24 L36 18 L52 24 L58 16 L54 32 L58 40 L46 44 L44 54 H34 L34 46 H24 L22 54 H12 Z"/></symbol>
  <symbol id="i-mech" viewBox="0 0 64 64"><rect x="16" y="16" width="32" height="26" rx="7"/><rect x="22" y="22" width="20" height="8" rx="3" fill="#0f172a"/><rect x="8" y="22" width="8" height="20" rx="4"/><rect x="48" y="22" width="8" height="20" rx="4"/><rect x="20" y="42" width="10" height="14" rx="3"/><rect x="34" y="42" width="10" height="14" rx="3"/></symbol>
</svg>

<canvas id="game" tabindex="0" aria-label="قلعة الألعاب: حصار الآليين والفرسان"></canvas>

<div id="ui">
  <!-- Active Battle HUD -->
  <div id="hud" hidden>
    <button type="button" id="btnPause" class="tc-btn icon-btn hud-pause" aria-label="استراحة" title="استراحة (P)">
      <svg aria-hidden="true"><use href="#i-pause"/></svg>
    </button>
    <div id="tray1p" class="tray1p"></div>
    <div id="tray2p" class="tray2p" dir="ltr" hidden>
      <div id="trayP1" class="subtray p1" dir="rtl"></div>
      <div id="trayP2" class="subtray p2" dir="rtl"></div>
    </div>
  </div>

  <!-- Title Screen -->
  <section id="scrTitle" class="screen" aria-label="قلعة الألعاب">
    <div class="top-chips" id="titleChips">
      <div class="chip" id="titleStars" aria-label="النجوم"><svg aria-hidden="true"><use href="#i-star"/></svg><b dir="ltr">0/36</b></div>
      <div class="chip" id="titleCoins" aria-label="العملات"><i class="coin"></i><b dir="ltr">0</b></div>
    </div>

    <header class="hero-brand">
      <div class="hero-tag">حصار الآليين والفرسان</div>
      <h1 class="logo">قلعة الألعاب</h1>
    </header>

    <div class="command-box">
      <div class="diff-row" id="titleDiffs" role="group" aria-label="مستوى الصعوبة">
        <button type="button" class="diff-pill" data-diff="easy">سهل</button>
        <button type="button" class="diff-pill on" data-diff="normal">متوسط</button>
        <button type="button" class="diff-pill" data-diff="hero">بطل</button>
      </div>

      <div class="howto" aria-label="طريقة اللعب">
        <div class="card"><svg aria-hidden="true"><use href="#i-cannon"/></svg><span>صوّب المدفع <span class="sg-key">مسافة</span></span></div>
        <div class="card"><svg aria-hidden="true"><use href="#i-mech"/></svg><span>أرسل الكتيبة <span class="sg-key" dir="ltr">1-4</span></span></div>
        <div class="card"><svg aria-hidden="true"><use href="#i-meteor"/></svg><span>الضربة الخارقة <span class="sg-key" dir="ltr">5</span></span></div>
        <div class="card"><svg aria-hidden="true"><use href="#i-bolt"/></svg><span>تطوير المولّد <span class="sg-key" dir="ltr">6</span></span></div>
      </div>

      <div class="title-btns">
        <button type="button" id="btnLevels" class="tc-btn act cyan" aria-label="العوالم والمراحل">
          <svg aria-hidden="true"><use href="#i-levels"/></svg><span>العوالم</span>
        </button>
        <button type="button" id="btnPlay" class="tc-btn play-hero ring" aria-label="ابدأ المعركة">
          <svg aria-hidden="true"><use href="#i-play"/></svg><span>ابدأ المعركة!</span>
        </button>
        <button type="button" id="btnTwo" class="tc-btn act crimson" aria-label="لاعبان">
          <svg aria-hidden="true"><use href="#i-two"/></svg><span>لاعبان</span>
        </button>
        <button type="button" id="btnShop" class="tc-btn act violet" aria-label="خزانة القلعة">
          <svg aria-hidden="true"><use href="#i-shield"/></svg><span>خزانة القلعة</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Worlds & Stages Map (All 4 Worlds x 3 Stages Unlocked!) -->
  <section id="scrMap" class="screen dim" aria-label="العوالم والمراحل" hidden>
    <div class="modal-bar">
      <button type="button" id="mapHome" class="tc-btn icon-btn" aria-label="الرئيسية" title="الرئيسية (Esc)"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
      <h2 class="scr-heading">اختر العالم والمرحلة</h2>
      <div class="bar-end">
        <div class="chip" id="mapStars"><svg aria-hidden="true"><use href="#i-star"/></svg><b dir="ltr">0/36</b></div>
        <button type="button" id="mapShop" class="tc-btn act small violet"><svg aria-hidden="true"><use href="#i-shield"/></svg><span>الخزانة</span></button>
      </div>
    </div>
    <div class="diff-row map-diffs" id="mapDiffs" role="group" aria-label="مستوى الصعوبة">
      <button type="button" class="diff-pill" data-diff="easy">سهل</button>
      <button type="button" class="diff-pill on" data-diff="normal">متوسط</button>
      <button type="button" class="diff-pill" data-diff="hero">بطل</button>
    </div>
    <div id="worlds" class="worlds-grid"></div>
  </section>

  <!-- Toy Armory (خزانة القلعة) -->
  <section id="scrShop" class="screen dim" aria-label="خزانة القلعة" hidden>
    <div class="modal-bar">
      <button type="button" id="shopBack" class="tc-btn icon-btn" aria-label="رجوع" title="رجوع (Esc)"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
      <h2 class="scr-heading">خزانة القلعة — الدروع والمدافع</h2>
      <div class="chip" id="shopCoins" aria-label="العملات"><i class="coin"></i><b dir="ltr">0</b></div>
    </div>
    <div class="armory-wrap">
      <h3 class="shelf-label">دروع ورايات القلعة</h3>
      <div class="shelf" id="shelfArmors"></div>
      <h3 class="shelf-label">أسلحة مدفع السطح</h3>
      <div class="shelf" id="shelfCannons"></div>
    </div>
  </section>

  <!-- Pause Overlay -->
  <section id="scrPause" class="screen dim" aria-label="استراحة" hidden>
    <div class="dialog">
      <h2>استراحة المعركة</h2>
      <div class="dialog-col">
        <button type="button" id="btnResume" class="tc-btn play-hero" aria-label="متابعة">
          <svg aria-hidden="true"><use href="#i-play"/></svg><span>متابعة</span><span class="sg-key" dir="ltr">P</span>
        </button>
        <div class="dialog-row">
          <button type="button" id="btnRestart" class="tc-btn act gold" aria-label="إعادة المعركة">
            <svg aria-hidden="true"><use href="#i-again"/></svg><span>إعادة</span><span class="sg-key" dir="ltr">R</span>
          </button>
          <button type="button" id="btnMap" class="tc-btn act cyan" aria-label="العوالم">
            <svg aria-hidden="true"><use href="#i-levels"/></svg><span>العوالم</span>
          </button>
          <button type="button" id="btnPauseHome" class="tc-btn act slate" aria-label="الرئيسية">
            <svg aria-hidden="true"><use href="#i-home"/></svg><span>الرئيسية</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Result Overlay -->
  <section id="scrResult" class="screen dim" aria-label="النتيجة" hidden>
    <div class="dialog result-box">
      <div class="ribbon" id="resBest" hidden>رقم قياسي جديد!</div>
      <h2 id="resTitle">انتصار ساحق!</h2>
      <div class="stars3" id="resStars" aria-hidden="true">
        <svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg>
      </div>
      <div class="facts" id="resFacts">
        <span class="fact" id="resHp"><svg aria-hidden="true"><use href="#i-shield"/></svg><b dir="ltr">100%</b></span>
        <span class="fact" id="resTime"><b dir="ltr">0s</b></span>
        <span class="fact" id="resCoins"><i class="coin"></i><b dir="ltr">+0</b></span>
      </div>
      <div class="dialog-row res-actions">
        <button type="button" id="resNext" class="tc-btn play-hero ring" aria-label="المرحلة التالية">
          <svg aria-hidden="true"><use href="#i-play"/></svg><span>التالية</span><span class="sg-key" dir="ltr">⏎</span>
        </button>
        <button type="button" id="resAgain" class="tc-btn act gold" aria-label="إعادة">
          <svg aria-hidden="true"><use href="#i-again"/></svg><span>إعادة</span><span class="sg-key" dir="ltr">R</span>
        </button>
        <button type="button" id="resMap" class="tc-btn act cyan" aria-label="العوالم">
          <svg aria-hidden="true"><use href="#i-levels"/></svg><span>العوالم</span>
        </button>
        <button type="button" id="resShop" class="tc-btn act violet" aria-label="خزانة القلعة">
          <svg aria-hidden="true"><use href="#i-shield"/></svg><span>الخزانة</span>
        </button>
      </div>
    </div>
  </section>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="../../shared/kit.js"></script>
<script src="../../shared/artkit.js"></script>
<script src="../../shared/juice.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
