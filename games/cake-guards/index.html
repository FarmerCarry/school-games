<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حرّاس الكعكة</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" dir="ltr" tabindex="0" aria-label="حرّاس الكعكة"></canvas>
<div id="ui">
  <div id="hud" hidden>
    <div class="cg-stats">
      <div class="cg-stat" title="قطع الكعكة"><span class="cg-ico">🍰</span><b id="hearts">20</b></div>
      <div class="cg-stat" id="coinStat" title="العملات"><span class="cg-coin"></span><b id="coins">0</b></div>
      <div class="cg-stat">الموجة <b id="wave" dir="ltr">0/0</b></div>
      <div class="cg-stat cg-combo" id="comboStat" hidden>🔥 <b id="combo" dir="ltr">×2</b></div>
    </div>
    <div class="cg-hudbtns">
      <button class="cg-btn cg-round" id="btnPause" type="button" aria-label="إيقاف مؤقت" title="إيقاف مؤقت (P)">⏸</button>
      <button class="cg-btn cg-round" id="btnSpeed" type="button" dir="ltr" aria-label="السرعة" title="السرعة (F)">×1</button>
    </div>
  </div>
  <div id="bar" hidden></div>
  <div id="banner" hidden></div>
  <div id="hint" hidden></div>
</div>

<div class="sg-overlay cg-overlay" id="scr-title">
  <div class="cg-title-wrap">
    <h1 class="cg-logo"><span class="cg-logo-a">حرّاس</span><span class="cg-logo-b">الكعكة</span></h1>
    <p class="cg-tag">أطلق الكريمة وابنِ الأبراج لتحمي الكعكة!</p>
    <button class="sg-btn cg-play" id="btnPlay" type="button"><span class="cg-btn-main">▶ العب</span><span class="cg-btn-sub" id="playSub">المرحلة 1</span></button>
    <div class="cg-menu">
      <button class="sg-btn secondary cg-big" id="btnLevels" type="button"><span class="cg-btn-main">المراحل</span><span class="cg-btn-sub" id="levelsSub">★ 0 / 36</span></button>
      <button class="sg-btn secondary cg-big" id="btnEndless" type="button"><span class="cg-btn-main">بلا نهاية</span><span class="cg-btn-sub" id="endlessSub"></span></button>
      <button class="sg-btn secondary cg-big" id="btnCakes" type="button"><span class="cg-btn-main">الكعكات</span><span class="cg-btn-sub" id="cakesSub"></span></button>
    </div>
  </div>
</div>

<div class="sg-overlay cg-overlay" id="scr-levels" hidden>
  <div class="sg-panel cg-panel cg-wide">
    <h2 class="cg-h2">اختر المرحلة</h2>
    <div id="worlds"></div>
    <div class="cg-row"><span class="cg-total" id="starsTotal"></span><button class="sg-btn secondary" id="btnLevelsBack" type="button">رجوع</button></div>
  </div>
</div>

<div class="sg-overlay cg-overlay" id="scr-cakes" hidden>
  <div class="sg-panel cg-panel cg-wide">
    <h2 class="cg-h2">اختر كعكتك</h2>
    <p class="sg-sub">اجمع النجوم لتفتح كعكات جديدة.</p>
    <div class="cg-cakes" id="cakeGrid"></div>
    <div class="cg-row"><button class="sg-btn secondary" id="btnCakesBack" type="button">رجوع</button></div>
  </div>
</div>

<div class="sg-overlay cg-overlay" id="scr-pause" hidden>
  <div class="sg-panel cg-panel">
    <h2 class="cg-h2">استراحة</h2>
    <p class="sg-sub" id="pauseSub"></p>
    <div class="cg-col">
      <button class="sg-btn good" id="btnResume" type="button">استمرار</button>
      <button class="sg-btn" id="btnRestart" type="button">ابدأ من جديد</button>
      <button class="sg-btn secondary" id="btnMenu" type="button">القائمة</button>
    </div>
  </div>
</div>

<div class="sg-overlay cg-overlay" id="scr-win" hidden>
  <div class="sg-panel cg-panel cg-result">
    <div class="cg-kicker" id="winKicker"></div>
    <h2 class="cg-h2 cg-win">الكعكة بأمان!</h2>
    <div class="cg-stars" id="winStars"><span>★</span><span>★</span><span>★</span></div>
    <p class="sg-sub" id="winSub"></p>
    <div class="cg-new" id="winNew" hidden></div>
    <div class="cg-col">
      <button class="sg-btn good" id="btnNext" type="button">المرحلة التالية ◀</button>
      <div><button class="sg-btn" id="btnReplay" type="button">إعادة</button><button class="sg-btn secondary" id="btnWinLevels" type="button">المراحل</button></div>
    </div>
  </div>
</div>

<div class="sg-overlay cg-overlay" id="scr-lose" hidden>
  <div class="sg-panel cg-panel cg-result">
    <div class="cg-kicker" id="loseKicker"></div>
    <h2 class="cg-h2 cg-lose">أكل الهلام الكعكة!</h2>
    <p class="sg-sub" id="loseSub"></p>
    <div class="cg-col">
      <button class="sg-btn good" id="btnRetry" type="button">حاول مرة أخرى</button>
      <button class="sg-btn secondary" id="btnLoseLevels" type="button">المراحل</button>
    </div>
  </div>
</div>

<div class="sg-overlay cg-overlay" id="scr-over" hidden>
  <div class="sg-panel cg-panel cg-result">
    <div class="cg-kicker">بلا نهاية</div>
    <h2 class="cg-h2 cg-lose">انتهى التحدي!</h2>
    <div class="cg-bignum" id="overWaves">0</div>
    <p class="sg-sub" id="overSub"></p>
    <div class="cg-new" id="overNew" hidden>رقم قياسي جديد!</div>
    <div class="cg-col">
      <button class="sg-btn good" id="btnAgain" type="button">مرة أخرى</button>
      <button class="sg-btn secondary" id="btnOverMenu" type="button">القائمة</button>
    </div>
  </div>
</div>

<script src="../../shared/kit.js"></script>
<script src="../../shared/artkit.js"></script>
<script src="../../shared/juice.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
