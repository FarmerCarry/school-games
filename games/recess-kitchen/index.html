<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مطبخ الفسحة</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <symbol id="i-play" viewBox="0 0 64 64"><path d="M22 11 Q18 9 18 14 L18 50 Q18 55 22 53 L52 35 Q56 32 52 29 Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 64 64"><rect x="15" y="12" width="12" height="40" rx="5"/><rect x="37" y="12" width="12" height="40" rx="5"/></symbol>
  <symbol id="i-again" viewBox="0 0 64 64"><path d="M50 30 A19 19 0 1 1 41 15" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><path d="M33 4 L52 13 L37 27 Z"/></symbol>
  <symbol id="i-levels" viewBox="0 0 64 64"><rect x="6" y="10" width="15" height="15" rx="4"/><rect x="25" y="10" width="15" height="15" rx="4"/><rect x="44" y="10" width="15" height="15" rx="4"/><rect x="6" y="36" width="15" height="15" rx="4"/><rect x="25" y="36" width="15" height="15" rx="4"/><rect x="44" y="36" width="15" height="15" rx="4" opacity=".45"/></symbol>
  <symbol id="i-home" viewBox="0 0 64 64"><path d="M8 32 L32 10 L56 32 L49 32 L49 54 L37 54 L37 40 L27 40 L27 54 L15 54 L15 32 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 5 L39 23.3 L58.6 24.4 L43.4 36.7 L48.5 55.6 L32 45 L15.5 55.6 L20.6 36.7 L5.4 24.4 L25 23.3 Z" stroke-linejoin="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 64 64"><path d="M20 28 L20 20 A12 12 0 0 1 44 20 L44 28" fill="none" stroke="currentColor" stroke-width="7"/><rect x="12" y="28" width="40" height="30" rx="7"/></symbol>
  <symbol id="i-check" viewBox="0 0 64 64"><path d="M12 34 L26 48 L52 18" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-coop" viewBox="0 0 64 64">
    <circle cx="21" cy="29" r="10" fill="#ffe0bd" stroke="#23140c" stroke-width="3.5"/>
    <path d="M10 21 C8 11 19 8 21 13 C23 8 34 11 32 21 Z" fill="#fff" stroke="#23140c" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M9 52 C9 41 33 41 33 52 Z" fill="#38b6ff" stroke="#23140c" stroke-width="3.5"/>
    <circle cx="43" cy="29" r="10" fill="#f5c69c" stroke="#23140c" stroke-width="3.5"/>
    <path d="M32 21 C30 11 41 8 43 13 C45 8 56 11 54 21 Z" fill="#fff" stroke="#23140c" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M31 52 C31 41 55 41 55 52 Z" fill="#ffb703" stroke="#23140c" stroke-width="3.5"/>
  </symbol>
  <symbol id="i-shop" viewBox="0 0 64 64">
    <path d="M16 32 C10 18 22 10 32 16 C42 10 54 18 48 32 Z" fill="#fff" stroke="#23140c" stroke-width="4" stroke-linejoin="round"/>
    <rect x="17" y="31" width="30" height="10" rx="4" fill="#ff5d9e" stroke="#23140c" stroke-width="4"/>
    <path d="M20 44 L44 44 L47 56 L17 56 Z" fill="#38b6ff" stroke="#23140c" stroke-width="4" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-dish" viewBox="0 0 64 64">
    <ellipse cx="32" cy="46" rx="24" ry="8" fill="#fff" stroke="#23140c" stroke-width="4"/>
    <path d="M12 42 A20 18 0 0 1 52 42 Z" fill="#ffd166" stroke="#23140c" stroke-width="4"/>
    <circle cx="32" cy="20" r="5" fill="#ff6b35" stroke="#23140c" stroke-width="3.5"/>
  </symbol>
</svg>

<canvas id="game" tabindex="0" aria-label="مطبخ الفسحة"></canvas>

<div id="ui">
  <div id="hud" hidden>
    <button type="button" id="btnPause" class="rk-btn rk-round" aria-label="استراحة" title="استراحة (P)"><svg aria-hidden="true"><use href="#i-pause"/></svg></button>
  </div>

  <section id="scrTitle" class="screen" aria-label="مطبخ الفسحة">
    <h1 class="logo">مطبخ الفسحة</h1>
    <div class="chips">
      <div class="chip" id="titleStars" aria-label="النجوم"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></div>
      <div class="chip" id="titleCoins" aria-label="العملات"><i class="coin"></i><b>0</b></div>
    </div>

    <div class="howto" aria-label="طريقة اللعب">
      <figure class="card">
        <svg viewBox="0 0 200 130" aria-hidden="true">
          <rect x="26" y="14" width="106" height="68" rx="22" fill="#fffdf7" stroke="#23140c" stroke-width="5"/>
          <path d="M98 82 L114 98 L116 80 Z" fill="#fffdf7" stroke="#23140c" stroke-width="5" stroke-linejoin="round"/>
          <ellipse cx="58" cy="48" rx="20" ry="13" fill="#f4c07a" stroke="#23140c" stroke-width="3.5"/>
          <circle cx="98" cy="48" r="13" fill="#9c541d" stroke="#23140c" stroke-width="3.5"/>
          <circle cx="156" cy="76" r="24" fill="#ffb703" stroke="#23140c" stroke-width="4.5"/>
          <path d="M138 58 L142 38 L153 52 M174 58 L170 38 L159 52" fill="#ffb703" stroke="#23140c" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="148" cy="74" r="3.5" fill="#23140c"/><circle cx="164" cy="74" r="3.5" fill="#23140c"/>
          <path d="M151 83 Q156 88 161 83" fill="none" stroke="#23140c" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <figcaption>شاهد الطلب</figcaption>
      </figure>
      <figure class="card">
        <svg viewBox="0 0 200 130" aria-hidden="true">
          <rect x="24" y="34" width="76" height="64" rx="14" fill="#b86b35" stroke="#23140c" stroke-width="5"/>
          <circle cx="62" cy="66" r="18" fill="#ff4d4d" stroke="#23140c" stroke-width="4"/>
          <path d="M56 48 L62 40 L68 48" fill="none" stroke="#2ec4b6" stroke-width="4" stroke-linecap="round"/>
          <rect x="114" y="28" width="66" height="72" rx="14" fill="#64748b" stroke="#23140c" stroke-width="5"/>
          <rect x="124" y="40" width="46" height="46" rx="10" fill="#ffbe0b" stroke="#23140c" stroke-width="3.5"/>
          <circle cx="139" cy="56" r="8" fill="#9c541d"/><circle cx="155" cy="69" r="8" fill="#9c541d"/>
          <circle cx="147" cy="20" r="11" fill="none" stroke="#34d399" stroke-width="6"/>
        </svg>
        <figcaption>قطّع واطبخ</figcaption>
      </figure>
      <figure class="card">
        <svg viewBox="0 0 200 130" aria-hidden="true">
          <ellipse cx="100" cy="76" rx="58" ry="34" fill="#ffffff" stroke="#23140c" stroke-width="5"/>
          <ellipse cx="100" cy="74" rx="44" ry="23" fill="#e2e8f0"/>
          <path d="M68 78 Q100 34 132 78 Q100 96 68 78 Z" fill="#f6c987" stroke="#23140c" stroke-width="4"/>
          <circle cx="92" cy="64" r="9" fill="#9c541d" stroke="#23140c" stroke-width="3"/>
          <circle cx="110" cy="66" r="9" fill="#9c541d" stroke="#23140c" stroke-width="3"/>
          <circle cx="101" cy="55" r="7" fill="#ff4d4d" stroke="#23140c" stroke-width="2.5"/>
        </svg>
        <figcaption>اجمع بالصحن</figcaption>
      </figure>
      <figure class="card">
        <svg viewBox="0 0 200 130" aria-hidden="true">
          <rect x="20" y="72" width="160" height="34" rx="12" fill="#f59e0b" stroke="#23140c" stroke-width="5"/>
          <circle cx="74" cy="48" r="24" fill="#ffd23f" stroke="#23140c" stroke-width="4.5"/>
          <circle cx="74" cy="48" r="15" fill="none" stroke="#d97706" stroke-width="3.5"/>
          <path d="M134 18 L141 36 L160 37 L145 49 L150 67 L134 57 L118 67 L123 49 L108 37 L127 36 Z" fill="#ffd23f" stroke="#23140c" stroke-width="4" stroke-linejoin="round"/>
        </svg>
        <figcaption>قدّم واكسب!</figcaption>
      </figure>
    </div>

    <button type="button" id="btnShop" class="rk-btn rk-side" aria-label="المتجر"><svg aria-hidden="true"><use href="#i-shop"/></svg><span>المتجر</span></button>
    <button type="button" id="btnCoop" class="rk-btn rk-coop" aria-label="تعاون اثنين" title="تعاون اثنين"><svg aria-hidden="true"><use href="#i-coop"/></svg><span>تعاون اثنين</span></button>
    <button type="button" id="btnPlay" class="rk-btn rk-play ring" aria-label="العب" title="العب (Enter)"><svg aria-hidden="true"><use href="#i-play"/></svg><span>العب</span></button>
    <button type="button" id="btnLevels" class="rk-btn rk-side" aria-label="المراحل"><svg aria-hidden="true"><use href="#i-levels"/></svg><span>المراحل</span></button>
  </section>

  <section id="scrMap" class="screen" aria-label="المراحل" hidden>
    <button type="button" id="mapHome" class="rk-btn rk-round" aria-label="البداية" title="البداية (Esc)"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
    <div class="chip" id="mapStars" aria-label="النجوم"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></div>
    <button type="button" id="mapMode" class="rk-btn rk-mode" aria-label="وضع اللعب"><svg aria-hidden="true"><use href="#i-coop"/></svg><span id="mapModeTxt">لاعب واحد</span></button>
    <div id="worlds"></div>
  </section>

  <section id="scrPause" class="screen dim" aria-label="استراحة" hidden>
    <div class="card panel">
      <h2>استراحة</h2>
      <button type="button" id="btnResume" class="rk-btn rk-go" aria-label="تابع" title="تابع (P)"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
      <div class="row">
        <button type="button" id="btnMap" class="rk-btn rk-round big" aria-label="المراحل"><svg aria-hidden="true"><use href="#i-levels"/></svg></button>
        <button type="button" id="btnRestart" class="rk-btn rk-round big" aria-label="ابدأ من جديد" title="ابدأ من جديد (R)"><svg aria-hidden="true"><use href="#i-again"/></svg></button>
      </div>
    </div>
  </section>

  <section id="scrResult" class="screen dim" aria-label="النتيجة" hidden>
    <div class="card panel result">
      <div class="ribbon" id="resBest" hidden>رقم جديد!</div>
      <h2 id="resTitle">أحسنت!</h2>
      <div class="stars3" id="resStars" aria-hidden="true"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
      <div class="facts">
        <span class="fact" id="resServed"><svg aria-hidden="true"><use href="#i-dish"/></svg><b dir="ltr">0</b><svg class="ok" aria-hidden="true"><use href="#i-check"/></svg></span>
        <span class="fact" id="resCoins"><i class="coin"></i><b dir="ltr">+0</b></span>
      </div>
      <div class="newworld" id="resWorld" hidden>عالم جديد!</div>
      <div class="row">
        <button type="button" id="resMap" class="rk-btn rk-round big" aria-label="المراحل" title="المراحل (Esc)"><svg aria-hidden="true"><use href="#i-levels"/></svg></button>
        <button type="button" id="resNext" class="rk-btn rk-go ring" aria-label="المرحلة التالية" title="التالي (Enter)"><svg aria-hidden="true"><use href="#i-play"/></svg><span class="sg-key cap" aria-hidden="true">Enter</span></button>
        <button type="button" id="resAgain" class="rk-btn rk-round big" aria-label="مرة أخرى" title="مرة أخرى (R)"><svg aria-hidden="true"><use href="#i-again"/></svg><span class="sg-key cap" aria-hidden="true">R</span></button>
      </div>
    </div>
  </section>

  <section id="scrShop" class="screen" aria-label="المتجر" hidden>
    <button type="button" id="shopBack" class="rk-btn rk-round" aria-label="رجوع" title="رجوع (Esc)"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
    <div class="chip" id="shopCoins" aria-label="العملات"><i class="coin"></i><b>0</b></div>
    <h2 class="shop-title">مريلة الطاهي</h2>
    <div class="shelf" id="shelfAprons"></div>
    <h2 class="shop-title small">قبعات مرحة</h2>
    <div class="shelf" id="shelfHats"></div>
  </section>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="../../shared/kit.js"></script>
<script src="../../shared/juice.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
