<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مطبخ الفسحة</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" tabindex="0" aria-label="ساحة مطبخ الفسحة"></canvas>

<!-- Live Gameplay HUD -->
<header id="hud" class="rk-hud" hidden>
  <div class="score-bar" dir="ltr">
    <div class="team p1"><span id="p1Tag" dir="rtl">أنت</span><b id="scLeft">0</b></div>
    <div id="hudTimer" class="timer-pill">45</div>
    <div class="team p2"><b id="scRight">0</b><span id="p2Tag" dir="rtl">الشيف الآلي</span></div>
  </div>
  <div id="hudMod" class="mod-pill">وجبة طازجة!</div>
</header>
<button id="btnPause" class="rk-pause" type="button" aria-label="إيقاف مؤقت" title="إيقاف مؤقت (P / Esc)" hidden>⏸</button>

<!-- Title Screen over Live Animated Canteen Attract World -->
<section id="scrTitle" class="rk-title">
  <div class="title-top">
    <div class="title-pills">
      <span class="sg-pill">🪙 <b id="titleCoins" dir="ltr">0</b></span>
      <span class="sg-pill">🏆 <b id="titleWins" dir="ltr">0</b></span>
    </div>
    <h1 class="rk-logo">مطبخ الفسحة</h1>
    <p class="rk-tag">اقلب السندويش وسجّل في صندوق خصمك!</p>
  </div>

  <div class="title-bottom">
    <div class="cta-row">
      <button id="btnPlay" class="sg-btn good rk-play" type="button">العب! ▶</button>
      <button id="btnDuo" class="sg-btn rk-duo" type="button">👥 لاعبان</button>
      <button id="btnHats" class="sg-btn secondary rk-hats-btn" type="button"><span id="titleHatIco">👨‍🍳</span> القبعات</button>
    </div>
    <div class="keys-hint">
      <span dir="ltr"><span class="sg-key">مسافة</span> / <span class="sg-key">W</span> / <span class="sg-key">انقر</span></span>
      <span>اقفز واضرب بالملعقة! · لاعب 2: <span class="sg-key" dir="ltr">↑</span></span>
    </div>
  </div>
</section>

<!-- Pause Overlay -->
<section id="scrPause" class="sg-overlay" hidden aria-modal="true" role="dialog" aria-label="استراحة">
  <div class="sg-panel rk-panel">
    <h2 class="sg-title">استراحة ☕</h2>
    <div class="rk-actions">
      <button id="btnResume" class="sg-btn good" type="button">تابع اللعب ▶</button>
      <button id="btnRestart" class="sg-btn" type="button">مباراة جديدة</button>
      <button id="btnHome" class="sg-btn secondary" type="button">الرئيسية</button>
    </div>
  </div>
</section>

<!-- Result Card -->
<section id="scrResult" class="sg-overlay" hidden aria-modal="true" role="dialog" aria-label="نتيجة المباراة">
  <div class="sg-panel rk-panel">
    <h2 id="resTitle" class="sg-title">فوز رائع! 🏆</h2>
    <p id="resSub" class="sg-sub">أنت بطل الملعقة الطائرة!</p>
    <div class="res-score" dir="ltr">
      <span class="rs p1" id="resScoreLeft">5</span>
      <span class="rs-sep">-</span>
      <span class="rs p2" id="resScoreRight">2</span>
    </div>
    <div class="res-wallet">
      <span>🪙 <b id="resCoins" dir="ltr">+50</b></span>
      <span>· رصيدك: <b id="resWallet" dir="ltr">50</b></span>
    </div>
    <div id="resNextHat" class="next-hat" hidden>
      <div id="resNextLabel" class="next-hat-lbl"></div>
      <div class="next-hat-bar"><div id="resNextFill" class="next-hat-fill"></div></div>
    </div>
    <div class="rk-actions">
      <button id="btnAgain" class="sg-btn good" type="button">العب مجددًا ▶</button>
      <button id="btnResHats" class="sg-btn" type="button">🎩 القبعات</button>
      <button id="btnResHome" class="sg-btn secondary" type="button">الرئيسية</button>
    </div>
  </div>
</section>

<!-- Silly Chef Hats Closet -->
<section id="scrHats" class="sg-overlay" hidden aria-modal="true" role="dialog" aria-label="قبعات الشيف">
  <div class="sg-panel rk-panel hats-panel">
    <h2 class="sg-title">قبعات الشيف 🎩</h2>
    <p class="sg-sub">🪙 رصيدك: <b id="hatsCoins" dir="ltr">0</b></p>
    <div id="hatsGrid" class="hats-grid"></div>
    <button id="btnHatsBack" class="sg-btn secondary" type="button">رجوع</button>
  </div>
</section>

<script src="../../shared/kit.js"></script>
<script src="../../shared/juice.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
