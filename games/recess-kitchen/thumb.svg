<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#3b1d0b"/>
      <stop offset="0.6" stop-color="#6b3410"/>
      <stop offset="1" stop-color="#2e1507"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.52" r="0.48">
      <stop offset="0" stop-color="#ffe89e" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#ffb703" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="awn">
      <rect x="14" y="12" width="372" height="38" rx="14"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="208" r="185" fill="url(#sun)"/>

  <!-- Festive school canteen striped awning -->
  <g clip-path="url(#awn)">
    <rect x="14" y="12" width="372" height="38" fill="#fffdf7"/>
    <g fill="#ff9f1c">
      <rect x="14" y="12" width="38" height="38"/><rect x="90" y="12" width="38" height="38"/>
      <rect x="166" y="12" width="38" height="38"/><rect x="242" y="12" width="38" height="38"/>
      <rect x="318" y="12" width="38" height="38"/>
    </g>
  </g>
  <rect x="14" y="12" width="372" height="38" rx="14" fill="none" stroke="#23140c" stroke-width="5"/>

  <!-- Sparkle stars -->
  <g fill="#ffd23f" stroke="#23140c" stroke-width="3" stroke-linejoin="round">
    <path d="M52 86 L56 97 L68 98 L59 106 L62 118 L52 111 L42 118 L45 106 L36 98 L48 97 Z"/>
    <path d="M352 78 L355 87 L365 88 L357 94 L360 104 L352 98 L344 104 L347 94 L339 88 L349 87 Z"/>
  </g>

  <!-- Chef 1 (Left: sky-blue apron + tall white toque) -->
  <g transform="translate(98 158)" stroke="#23140c" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-32 -28 C-48 -62 -20 -80 0 -66 C20 -80 48 -62 32 -28 Z" fill="#ffffff" stroke-width="5"/>
    <rect x="-31" y="-34" width="62" height="15" rx="6" fill="#e2e8f0" stroke-width="4.5"/>
    <rect x="-34" y="18" width="68" height="58" rx="22" fill="#fffdf7" stroke-width="5"/>
    <rect x="-26" y="24" width="52" height="48" rx="14" fill="#38b6ff" stroke-width="4.5"/>
    <rect x="-13" y="42" width="26" height="16" rx="6" fill="#0284c7" stroke="none"/>
    <circle cx="0" cy="-4" r="32" fill="#ffe0bd" stroke-width="5"/>
    <circle cx="-11" cy="-6" r="4.5" fill="#23140c" stroke="none"/>
    <circle cx="11" cy="-6" r="4.5" fill="#23140c" stroke="none"/>
    <circle cx="-20" cy="4" r="6" fill="#fb7185" opacity="0.45" stroke="none"/>
    <circle cx="20" cy="4" r="6" fill="#fb7185" opacity="0.45" stroke="none"/>
    <path d="M-9 5 Q0 15 9 5" fill="none" stroke-width="4"/>
  </g>

  <!-- Chef 2 (Right: berry-pink apron + golden crown) -->
  <g transform="translate(304 162)" stroke="#23140c" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-28 -26 L-33 -60 L-13 -44 L0 -66 L13 -44 L33 -60 L28 -26 Z" fill="#ffd23f" stroke-width="5"/>
    <circle cx="0" cy="-42" r="5.5" fill="#f43f5e" stroke="none"/>
    <rect x="-34" y="18" width="68" height="58" rx="22" fill="#fffdf7" stroke-width="5"/>
    <rect x="-26" y="24" width="52" height="48" rx="14" fill="#ff5d9e" stroke-width="4.5"/>
    <rect x="-13" y="42" width="26" height="16" rx="6" fill="#be185d" stroke="none"/>
    <circle cx="0" cy="-4" r="32" fill="#f3c195" stroke-width="5"/>
    <circle cx="-11" cy="-6" r="4.5" fill="#23140c" stroke="none"/>
    <circle cx="11" cy="-6" r="4.5" fill="#23140c" stroke="none"/>
    <circle cx="-20" cy="4" r="6" fill="#fb7185" opacity="0.45" stroke="none"/>
    <circle cx="20" cy="4" r="6" fill="#fb7185" opacity="0.45" stroke="none"/>
    <path d="M-9 5 Q0 15 9 5" fill="none" stroke-width="4"/>
  </g>

  <!-- Warm wood serving counter -->
  <rect x="18" y="218" width="364" height="104" rx="22" fill="#d99b5e" stroke="#23140c" stroke-width="6"/>
  <rect x="28" y="226" width="344" height="32" rx="12" fill="#f6d2a4" stroke="#b5763a" stroke-width="3"/>

  <!-- Giant Falafel Wrap on porcelain plate (center-left) -->
  <g transform="translate(158 240)" stroke="#23140c" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="0" cy="18" rx="68" ry="26" fill="#ffffff" stroke-width="5.5"/>
    <ellipse cx="0" cy="17" rx="50" ry="17" fill="#e2e8f0" stroke="none"/>
    <!-- Lettuce & tomato & crispy golden falafel inside pita pocket -->
    <circle cx="-22" cy="-12" r="16" fill="#22c55e" stroke-width="4"/>
    <circle cx="20" cy="-14" r="15" fill="#ef4444" stroke-width="4"/>
    <circle cx="20" cy="-14" r="8" fill="#fca5a5" stroke="none"/>
    <circle cx="-12" cy="-18" r="16" fill="#9c4a1a" stroke-width="4.5"/>
    <circle cx="10" cy="-20" r="16" fill="#9c4a1a" stroke-width="4.5"/>
    <circle cx="-16" cy="-22" r="4" fill="#f59e0b" stroke="none"/>
    <circle cx="6" cy="-24" r="4" fill="#f59e0b" stroke="none"/>
    <path d="M-46 14 Q0 -26 46 14 Q0 36 -46 14 Z" fill="#f5c478" stroke-width="5"/>
    <path d="M-18 6 L-10 18 M4 5 L12 17" stroke="#b4692e" stroke-width="3.5"/>
  </g>

  <!-- Tall Swirling Mango Smoothie (center-right) -->
  <g transform="translate(248 232)" stroke="#23140c" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-6 -28 L-14 -54 L-26 -52" fill="none" stroke="#22c55e" stroke-width="8"/>
    <path d="M-26 -18 L26 -18 L20 36 L-20 36 Z" fill="#ffb703" stroke-width="5"/>
    <path d="M-14 0 Q0 12 14 -2" fill="none" stroke="#fef08a" stroke-width="5"/>
    <path d="M-26 -18 A26 24 0 0 1 26 -18 Z" fill="#ffffff" fill-opacity="0.86" stroke-width="4.5"/>
    <circle cx="-12" cy="14" r="4" fill="#fb923c" stroke="none"/>
  </g>

  <!-- Cute tabby kitten classmate peeking at front-left -->
  <g transform="translate(56 276)" stroke="#23140c" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-22 -10 L-19 -34 L-4 -20 M22 -10 L19 -34 L4 -20" fill="#fb923c" stroke-width="4.5"/>
    <circle cx="0" cy="0" r="25" fill="#fdba74" stroke-width="5"/>
    <circle cx="-8" cy="-3" r="3.5" fill="#23140c" stroke="none"/>
    <circle cx="8" cy="-3" r="3.5" fill="#23140c" stroke="none"/>
    <path d="M-5 5 Q0 11 5 5" fill="none" stroke-width="3"/>
  </g>

  <!-- Arabic game title -->
  <g font-family="Fredoka, 'Segoe UI', Tahoma, sans-serif" font-weight="700" text-anchor="middle" direction="rtl">
    <text x="200" y="374" font-size="56" fill="#23140c" stroke="#23140c" stroke-width="15" stroke-linejoin="round" paint-order="stroke">مطبخ الفسحة</text>
    <text x="200" y="374" font-size="56" fill="#fffdf7">مطبخ الفسحة</text>
  </g>
</svg>
