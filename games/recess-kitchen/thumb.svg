<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9f1c"/>
      <stop offset="55%" stop-color="#ff5d8f"/>
      <stop offset="100%" stop-color="#2b195c"/>
    </linearGradient>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef476f"/>
      <stop offset="100%" stop-color="#b5179e"/>
    </linearGradient>
  </defs>

  <!-- Vibrant background & starburst -->
  <rect width="400" height="400" rx="44" fill="url(#bg)"/>
  <g opacity="0.22" fill="#fff8eb">
    <polygon points="200,190 40,0 110,0"/>
    <polygon points="200,190 290,0 360,0"/>
    <polygon points="200,190 400,90 400,165"/>
    <polygon points="200,190 0,90 0,165"/>
  </g>

  <!-- Striped Cafeteria Awning -->
  <g stroke="#1b1640" stroke-width="5" stroke-linejoin="round">
    <path d="M16 16 H88 V54 Q52 70 16 54 Z" fill="#fff8eb"/>
    <path d="M88 16 H162 V54 Q125 70 88 54 Z" fill="#00b4d8"/>
    <path d="M162 16 H238 V54 Q200 70 162 54 Z" fill="#fff8eb"/>
    <path d="M238 16 H312 V54 Q275 70 238 54 Z" fill="#00b4d8"/>
    <path d="M312 16 H384 V54 Q348 70 312 54 Z" fill="#fff8eb"/>
  </g>

  <!-- Checkered Kitchen Counter Sill -->
  <rect x="20" y="294" width="360" height="86" rx="22" fill="#fff3d6" stroke="#1b1640" stroke-width="6"/>
  <g fill="#ffe0a3">
    <rect x="36" y="308" width="44" height="28" rx="6"/>
    <rect x="124" y="308" width="44" height="28" rx="6"/>
    <rect x="212" y="308" width="44" height="28" rx="6"/>
    <rect x="300" y="308" width="44" height="28" rx="6"/>
  </g>

  <!-- Cute Mini Robo-Sous-Chef on Left -->
  <g transform="translate(86, 238)" stroke="#1b1640" stroke-width="5" stroke-linejoin="round">
    <line x1="0" y1="-54" x2="0" y2="-36" stroke-linecap="round"/>
    <circle cx="0" cy="-58" r="8" fill="#00f5d4"/>
    <rect x="-36" y="-36" width="72" height="60" rx="18" fill="#38bdf8"/>
    <rect x="-25" y="-24" width="50" height="26" rx="10" fill="#1b1640"/>
    <circle cx="-11" cy="-11" r="5" fill="#00f5d4" stroke="none"/>
    <circle cx="11" cy="-11" r="5" fill="#00f5d4" stroke="none"/>
    <path d="M-10 12 Q0 20 10 12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Happy Turbo Chef on Right -->
  <g transform="translate(308, 232)" stroke="#1b1640" stroke-width="5" stroke-linejoin="round">
    <path d="M-40 58 C-40 16 40 16 40 58 Z" fill="#ff8c2b"/>
    <circle cx="0" cy="-4" r="32" fill="#ffdbac"/>
    <!-- Chef Toque Hat -->
    <path d="M-26 -28 C-38 -56 -12 -72 0 -60 C12 -72 38 -56 26 -28 Z" fill="#ffffff"/>
    <rect x="-25" y="-32" width="50" height="12" rx="6" fill="#ffd166"/>
    <circle cx="-11" cy="-5" r="4.5" fill="#1b1640" stroke="none"/>
    <circle cx="11" cy="-5" r="4.5" fill="#1b1640" stroke="none"/>
    <path d="M-11 8 Q0 19 11 8" fill="#ef476f"/>
  </g>

  <!-- Turbo Burger Cannon Launching Trail -->
  <path d="M188 270 Q196 196 206 146" fill="none" stroke="#ffd166" stroke-width="20" stroke-linecap="round" opacity="0.75"/>
  <path d="M188 270 Q196 196 206 146" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="12 10" stroke-linecap="round"/>

  <g transform="translate(188, 276) rotate(-14)" stroke="#1b1640" stroke-width="5.5" stroke-linejoin="round">
    <rect x="-34" y="-32" width="68" height="58" rx="16" fill="url(#can)"/>
    <rect x="-26" y="-48" width="52" height="22" rx="9" fill="#ffd166"/>
    <circle cx="0" cy="-4" r="11" fill="#3ddc84"/>
  </g>

  <!-- Giant Flying Mega-Cheeseburger! -->
  <g transform="translate(204, 134) rotate(8)" stroke="#1b1640" stroke-width="5.5" stroke-linejoin="round">
    <!-- Bottom Bun -->
    <ellipse cx="0" cy="34" rx="66" ry="20" fill="#f4a261"/>
    <!-- Lettuce -->
    <path d="M-68 22 Q-45 36 -22 20 Q0 36 22 20 Q45 36 68 22 Q45 8 -68 22 Z" fill="#3ddc84"/>
    <!-- Grilled Patty -->
    <ellipse cx="0" cy="11" rx="68" ry="18" fill="#7f3718"/>
    <!-- Melted Golden Cheese -->
    <polygon points="-64,-2 64,-2 38,20 8,4 -28,22" fill="#ffd166"/>
    <!-- Top Sesame Bun -->
    <path d="M-66 -2 C-66 -54 66 -54 66 -2 Z" fill="url(#bun)"/>
    <g fill="#fff8eb" stroke="none">
      <ellipse cx="-24" cy="-24" rx="6" ry="3.2" transform="rotate(-18 -24 -24)"/>
      <ellipse cx="4" cy="-31" rx="6" ry="3.2"/>
      <ellipse cx="28" cy="-21" rx="6" ry="3.2" transform="rotate(20 28 -21)"/>
      <ellipse cx="-6" cy="-16" rx="5.5" ry="3"/>
    </g>
  </g>

  <!-- Sparkle Stars -->
  <g fill="#ffee32" stroke="#1b1640" stroke-width="4" stroke-linejoin="round">
    <polygon points="84,114 91,130 108,132 95,143 99,160 84,151 69,160 73,143 60,132 77,130"/>
    <polygon points="332,98 337,111 351,112 340,121 343,135 332,127 321,135 324,121 313,112 327,111"/>
  </g>

  <!-- Arabic Title Banner -->
  <rect x="44" y="318" width="312" height="54" rx="18" fill="#1b1640"/>
  <text x="200" y="354" text-anchor="middle" direction="rtl" font-family="Fredoka, Tahoma, sans-serif" font-weight="900" font-size="34" fill="#ffd166">مطبخ الفسحة</text>
</svg>
