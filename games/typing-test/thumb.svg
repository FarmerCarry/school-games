<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb4ff"/>
      <stop offset="0.7" stop-color="#8fdcff"/>
      <stop offset="1" stop-color="#d6f6ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <!-- soft background clouds -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="40" cy="128" r="22"/><circle cx="64" cy="120" r="26"/><circle cx="88" cy="130" r="18"/>
    <circle cx="330" cy="104" r="20"/><circle cx="354" cy="96" r="24"/><circle cx="378" cy="106" r="18"/>
  </g>
  <!-- the rainbow behind the cloud -->
  <g fill="none" stroke-linecap="butt">
    <path d="M78 272 A122 122 0 0 1 322 272" stroke="#1c2250" stroke-width="56"/>
    <path d="M58 272 A142 142 0 0 1 342 272" stroke="#ff5d6c" stroke-width="9"/>
    <path d="M66 272 A134 134 0 0 1 334 272" stroke="#ff9f43" stroke-width="9"/>
    <path d="M74 272 A126 126 0 0 1 326 272" stroke="#ffd23f" stroke-width="9"/>
    <path d="M82 272 A118 118 0 0 1 318 272" stroke="#5be38f" stroke-width="9"/>
    <path d="M90 272 A110 110 0 0 1 310 272" stroke="#4fd1ff" stroke-width="9"/>
    <path d="M98 272 A102 102 0 0 1 302 272" stroke="#b48cff" stroke-width="9"/>
  </g>
  <!-- glow where the bolt strikes -->
  <circle cx="200" cy="214" r="120" fill="url(#glow)"/>
  <!-- the word cloud: ink outline first, white body on top -->
  <g fill="#1c2250">
    <circle cx="132" cy="196" r="44"/><circle cx="186" cy="168" r="54"/><circle cx="246" cy="176" r="48"/><circle cx="286" cy="206" r="36"/>
    <circle cx="118" cy="226" r="34"/><rect x="104" y="196" width="196" height="64" rx="30"/>
  </g>
  <g fill="#ffffff">
    <circle cx="132" cy="196" r="37"/><circle cx="186" cy="168" r="47"/><circle cx="246" cy="176" r="41"/><circle cx="286" cy="206" r="29"/>
    <circle cx="118" cy="226" r="27"/><rect x="111" y="203" width="182" height="50" rx="24"/>
  </g>
  <path d="M112 236 L292 236 L292 241 Q292 253 280 253 L124 253 Q112 253 112 241 Z" fill="#dfe6ff"/>
  <circle cx="150" cy="168" r="8" fill="#ffffff" stroke="#e8eeff" stroke-width="2"/>
  <!-- a happy face on the top puff -->
  <g stroke="#1c2250" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M168 144 Q172 139 176 144"/><path d="M190 144 Q194 139 198 144"/><path d="M177 152 Q183 158 189 152"/>
  </g>
  <circle cx="163" cy="154" r="5" fill="#ff7eb6" opacity="0.6"/><circle cx="203" cy="154" r="5" fill="#ff7eb6" opacity="0.6"/>
  <!-- the word -->
  <g font-family="Fredoka, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="700" text-anchor="middle" direction="rtl">
    <text x="204" y="226" font-size="58" fill="#1c2250">قطة</text>
  </g>
  <rect x="220" y="238" width="34" height="9" rx="4.5" fill="#1c2250"/><rect x="223" y="240" width="28" height="5" rx="2.5" fill="#ff9f1c"/>
  <!-- the keyboard strip -->
  <rect x="-10" y="300" width="420" height="120" rx="26" fill="#2a2f4f" stroke="#1c2250" stroke-width="6"/>
  <g font-family="Fredoka, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="700">
    <g transform="translate(14 318)">
      <rect x="0" y="4" width="66" height="64" rx="12" fill="#232848"/><rect x="0" y="0" width="66" height="62" rx="12" fill="#3d4473" stroke="#1c2250" stroke-width="3"/>
      <text x="10" y="25" font-size="22" fill="#ffffff" opacity="0.5">E</text><text x="44" y="52" font-size="26" fill="#ffffff" text-anchor="middle">ث</text>
    </g>
    <g transform="translate(92 318)">
      <rect x="0" y="4" width="66" height="64" rx="12" fill="#232848"/><rect x="0" y="0" width="66" height="62" rx="12" fill="#3d4473" stroke="#1c2250" stroke-width="3"/>
      <text x="10" y="25" font-size="22" fill="#ffffff" opacity="0.5">'</text><text x="44" y="52" font-size="26" fill="#ffffff" text-anchor="middle">ط</text>
    </g>
    <g transform="translate(170 318)">
      <rect x="-9" y="-9" width="84" height="82" rx="18" fill="#ffd23f" opacity="0.45"/>
      <rect x="0" y="4" width="66" height="64" rx="12" fill="#e0a400"/><rect x="0" y="0" width="66" height="62" rx="12" fill="#ffd23f" stroke="#1c2250" stroke-width="3.5"/>
      <text x="10" y="25" font-size="22" fill="#1c2250" opacity="0.7">R</text><text x="44" y="52" font-size="28" fill="#1c2250" text-anchor="middle">ق</text>
    </g>
    <g transform="translate(248 318)">
      <rect x="0" y="4" width="66" height="64" rx="12" fill="#232848"/><rect x="0" y="0" width="66" height="62" rx="12" fill="#3d4473" stroke="#1c2250" stroke-width="3"/>
      <text x="10" y="25" font-size="22" fill="#ffffff" opacity="0.5">M</text><text x="44" y="52" font-size="26" fill="#ffffff" text-anchor="middle">ة</text>
    </g>
    <g transform="translate(326 318)">
      <rect x="0" y="4" width="66" height="64" rx="12" fill="#232848"/><rect x="0" y="0" width="66" height="62" rx="12" fill="#3d4473" stroke="#1c2250" stroke-width="3"/>
      <text x="10" y="25" font-size="22" fill="#ffffff" opacity="0.5">H</text><text x="44" y="52" font-size="26" fill="#ffffff" text-anchor="middle">ا</text>
    </g>
  </g>
  <!-- the bolt from the lit key up to the cloud -->
  <g stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M203 314 L222 290 L196 274 L218 252" stroke="#1c2250" stroke-width="17"/>
    <path d="M203 314 L222 290 L196 274 L218 252" stroke="#ffd23f" stroke-width="10"/>
    <path d="M203 314 L222 290 L196 274 L218 252" stroke="#ffffff" stroke-width="4"/>
  </g>
  <!-- sparkles -->
  <g fill="#fff27a" stroke="#1c2250" stroke-width="3" stroke-linejoin="round">
    <path d="M326 236 L331 248 L344 250 L334 258 L337 271 L326 264 L315 271 L318 258 L308 250 L321 248 Z"/>
    <path d="M70 250 L74 259 L84 260 L76 266 L78 276 L70 270 L62 276 L64 266 L56 260 L66 259 Z"/>
  </g>
  <g fill="#ffffff"><circle cx="352" cy="192" r="5"/><circle cx="54" cy="196" r="4"/><circle cx="300" cy="140" r="4"/></g>
  <!-- the title -->
  <g font-family="Fredoka, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="700" text-anchor="middle" direction="rtl">
    <text x="200" y="80" font-size="70" fill="#1c2250" stroke="#1c2250" stroke-width="16" stroke-linejoin="round" paint-order="stroke">أصابع البرق</text>
    <text x="200" y="76" font-size="70" fill="#ffd23f" stroke="#ffffff" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round">أصابع البرق</text>
  </g>
</svg>
