<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكاديمية الفأرة واللوحة</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>أكاديمية الفأرة واللوحة</h1>
    <div id="stickers" aria-hidden="true"></div>
    <div class="tools">
      <button type="button" id="btnMap" hidden>الخريطة</button>
      <button type="button" id="btnPause" hidden>استراحة</button>
      <button type="button" id="btnTeacher">للمعلم</button>
      <button type="button" id="btnNew">طالب جديد</button>
    </div>
  </header>
  <p id="prompt" role="status"></p>
  <p id="langHint" hidden></p>
  <div id="view"></div>
  <div id="overlay" hidden></div>
  <div id="toast" hidden>أحسنت!</div>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<script src="../../shared/kit.js"></script>
<script src="rules.js"></script>
<script src="game.js"></script>
</body>
</html>
