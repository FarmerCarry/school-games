<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa8ff"/>
      <stop offset="0.68" stop-color="#b8f0ff"/>
      <stop offset="1" stop-color="#fff4c8"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ce072"/>
      <stop offset="1" stop-color="#1f8c43"/>
    </linearGradient>
    <radialGradient id="blast" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#ffe033"/>
      <stop offset="0.78" stop-color="#ff3877"/>
      <stop offset="1" stop-color="#ff3877" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bombG" x1="0.2" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#ff85b3"/>
      <stop offset="0.5" stop-color="#ff2e73"/>
      <stop offset="1" stop-color="#a80b43"/>
    </linearGradient>
    <linearGradient id="woodG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a654"/>
      <stop offset="1" stop-color="#b96823"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="322" cy="72" r="36" fill="#fff394" opacity="0.85"/>
  <path d="M0 292 Q95 256 205 288 T400 274 V400 H0 Z" fill="#7be888"/>
  <path d="M0 322 Q130 302 265 320 T400 314 V400 H0 Z" fill="url(#grass)"/>
  <rect y="330" width="400" height="8" fill="#8ff578" opacity="0.7"/>

  <!-- Paint-TNT Explosion Burst behind Toppling Fort -->
  <circle cx="292" cy="212" r="105" fill="url(#blast)"/>
  <path d="M292 118 L310 158 L354 136 L334 180 L382 192 L340 218 L370 258 L322 248 L314 294 L286 254 L244 282 L256 234 L212 218 L254 192 L232 148 L274 166 Z" fill="#ffe033" stroke="#1b1640" stroke-width="5" stroke-linejoin="round"/>

  <!-- Neon Paint Splatters -->
  <g fill="#00d2ff">
    <circle cx="242" cy="142" r="13"/><circle cx="356" cy="150" r="11"/><circle cx="368" cy="248" r="14"/>
  </g>
  <g fill="#34d85c">
    <circle cx="222" cy="245" r="12"/><circle cx="330" cy="122" r="10"/><circle cx="268" cy="306" r="11"/>
  </g>
  <g fill="#b44cff">
    <circle cx="348" cy="286" r="12"/><circle cx="256" cy="116" r="9"/>
  </g>

  <!-- Leaning & Toppling Fort Pillars + Roof Beam! -->
  <g transform="translate(264 268) rotate(22)">
    <rect x="-13" y="-62" width="26" height="124" rx="5" fill="url(#woodG)" stroke="#1b1640" stroke-width="5"/>
    <path d="M-4 -40 L4 -14 L-3 10" fill="none" stroke="#6e390e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="4" cy="-24" r="9" fill="#ff3877"/>
  </g>
  <g transform="translate(338 272) rotate(36)">
    <rect x="-13" y="-62" width="26" height="124" rx="5" fill="#84e3ff" stroke="#1b1640" stroke-width="5"/>
    <path d="M-5 -32 L6 -8 L-4 22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(308 186) rotate(29)">
    <rect x="-64" y="-12" width="128" height="24" rx="5" fill="url(#woodG)" stroke="#1b1640" stroke-width="5"/>
    <circle cx="-22" cy="0" r="9" fill="#00c8ff"/>
    <circle cx="28" cy="2" r="8" fill="#34d85c"/>
  </g>

  <!-- Paint-TNT Barrel Tilting Mid-Blast -->
  <g transform="translate(284 294) rotate(-18)">
    <rect x="-22" y="-26" width="44" height="52" rx="7" fill="#ff3b5c" stroke="#1b1640" stroke-width="5"/>
    <rect x="-22" y="-9" width="44" height="18" fill="#ffe033" stroke="#1b1640" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="6" fill="#ff3b5c"/>
  </g>

  <!-- Cheeky Grumpy Grey Robo-Goblin Tumbling in Paint! -->
  <g transform="translate(324 140) rotate(26)">
    <line x1="0" y1="-28" x2="0" y2="-40" stroke="#1b1640" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-43" r="6" fill="#ffe033" stroke="#1b1640" stroke-width="3.5"/>
    <circle r="28" fill="#8c98ad" stroke="#1b1640" stroke-width="5"/>
    <path d="M-18 -18 Q-4 -8 -8 4 Q-22 2 -24 -10 Z" fill="#ff3877"/>
    <circle cx="-9" cy="-3" r="7" fill="#fff" stroke="#1b1640" stroke-width="3"/>
    <circle cx="9" cy="-3" r="7" fill="#fff" stroke="#1b1640" stroke-width="3"/>
    <circle cx="-8" cy="-3" r="3" fill="#1b1640"/><circle cx="10" cy="-3" r="3" fill="#1b1640"/>
    <path d="M-17 -11 L-3 -7 M17 -11 L3 -7" stroke="#1b1640" stroke-width="4" stroke-linecap="round"/>
    <rect x="-10" y="9" width="20" height="8" rx="3" fill="#fff" stroke="#1b1640" stroke-width="3"/>
  </g>

  <!-- Parabolic Trajectory Arc & Flying Paint-Bomb -->
  <path d="M98 228 Q162 112 246 168" fill="none" stroke="#ffffff" stroke-width="7" stroke-dasharray="2 16" stroke-linecap="round"/>
  <g transform="translate(184 152) rotate(-18)">
    <path d="M-42 6 L-14 -10 L-14 14 Z" fill="#00c8ff" stroke="#1b1640" stroke-width="4" stroke-linejoin="round"/>
    <circle r="26" fill="url(#bombG)" stroke="#1b1640" stroke-width="5"/>
    <ellipse cx="-8" cy="-9" rx="7" ry="5" transform="rotate(-25 -8 -9)" fill="#ffffff" opacity="0.75"/>
    <path d="M18 -18 Q28 -28 36 -20" fill="none" stroke="#ffe033" stroke-width="5" stroke-linecap="round"/>
    <circle cx="38" cy="-19" r="6" fill="#ffe033"/>
  </g>

  <!-- Mega Paint-Catapult on Left -->
  <g transform="translate(78 332)">
    <ellipse cx="0" cy="8" rx="46" ry="11" fill="#14572b" opacity="0.45"/>
    <rect x="-34" y="-14" width="68" height="20" rx="8" fill="#8d4c1d" stroke="#1b1640" stroke-width="5"/>
    <path d="M0 -12 V-68 M0 -64 L-24 -104 M0 -64 L24 -104" fill="none" stroke="url(#woodG)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 -12 V-68 M0 -64 L-24 -104 M0 -64 L24 -104" fill="none" stroke="#1b1640" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-24 -102 L-44 -82 L24 -102" fill="none" stroke="#ff3877" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-18" cy="-4" r="12" fill="#ffe033" stroke="#1b1640" stroke-width="4.5"/>
    <circle cx="18" cy="-4" r="12" fill="#ffe033" stroke="#1b1640" stroke-width="4.5"/>
  </g>
</svg>
