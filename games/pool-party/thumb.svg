<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#ff7ac2"/>
      <stop offset="0.5" stop-color="#9b4dff"/>
      <stop offset="1" stop-color="#2a1270"/>
    </radialGradient>
    <radialGradient id="felt" cx="45%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2fd07f"/>
      <stop offset="1" stop-color="#0d8a4a"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8763a"/>
      <stop offset="1" stop-color="#7a3d14"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="eight" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#5a5a6e"/>
      <stop offset="0.45" stop-color="#1b1b24"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="hole" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.8" stop-color="#0a0710"/>
      <stop offset="1" stop-color="#2d2338"/>
    </radialGradient>
    <linearGradient id="cue2" gradientUnits="userSpaceOnUse" x1="88" y1="305" x2="-48" y2="432">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.5" stop-color="#f2dcae"/>
      <stop offset="0.52" stop-color="#ff3b8d"/>
      <stop offset="1" stop-color="#9b1454"/>
    </linearGradient>
    <clipPath id="c11"><circle cx="332" cy="272" r="35"/></clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- party light rays -->
  <g fill="#ffffff" opacity="0.12">
    <path d="M200 150 L110 -20 L185 -20Z"/><path d="M200 150 L255 -20 L335 -20Z"/>
    <path d="M200 150 L420 20 L420 110Z"/><path d="M200 150 L-20 40 L-20 130Z"/>
    <path d="M200 150 L-20 240 L-20 320Z"/><path d="M200 150 L420 230 L420 310Z"/>
  </g>
  <!-- confetti -->
  <g>
    <rect x="34" y="34" width="16" height="9" rx="2.5" fill="#ffe45c" transform="rotate(-25 42 38)"/>
    <rect x="340" y="28" width="16" height="9" rx="2.5" fill="#5fe0ff" transform="rotate(30 348 32)"/>
    <rect x="354" y="106" width="14" height="8" rx="2" fill="#3ddc84" transform="rotate(-40 361 110)"/>
    <rect x="26" y="102" width="14" height="8" rx="2" fill="#ff8a00" transform="rotate(35 33 106)"/>
    <circle cx="88" cy="72" r="6" fill="#fff"/>
    <circle cx="310" cy="68" r="6" fill="#ffe45c"/>
    <circle cx="204" cy="36" r="5" fill="#5fe0ff"/>
    <rect x="148" y="26" width="12" height="7" rx="2" fill="#ff3b8d" transform="rotate(20 154 29)"/>
    <rect x="252" y="42" width="12" height="7" rx="2" fill="#3ddc84" transform="rotate(-18 258 45)"/>
  </g>

  <!-- crisp vector shadow + table corner -->
  <path d="M-10 138 Q-10 118 10 118 L410 118 L410 410 L-10 410Z" fill="#170840" opacity="0.4" transform="translate(0 9)"/>
  <path d="M-10 134 Q-10 114 10 114 L410 114 L410 410 L-10 410Z" fill="url(#wood)"/>
  <rect x="18" y="142" width="400" height="270" rx="8" fill="#0b6e3a"/>
  <rect x="30" y="154" width="390" height="260" fill="url(#felt)"/>
  <circle cx="24" cy="146" r="30" fill="url(#hole)" stroke="#e8b04a" stroke-width="4"/>
  <g fill="#fff2d6">
    <path d="M110 121 l5 7 -5 7 -5 -7z"/><path d="M210 121 l5 7 -5 7 -5 -7z"/><path d="M310 121 l5 7 -5 7 -5 -7z"/>
  </g>

  <!-- cue stick + crisp drop shadow -->
  <path d="M84 301 L92 310 L-38 438 L-54 420Z" fill="#063d20" opacity="0.38" transform="translate(4 8)"/>
  <path d="M84 301 L92 310 L-38 438 L-54 420Z" fill="url(#cue2)"/>
  <path d="M84 301 L92 310 L88 314 L80 305Z" fill="#2f7de0"/>

  <!-- crisp ground shadows under pool balls (no SVG filter) -->
  <g fill="#063d20" opacity="0.42">
    <ellipse cx="114" cy="298" rx="31" ry="18"/>
    <ellipse cx="304" cy="216" rx="35" ry="20"/>
    <ellipse cx="336" cy="296" rx="36" ry="20"/>
    <ellipse cx="242" cy="314" rx="31" ry="18"/>
    <ellipse cx="204" cy="224" rx="64" ry="30"/>
  </g>

  <!-- pool balls -->
  <g>
    <!-- cue ball -->
    <circle cx="110" cy="280" r="31" fill="#fbf8ee"/>
    <circle cx="110" cy="280" r="31" fill="url(#shine)"/>
    <circle cx="122" cy="288" r="4.5" fill="#e6283c"/>
    <!-- yellow 1 -->
    <circle cx="298" cy="196" r="35" fill="#ffd21f"/>
    <circle cx="304" cy="192" r="15.5" fill="#fff"/>
    <text x="304" y="199" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="21" text-anchor="middle" fill="#111">1</text>
    <circle cx="298" cy="196" r="35" fill="url(#shine)"/>
    <!-- red stripe 11 -->
    <circle cx="332" cy="272" r="35" fill="#fbf8ee"/>
    <rect x="295" y="252" width="74" height="40" fill="#ff2d3a" clip-path="url(#c11)"/>
    <circle cx="328" cy="272" r="14.5" fill="#fff"/>
    <text x="328" y="279" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#111">11</text>
    <circle cx="332" cy="272" r="35" fill="url(#shine)"/>
    <!-- blue 2 -->
    <circle cx="238" cy="294" r="31" fill="#1e6bff"/>
    <circle cx="234" cy="288" r="13.5" fill="#fff"/>
    <text x="234" y="295" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#111">2</text>
    <circle cx="238" cy="294" r="31" fill="url(#shine)"/>
    <!-- big hero 8 ball -->
    <circle cx="196" cy="182" r="66" fill="url(#eight)"/>
    <circle cx="205" cy="171" r="29" fill="#fff"/>
    <text x="205" y="186" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="41" text-anchor="middle" fill="#111">8</text>
    <ellipse cx="174" cy="148" rx="23" ry="13.5" fill="#fff" opacity="0.38" transform="rotate(-30 174 148)"/>
  </g>
</svg>
