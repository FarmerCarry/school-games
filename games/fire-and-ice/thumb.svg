<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d3b29"/>
      <stop offset="55%" stop-color="#3c2526"/>
      <stop offset="100%" stop-color="#22141f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffe799" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffe799" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2cb82"/>
      <stop offset="100%" stop-color="#c99152"/>
    </linearGradient>
    <linearGradient id="stoneFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9e6d44"/>
      <stop offset="100%" stop-color="#6b4429"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe04a"/>
      <stop offset="45%" stop-color="#ff741a"/>
      <stop offset="100%" stop-color="#d63108"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8f8ff"/>
      <stop offset="45%" stop-color="#22ceff"/>
      <stop offset="100%" stop-color="#0b77c4"/>
    </linearGradient>
    <linearGradient id="fireBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9929"/>
      <stop offset="55%" stop-color="#ff571a"/>
      <stop offset="100%" stop-color="#d42b08"/>
    </linearGradient>
    <linearGradient id="iceBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9cf5ff"/>
      <stop offset="55%" stop-color="#22c8ff"/>
      <stop offset="100%" stop-color="#0b77cc"/>
    </linearGradient>
    <linearGradient id="goldTxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="100%" stop-color="#ffaa22"/>
    </linearGradient>
  </defs>

  <!-- Ancient sunlit temple chamber -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Arched temple alcoves -->
  <path d="M55 295 V125 A60 60 0 0 1 175 125 V295 Z" fill="#ffcf7d" fill-opacity="0.11"/>
  <path d="M225 295 V125 A60 60 0 0 1 345 125 V295 Z" fill="#6de8ff" fill-opacity="0.11"/>
  <!-- Sunbeams -->
  <polygon points="95,0 165,0 105,300 35,300" fill="url(#beam)"/>
  <polygon points="245,0 315,0 255,300 185,300" fill="url(#beam)"/>

  <!-- Background glowing temple exit gates -->
  <g transform="translate(88,124)">
    <rect x="-36" y="0" width="72" height="92" rx="14" fill="#3a6e94" stroke="#75e4ff" stroke-width="4"/>
    <rect x="-24" y="14" width="48" height="78" rx="8" fill="#2cd8ff" fill-opacity="0.72"/>
    <polygon points="0,-16 12,0 0,14 -12,0" fill="#a8f7ff"/>
  </g>
  <g transform="translate(312,124)">
    <rect x="-36" y="0" width="72" height="92" rx="14" fill="#9c4a2a" stroke="#ffba42" stroke-width="4"/>
    <rect x="-24" y="14" width="48" height="78" rx="8" fill="#ff7d26" fill-opacity="0.75"/>
    <polygon points="0,-18 11,4 -11,4" fill="#ffe15c"/>
  </g>

  <!-- Chunky 3D stone ledge & elemental pools -->
  <rect x="0" y="294" width="400" height="106" fill="url(#stoneFace)"/>
  <rect x="0" y="284" width="400" height="20" fill="url(#stoneTop)"/>
  <!-- Recessed glowing pools -->
  <rect x="24" y="288" width="136" height="24" rx="10" fill="url(#water)" stroke="#1b3a54" stroke-width="4"/>
  <rect x="240" y="288" width="136" height="24" rx="10" fill="url(#lava)" stroke="#4f1c12" stroke-width="4"/>
  <!-- Pool sparkles -->
  <circle cx="62" cy="276" r="5" fill="#9ef6ff" opacity="0.85"/>
  <circle cx="116" cy="268" r="3.5" fill="#fff" opacity="0.8"/>
  <circle cx="288" cy="274" r="5" fill="#ffe054" opacity="0.9"/>
  <circle cx="336" cy="264" r="3.5" fill="#ff9829" opacity="0.85"/>

  <!-- Floating Ruby & Sapphire Gems -->
  <g transform="translate(68,94)">
    <polygon points="0,-24 18,0 0,24 -18,0" fill="#2bd2ff" stroke="#d4fbff" stroke-width="3"/>
    <polygon points="0,-13 9,0 0,13 -9,0" fill="#c7faff" opacity="0.65"/>
  </g>
  <g transform="translate(332,94)">
    <polygon points="0,-24 18,0 0,24 -18,0" fill="#ff4024" stroke="#ffd899" stroke-width="3"/>
    <polygon points="0,-13 9,0 0,13 -9,0" fill="#fff0b8" opacity="0.65"/>
  </g>

  <!-- Cute Chunky Ice Hero (ثلجة) - Left -->
  <g transform="translate(142,218)">
    <ellipse cx="0" cy="68" rx="34" ry="8" fill="#120916" opacity="0.45"/>
    <!-- Boots -->
    <ellipse cx="-16" cy="60" rx="14" ry="9" fill="#183a66"/>
    <ellipse cx="16" cy="60" rx="14" ry="9" fill="#183a66"/>
    <!-- Torso -->
    <ellipse cx="0" cy="30" rx="31" ry="29" fill="url(#iceBody)"/>
    <ellipse cx="0" cy="34" rx="18" ry="16" fill="#c2f8ff" opacity="0.78"/>
    <!-- Arms -->
    <ellipse cx="-32" cy="26" rx="10" ry="13" fill="#22c8ff" transform="rotate(18 -32 26)"/>
    <ellipse cx="32" cy="24" rx="10" ry="13" fill="#22c8ff" transform="rotate(-24 32 24)"/>
    <!-- Head -->
    <circle cx="0" cy="-14" r="34" fill="url(#iceBody)"/>
    <!-- Droplet crystal hair -->
    <path d="M-24,-34 Q-38,-48 -20,-54 Q-10,-78 4,-86 Q14,-68 22,-54 Q40,-46 24,-32 Z" fill="#4ce4ff" stroke="#c8fbff" stroke-width="2.5"/>
    <polygon points="2,-72 10,-56 2,-44 -6,-56" fill="#e0feff" opacity="0.85"/>
    <!-- Expressive eyes & smile -->
    <ellipse cx="-12" cy="-14" rx="8.5" ry="10.5" fill="#fff"/>
    <ellipse cx="12" cy="-14" rx="8.5" ry="10.5" fill="#fff"/>
    <ellipse cx="-10" cy="-14" rx="5.5" ry="7.5" fill="#15192e"/>
    <ellipse cx="14" cy="-14" rx="5.5" ry="7.5" fill="#15192e"/>
    <circle cx="-12" cy="-18" r="2.8" fill="#fff"/>
    <circle cx="12" cy="-18" r="2.8" fill="#fff"/>
    <ellipse cx="-22" cy="-5" rx="5.5" ry="3.2" fill="#82f6ff"/>
    <ellipse cx="22" cy="-5" rx="5.5" ry="3.2" fill="#82f6ff"/>
    <path d="M-9,-1 Q0,8 9,-1" fill="none" stroke="#12284a" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Cute Chunky Fire Hero (شعلة) - Right -->
  <g transform="translate(258,218)">
    <ellipse cx="0" cy="68" rx="34" ry="8" fill="#120916" opacity="0.45"/>
    <!-- Boots -->
    <ellipse cx="-16" cy="60" rx="14" ry="9" fill="#421a14"/>
    <ellipse cx="16" cy="60" rx="14" ry="9" fill="#421a14"/>
    <!-- Torso -->
    <ellipse cx="0" cy="30" rx="31" ry="29" fill="url(#fireBody)"/>
    <ellipse cx="0" cy="34" rx="18" ry="16" fill="#ffd466" opacity="0.85"/>
    <!-- Arms -->
    <ellipse cx="-32" cy="24" rx="10" ry="13" fill="#ff5a1c" transform="rotate(24 -32 24)"/>
    <ellipse cx="32" cy="26" rx="10" ry="13" fill="#ff5a1c" transform="rotate(-18 32 26)"/>
    <!-- Head -->
    <circle cx="0" cy="-14" r="34" fill="url(#fireBody)"/>
    <!-- Spiky flame hair crown -->
    <path d="M-28,-32 L-38,-60 L-16,-48 L-2,-90 L14,-50 L36,-62 L26,-32 Z" fill="#ff9824" stroke="#fff099" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-14,-38 L-1,-74 L12,-38 Z" fill="#fff085"/>
    <!-- Expressive eyes & smile -->
    <ellipse cx="-12" cy="-14" rx="8.5" ry="10.5" fill="#fff"/>
    <ellipse cx="12" cy="-14" rx="8.5" ry="10.5" fill="#fff"/>
    <ellipse cx="-14" cy="-14" rx="5.5" ry="7.5" fill="#211216"/>
    <ellipse cx="10" cy="-14" rx="5.5" ry="7.5" fill="#211216"/>
    <circle cx="-16" cy="-18" r="2.8" fill="#fff"/>
    <circle cx="8" cy="-18" r="2.8" fill="#fff"/>
    <ellipse cx="-22" cy="-5" rx="5.5" ry="3.2" fill="#ffb86b"/>
    <ellipse cx="22" cy="-5" rx="5.5" ry="3.2" fill="#ffb86b"/>
    <path d="M-9,-1 Q0,8 9,-1" fill="none" stroke="#3d140a" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Crisp Arabic Title Banner -->
  <rect x="34" y="324" width="332" height="58" rx="22" fill="#241320" fill-opacity="0.92" stroke="#ffcf54" stroke-width="3.5"/>
  <text x="200" y="365" text-anchor="middle" direction="rtl" font-family="Fredoka, 'Baloo Bhaijaan 2', Tahoma, sans-serif" font-size="34" font-weight="700" fill="url(#goldTxt)">النار والجليد</text>
</svg>
