<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a12"/><stop offset="1" stop-color="#4a2f1c"/>
    </linearGradient>
    <radialGradient id="glowF" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.75"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowI" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3cb8ff" stop-opacity="0.7"/><stop offset="1" stop-color="#3cb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fireTxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff27a"/><stop offset="0.45" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff4d12"/>
    </linearGradient>
    <linearGradient id="iceTxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#9ff0ff"/><stop offset="1" stop-color="#2f8fff"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd34d"/><stop offset="0.4" stop-color="#ff6a00"/><stop offset="1" stop-color="#b3170c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ff0ff"/><stop offset="0.4" stop-color="#2aa8ff"/><stop offset="1" stop-color="#0b4fb8"/>
    </linearGradient>
    <linearGradient id="fireBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa033"/><stop offset="1" stop-color="#ff5a14"/>
    </linearGradient>
    <linearGradient id="iceBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fdcff"/><stop offset="1" stop-color="#2f8fff"/>
    </linearGradient>
    <pattern id="bricks" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#3a2618"/>
      <rect x="2" y="2" width="56" height="12" rx="2" fill="#4b3120"/>
      <rect x="-28" y="17" width="56" height="12" rx="2" fill="#453020"/>
      <rect x="32" y="17" width="56" height="12" rx="2" fill="#4e3322"/>
    </pattern>
    <g id="gem">
      <path d="M0 -14 L13 -3 L0 15 L-13 -3 Z" fill="#2a0d05"/>
      <path d="M0 -11 L10 -3 L0 12 L-10 -3 Z" fill="currentColor"/>
      <path d="M0 -11 L10 -3 L0 -1 L-10 -3 Z" fill="#fff" opacity="0.45"/>
      <path d="M-6 -5 L-2 -8 L-1 -5 Z" fill="#fff"/>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#bricks)" opacity="0.8"/>
  <!-- torches -->
  <g>
    <circle cx="40" cy="230" r="55" fill="url(#glowF)" opacity="0.6"/>
    <circle cx="360" cy="230" r="55" fill="url(#glowF)" opacity="0.6"/>
    <path d="M33 236 h14 l-3 18 h-8 z" fill="#5a3a22"/><path d="M33 230 q-2 -10 7 -24 q9 14 7 24 z" fill="#ff4d1a"/><path d="M36 230 q0 -7 4 -15 q5 8 4 15 z" fill="#ffd34d"/>
    <path d="M353 236 h14 l-3 18 h-8 z" fill="#5a3a22"/><path d="M353 230 q-2 -10 7 -24 q9 14 7 24 z" fill="#ff4d1a"/><path d="M356 230 q0 -7 4 -15 q5 8 4 15 z" fill="#ffd34d"/>
  </g>
  <!-- vines -->
  <path d="M90 0 q-8 30 4 60 q8 20 -2 40" stroke="#3d8f2c" stroke-width="4" fill="none"/>
  <ellipse cx="98" cy="40" rx="8" ry="4" fill="#4fa83a" transform="rotate(30 98 40)"/>
  <ellipse cx="86" cy="75" rx="8" ry="4" fill="#4fa83a" transform="rotate(-30 86 75)"/>
  <path d="M315 0 q10 25 -2 50 q-6 15 3 30" stroke="#3d8f2c" stroke-width="4" fill="none"/>
  <ellipse cx="306" cy="35" rx="8" ry="4" fill="#4fa83a" transform="rotate(-30 306 35)"/>
  <circle cx="316" cy="82" r="4" fill="#ff8fb1"/>

  <!-- title (Arabic, reads right-to-left: النار on the right over the fire kid) -->
  <g font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="bold" text-anchor="middle" direction="rtl">
    <text x="300" y="92" font-size="70" fill="#2a1206" stroke="#2a1206" stroke-width="12" stroke-linejoin="round" transform="rotate(5 300 66)">النار</text>
    <text x="300" y="92" font-size="70" fill="url(#fireTxt)" transform="rotate(5 300 66)">النار</text>
    <text x="206" y="80" font-size="46" fill="#3a2400" stroke="#3a2400" stroke-width="10" stroke-linejoin="round">و</text>
    <text x="206" y="80" font-size="46" fill="#ffd84a">و</text>
    <text x="106" y="92" font-size="60" fill="#07275a" stroke="#07275a" stroke-width="12" stroke-linejoin="round" transform="rotate(-5 106 66)">الجليد</text>
    <text x="106" y="92" font-size="60" fill="url(#iceTxt)" transform="rotate(-5 106 66)">الجليد</text>
  </g>

  <!-- floating gems -->
  <use href="#gem" x="40" y="138" color="#1fa2ff" transform="rotate(-10 40 138)"/>
  <use href="#gem" x="362" y="138" color="#ff3b2f" transform="rotate(10 362 138)"/>
  <use href="#gem" x="200" y="150" color="#ffd230"/>

  <!-- floor -->
  <rect x="0" y="330" width="400" height="70" fill="#b98a4e"/>
  <rect x="0" y="330" width="400" height="6" fill="#e0b574"/>
  <rect x="0" y="324" width="400" height="10" fill="#6cc23a"/>
  <path d="M0 324 l6 -8 l6 8 l10 -6 l6 6 l8 -9 l6 9 l12 -6 l6 6 l10 -8 l8 8 l12 -5 l6 5 l10 -7 l6 7" fill="#8fe052"/>
  <path d="M250 324 l6 -8 l6 8 l10 -6 l6 6 l8 -9 l6 9 l12 -6 l6 6 l10 -8 l8 8 l12 -5 l6 5 l10 -7 l6 7 l12 -6 l8 6" fill="#8fe052"/>
  <g stroke="#7a5530" stroke-width="2" opacity="0.6">
    <line x1="0" y1="360" x2="400" y2="360"/><line x1="40" y1="336" x2="40" y2="360"/><line x1="120" y1="336" x2="120" y2="360"/>
    <line x1="280" y1="336" x2="280" y2="360"/><line x1="360" y1="336" x2="360" y2="360"/><line x1="80" y1="360" x2="80" y2="400"/><line x1="320" y1="360" x2="320" y2="400"/>
  </g>
  <!-- pools -->
  <ellipse cx="290" cy="340" rx="85" ry="30" fill="url(#glowF)"/>
  <ellipse cx="115" cy="340" rx="85" ry="30" fill="url(#glowI)"/>
  <path d="M226 336 q16 -6 32 0 t32 0 t32 0 t32 0 v34 h-128 z" fill="url(#lava)"/>
  <path d="M226 336 q16 -6 32 0 t32 0 t32 0 t32 0" stroke="#fff1a8" stroke-width="3" fill="none"/>
  <circle cx="266" cy="352" r="4" fill="#ffe27a"/><circle cx="316" cy="358" r="3" fill="#ffe27a"/>
  <path d="M50 336 q16 -6 32 0 t32 0 t32 0 t32 0 v34 h-128 z" fill="url(#water)"/>
  <path d="M50 336 q16 -6 32 0 t32 0 t32 0 t32 0" stroke="#e8fdff" stroke-width="3" fill="none"/>
  <circle cx="94" cy="354" r="4" fill="#dff8ff"/><circle cx="144" cy="360" r="3" fill="#dff8ff"/>

  <!-- FIRE KID (jumping) -->
  <g transform="translate(282 300) rotate(8) scale(-2.55 2.55)">
    <ellipse cx="-6" cy="-3" rx="5" ry="4" fill="#b83a0a"/><ellipse cx="6" cy="-4" rx="5" ry="4" fill="#b83a0a"/>
    <path d="M-8 -34 q-2 -12 3 -22 q2 10 5 8 q1 -10 7 -18 q2 12 6 10 q3 -6 6 -12 q3 14 -1 30 z" fill="#ff3d00"/>
    <path d="M-5 -34 q0 -8 3 -14 q2 7 4 5 q1 -6 5 -12 q2 9 4 8 q2 -4 3 -6 q1 8 -2 19 z" fill="#ff9100"/>
    <path d="M-2 -34 q1 -5 3 -8 q1 4 3 3 q1 -3 3 -6 q1 6 -1 11 z" fill="#ffe066"/>
    <rect x="-14.5" y="-37.5" width="29" height="35" rx="13" fill="#7a2204"/>
    <rect x="-13" y="-36" width="26" height="32" rx="12" fill="url(#fireBody)"/>
    <ellipse cx="0" cy="-13" rx="8" ry="7" fill="#ffd59a"/>
    <ellipse cx="-15" cy="-22" rx="3.6" ry="6.5" fill="#ff7a1f" transform="rotate(40 -15 -22)"/>
    <ellipse cx="15" cy="-24" rx="3.6" ry="6.5" fill="#ff7a1f" transform="rotate(-50 15 -24)"/>
    <ellipse cx="-2.5" cy="-25" rx="4.4" ry="5.4" fill="#fff"/><ellipse cx="7.5" cy="-25" rx="4.4" ry="5.4" fill="#fff"/>
    <circle cx="-1" cy="-26" r="2.6" fill="#1a1030"/><circle cx="9" cy="-26" r="2.6" fill="#1a1030"/>
    <circle cx="0" cy="-27.2" r="1" fill="#fff"/><circle cx="10" cy="-27.2" r="1" fill="#fff"/>
    <ellipse cx="-7" cy="-19" rx="2.6" ry="1.8" fill="#ff3c50" opacity="0.5"/><ellipse cx="12" cy="-19" rx="2.6" ry="1.8" fill="#ff3c50" opacity="0.5"/>
    <path d="M1 -19 q3 4 6 0" stroke="#1a1030" stroke-width="1.8" fill="#6b1020" stroke-linecap="round"/>
  </g>

  <!-- ICE KID (jumping) -->
  <g transform="translate(120 300) rotate(-8) scale(-2.55 2.55)">
    <ellipse cx="-6" cy="-4" rx="5" ry="4" fill="#1b5fb5"/><ellipse cx="6" cy="-3" rx="5" ry="4" fill="#1b5fb5"/>
    <path d="M-17 -30 L-15 -52 L-5 -32 Z" fill="#9fe6ff" stroke="#0b3a80" stroke-width="1.2"/>
    <path d="M-8 -32 L-2 -60 L6 -32 Z" fill="#bff4ff" stroke="#0b3a80" stroke-width="1.2"/>
    <path d="M1 -32 L12 -55 L13 -31 Z" fill="#9fe6ff" stroke="#0b3a80" stroke-width="1.2"/>
    <path d="M8 -31 L20 -43 L15 -28 Z" fill="#bff4ff" stroke="#0b3a80" stroke-width="1.2"/>
    <path d="M-3 -34 L-2 -54 L1 -34 Z" fill="#fff" opacity="0.85"/>
    <rect x="-14.5" y="-37.5" width="29" height="35" rx="13" fill="#0b3a80"/>
    <rect x="-13" y="-36" width="26" height="32" rx="12" fill="url(#iceBody)"/>
    <ellipse cx="0" cy="-13" rx="8" ry="7" fill="#e3f9ff"/>
    <ellipse cx="-15" cy="-24" rx="3.6" ry="6.5" fill="#4fb8ff" transform="rotate(50 -15 -24)"/>
    <ellipse cx="15" cy="-22" rx="3.6" ry="6.5" fill="#4fb8ff" transform="rotate(-40 15 -22)"/>
    <ellipse cx="-7.5" cy="-25" rx="4.4" ry="5.4" fill="#fff"/><ellipse cx="2.5" cy="-25" rx="4.4" ry="5.4" fill="#fff"/>
    <circle cx="-9" cy="-26" r="2.6" fill="#1a1030"/><circle cx="1" cy="-26" r="2.6" fill="#1a1030"/>
    <circle cx="-8" cy="-27.2" r="1" fill="#fff"/><circle cx="2" cy="-27.2" r="1" fill="#fff"/>
    <ellipse cx="-12" cy="-19" rx="2.6" ry="1.8" fill="#ff78be" opacity="0.5"/><ellipse cx="7" cy="-19" rx="2.6" ry="1.8" fill="#ff78be" opacity="0.5"/>
    <path d="M-7 -19 q3 4 6 0" stroke="#1a1030" stroke-width="1.8" fill="#6b1020" stroke-linecap="round"/>
  </g>
  <!-- sparkles -->
  <g fill="#fff">
    <path d="M150 150 l3 10 l10 3 l-10 3 l-3 10 l-3 -10 l-10 -3 l10 -3 z"/>
    <path d="M240 200 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z"/>
    <path d="M50 230 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z"/>
  </g>
  <g fill="#ffb347">
    <circle cx="304" cy="150" r="3"/><circle cx="262" cy="140" r="2.5"/><circle cx="322" cy="130" r="2"/>
  </g>
</svg>
