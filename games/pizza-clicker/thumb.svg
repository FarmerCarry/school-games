<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgg" cx="50%" cy="58%" r="70%">
      <stop offset="0" stop-color="#ffd35c"/>
      <stop offset="0.55" stop-color="#ff9a1f"/>
      <stop offset="1" stop-color="#e2531a"/>
    </radialGradient>
    <radialGradient id="crust" cx="50%" cy="42%" r="55%">
      <stop offset="0.8" stop-color="#eaa048"/>
      <stop offset="1" stop-color="#b86a22"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff59a"/>
      <stop offset="1" stop-color="#f5b700"/>
    </radialGradient>
    <g id="pep">
      <circle r="15" fill="#c7302a" stroke="#8f1c16" stroke-width="3"/>
      <ellipse cx="-5" cy="-6" rx="5" ry="2.5" fill="#fff" fill-opacity="0.4" transform="rotate(-30 -5 -6)"/>
    </g>
    <g id="mini">
      <circle r="20" fill="#e59a3c" stroke="#3b2314" stroke-width="4"/>
      <circle r="14" fill="#ffd766"/>
      <circle cx="-6" cy="-4" r="3.6" fill="#d63a2a"/>
      <circle cx="6" cy="-1" r="3.6" fill="#d63a2a"/>
      <circle cx="0" cy="7" r="3.6" fill="#d63a2a"/>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#bgg)"/>
  <!-- sunburst -->
  <g transform="translate(200 272)" fill="#ffffff" fill-opacity="0.16">
    <path d="M0 0 L-40 -300 L40 -300 Z"/>
    <path d="M0 0 L-40 -300 L40 -300 Z" transform="rotate(30)"/>
    <path d="M0 0 L-40 -300 L40 -300 Z" transform="rotate(60)"/>
    <path d="M0 0 L-40 -300 L40 -300 Z" transform="rotate(90)"/>
    <path d="M0 0 L-40 -300 L40 -300 Z" transform="rotate(120)"/>
    <path d="M0 0 L-40 -300 L40 -300 Z" transform="rotate(150)"/>
    <path d="M0 0 L-40 -300 L40 -300 Z" transform="rotate(180)"/>
    <path d="M0 0 L-40 -300 L40 -300 Z" transform="rotate(210)"/>
    <path d="M0 0 L-40 -300 L40 -300 Z" transform="rotate(240)"/>
    <path d="M0 0 L-40 -300 L40 -300 Z" transform="rotate(270)"/>
    <path d="M0 0 L-40 -300 L40 -300 Z" transform="rotate(300)"/>
    <path d="M0 0 L-40 -300 L40 -300 Z" transform="rotate(330)"/>
  </g>
  <circle cx="200" cy="272" r="160" fill="url(#glow)"/>

  <!-- flying mini pizzas -->
  <use href="#mini" transform="translate(52 205) rotate(-20)"/>
  <use href="#mini" transform="translate(352 180) rotate(25) scale(0.85)"/>
  <use href="#mini" transform="translate(340 330) rotate(10) scale(1.1)"/>

  <!-- golden pizza -->
  <g transform="translate(62 320)">
    <circle r="36" fill="#fff6a0" fill-opacity="0.45"/>
    <circle r="24" fill="#f5b700" stroke="#3b2314" stroke-width="4"/>
    <circle r="18" fill="url(#gold)"/>
    <path d="M0 -10 L3 -3 L10 -3 L4 2 L6 10 L0 5 L-6 10 L-4 2 L-10 -3 L-3 -3 Z" fill="#fffbe0"/>
  </g>

  <!-- shadow -->
  <ellipse cx="200" cy="384" rx="108" ry="12" fill="#6b1d05" fill-opacity="0.35"/>

  <!-- big pizza -->
  <g transform="translate(200 278) scale(0.9)">
    <circle r="118" fill="url(#crust)" stroke="#3b2314" stroke-width="6"/>
    <g fill="#f7c07a">
      <ellipse cx="0" cy="-108" rx="10" ry="4"/>
      <ellipse cx="76" cy="-76" rx="10" ry="4" transform="rotate(45 76 -76)"/>
      <ellipse cx="108" cy="0" rx="4" ry="10"/>
      <ellipse cx="76" cy="76" rx="10" ry="4" transform="rotate(-45 76 76)"/>
      <ellipse cx="0" cy="108" rx="10" ry="4"/>
      <ellipse cx="-76" cy="76" rx="10" ry="4" transform="rotate(45 -76 76)"/>
      <ellipse cx="-108" cy="0" rx="4" ry="10"/>
      <ellipse cx="-76" cy="-76" rx="10" ry="4" transform="rotate(-45 -76 -76)"/>
    </g>
    <circle r="98" fill="#e0402a"/>
    <path d="M0 -91 C30 -93 50 -80 66 -64 C84 -48 94 -24 91 4 C92 30 80 54 62 70 C44 86 22 94 -4 92 C-30 93 -54 82 -70 64 C-86 46 -94 22 -90 -4 C-92 -30 -80 -54 -62 -70 C-46 -84 -22 -92 0 -91 Z" fill="#ffd766"/>
    <g fill="#ffffff" fill-opacity="0.3">
      <ellipse cx="-40" cy="-58" rx="12" ry="6" transform="rotate(-20 -40 -58)"/>
      <ellipse cx="52" cy="42" rx="11" ry="5" transform="rotate(30 52 42)"/>
      <ellipse cx="30" cy="-70" rx="9" ry="4"/>
    </g>
    <use href="#pep" x="-8" y="-66"/>
    <use href="#pep" x="44" y="-50"/>
    <use href="#pep" x="-62" y="-26"/>
    <use href="#pep" x="70" y="10"/>
    <use href="#pep" x="-64" y="40"/>
    <use href="#pep" x="54" y="58"/>
    <use href="#pep" x="-26" y="72"/>
    <g fill="#3aa845" stroke="#1f6b2a" stroke-width="2.5">
      <ellipse cx="20" cy="-78" rx="10" ry="5" transform="rotate(30 20 -78)"/>
      <ellipse cx="-78" cy="4" rx="10" ry="5" transform="rotate(-60 -78 4)"/>
      <ellipse cx="80" cy="-24" rx="10" ry="5" transform="rotate(70 80 -24)"/>
      <ellipse cx="18" cy="80" rx="10" ry="5" transform="rotate(10 18 80)"/>
    </g>
    <!-- face -->
    <ellipse cx="-44" cy="-4" rx="14" ry="8" fill="#ff5a6e" fill-opacity="0.4"/>
    <ellipse cx="44" cy="-4" rx="14" ry="8" fill="#ff5a6e" fill-opacity="0.4"/>
    <ellipse cx="-30" cy="-22" rx="18" ry="22" fill="#fff" stroke="#3b2314" stroke-width="4.5"/>
    <ellipse cx="30" cy="-22" rx="18" ry="22" fill="#fff" stroke="#3b2314" stroke-width="4.5"/>
    <circle cx="-26" cy="-18" r="11" fill="#2b1a10"/>
    <circle cx="34" cy="-18" r="11" fill="#2b1a10"/>
    <circle cx="-30" cy="-23" r="4" fill="#fff"/>
    <circle cx="30" cy="-23" r="4" fill="#fff"/>
    <path d="M-24 14 Q0 52 24 14 Z" fill="#6b1d14" stroke="#3b2314" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-12 30 Q0 42 12 30 Q0 24 -12 30 Z" fill="#ff6b81"/>
    <!-- chef hat -->
    <g transform="translate(70 -104) rotate(28) scale(0.85)">
      <rect x="-34" y="-6" width="68" height="24" rx="6" fill="#fff" stroke="#3b2314" stroke-width="4.5"/>
      <circle cx="-26" cy="-16" r="20" fill="#fff" stroke="#3b2314" stroke-width="4.5"/>
      <circle cx="26" cy="-16" r="20" fill="#fff" stroke="#3b2314" stroke-width="4.5"/>
      <circle cx="0" cy="-28" r="25" fill="#fff" stroke="#3b2314" stroke-width="4.5"/>
      <rect x="-30" y="-20" width="60" height="22" fill="#fff"/>
      <rect x="-32" y="4" width="64" height="8" fill="#e8413a"/>
    </g>
  </g>

  <!-- +1 popups -->
  <g font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="bold" stroke="#4a1606" stroke-width="6" paint-order="stroke" stroke-linejoin="round">
    <text x="318" y="252" font-size="30" fill="#ffffff" transform="rotate(12 318 252)">+1</text>
    <text x="66" y="272" font-size="26" fill="#7dff9a" transform="rotate(-10 66 272)">+5</text>
  </g>

  <!-- sparkles -->
  <g fill="#fffbe0">
    <path d="M300 118 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M96 128 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
    <path d="M362 262 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="bold" text-anchor="middle" direction="rtl" paint-order="stroke" stroke-linejoin="round">
    <text x="200" y="60" font-size="48" fill="#ffe14d" stroke="#5a1a0a" stroke-width="12">إمبراطورية</text>
    <text x="200" y="112" font-size="48" fill="#ffffff" stroke="#5a1a0a" stroke-width="12">البيتزا</text>
  </g>
</svg>
