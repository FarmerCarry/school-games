  <g fill="#1c2250">
    <circle cx="193" cy="188" r="3.5"/><circle cx="207" cy="188" r="3.5"/>
  </g>
  <path d="M192 198 Q200 206 208 198" fill="none" stroke="#1c2250" stroke-width="3.5" stroke-linecap="round"/>
