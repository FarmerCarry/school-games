  <g stroke="#1c2250" stroke-width="3.5">
    <ellipse cx="114" cy="178" rx="11" ry="14" fill="#e6f6ff" transform="rotate(-25 114 178)"/>
    <ellipse cx="128" cy="178" rx="11" ry="14" fill="#e6f6ff" transform="rotate(25 128 178)"/>
    <ellipse cx="120" cy="196" rx="20" ry="14" fill="#ffd43b"/>
