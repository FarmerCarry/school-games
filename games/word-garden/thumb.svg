  </g>
  <!-- the key that flies into the gap -->
  <g transform="rotate(8 318 108)">
    <path d="M246 150 Q266 140 280 126" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <path d="M252 168 Q272 162 286 148" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
