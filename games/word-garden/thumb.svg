      <ellipse cx="304" cy="214" rx="15" ry="9"/><ellipse cx="356" cy="214" rx="15" ry="9"/>
      <ellipse cx="312" cy="196" rx="9" ry="14" transform="rotate(-45 312 196)"/><ellipse cx="348" cy="196" rx="9" ry="14" transform="rotate(45 348 196)"/>
      <ellipse cx="312" cy="232" rx="9" ry="14" transform="rotate(45 312 232)"/><ellipse cx="348" cy="232" rx="9" ry="14" transform="rotate(-45 348 232)"/>
    </g>
    <circle cx="330" cy="214" r="14" fill="#8a5a2b"/>
