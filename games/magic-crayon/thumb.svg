<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87dcff"/>
      <stop offset="55%" stop-color="#fff8e0"/>
      <stop offset="100%" stop-color="#f2c480"/>
    </linearGradient>
    <linearGradient id="crayonBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#149ee8"/>
      <stop offset="50%" stop-color="#48d4ff"/>
      <stop offset="100%" stop-color="#2de380"/>
    </linearGradient>
    <linearGradient id="truckRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6678"/>
      <stop offset="100%" stop-color="#e82442"/>
    </linearGradient>
  </defs>

  <!-- Sunny notebook paper diorama background -->
  <rect width="400" height="400" rx="28" fill="url(#bg)"/>
  <g stroke="#5ebeff" stroke-opacity="0.35" stroke-width="2.5">
    <line x1="18" y1="76" x2="382" y2="76"/>
    <line x1="18" y1="116" x2="382" y2="116"/>
    <line x1="18" y1="156" x2="382" y2="156"/>
    <line x1="18" y1="196" x2="382" y2="196"/>
    <line x1="18" y1="236" x2="382" y2="236"/>
    <line x1="18" y1="276" x2="382" y2="276"/>
  </g>
  <line x1="56" y1="18" x2="56" y2="330" stroke="#ff6c8a" stroke-opacity="0.45" stroke-width="4"/>

  <!-- Wooden desk strip at bottom -->
  <rect x="0" y="328" width="400" height="72" fill="#e6a860"/>
  <rect x="0" y="324" width="400" height="10" fill="#241c3b"/>

  <!-- Left & right toy block platforms -->
  <rect x="-10" y="254" width="112" height="80" rx="12" fill="#3b8eea" stroke="#241c3b" stroke-width="7"/>
  <rect x="-10" y="250" width="116" height="18" rx="8" fill="#fff6de" stroke="#241c3b" stroke-width="6"/>
  <rect x="296" y="220" width="114" height="114" rx="12" fill="#ff6b9d" stroke="#241c3b" stroke-width="7"/>
  <rect x="292" y="216" width="118" height="18" rx="8" fill="#ffe27a" stroke="#241c3b" stroke-width="6"/>

  <!-- Checkered flag on right platform -->
  <line x1="342" y1="216" x2="342" y2="132" stroke="#241c3b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="342" cy="128" r="8" fill="#ffd22b" stroke="#241c3b" stroke-width="4"/>
  <g transform="translate(344,136)">
    <path d="M0 0 Q18 -8 40 2 L40 34 Q18 24 0 34 Z" fill="#fff" stroke="#241c3b" stroke-width="4"/>
    <rect x="2" y="2" width="12" height="10" fill="#241c3b"/>
    <rect x="26" y="2" width="12" height="10" fill="#241c3b"/>
    <rect x="14" y="12" width="12" height="10" fill="#241c3b"/>
    <rect x="2" y="22" width="12" height="10" fill="#241c3b"/>
    <rect x="26" y="22" width="12" height="10" fill="#241c3b"/>
  </g>

  <!-- Chunky glowing 3D-look crayon bridge arc -->
  <path d="M90 264 Q198 286 306 232" fill="none" stroke="#241c3b" stroke-width="32" stroke-linecap="round"/>
  <path d="M90 264 Q198 286 306 232" fill="none" stroke="url(#crayonBlue)" stroke-width="20" stroke-linecap="round"/>
  <path d="M96 258 Q198 279 300 226" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>

  <!-- Spinning golden stars above the arc -->
  <g fill="#ffd22b" stroke="#241c3b" stroke-width="4" stroke-linejoin="round">
    <polygon points="244,142 250,156 265,157 253,167 257,182 244,173 231,182 235,167 223,157 238,156"/>
    <polygon transform="translate(292,158) scale(0.75)" points="0,-20 6,-6 21,-5 9,5 13,20 0,11 -13,20 -9,5 -21,-5 -6,-6"/>
  </g>

  <!-- Chunky smiling 3D toy monster truck zooming on the crayon bridge! -->
  <g transform="translate(158,216) rotate(-8)">
    <!-- Boost flame -->
    <polygon points="-58,0 -98,-12 -86,2 -102,14 -58,12" fill="#ff7b1a" stroke="#241c3b" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="-58,3 -80,-3 -74,6 -58,9" fill="#ffe64d"/>
    <!-- Antenna -->
    <path d="M-26,-42 Q-38,-68 -48,-72" fill="none" stroke="#241c3b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-49" cy="-73" r="9" fill="#ffd23f" stroke="#241c3b" stroke-width="4"/>
    <!-- Body & cab -->
    <rect x="-56" y="-12" width="114" height="36" rx="12" fill="url(#truckRed)" stroke="#241c3b" stroke-width="6"/>
    <rect x="-52" y="4" width="106" height="9" fill="#ffd23f"/>
    <rect x="-34" y="-44" width="66" height="36" rx="12" fill="#ff5c6c" stroke="#241c3b" stroke-width="6"/>
    <!-- Windshield & cute cartoon eyes -->
    <rect x="-24" y="-36" width="46" height="22" rx="7" fill="#7ce3ff" stroke="#241c3b" stroke-width="4"/>
    <ellipse cx="4" cy="-25" rx="7" ry="8" fill="#fff" stroke="#241c3b" stroke-width="3"/>
    <ellipse cx="18" cy="-25" rx="7" ry="8" fill="#fff" stroke="#241c3b" stroke-width="3"/>
    <circle cx="6" cy="-25" r="3.5" fill="#241c3b"/>
    <circle cx="20" cy="-25" r="3.5" fill="#241c3b"/>
    <!-- Headlight -->
    <circle cx="56" cy="-2" r="7" fill="#fff48f" stroke="#241c3b" stroke-width="3.5"/>
    <!-- Giant monster truck wheels -->
    <g transform="translate(-32,28)">
      <circle r="26" fill="#2b2f3d" stroke="#241c3b" stroke-width="6"/>
      <circle r="13" fill="#ffd23f" stroke="#241c3b" stroke-width="4"/>
      <circle r="5" fill="#fff"/>
    </g>
    <g transform="translate(34,28)">
      <circle r="26" fill="#2b2f3d" stroke="#241c3b" stroke-width="6"/>
      <circle r="13" fill="#ffd23f" stroke="#241c3b" stroke-width="4"/>
      <circle r="5" fill="#fff"/>
    </g>
  </g>

  <!-- Giant magic crayon drawing at bottom-right -->
  <g transform="translate(274,264) rotate(32)">
    <polygon points="0,0 -14,26 14,26" fill="#ff7b1a" stroke="#241c3b" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-15" y="24" width="30" height="72" rx="4" fill="#ff7b1a" stroke="#241c3b" stroke-width="5"/>
    <rect x="-15" y="42" width="30" height="32" fill="#241c3b"/>
    <rect x="-15" y="52" width="30" height="10" fill="#ffe047"/>
  </g>

  <!-- Bold Arabic Logo -->
  <g transform="translate(200,82)">
    <text x="0" y="0" text-anchor="middle" direction="rtl"
      font-family="Fredoka, 'Baloo Bhaijaan 2', 'Segoe UI', sans-serif"
      font-weight="700" font-size="56" fill="#241c3b" stroke="#241c3b" stroke-width="14" stroke-linejoin="round">القلم السحري</text>
    <text x="0" y="-4" text-anchor="middle" direction="rtl"
      font-family="Fredoka, 'Baloo Bhaijaan 2', 'Segoe UI', sans-serif"
      font-weight="700" font-size="56" fill="#ff477e" stroke="#fffef7" stroke-width="5" paint-order="stroke fill">القلم السحري</text>
  </g>
</svg>
