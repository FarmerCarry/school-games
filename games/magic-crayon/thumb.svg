<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="turbo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.48" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="podBody" cx="0.35" cy="0.3">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="0.35" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="portalGlow">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Blueprint Stunt Stadium Backdrop -->
  <rect width="400" height="400" rx="28" fill="url(#sky)"/>
  <g stroke="#93c5fd" stroke-opacity="0.22" stroke-width="1.5">
    <line x1="0" y1="60" x2="400" y2="60"/><line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/><line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Distant Comic Stadium Hills & Clouds -->
  <path d="M0 305 Q95 265 200 295 T400 280 L400 400 L0 400 Z" fill="#0f172a" opacity="0.35"/>

  <!-- Steel Stunt Ramps -->
  <g stroke="#0f172a" stroke-width="5" stroke-linejoin="round">
    <rect x="14" y="242" width="96" height="20" rx="10" transform="rotate(8 62 252)" fill="#f59e0b"/>
    <rect x="286" y="226" width="102" height="20" rx="10" fill="#f59e0b"/>
  </g>

  <!-- Magic Turbo Crayon Track + Sparks -->
  <g fill="none" stroke-linecap="round">
    <path d="M98 256 Q195 190 292 232" stroke="#0f172a" stroke-width="24"/>
    <path d="M98 256 Q195 190 292 232" stroke="url(#turbo)" stroke-width="15"/>
    <path d="M104 252 Q195 188 286 229" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3.5" stroke-dasharray="8 10"/>
  </g>

  <!-- Checkered Goal Portal -->
  <circle cx="342" cy="176" r="56" fill="url(#portalGlow)"/>
  <g transform="translate(342 180)">
    <circle cx="0" cy="0" r="36" fill="#0f172a"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#0f172a" stroke-width="8" stroke-dasharray="12 12"/>
    <circle cx="0" cy="0" r="19" fill="#10b981" stroke="#fde047" stroke-width="4"/>
    <polygon points="0,-11 3.5,-3 12,-2 5.5,3.5 7.5,12 0,7.5 -7.5,12 -5.5,3.5 -12,-2 -3.5,-3" fill="#fde047"/>
  </g>

  <!-- Smashing Wooden Crate & Golden Stars -->
  <g transform="translate(274 196) rotate(14)" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round">
    <rect x="-15" y="-15" width="30" height="30" rx="5" fill="#d97706"/>
    <line x1="-12" y1="-12" x2="12" y2="12"/><line x1="12" y1="-12" x2="-12" y2="12"/>
  </g>
  <g fill="#fde047" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round">
    <polygon transform="translate(205 130) scale(0.95)" points="0,-20 6,-7 20,-6 9,4 13,18 0,10 -13,18 -9,4 -20,-6 -6,-7"/>
    <polygon transform="translate(256 138) rotate(14) scale(0.78)" points="0,-20 6,-7 20,-6 9,4 13,18 0,10 -13,18 -9,4 -20,-6 -6,-7"/>
  </g>

  <!-- Mini Monster-Wheel Rocket Stunt Pod -->
  <g transform="translate(152 182) rotate(-14)">
    <!-- Rocket exhaust flame -->
    <path d="M-30 4 L-62 -8 L-50 4 L-66 16 L-30 12 Z" fill="#f97316" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M-30 6 L-48 0 L-42 8 L-50 13 L-30 10 Z" fill="#fde047"/>
    <!-- Pod cockpit sphere -->
    <circle cx="0" cy="-4" r="28" fill="url(#podBody)" stroke="#0f172a" stroke-width="4.5"/>
    <path d="M-8 -22 Q16 -24 22 -4 Q12 2 -6 -4 Z" fill="#bae6fd" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M-24 2 H24" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <!-- Monster tire -->
    <circle cx="0" cy="18" r="16" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
    <circle cx="0" cy="18" r="7" fill="#fbbf24" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- Magic Orange Turbo Crayon -->
  <g transform="translate(292 232) rotate(-34)">
    <polygon points="0,0 -13,-26 13,-26" fill="#ea580c" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-13" y="-88" width="26" height="62" rx="6" fill="#f97316" stroke="#0f172a" stroke-width="4"/>
    <rect x="-11" y="-76" width="22" height="8" fill="#fde047"/>
    <rect x="-11" y="-44" width="22" height="8" fill="#fde047"/>
  </g>

  <!-- Bold Arabic Stunt Banner -->
  <rect x="36" y="318" width="328" height="64" rx="22" fill="#0f172a" opacity="0.45"/>
  <g font-family="Fredoka, 'Segoe UI', Tahoma, sans-serif" font-weight="700" text-anchor="middle" direction="rtl">
    <text x="200" y="364" font-size="54" fill="#0f172a" stroke="#0f172a" stroke-width="14" stroke-linejoin="round" paint-order="stroke">القلم السحري</text>
    <text x="200" y="364" font-size="54" fill="#fde047" stroke="#ef4444" stroke-width="5" stroke-linejoin="round" paint-order="stroke">القلم السحري</text>
  </g>
</svg>
