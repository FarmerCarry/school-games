<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>القلم السحري</title>
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="title">
  <canvas id="scene" tabindex="0" aria-label="ساحة اللعب ثلاثية الأبعاد للقلم السحري"></canvas>

  <!-- Minimal, vibrant HUD -->
  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-left">
        <button id="btnPause" class="icon-btn" type="button" aria-label="إيقاف مؤقت" title="استراحة (P / Esc)">⏸</button>
        <button id="btnReset" class="icon-btn" type="button" aria-label="إعادة المرحلة" title="إعادة (R)">↻</button>
        <div class="stage-pill">
          <span id="hudStage" dir="ltr">1-1</span>
          <span class="hud-stars" id="hudStars" aria-label="النجوم">
            <i class="st">★</i><i class="st">★</i><i class="st">★</i>
          </span>
        </div>
      </div>

      <div class="ink-meter" aria-label="حبر القلم">
        <span class="ink-ico" aria-hidden="true">🖍️</span>
        <div class="ink-track">
          <div id="inkFill" class="ink-fill"></div>
        </div>
        <b id="inkPct" dir="ltr">100%</b>
      </div>
      <!-- Space reserved top-right for Kit.muteButton() -->
      <div class="mute-spacer" aria-hidden="true"></div>
    </div>

    <div id="banner" class="toast" hidden></div>
    <div id="drawGuide" class="draw-guide" hidden>🖍️ ارسم جسراً هنا!</div>

    <div class="hud-dock">
      <div class="crayon-bar" role="group" aria-label="أنواع الأقلام">
        <button id="ink0" class="crayon-btn c0 active" type="button" data-crayon="0">
          <span class="c-dot"></span>
          <span class="c-lbl">جسر</span>
          <span class="sg-key mini">1</span>
        </button>
        <button id="ink1" class="crayon-btn c1" type="button" data-crayon="1">
          <span class="c-dot"></span>
          <span class="c-lbl">تيربو</span>
          <span class="sg-key mini">2</span>
        </button>
        <button id="ink2" class="crayon-btn c2" type="button" data-crayon="2">
          <span class="c-dot"></span>
          <span class="c-lbl">نابض</span>
          <span class="sg-key mini">3</span>
        </button>
      </div>

      <button id="btnUndo" class="dock-btn undo" type="button" title="تراجع (Z)">
        <span>↩</span>
        <span>تراجع</span>
        <span class="sg-key mini">Z</span>
      </button>

      <button id="btnLaunch" class="dock-btn go" type="button">
        <span id="launchLbl">انطلق!</span>
        <span class="sg-key mini">مسافة</span>
      </button>
    </div>
  </div>

  <!-- Minimal Poki-style Title Screen over live 3D diorama -->
  <section id="scrTitle" class="overlay title-ov" aria-label="القلم السحري">
    <div class="title-wrap">
      <div class="title-badge">⭐ <b id="titleStars" dir="ltr">0/63</b></div>
      <h1 class="game-logo">القلم السحري</h1>

      <button id="btnPlay" class="play-hero" type="button">▶ العب!</button>

      <div class="title-actions">
        <button id="btnLevels" class="pill-btn" type="button">🗺️ المراحل</button>
        <button id="btnGarage" class="pill-btn" type="button">🚙 الشاحنات</button>
      </div>
    </div>

    <div class="keys-line">
      <span><span dir="ltr"><span class="sg-key">اسحب</span></span> ارسم</span>
      <span><span dir="ltr"><span class="sg-key">مسافة</span></span> انطلق</span>
      <span><span dir="ltr"><span class="sg-key">1–3</span></span> الألوان</span>
      <span><span dir="ltr"><span class="sg-key">Z</span></span> تراجع</span>
    </div>
  </section>

  <!-- Pause Overlay -->
  <section id="scrPause" class="overlay" hidden aria-label="استراحة">
    <div class="card">
      <h2 class="card-title">استراحة</h2>
      <p id="pauseStage" class="card-sub"></p>
      <div class="card-btns">
        <button id="btnResume" class="sg-btn good" type="button">متابعة</button>
        <button id="btnRestart" class="sg-btn" type="button">إعادة</button>
        <button id="btnMap" class="sg-btn secondary" type="button">المراحل</button>
        <button id="btnHome" class="sg-btn secondary" type="button">الرئيسية</button>
      </div>
    </div>
  </section>

  <!-- Win / Level Clear Overlay -->
  <section id="scrWin" class="overlay" hidden aria-label="أحسنت!">
    <div class="card win-card">
      <div id="winBadge" class="new-best" hidden>رقم جديد! 🎉</div>
      <h2 id="winTitle" class="card-title">أحسنت!</h2>
      <div id="winStars" class="big-stars" aria-label="النجوم المكتسبة">
        <span class="bstar">★</span><span class="bstar">★</span><span class="bstar">★</span>
      </div>
      <div id="winUnlock" class="unlock-note" hidden></div>
      <div class="card-btns">
        <button id="btnNext" class="sg-btn good" type="button">المرحلة التالية ▶</button>
        <button id="btnReplay" class="sg-btn" type="button">إعادة</button>
        <button id="winMap" class="sg-btn secondary" type="button">المراحل</button>
      </div>
    </div>
  </section>

  <!-- Level Select Overlay (3 themed worlds x 7 stages) -->
  <section id="scrLevels" class="overlay" hidden aria-label="المراحل">
    <div class="card wide-card">
      <div class="card-head">
        <h2 class="card-title">المراحل</h2>
        <button id="levelsBack" class="icon-btn close-btn" type="button" aria-label="إغلاق">✕</button>
      </div>
      <div id="worldTabs" class="world-tabs" role="tablist"></div>
      <div id="levelGrid" class="level-grid"></div>
    </div>
  </section>

  <!-- Truck Skins Garage Overlay -->
  <section id="scrGarage" class="overlay" hidden aria-label="الشاحنات">
    <div class="card wide-card">
      <div class="card-head">
        <h2 class="card-title">🚙 الشاحنات</h2>
        <span class="garage-stars">⭐ <b id="garageStars" dir="ltr">0</b></span>
        <button id="garageBack" class="icon-btn close-btn" type="button" aria-label="إغلاق">✕</button>
      </div>
      <div id="skinGrid" class="skin-grid"></div>
    </div>
  </section>

  <!-- WebGL unavailable fallback -->
  <section id="scrError" class="overlay" hidden aria-label="تعذر التشغيل">
    <div class="card">
      <h2 class="card-title">تعذّر تشغيل العرض ثلاثي الأبعاد</h2>
      <p class="card-sub">يرجى تفعيل WebGL في المتصفح ثم إعادة المحاولة.</p>
      <button id="btnErrorReload" class="sg-btn" type="button">أعد المحاولة</button>
    </div>
  </section>

  <div id="contextNotice" class="toast" hidden>جاري استعادة الرسوم ثلاثية الأبعاد...</div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script src="../../shared/kit.js"></script>
  <script src="../../shared/webgl.js"></script>
  <script src="../../shared/juice.js"></script>
  <script src="../../lib/three/three.min.js"></script>
  <script src="engine.js"></script>
  <script src="art.js"></script>
  <script src="game.js"></script>
</body>
</html>
