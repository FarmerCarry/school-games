<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="75%">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.45" stop-color="#ffc24a"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </radialGradient>
    <radialGradient id="body" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#c4f58a"/>
      <stop offset="0.55" stop-color="#6fd13f"/>
      <stop offset="1" stop-color="#3f9e1f"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7a8"/>
      <stop offset="0.55" stop-color="#ffd000"/>
      <stop offset="1" stop-color="#ff9d00"/>
    </linearGradient>
    <clipPath id="candyClip"><circle cx="0" cy="0" r="30"/></clipPath>
    <clipPath id="mouthClip"><ellipse cx="200" cy="318" rx="46" ry="34"/></clipPath>
    <path id="st" d="M0,-24 L7,-8 L24,-7 L11,4 L15,21 L0,12 L-15,21 L-11,4 L-24,-7 L-7,-8 Z"/>
  </defs>

  <rect width="400" height="400" rx="0" fill="url(#bg)"/>
  <!-- sunburst -->
  <g opacity="0.22" fill="#fff">
    <path d="M200 270 L120 -20 L180 -20 Z"/><path d="M200 270 L300 -20 L370 -20 Z"/>
    <path d="M200 270 L420 40 L420 120 Z"/><path d="M200 270 L-20 40 L-20 120 Z"/>
    <path d="M200 270 L420 230 L420 310 Z"/><path d="M200 270 L-20 230 L-20 310 Z"/>
    <path d="M200 270 L60 -20 L0 -20 L-20 0 Z"/>
  </g>

  <!-- rope -->
  <circle cx="92" cy="128" r="13" fill="#ffc93c" stroke="#4a2a0c" stroke-width="5"/>
  <path d="M92 128 Q130 170 174 186" fill="none" stroke="#4a2a0c" stroke-width="12" stroke-linecap="round"/>
  <path d="M92 128 Q130 170 174 186" fill="none" stroke="#f1c98a" stroke-width="7" stroke-linecap="round"/>
  <path d="M92 128 Q130 170 174 186" fill="none" stroke="#c07c33" stroke-width="7" stroke-dasharray="8 8"/>
  <circle cx="92" cy="128" r="4" fill="#4a2a0c"/>
  <!-- cut sparkle -->
  <path d="M104 186 L160 128" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M136 146 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" fill="#fff"/>

  <!-- Munch -->
  <ellipse cx="200" cy="384" rx="96" ry="12" fill="#000" opacity="0.18"/>
  <path d="M226 234 Q236 206 266 196" fill="none" stroke="#1f5510" stroke-width="12" stroke-linecap="round"/>
  <path d="M226 234 Q236 206 266 196" fill="none" stroke="#5cc233" stroke-width="5" stroke-linecap="round"/>
  <circle cx="270" cy="194" r="14" fill="#ffe14d" stroke="#1f5510" stroke-width="6"/>
  <ellipse cx="160" cy="380" rx="26" ry="13" fill="#3f9a22" stroke="#1f5510" stroke-width="6"/>
  <ellipse cx="240" cy="380" rx="26" ry="13" fill="#3f9a22" stroke="#1f5510" stroke-width="6"/>
  <circle cx="200" cy="312" r="86" fill="url(#body)" stroke="#1f5510" stroke-width="8"/>
  <ellipse cx="200" cy="350" rx="52" ry="30" fill="#e6ffbe" opacity="0.5"/>
  <circle cx="258" cy="270" r="8" fill="#2f7a14" opacity="0.35"/>
  <circle cx="244" cy="252" r="5" fill="#2f7a14" opacity="0.35"/>
  <ellipse cx="143" cy="322" rx="14" ry="9" fill="#ff6e96" opacity="0.6"/>
  <ellipse cx="257" cy="322" rx="14" ry="9" fill="#ff6e96" opacity="0.6"/>
  <!-- eyes looking up at candy -->
  <ellipse cx="170" cy="272" rx="23" ry="27" fill="#fff" stroke="#1f5510" stroke-width="5"/>
  <ellipse cx="230" cy="272" rx="23" ry="27" fill="#fff" stroke="#1f5510" stroke-width="5"/>
  <circle cx="168" cy="260" r="12" fill="#1b1030"/>
  <circle cx="224" cy="260" r="12" fill="#1b1030"/>
  <circle cx="163" cy="255" r="4.5" fill="#fff"/>
  <circle cx="219" cy="255" r="4.5" fill="#fff"/>
  <!-- open mouth -->
  <ellipse cx="200" cy="318" rx="46" ry="34" fill="#6a0f2a"/>
  <g clip-path="url(#mouthClip)">
    <ellipse cx="200" cy="350" rx="32" ry="18" fill="#ff6f91"/>
    <rect x="170" y="282" width="13" height="15" rx="3" fill="#fff"/>
    <rect x="217" y="282" width="13" height="15" rx="3" fill="#fff"/>
  </g>
  <ellipse cx="200" cy="318" rx="46" ry="34" fill="none" stroke="#1b1030" stroke-width="6"/>

  <!-- candy -->
  <g transform="translate(192 196) rotate(-18)">
    <path d="M-20 -8 Q-36 -3 -50 -18 Q-46 0 -50 18 Q-36 3 -20 8 Z" fill="#ff8fa3" stroke="#a3122f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M20 -8 Q36 -3 50 -18 Q46 0 50 18 Q36 3 20 8 Z" fill="#ff8fa3" stroke="#a3122f" stroke-width="4" stroke-linejoin="round"/>
    <circle r="30" fill="#fff"/>
    <g clip-path="url(#candyClip)" fill="#ff3b5c">
      <path d="M0 0 Q20 -4 36 0 L25 26 Q14 10 0 0 Z"/>
      <path d="M0 0 Q4 20 0 36 L-26 25 Q-10 14 0 0 Z"/>
      <path d="M0 0 Q-20 4 -36 0 L-25 -26 Q-14 -10 0 0 Z"/>
      <path d="M0 0 Q-4 -20 0 -36 L26 -25 Q10 -14 0 0 Z"/>
    </g>
    <circle r="30" fill="none" stroke="#a3122f" stroke-width="4.5"/>
    <ellipse cx="-11" cy="-13" rx="9" ry="5" fill="#fff" opacity="0.8" transform="rotate(-35 -11 -13)"/>
  </g>

  <!-- stars -->
  <use href="#st" transform="translate(330 205) rotate(12) scale(1.25)" fill="url(#star)" stroke="#a35a00" stroke-width="3.5" stroke-linejoin="round"/>
  <use href="#st" transform="translate(72 250) rotate(-14) scale(1.05)" fill="url(#star)" stroke="#a35a00" stroke-width="3.5" stroke-linejoin="round"/>
  <use href="#st" transform="translate(338 132) rotate(-8) scale(0.8)" fill="url(#star)" stroke="#a35a00" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- logo -->
  <g font-family="Fredoka, 'Segoe UI Rounded', 'Segoe UI', 'Trebuchet MS', sans-serif" font-weight="700" text-anchor="middle" stroke-linejoin="round">
    <g transform="rotate(-5 200 60)">
      <text x="200" y="76" font-size="72" fill="#2b1238" stroke="#2b1238" stroke-width="16">MUNCH</text><text x="200" y="70" font-size="72" fill="#2b1238" stroke="#2b1238" stroke-width="10">MUNCH</text>
      <text x="200" y="70" font-size="72" fill="#7ed957">MUNCH</text>
      <text x="238" y="130" font-size="52" fill="#2b1238" stroke="#2b1238" stroke-width="14">ROPE</text><text x="238" y="125" font-size="52" fill="#2b1238" stroke="#2b1238" stroke-width="9">ROPE</text>
      <text x="238" y="125" font-size="52" fill="#ff4f7a">ROPE</text>
    </g>
  </g>
</svg>
