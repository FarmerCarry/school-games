<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حبل الحلوى</title>
<style>@font-face{font-family:Fredoka;src:url(../../shared/fonts/fredoka-latin-500-normal.woff2) format("woff2");font-weight:400 500;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-200B,U+2010-206F,U+20AC,U+2122,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:Fredoka;src:url(../../shared/fonts/fredoka-latin-700-normal.woff2) format("woff2");font-weight:600 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-200B,U+2010-206F,U+20AC,U+2122,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:Fredoka;src:url(../../shared/fonts/baloo-bhaijaan-2-arabic-500-normal.woff2) format("woff2");font-weight:400 500;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200F,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}@font-face{font-family:Fredoka;src:url(../../shared/fonts/baloo-bhaijaan-2-arabic-700-normal.woff2) format("woff2");font-weight:600 900;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200F,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}:root{--sg-font: "Fredoka", "Segoe UI", Tahoma, "Trebuchet MS", system-ui, sans-serif;--sg-bg: #10142b;--sg-panel: rgba(16, 20, 43, .88);--sg-text: #ffffff;--sg-accent: #ffcc00;--sg-accent-ink: #3a2a00;--sg-good: #3ddc84;--sg-bad: #ff5a5f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sg-bg);color:var(--sg-text);font-family:var(--sg-font);font-weight:500;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}canvas{display:block;outline:none}.sg-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080a188c;z-index:10}.sg-overlay[hidden]{display:none}.sg-panel{background:var(--sg-panel);border:3px solid rgba(255,255,255,.15);border-radius:24px;padding:28px 36px;min-width:320px;max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 60px #00000073;animation:sg-pop .25s ease-out}.sg-title{margin:0 0 8px;font-size:clamp(32px,6vw,56px);font-weight:700;line-height:1.05;letter-spacing:.5px;text-shadow:0 4px 0 rgba(0,0,0,.35)}.sg-sub{margin:0 0 18px;font-size:18px;opacity:.85}.sg-btn{display:inline-block;font:inherit;font-weight:700;font-size:22px;color:var(--sg-accent-ink);background:var(--sg-accent);border:none;border-radius:999px;padding:12px 34px;margin:6px;cursor:pointer;box-shadow:0 5px #00000059;transition:transform .08s ease,filter .08s ease}.sg-btn:hover{transform:translateY(-2px) scale(1.04);filter:brightness(1.08)}.sg-btn:active{transform:translateY(3px);box-shadow:0 2px #00000059}.sg-btn.secondary{background:#fff;color:#1d2340}.sg-btn.good{background:var(--sg-good);color:#07351c}.sg-key{display:inline-block;min-width:30px;padding:2px 8px;direction:ltr;unicode-bidi:isolate;margin:0 2px;border-radius:7px;background:#fff;color:#1d2340;font-weight:700;font-size:16px;box-shadow:0 3px #9aa3c7;text-align:center}.sg-howto{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;text-align:start;margin:14px auto 18px;max-width:420px;font-size:17px}.sg-mute{position:fixed;top:10px;right:10px;left:auto;z-index:20;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:#00000059;color:#fff;font-size:20px;line-height:1;cursor:pointer}.sg-mute:hover{background:#0000008c}.sg-hud{position:fixed;top:10px;left:14px;z-index:5;font-size:26px;font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.4);pointer-events:none}@keyframes sg-pop{0%{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}</style>
<style>body{background:#2a1640}#cv{cursor:crosshair}#ui{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;pointer-events:none;z-index:10;font-family:var(--sg-font);color:#fff}#ui .scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto}#ui .scr[hidden],#ui [hidden]{display:none!important}#ui .scr.pass{pointer-events:none}#ui .scr.pass>*{pointer-events:auto}#ui .scr.dim{background:#280e3c73}#ui .sg-btn{position:relative}#ui .sg-btn .sg-key{font-size:14px;padding:0 6px;min-width:0;vertical-align:2px;box-shadow:0 2px #00000040}#ui .sg-btn.small{font-size:18px;padding:8px 20px}#ui .sg-btn.good{background:#5ee04f;color:#0d3a07;box-shadow:0 5px #2f8a24}#ui .sg-btn.secondary{box-shadow:0 5px #9aa3c7}#hud{position:absolute;top:12px;right:72px;display:flex;gap:10px;pointer-events:auto}.hb{width:52px;height:52px;border-radius:50%;border:3px solid #fff;padding:0;background:#3c19468c;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;box-shadow:0 4px #00000040;transition:transform .08s}.hb:hover{transform:scale(1.08);background:#3c1946bf}.hb:active{transform:scale(.94)}.hb .pz{width:7px;height:20px;background:#fff;border-radius:3px}.hb .rst{font-size:30px;font-weight:700;line-height:1;margin-top:-3px}.hb .bulb{width:18px;height:18px;border-radius:50%;background:#ffe14d;position:relative;margin-top:-6px;box-shadow:0 0 10px #ffe14d}.hb .bulb:after{content:"";position:absolute;left:4px;top:16px;width:10px;height:8px;border-radius:0 0 4px 4px;background:#d8d8e8}.hb.glow{animation:hbglow .9s ease-in-out infinite}@keyframes hbglow{0%,to{box-shadow:0 4px #00000040,0 0 #ffe14de6}50%{box-shadow:0 4px #00000040,0 0 0 10px #ffe14d00}}.tleft{position:absolute;left:70px;top:50%;transform:translateY(-50%);width:560px;display:flex;flex-direction:column;align-items:center}.logo{margin:0 0 18px;text-align:center;line-height:.82;transform:rotate(-4deg);display:flex;flex-direction:column;align-items:center}.logo span{display:flex;gap:2px}.logo .w2{margin-left:90px}.logo b{display:inline-block;font-weight:700;font-size:128px;color:var(--c);-webkit-text-stroke:13px #2b1238;paint-order:stroke fill;text-shadow:0 10px 0 #2b1238,0 16px 22px rgba(0,0,0,.3);animation:bob 1.8s ease-in-out infinite;animation-delay:calc(var(--d) * -.15s)}@keyframes bob{0%,to{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}#ui .sg-btn.big{font-size:46px;padding:12px 74px;box-shadow:0 8px #b37800,0 14px 24px #00000040;animation:pulse 1.2s ease-in-out infinite}#ui .sg-btn.big:hover{animation:none}@keyframes pulse{0%,to{transform:scale(1)}50%{transform:scale(1.06)}}.tleft .row{display:flex;gap:8px;margin-top:8px}.newdot{position:absolute;top:-10px;right:-12px;background:#ff3b6b;color:#fff;font-style:normal;font-size:13px;padding:2px 7px;border-radius:10px;box-shadow:0 2px #0000004d;animation:pulse .8s infinite}.howto{margin-top:16px;background:#2b1238b8;border:3px solid rgba(255,255,255,.25);border-radius:20px;padding:10px 20px;font-size:19px;display:flex;flex-direction:column;gap:6px}.progress{margin-top:12px;font-size:24px;font-weight:700;text-shadow:0 3px 0 rgba(43,18,56,.7)}.progress .st{color:#ffd21f}.ttry{position:absolute;left:1060px;top:150px;width:190px;text-align:center;font-size:20px;font-weight:700;color:#5b3210;background:#fff8d7bf;border-radius:16px;padding:6px 10px;transform:rotate(4deg);pointer-events:none!important}.panel{background:linear-gradient(180deg,#6a2f8e,#43185e);border:5px solid #fff;border-radius:34px;padding:22px 34px;box-shadow:0 12px #1e082d8c,0 30px 60px #0006;text-align:center;min-width:460px;animation:popin .35s cubic-bezier(.2,1.6,.4,1)}.panel.wide{width:1060px}@keyframes popin{0%{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}.panel h2{margin:0;font-size:40px;font-weight:700;text-shadow:0 4px 0 rgba(0,0,0,.3)}.panel h2.big{font-size:58px;margin-bottom:8px}.panel h3{margin:12px 0 8px;font-size:24px;text-align:right;color:#ffe14d}.panel .col{display:flex;flex-direction:column;align-items:center}.panel .col .sg-btn{width:280px}.panel .row{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:10px}.panel .note{margin:12px 0 0;font-size:17px;opacity:.85}.phead{display:grid;grid-template-columns:200px 1fr 200px;align-items:center;margin-bottom:12px}.phead .sg-btn{justify-self:start;margin:0}.starcount{justify-self:end;font-size:28px;font-weight:700;color:#ffd21f;text-shadow:0 3px 0 rgba(0,0,0,.35)}.boxes{display:flex;gap:40px;justify-content:center;padding:10px 0 8px}.boxcard{width:400px;height:380px;border-radius:28px;border:5px solid #fff;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18px;font:inherit;color:#fff;box-shadow:0 8px #0000004d;transition:transform .1s}.boxcard:hover{transform:translateY(-4px) scale(1.03)}.boxcard.cardboard{background:linear-gradient(180deg,#f0c48a,#cf9656)}.boxcard.gift{background:linear-gradient(180deg,#ff9ccc,#ef4f9f)}.boxcard .art{position:absolute;top:34px;left:50%;width:220px;height:170px;transform:translate(-50%)}.boxcard .art .bx{position:absolute;left:0;right:0;bottom:0;height:130px;border-radius:12px;border:5px solid rgba(0,0,0,.45)}.boxcard.cardboard .bx{background:#c7843f}.boxcard.cardboard .bx:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:40px;transform:translate(-50%);background:#fff5d299}.boxcard.cardboard .lid{position:absolute;left:-10px;right:-10px;top:20px;height:34px;background:#d8995a;border-radius:8px;border:5px solid rgba(0,0,0,.45);transform:rotate(-6deg)}.boxcard.gift .bx{background:#3ec7ff}.boxcard.gift .bx:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:30px;transform:translate(-50%);background:#ffd21f}.boxcard.gift .lid{position:absolute;left:-10px;right:-10px;top:20px;height:34px;background:#25a9e6;border-radius:8px;border:5px solid rgba(0,0,0,.45);transform:rotate(5deg)}.boxcard.gift .lid:before,.boxcard.gift .lid:after{content:"";position:absolute;top:-40px;width:50px;height:40px;border:8px solid #ffd21f;border-radius:50% 50% 10px}.boxcard.gift .lid:before{left:50px;transform:rotate(-20deg)}.boxcard.gift .lid:after{right:50px;transform:scaleX(-1) rotate(-20deg)}.boxcard .bname{font-size:36px;font-weight:700;text-shadow:0 4px 0 rgba(0,0,0,.3)}.boxcard .bstars{font-size:26px;font-weight:700;color:#fff6b0;text-shadow:0 3px 0 rgba(0,0,0,.3)}.boxcard.locked{cursor:default;filter:saturate(.35) brightness(.8)}.boxcard.locked:hover{transform:none}.boxcard .lock{position:absolute;top:60px;left:50%;transform:translate(-50%);background:#1e0a28cc;border-radius:20px;padding:10px 18px;font-size:22px;font-weight:700;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(5,170px);gap:16px 22px;justify-content:center;padding:6px 0 10px}.lv{height:128px;border-radius:24px;border:4px solid #fff;background:#ffcc3d;color:#5a3500;font:inherit;font-size:50px;font-weight:700;cursor:pointer;box-shadow:0 7px #b37800;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .08s}.lv:hover{transform:translateY(-3px) scale(1.05)}.lv .ss{display:flex;gap:4px;margin-top:8px}.lv .ss i{width:26px;height:26px;background:#5a350040;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}.lv .ss i.on{background:#fff}.lv.done{background:#7ed957;color:#134d09;box-shadow:0 7px #3e8d24}.lv.done .ss i.on{background:#ffe14d}.lv.next{animation:pulse 1s ease-in-out infinite}.lv.locked{background:#8c7a9c;color:#d9cfe3;box-shadow:0 7px #5a4a6a;cursor:default;font-size:40px}.lv.locked:hover{transform:none}.picks{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-start}.pick{width:112px;height:132px;border-radius:20px;border:4px solid rgba(255,255,255,.4);background:#ffffff1f;cursor:pointer;font:inherit;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px 0}.pick canvas{width:96px;height:84px}.pick span{font-size:14px;font-weight:700;margin-top:2px;white-space:nowrap}.pick:hover{background:#ffffff38}.pick.sel{border-color:#ffe14d;background:#ffe14d40;box-shadow:0 0 0 4px #ffe14d59}.pick.locked{cursor:default;opacity:.6}.pick.locked span{color:#ffd21f}#sWin,#sFail{background:#280e3c4d}.panel.win{position:relative;padding-top:58px;min-width:560px;margin-left:-330px}.panel.fail{min-width:520px;margin-left:-330px}.ribbon{position:absolute;top:-48px;left:50%;transform:translate(-50%);white-space:nowrap;background:#ff4f7a;color:#fff;font-size:50px;font-weight:700;line-height:1.15;padding:0 46px 4px;border-radius:20px;border:5px solid #fff;box-shadow:0 8px #a3163f;text-shadow:0 4px 0 rgba(0,0,0,.25)}.bigstars{display:flex;justify-content:center;gap:14px;margin:10px 0 4px}.bigstars i{width:96px;height:96px;background:#0000004d;display:block;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}.bigstars i:nth-child(2){transform:translateY(-16px) scale(1.12)}.bigstars i.on{background:linear-gradient(180deg,#fff6a0,#ffc400 60%,#ff9d00);animation:starin .45s cubic-bezier(.2,1.8,.4,1) both}.bigstars i:nth-child(2).on{animation-name:starin2}@keyframes starin{0%{transform:scale(2.4) rotate(-40deg);opacity:0}to{transform:scale(1);opacity:1}}@keyframes starin2{0%{transform:translateY(-16px) scale(2.6) rotate(40deg);opacity:0}to{transform:translateY(-16px) scale(1.12);opacity:1}}.wlevel{font-size:22px;opacity:.9}.newbest{display:inline-block;margin-top:8px;background:#ffe14d;color:#6a3a00;font-weight:700;font-size:24px;padding:4px 18px;border-radius:16px;animation:pulse .7s infinite}.unlocks{display:flex;flex-direction:column;gap:6px;margin-top:8px}.unlocks div{background:#5ee04f40;border:3px solid #5ee04f;border-radius:16px;padding:6px 14px;font-size:20px;font-weight:700;animation:popin .4s both}.reason{font-size:24px;margin:0 0 8px}#toast{position:absolute;left:50%;top:12px;transform:translate(-50%);background:#ffe14d;color:#5a3500;z-index:5;font-size:26px;font-weight:700;padding:10px 26px;border-radius:22px;border:4px solid #fff;box-shadow:0 6px #00000040;animation:popin .35s cubic-bezier(.2,1.6,.4,1);white-space:nowrap}.panel.fail .row .sg-btn{padding:12px 20px;margin:4px}</style>

<body>
<canvas id="cv" tabindex="0"></canvas>

<div id="ui">
  <!-- in-game buttons -->
  <div id="hud" hidden>
    <button class="hb" id="bHint" type="button" aria-label="تلميح" title="تلميح (H)"><span class="bulb"></span></button>
    <button class="hb" id="bRestart" type="button" aria-label="إعادة" title="إعادة (R)"><span class="rst">&#x21bb;</span></button>
    <button class="hb" id="bPause" type="button" aria-label="إيقاف مؤقت" title="إيقاف مؤقت (P)"><span class="pz"></span><span class="pz"></span></button>
  </div>

  <!-- TITLE -->
  <section id="sTitle" class="scr pass">
    <div class="tleft">
      <h1 class="logo" aria-label="حبل الحلوى">
        <span class="w1"><b style="--c:#ffc21f;--d:0">حبل</b></span>
        <span class="w2"><b style="--c:#ff4f7a;--d:3">الحلوى</b></span>
      </h1>
      <button class="sg-btn big" id="tPlay" type="button">&#9654; العب</button>
      <div class="row">
        <button class="sg-btn secondary" id="tLevels" type="button">المراحل</button>
        <button class="sg-btn secondary" id="tStyle" type="button">الأزياء<em class="newdot" id="styleNew" hidden>جديد</em></button>
      </div>
      <div class="howto">
        <div><span class="sg-key">اسحب</span> بالفأرة عبر الحبل لتقطعه</div>
        <div><span class="sg-key">انقر</span> لتفرقع الفقاعات وتنفخ الهواء</div>
        <div><span class="sg-key">R</span> إعادة &nbsp;<span class="sg-key">P</span> إيقاف &nbsp;<span class="sg-key">H</span> تلميح</div>
      </div>
      <div class="progress" id="tProgress"></div>
    </div>
    <div class="ttry">جرّب أن تقطع هذا الحبل!</div>
  </section>

  <!-- BOXES -->
  <section id="sBoxes" class="scr dim" hidden>
    <div class="panel wide">
      <div class="phead">
        <button class="sg-btn secondary small" id="bxBack" type="button">&rarr; رجوع</button>
        <h2>اختر صندوقًا</h2>
        <div class="starcount" id="bxStars"></div>
      </div>
      <div class="boxes" id="bxList"></div>
    </div>
  </section>

  <!-- LEVELS -->
  <section id="sLevels" class="scr dim" hidden>
    <div class="panel wide">
      <div class="phead">
        <button class="sg-btn secondary small" id="lvBack" type="button">&rarr; الصناديق</button>
        <h2 id="lvTitle">الصندوق</h2>
        <div class="starcount" id="lvStars"></div>
      </div>
      <div class="grid" id="lvGrid"></div>
    </div>
  </section>

  <!-- STYLE -->
  <section id="sStyle" class="scr dim" hidden>
    <div class="panel wide">
      <div class="phead">
        <button class="sg-btn secondary small" id="stBack" type="button">&rarr; رجوع</button>
        <h2>الأزياء</h2>
        <div class="starcount" id="stStars"></div>
      </div>
      <h3>شكل الحلوى</h3>
      <div class="picks" id="stCandy"></div>
      <h3>قبعة قضّوم</h3>
      <div class="picks" id="stHat"></div>
      <p class="note">اجمع النجوم لتفتح المزيد!</p>
    </div>
  </section>

  <!-- PAUSE -->
  <section id="sPause" class="scr dim" hidden>
    <div class="panel">
      <h2 class="big">استراحة</h2>
      <div class="col">
        <button class="sg-btn good" id="pResume" type="button">&#9654; تابع</button>
        <button class="sg-btn secondary" id="pRestart" type="button">&#x21bb; أعد المرحلة <span class="sg-key">R</span></button>
        <button class="sg-btn secondary" id="pLevels" type="button">المراحل</button>
        <button class="sg-btn secondary" id="pMenu" type="button">القائمة الرئيسية</button>
      </div>
      <p class="note"><span class="sg-key">P</span> أو <span class="sg-key">Esc</span> للمتابعة</p>
    </div>
  </section>

  <!-- WIN -->
  <section id="sWin" class="scr" hidden>
    <div class="panel win">
      <div class="ribbon" id="wTitle">لذيذ!</div>
      <div class="bigstars" id="wStars"><i></i><i></i><i></i></div>
      <div class="wlevel" id="wLevel"></div>
      <div class="newbest" id="wBest" hidden>رقم قياسي جديد!</div>
      <div class="unlocks" id="wUnlocks"></div>
      <div class="row">
        <button class="sg-btn secondary" id="wLevels" type="button">المراحل</button>
        <button class="sg-btn secondary" id="wReplay" type="button">&#x21bb; مرة أخرى <span class="sg-key">R</span></button>
        <button class="sg-btn good" id="wNext" type="button">التالي &#9664; <span class="sg-key">Enter</span></button>
      </div>
    </div>
  </section>

  <!-- FAIL -->
  <section id="sFail" class="scr" hidden>
    <div class="panel fail">
      <h2 class="big" id="fTitle">يا خسارة!</h2>
      <p class="reason" id="fReason"></p>
      <div class="row">
        <button class="sg-btn secondary" id="fLevels" type="button">المراحل</button>
        <button class="sg-btn secondary" id="fHint" type="button">تلميح <span class="sg-key">H</span></button>
        <button class="sg-btn secondary" id="fSkip" type="button" hidden>تخطَّ المرحلة</button>
        <button class="sg-btn good" id="fRetry" type="button">&#x21bb; حاول مجددًا <span class="sg-key">R</span></button>
      </div>
    </div>
  </section>
