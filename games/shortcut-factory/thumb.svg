<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="60%" stop-color="#142459"/>
      <stop offset="100%" stop-color="#0d173b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffd740" stop-opacity="0.25"/>
    </linearGradient>
    <g id="cyberbot" stroke="#081026" stroke-width="5" stroke-linejoin="round">
      <!-- Jetpack & antenna -->
      <line x1="0" y1="-44" x2="0" y2="-60" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="-63" r="6" fill="#ffd740"/>
      <!-- Body -->
      <rect x="-26" y="-8" width="52" height="40" rx="13" fill="#29b6f6"/>
      <rect x="-16" y="0" width="32" height="22" rx="7" fill="#0d214f"/>
      <circle cx="0" cy="11" r="6" fill="#00e676" stroke="none"/>
      <!-- Shoulder pods -->
      <rect x="-38" y="-4" width="12" height="24" rx="5" fill="#ffd740"/>
      <rect x="26" y="-4" width="12" height="24" rx="5" fill="#ffd740"/>
      <!-- Head & glowing visor -->
      <rect x="-30" y="-44" width="60" height="38" rx="15" fill="#e1f5fe"/>
      <rect x="-22" y="-34" width="44" height="18" rx="8" fill="#0a1936"/>
      <rect x="-16" y="-29" width="12" height="8" rx="4" fill="#00e5ff" stroke="none"/>
      <rect x="4" y="-29" width="12" height="8" rx="4" fill="#00e5ff" stroke="none"/>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Sci-fi subtle grid -->
  <g stroke="#233b82" stroke-width="2" opacity="0.45">
    <line x1="0" y1="80" x2="400" y2="80"/><line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="280"/><line x1="200" y1="0" x2="200" y2="280"/><line x1="320" y1="0" x2="320" y2="280"/>
  </g>

  <!-- Holo-cloner laser beam -->
  <polygon points="86,195 314,155 314,235" fill="url(#beam)"/>

  <!-- Glowing Ctrl + C keycaps -->
  <g font-family="Fredoka, 'Segoe UI', Tahoma, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="34" y="30" width="146" height="86" rx="20" fill="#071029"/>
    <rect x="34" y="20" width="146" height="84" rx="20" fill="#ffd740" stroke="#081026" stroke-width="6"/>
    <text x="107" y="76" font-size="44" fill="#081026">Ctrl</text>

    <text x="210" y="78" font-size="52" fill="#00e5ff" stroke="#081026" stroke-width="7" paint-order="stroke">+</text>

    <rect x="240" y="30" width="126" height="86" rx="20" fill="#071029"/>
    <rect x="240" y="20" width="126" height="84" rx="20" fill="#00e5ff" stroke="#081026" stroke-width="6"/>
    <text x="303" y="76" font-size="46" fill="#081026">C</text>
  </g>

  <!-- Neon Conveyor Belt -->
  <rect x="-10" y="236" width="420" height="32" rx="14" fill="#182b63" stroke="#081026" stroke-width="6"/>
  <line x1="0" y1="242" x2="400" y2="242" stroke="#00e5ff" stroke-width="3"/>
  <g fill="#395bb5">
    <polygon points="20,246 38,246 28,262 10,262"/><polygon points="80,246 98,246 88,262 70,262"/>
    <polygon points="140,246 158,246 148,262 130,262"/><polygon points="200,246 218,246 208,262 190,262"/>
    <polygon points="260,246 278,246 268,262 250,262"/><polygon points="320,246 338,246 328,262 310,262"/>
    <polygon points="380,246 398,246 388,262 370,262"/>
  </g>

  <!-- Selected target reticle + Cyber-Bots -->
  <circle cx="296" cy="194" r="52" fill="#00e5ff" fill-opacity="0.22" stroke="#ffd740" stroke-width="5" stroke-dasharray="12 8"/>
  <use href="#cyberbot" transform="translate(296 204)"/>
  <g opacity="0.95">
    <circle cx="114" cy="194" r="46" fill="#00e676" fill-opacity="0.2" stroke="#00e5ff" stroke-width="4"/>
    <use href="#cyberbot" transform="translate(114 204) scale(0.92)"/>
  </g>

  <!-- Sparks -->
  <g fill="#ffd740" stroke="#081026" stroke-width="3" stroke-linejoin="round">
    <polygon points="204,132 210,146 224,150 210,156 204,170 198,156 184,150 198,146"/>
    <polygon points="50,140 54,150 64,153 54,157 50,167 46,157 36,153 46,150"/>
  </g>

  <!-- Bottom Banner & Arabic Title -->
  <rect x="0" y="274" width="400" height="126" fill="#091026"/>
  <line x1="0" y1="274" x2="400" y2="274" stroke="#00e5ff" stroke-width="4"/>
  <g font-family="Fredoka, 'Segoe UI', Tahoma, sans-serif" font-weight="700" text-anchor="middle" direction="rtl">
    <text x="200" y="324" font-size="48" fill="#ffffff" stroke="#081026" stroke-width="13" stroke-linejoin="round" paint-order="stroke">مصنع</text>
    <text x="200" y="382" font-size="60" fill="#ffd740" stroke="#081026" stroke-width="15" stroke-linejoin="round" paint-order="stroke">الاختصارات</text>
  </g>
</svg>
