<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b83f2"/>
      <stop offset="56%" stop-color="#b7f0e2"/>
      <stop offset="100%" stop-color="#8edbc8"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc33b"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b878"/>
      <stop offset="100%" stop-color="#b87e3c"/>
    </linearGradient>
  </defs>
  <!-- Bright factory backdrop -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <g fill="#5b579c" opacity="0.28">
    <rect x="24" y="110" width="90" height="106" rx="10"/>
    <rect x="286" y="110" width="90" height="106" rx="10"/>
  </g>
  <!-- Conveyor belt -->
  <rect x="0" y="246" width="318" height="46" rx="12" fill="#3b4566" stroke="#1e2340" stroke-width="7"/>
  <rect x="0" y="280" width="318" height="14" rx="6" fill="#ff9824" stroke="#1e2340" stroke-width="5"/>
  <g fill="none" stroke="#63709c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 256 L50 264 L36 272"/>
    <path d="M96 256 L110 264 L96 272"/>
    <path d="M156 256 L170 264 L156 272"/>
    <path d="M216 256 L230 264 L216 272"/>
  </g>
  <!-- Cute robot arm -->
  <g>
    <rect x="148" y="198" width="44" height="48" rx="12" fill="#4c5d99" stroke="#1e2340" stroke-width="6"/>
    <rect x="134" y="140" width="72" height="58" rx="22" fill="url(#arm)" stroke="#1e2340" stroke-width="6"/>
    <rect x="148" y="152" width="44" height="24" rx="10" fill="#1e2340"/>
    <circle cx="161" cy="164" r="6" fill="#5cebff"/><circle cx="179" cy="164" r="6" fill="#5cebff"/>
    <circle cx="159" cy="162" r="2" fill="#fff"/><circle cx="177" cy="162" r="2" fill="#fff"/>
    <path d="M162 185 Q170 191 178 185" fill="none" stroke="#1e2340" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- Yellow rubber duck toy on belt -->
  <g transform="translate(114 226)">
    <ellipse cx="0" cy="10" rx="30" ry="20" fill="#ffd93b" stroke="#1e2340" stroke-width="6"/>
    <circle cx="16" cy="-12" r="18" fill="#ffd93b" stroke="#1e2340" stroke-width="6"/>
    <path d="M30 -14 L44 -9 L30 -4 Z" fill="#ff7a1a" stroke="#1e2340" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="21" cy="-15" r="3.5" fill="#1e2340"/>
    <circle cx="20" cy="-16.5" r="1.2" fill="#fff"/>
  </g>
  <!-- Hologram copy duck floating -->
  <g transform="translate(226 218)" opacity="0.92">
    <circle r="34" fill="#5cebff" fill-opacity="0.28" stroke="#36d1ff" stroke-width="4" stroke-dasharray="7 5"/>
    <ellipse cx="-2" cy="8" rx="20" ry="13" fill="#ffe45e" stroke="#1e2340" stroke-width="4"/>
    <circle cx="9" cy="-7" r="12" fill="#ffe45e" stroke="#1e2340" stroke-width="4"/>
    <path d="M18 -8 L28 -5 L18 -2 Z" fill="#ff7a1a" stroke="#1e2340" stroke-width="3"/>
  </g>
  <!-- Delivery cardboard box -->
  <g transform="translate(292 224)">
    <rect x="0" y="20" width="90" height="72" rx="10" fill="url(#box)" stroke="#1e2340" stroke-width="6"/>
    <polygon points="0,20 -14,2 34,2 44,20" fill="#f3c98d" stroke="#1e2340" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="90,20 104,2 56,2 46,20" fill="#f3c98d" stroke="#1e2340" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="45" cy="56" r="18" fill="#28c76f" stroke="#1e2340" stroke-width="4"/>
    <path d="M36 56 L43 63 L55 49" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Chunky keycaps Ctrl + C / V -->
  <g transform="translate(64 316)">
    <rect x="0" y="0" width="92" height="58" rx="14" fill="#ffffff" stroke="#1e2340" stroke-width="6"/>
    <rect x="5" y="44" width="82" height="10" rx="5" fill="#d9e2f5"/>
    <text x="46" y="38" text-anchor="middle" font-family="Fredoka, Tahoma, sans-serif" font-size="28" font-weight="700" fill="#1e2340">Ctrl</text>
    <text x="114" y="40" text-anchor="middle" font-family="Fredoka, Tahoma, sans-serif" font-size="34" font-weight="700" fill="#1e2340">+</text>
    <rect x="136" y="0" width="60" height="58" rx="14" fill="#ffd23f" stroke="#1e2340" stroke-width="6"/>
    <text x="166" y="39" text-anchor="middle" font-family="Fredoka, Tahoma, sans-serif" font-size="30" font-weight="700" fill="#1e2340">C</text>
    <rect x="210" y="0" width="60" height="58" rx="14" fill="#46e08b" stroke="#1e2340" stroke-width="6"/>
    <text x="240" y="39" text-anchor="middle" font-family="Fredoka, Tahoma, sans-serif" font-size="30" font-weight="700" fill="#1e2340">V</text>
  </g>
  <!-- Bold Arabic title -->
  <text x="200" y="54" text-anchor="middle" direction="rtl" font-family="Fredoka, 'Baloo Bhaijaan 2', Tahoma, sans-serif" font-size="36" font-weight="700" fill="#ffffff" stroke="#1e2340" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill">مصنع</text>
  <text x="200" y="106" text-anchor="middle" direction="rtl" font-family="Fredoka, 'Baloo Bhaijaan 2', Tahoma, sans-serif" font-size="56" font-weight="700" fill="#ffd23f" stroke="#1e2340" stroke-width="12" stroke-linejoin="round" paint-order="stroke fill">الاختصارات</text>
</svg>
