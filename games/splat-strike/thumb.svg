  <g font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="bold" text-anchor="middle" direction="rtl" stroke="#1b1f4b" stroke-linejoin="round" paint-order="stroke" transform="rotate(-5 200 60)">
