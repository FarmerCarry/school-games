<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوّن الأرض</title>
<style>@font-face{font-family:Fredoka;src:url(../../shared/fonts/fredoka-latin-500-normal.woff2) format("woff2");font-weight:400 500;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-200B,U+2010-206F,U+20AC,U+2122,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:Fredoka;src:url(../../shared/fonts/fredoka-latin-700-normal.woff2) format("woff2");font-weight:600 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-200B,U+2010-206F,U+20AC,U+2122,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:Fredoka;src:url(../../shared/fonts/baloo-bhaijaan-2-arabic-500-normal.woff2) format("woff2");font-weight:400 500;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200F,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}@font-face{font-family:Fredoka;src:url(../../shared/fonts/baloo-bhaijaan-2-arabic-700-normal.woff2) format("woff2");font-weight:600 900;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200F,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}:root{--sg-font: "Fredoka", "Segoe UI", Tahoma, "Trebuchet MS", system-ui, sans-serif;--sg-bg: #10142b;--sg-panel: rgba(16, 20, 43, .88);--sg-text: #ffffff;--sg-accent: #ffcc00;--sg-accent-ink: #3a2a00;--sg-good: #3ddc84;--sg-bad: #ff5a5f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sg-bg);color:var(--sg-text);font-family:var(--sg-font);font-weight:500;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}canvas{display:block;outline:none}.sg-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080a188c;z-index:10}.sg-overlay[hidden]{display:none}.sg-panel{background:var(--sg-panel);border:3px solid rgba(255,255,255,.15);border-radius:24px;padding:28px 36px;min-width:320px;max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 60px #00000073;animation:sg-pop .25s ease-out}.sg-title{margin:0 0 8px;font-size:clamp(32px,6vw,56px);font-weight:700;line-height:1.05;letter-spacing:.5px;text-shadow:0 4px 0 rgba(0,0,0,.35)}.sg-sub{margin:0 0 18px;font-size:18px;opacity:.85}.sg-btn{display:inline-block;font:inherit;font-weight:700;font-size:22px;color:var(--sg-accent-ink);background:var(--sg-accent);border:none;border-radius:999px;padding:12px 34px;margin:6px;cursor:pointer;box-shadow:0 5px #00000059;transition:transform .08s ease,filter .08s ease}.sg-btn:hover{transform:translateY(-2px) scale(1.04);filter:brightness(1.08)}.sg-btn:active{transform:translateY(3px);box-shadow:0 2px #00000059}.sg-btn.secondary{background:#fff;color:#1d2340}.sg-btn.good{background:var(--sg-good);color:#07351c}.sg-key{display:inline-block;min-width:30px;padding:2px 8px;direction:ltr;unicode-bidi:isolate;margin:0 2px;border-radius:7px;background:#fff;color:#1d2340;font-weight:700;font-size:16px;box-shadow:0 3px #9aa3c7;text-align:center}.sg-howto{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;text-align:start;margin:14px auto 18px;max-width:420px;font-size:17px}.sg-mute{position:fixed;top:10px;right:10px;left:auto;z-index:20;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:#00000059;color:#fff;font-size:20px;line-height:1;cursor:pointer}.sg-mute:hover{background:#0000008c}.sg-hud{position:fixed;top:10px;left:14px;z-index:5;font-size:26px;font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.4);pointer-events:none}@keyframes sg-pop{0%{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}</style>
<style>
  :root { --ink: #2b2350; }
  body { background: #cfeee0; }
  #ui { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; pointer-events: none; z-index: 10; }
  .scr { position: absolute; inset: 0; pointer-events: none; }
  .scr > * { pointer-events: auto; }
  .scr[hidden] { display: none; }
  button { font-family: var(--sg-font); }
  .card { background: #fcfbff; color: var(--ink); border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 rgba(43,35,80,0.55); }
  .stroke { -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; }
  .sg-key { border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-size: 17px; }
  svg.st { width: 1em; height: 1em; vertical-align: -0.12em; }
  svg.st path { fill: #d7d2e6; stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; }
  svg.st.on path { fill: #ffcf33; }
  @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -8px; } }
  @keyframes pulse { 0%,100% { scale: 1; } 50% { scale: 1.05; } }
  @keyframes popIn { 0% { scale: 0.3; opacity: 0; } 70% { scale: 1.12; opacity: 1; } 100% { scale: 1; } }
  @keyframes wig { 0%,100% { rotate: -3deg; } 50% { rotate: 3deg; } }

  /* ---------- title ---------- */
  #scr-title .dim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.0) 0%, rgba(43,35,80,0.10) 55%, rgba(43,35,80,0.35) 100%); pointer-events: none; }
  .logo { position: absolute; left: 0; right: 0; top: 6px; text-align: center; font-weight: 700; line-height: 1; pointer-events: none; white-space: nowrap; }
  .logo span { display: inline-block; font-size: 110px; -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--ink); animation: bob 1.8s ease-in-out infinite; }
  .logo .w1 { color: #ff6fae; rotate: 4deg; }
  .logo .w2 { color: #ffcf33; rotate: -3deg; margin-right: 16px; animation-delay: 0.3s; }
  .tag { position: absolute; left: 0; right: 0; top: 138px; text-align: center; font-size: 25px; font-weight: 700; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; pointer-events: none; }
  #arenas { position: absolute; left: 60px; right: 60px; top: 200px; display: flex; justify-content: center; gap: 14px; }
  .arena { position: relative; width: 214px; height: 206px; border: 5px solid var(--ink); border-radius: 24px; background: var(--bg); color: var(--ink); cursor: pointer; padding: 6px 8px; box-shadow: 0 7px 0 var(--ink); transition: transform 0.1s; text-align: center; }
  .arena:hover { transform: translateY(-4px); }
  .arena.sel { transform: translateY(-8px) scale(1.05); box-shadow: 0 7px 0 var(--ink), 0 0 0 5px #fff, 0 0 0 10px var(--ink); z-index: 2; }
  .arena .anum { z-index: 3; position: absolute; top: -14px; right: -12px; width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 4px solid var(--ink); font-size: 22px; font-weight: 700; line-height: 32px; }
  .arena canvas { display: block; width: 180px; height: 92px; margin: 4px auto 0; border-radius: 14px; border: 3px solid var(--ink); background: #fff; }
  .arena .aname { font-size: 23px; font-weight: 700; margin-top: 2px; white-space: nowrap; }
  .arena .astars { font-size: 28px; line-height: 1; }
  .arena .alock { position: absolute; inset: -1px; border-radius: 19px; background: #3a3068; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; padding: 10px; line-height: 1.3; }
  .arena .alock svg { width: 46px; height: 46px; margin-bottom: 6px; }
  .arena.locked { cursor: default; }
  .arena.shake { animation: shk 0.35s; }
  @keyframes shk { 25% { translate: -8px 0; } 75% { translate: 8px 0; } }
  .trow { position: absolute; left: 0; right: 0; top: 432px; display: flex; justify-content: center; align-items: center; gap: 26px; }
  #bPlay { font-weight: 700; font-size: 64px; line-height: 1; padding: 10px 70px 20px; border: 6px solid var(--ink); border-radius: 40px; background: #3ddc84; color: #fff; -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; cursor: pointer; box-shadow: 0 9px 0 var(--ink); animation: pulse 1.2s ease-in-out infinite; }
  #bPlay small { display: block; font-size: 18px; -webkit-text-stroke: 0; color: var(--ink); opacity: 0.75; margin-top: 4px; }
  #bPlay:hover { filter: brightness(1.07); }
  #bPlay:active, #bSkins:active { translate: 0 5px; box-shadow: 0 3px 0 var(--ink); }
  #bSkins { position: relative; width: 190px; height: 118px; border: 5px solid var(--ink); border-radius: 26px; background: #ffcf33; color: var(--ink); font-size: 24px; font-weight: 700; cursor: pointer; box-shadow: 0 7px 0 var(--ink); padding: 0; }
  #bSkins canvas { width: 76px; height: 76px; display: block; margin: 2px auto -4px; }
  #bSkins:hover { filter: brightness(1.06); }
  .badge { position: absolute; top: -12px; left: -12px; background: #ff5b6e; color: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 0 8px; font-size: 16px; font-weight: 700; animation: pulse 0.8s infinite; }
  .badge[hidden] { display: none; }
  #statBox { width: 190px; height: 118px; padding: 8px 10px; font-size: 17px; font-weight: 700; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  #statBox .big { font-size: 30px; color: #ff4f9a; line-height: 1.05; }
  #statBox .lbl { font-size: 14px; opacity: 0.7; }
  #statBox .row2 { display: flex; justify-content: center; gap: 14px; font-size: 18px; }
  #statBox .row2 span { display: inline-flex; align-items: center; gap: 4px; }
  #statBox .row2 svg.st { width: 20px; height: 20px; }
  #howto { position: absolute; left: 150px; right: 150px; top: 588px; padding: 10px 20px 12px; font-size: 18px; font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
  #howto .r1 { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; }
  #howto .r2 { text-align: center; font-size: 17px; color: #6b4bb8; }

  /* ---------- skins ---------- */
  #scr-skins { background: rgba(43,35,80,0.5); }
  #skPanel { position: absolute; left: 90px; right: 90px; top: 34px; bottom: 34px; padding: 18px 26px; display: flex; gap: 22px; }
  #skLeft { width: 300px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  #skLeft h2 { margin: 0; font-size: 44px; color: #ff6fae; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; }
  #skPrev { width: 260px; height: 260px; border-radius: 26px; border: 4px solid var(--ink); background: #f4f0ff; margin-top: 8px; }
  #skName { font-size: 22px; font-weight: 700; margin-top: 8px; min-height: 30px; }
  #skDone { margin-top: auto; font-size: 32px; font-weight: 700; padding: 6px 40px 10px; border: 5px solid var(--ink); border-radius: 26px; background: #3ddc84; color: var(--ink); box-shadow: 0 6px 0 var(--ink); cursor: pointer; }
  #skDone:hover { filter: brightness(1.07); }
  #skRight { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .tabs { display: flex; gap: 10px; }
  .tab { font-size: 24px; font-weight: 700; padding: 4px 24px 8px; border: 4px solid var(--ink); border-radius: 18px; background: #eee9fa; color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
  .tab.on { background: #ffcf33; translate: 0 -3px; }
  #skGrid { flex: 1; margin-top: 14px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-content: start; }
  .it { position: relative; aspect-ratio: 1; border: 4px solid var(--ink); border-radius: 18px; background: #f4f0ff; cursor: pointer; padding: 0; box-shadow: 0 4px 0 var(--ink); }
  .it canvas { width: 100%; height: 100%; display: block; border-radius: 13px; }
  .it.on { outline: 5px solid #3ddc84; outline-offset: 2px; }
  .it.locked canvas { opacity: 0.35; filter: grayscale(0.7); }
  .it .lk { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .it .lk svg { width: 40%; height: 40%; }
  .it .nw { position: absolute; top: -10px; left: -8px; background: #ff5b6e; color: #fff; border: 3px solid var(--ink); border-radius: 10px; font-size: 13px; font-weight: 700; padding: 0 6px; }
  #skInfo { min-height: 46px; font-size: 20px; font-weight: 700; text-align: center; padding: 8px; border-radius: 16px; background: #f4f0ff; border: 3px dashed #b9aee0; }

  /* ---------- pause ---------- */
  #scr-pause { background: rgba(43,35,80,0.55); display: flex; align-items: center; justify-content: center; }
  #scr-pause[hidden] { display: none; }
  .ppanel { padding: 22px 44px 28px; text-align: center; min-width: 440px; }
  .ppanel h2 { margin: 0 0 8px; font-size: 64px; color: #ffcf33; -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; }
  .col { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .pbtn { font-weight: 700; font-size: 28px; cursor: pointer; border: 5px solid var(--ink); border-radius: 24px; padding: 4px 20px 8px; min-width: 300px; color: var(--ink); box-shadow: 0 6px 0 var(--ink); background: #fff; }
  .pbtn.g { background: #3ddc84; } .pbtn.y { background: #ffcf33; }
  .pbtn:hover { filter: brightness(1.06); translate: 0 -2px; }
  .pbtn:active { translate: 0 4px; box-shadow: 0 2px 0 var(--ink); }
  .pbtn small { font-size: 16px; opacity: 0.65; }

  /* ---------- game over ---------- */
  #oPanel { position: absolute; right: 36px; top: 26px; width: 560px; padding: 14px 26px 20px; text-align: center; }
  #oHead { margin: 0; font-size: 62px; line-height: 1.1; -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; color: #ffcf33; }
  #oWhy { font-size: 21px; font-weight: 700; margin: 2px 0 4px; min-height: 28px; }
  .obig { display: flex; justify-content: center; align-items: stretch; gap: 14px; margin: 4px 0; }
  .obox { flex: 1; background: #f4f0ff; border: 3px solid var(--ink); border-radius: 18px; padding: 4px 6px 6px; }
  .obox .lbl { font-size: 15px; font-weight: 700; opacity: 0.7; }
  .obox .val { font-size: 42px; font-weight: 700; line-height: 1.05; direction: ltr; }
  #oPct { color: #ff4f9a; }
  #oRank { color: #6b4bb8; }
  #oKills { color: #ff8a3d; }
  #oBest { font-size: 20px; font-weight: 700; margin: 6px 0 2px; min-height: 28px; }
  #oBest.nb { color: #fff; background: #ff5b6e; border: 3px solid var(--ink); border-radius: 16px; display: inline-block; padding: 0 16px; animation: popIn 0.5s ease-out both 0.8s, wig 0.6s ease-in-out infinite 1.3s; }
  #oStars { display: flex; justify-content: center; gap: 12px; margin: 6px 0 2px; }
  .ostar { width: 150px; background: #fff; border: 3px solid #d7d2e6; border-radius: 16px; padding: 2px 4px 4px; font-size: 14px; font-weight: 700; line-height: 1.2; }
  .ostar svg { width: 48px; height: 48px; display: block; margin: 0 auto; }
  .ostar.got svg { animation: popIn 0.5s ease-out both; }
  .ostar.got { border-color: #ffcf33; background: #fffbe6; }
  #oClose { font-size: 18px; font-weight: 700; color: #d61f5a; min-height: 24px; margin: 4px 0; }
  #oUnlocks { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 4px 0 8px; }
  .unl { display: flex; align-items: center; gap: 6px; background: #ffe45c; border: 3px solid var(--ink); border-radius: 16px; padding: 2px 10px 2px 4px; font-size: 17px; font-weight: 700; animation: popIn 0.5s ease-out both; }
  .unl canvas { width: 40px; height: 40px; }
  .obtns { display: flex; justify-content: center; gap: 14px; margin-top: 6px; }
  #bAgain { font-size: 34px; min-width: 280px; animation: pulse 1.1s ease-in-out infinite; }
  #bOverMenu { min-width: 160px; }

  .pg-btn { right: 62px; font-weight: 700; font-family: var(--sg-font); font-size: 17px; }
  .pg-btn[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>

<div id="ui">
  <!-- TITLE -->
  <div id="scr-title" class="scr" hidden>
    <div class="dim"></div>
    <div class="logo"><span class="w1">لوّن</span><span class="w2">الأرض</span></div>
    <div class="tag">اخرج من أرضك، ارسم دائرة، ولوّن كل ما بداخلها!</div>
    <div id="arenas"></div>
    <div class="trow">
      <div id="statBox" class="card"></div>
      <button id="bPlay" type="button">العب!<small><span dir="ltr"><span class="sg-key">Enter</span></span></small></button>
      <button id="bSkins" type="button"><canvas id="skinBtnCv" width="152" height="152"></canvas>الأزياء<span class="badge" id="skBadge" hidden>جديد!</span></button>
    </div>
    <div id="howto" class="card">
      <div class="r1">
        <span><span dir="ltr"><span class="sg-key">←</span><span class="sg-key">↑</span><span class="sg-key">→</span><span class="sg-key">↓</span></span> أو <span dir="ltr"><span class="sg-key">W</span><span class="sg-key">A</span><span class="sg-key">S</span><span class="sg-key">D</span></span> توجيه</span>
        <span><span class="sg-key">الفأرة</span> اتبع المؤشر</span>
        <span><span class="sg-key">P</span> إيقاف</span>
      </div>
      <div class="r2">عُد إلى أرضك لتلوين المساحة. إذا لمس أحد خطّك تخسر... واقطع خطوط الروبوتات لتقصيها!</div>
    </div>
  </div>

  <!-- SKINS -->
  <div id="scr-skins" class="scr" hidden>
    <div id="skPanel" class="card">
      <div id="skLeft">
        <h2>الأزياء</h2>
        <canvas id="skPrev" width="520" height="520"></canvas>
        <div id="skName"></div>
        <button id="skDone" type="button">تم! <small style="font-size:16px;opacity:.6"><span dir="ltr">Esc</span></small></button>
      </div>
      <div id="skRight">
        <div class="tabs">
          <button class="tab on" data-tab="c" type="button">الألوان</button>
          <button class="tab" data-tab="f" type="button">الوجوه</button>
          <button class="tab" data-tab="p" type="button">النقوش</button>
        </div>
        <div id="skGrid"></div>
        <div id="skInfo"></div>
      </div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="scr-pause" class="scr" hidden>
    <div class="card ppanel">
      <h2>استراحة</h2>
      <div class="col">
        <button class="pbtn g" id="bResume" type="button">متابعة <small dir="ltr">P / Esc</small></button>
        <button class="pbtn y" id="bRestart" type="button">جولة جديدة <small dir="ltr">R</small></button>
        <button class="pbtn" id="bMenu" type="button">القائمة</button>
      </div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="scr-over" class="scr" hidden>
    <div id="oPanel" class="card">
      <h2 id="oHead">انتهت الجولة!</h2>
      <div id="oWhy"></div>
      <div class="obig">
        <div class="obox"><div class="lbl">أكبر مساحة</div><div class="val" id="oPct">0%</div></div>
        <div class="obox"><div class="lbl">المركز</div><div class="val" id="oRank">#1</div></div>
        <div class="obox"><div class="lbl">روبوتات أقصيتها</div><div class="val" id="oKills">0</div></div>
      </div>
      <div id="oBest"></div>
      <div id="oStars"></div>
      <div id="oClose"></div>
      <div id="oUnlocks"></div>
      <div class="obtns">
        <button class="pbtn g" id="bAgain" type="button">العب مجدداً <small dir="ltr">Enter</small></button>
        <button class="pbtn" id="bOverMenu" type="button">القائمة <small dir="ltr">Esc</small></button>
      </div>
    </div>
  </div>
