<path d="M-50 0 C-50 -56 50 -56 50 0 C50 46 -50 46 -50 0Z" fill="#ff6fae" stroke="#8a1f55" stroke-width="7"/>
<ellipse cx="-24" cy="-26" rx="11" ry="7" fill="#fff" opacity=".6" transform="rotate(-30 -24 -26)"/>
<ellipse cx="-17" cy="-6" rx="13" ry="14" fill="#fff" stroke="#2b2350" stroke-width="4"/>
<ellipse cx="17" cy="-6" rx="13" ry="14" fill="#fff" stroke="#2b2350" stroke-width="4"/>
<circle cx="-12" cy="-4" r="7" fill="#2b2350"/><circle cx="22" cy="-4" r="7" fill="#2b2350"/>
