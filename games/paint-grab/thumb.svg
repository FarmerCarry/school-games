<ellipse cx="0" cy="12" rx="7" ry="8" fill="#8a2446" stroke="#2b2350" stroke-width="3"/>
</g>
<g fill="#ffcf33" stroke="#2b2350" stroke-width="3" stroke-linejoin="round">
