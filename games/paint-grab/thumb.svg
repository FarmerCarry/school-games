<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#f2fff8"/><rect width="20" height="20" fill="#dff6ea"/><rect x="20" y="20" width="20" height="20" fill="#dff6ea"/></pattern>
<pattern id="chk" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#ff6fae"/><rect width="10" height="10" fill="#ff8fc1"/><rect x="10" y="10" width="10" height="10" fill="#ff8fc1"/></pattern>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="400" fill="url(#grid)"/>
