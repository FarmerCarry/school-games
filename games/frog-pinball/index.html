<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بينبول الضفدع</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <symbol id="i-play" viewBox="0 0 64 64"><path d="M22 11 Q18 9 18 14 L18 50 Q18 55 22 53 L52 35 Q56 32 52 29 Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 64 64"><rect x="15" y="12" width="12" height="40" rx="5"/><rect x="37" y="12" width="12" height="40" rx="5"/></symbol>
  <symbol id="i-again" viewBox="0 0 64 64"><path d="M50 30 A19 19 0 1 1 41 15" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><path d="M33 4 L52 13 L37 27 Z"/></symbol>
  <symbol id="i-home" viewBox="0 0 64 64"><path d="M8 32 L32 10 L56 32 L49 32 L49 54 L37 54 L37 40 L27 40 L27 54 L15 54 L15 32 Z"/></symbol>
  <symbol id="i-next" viewBox="0 0 64 64"><path d="M14 12 L40 32 L14 52 Z M36 12 L58 32 L36 52 Z"/></symbol>
  <symbol id="i-map" viewBox="0 0 64 64"><circle cx="16" cy="46" r="8"/><circle cx="34" cy="26" r="8"/><circle cx="52" cy="14" r="7"/><path d="M16 46 L34 26 L52 14" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 8"/></symbol>
  <symbol id="i-shop" viewBox="0 0 64 64"><path d="M10 22 L54 22 L50 54 L14 54 Z"/><path d="M22 24 L22 18 A10 10 0 0 1 42 18 L42 24" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 4 L40 23 L60 24 L44 37 L50 58 L32 46 L14 58 L20 37 L4 24 L24 23 Z" fill="#ffd93d" stroke="#123536" stroke-width="4" stroke-linejoin="round"/></symbol>
  <symbol id="i-star0" viewBox="0 0 64 64"><path d="M32 4 L40 23 L60 24 L44 37 L50 58 L32 46 L14 58 L20 37 L4 24 L24 23 Z" fill="#d8e6e2" stroke="#123536" stroke-width="4" stroke-linejoin="round" opacity="0.7"/></symbol>
  <symbol id="i-lock" viewBox="0 0 64 64"><rect x="14" y="28" width="36" height="28" rx="6" fill="#123536"/><path d="M22 30 L22 22 A10 10 0 0 1 42 22 L42 30" fill="none" stroke="#123536" stroke-width="7"/></symbol>
  <symbol id="i-frog" viewBox="0 0 64 64"><ellipse cx="32" cy="38" rx="27" ry="20" fill="#63d35a" stroke="#123536" stroke-width="4"/><circle cx="19" cy="20" r="10" fill="#63d35a" stroke="#123536" stroke-width="4"/><circle cx="45" cy="20" r="10" fill="#63d35a" stroke="#123536" stroke-width="4"/><circle cx="19" cy="20" r="5" fill="#fff"/><circle cx="45" cy="20" r="5" fill="#fff"/><circle cx="20" cy="21" r="2.6" fill="#123536"/><circle cx="46" cy="21" r="2.6" fill="#123536"/><path d="M14 40 Q32 54 50 40" fill="none" stroke="#123536" stroke-width="4" stroke-linecap="round"/></symbol>
  <symbol id="i-duck" viewBox="0 0 64 64"><ellipse cx="36" cy="42" rx="22" ry="14" fill="#ffd93d" stroke="#123536" stroke-width="4"/><circle cx="24" cy="24" r="12" fill="#ffd93d" stroke="#123536" stroke-width="4"/><ellipse cx="11" cy="28" rx="8" ry="4.5" fill="#ff8a2e" stroke="#123536" stroke-width="3"/><circle cx="23" cy="21" r="3" fill="#123536"/></symbol>
  <symbol id="i-bump" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="#63d062" stroke="#123536" stroke-width="4"/><circle cx="32" cy="34" r="12" fill="#ff8cc6" stroke="#123536" stroke-width="4"/><circle cx="24" cy="22" r="7" fill="#fff" stroke="#123536" stroke-width="3"/><circle cx="40" cy="22" r="6" fill="#fff" stroke="#123536" stroke-width="3"/><circle cx="25" cy="23" r="3" fill="#123536"/><circle cx="41" cy="23" r="2.6" fill="#123536"/></symbol>
  <symbol id="i-coin" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#ffd93d" stroke="#123536" stroke-width="4"/><circle cx="32" cy="32" r="17" fill="none" stroke="#e0a800" stroke-width="4"/><path d="M32 20 L32 44 M24 26 L40 26 M24 38 L40 38" stroke="#123536" stroke-width="4" stroke-linecap="round"/></symbol>
  <symbol id="i-orbit" viewBox="0 0 64 64"><path d="M12 52 L12 26 A20 18 0 0 1 52 26 L52 52" fill="none" stroke="#4fd8ff" stroke-width="9" stroke-linecap="round"/><path d="M12 52 L12 26 A20 18 0 0 1 52 26 L52 52" fill="none" stroke="#123536" stroke-width="3" stroke-linecap="round"/><path d="M42 44 L52 58 L62 44 Z" fill="#123536"/></symbol>
  <symbol id="i-mult" viewBox="0 0 64 64"><path d="M32 3 L39 18 L56 12 L50 29 L62 38 L46 44 L48 61 L32 52 L16 61 L18 44 L2 38 L14 29 L8 12 L25 18 Z" fill="#ffd93d" stroke="#123536" stroke-width="4" stroke-linejoin="round"/><text x="32" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#123536" font-family="Fredoka, sans-serif">×3</text></symbol>
  <symbol id="i-rain" viewBox="0 0 64 64"><circle cx="18" cy="16" r="9" fill="#c9d4e3" stroke="#123536" stroke-width="3.5"/><circle cx="44" cy="22" r="9" fill="#c9d4e3" stroke="#123536" stroke-width="3.5"/><circle cx="28" cy="44" r="9" fill="#c9d4e3" stroke="#123536" stroke-width="3.5"/><circle cx="50" cy="50" r="7" fill="#c9d4e3" stroke="#123536" stroke-width="3.5"/></symbol>
  <symbol id="i-free" viewBox="0 0 64 64"><path d="M6 32 Q18 10 32 32 Q46 54 58 32 Q46 10 32 32 Q18 54 6 32 Z" fill="none" stroke="#123536" stroke-width="7" stroke-linejoin="round"/><path d="M6 32 Q18 10 32 32 Q46 54 58 32 Q46 10 32 32 Q18 54 6 32 Z" fill="none" stroke="#4fd8ff" stroke-width="3" stroke-linejoin="round"/></symbol>
</svg>

<canvas id="game" tabindex="0" aria-label="بينبول الضفدع"></canvas>

<div id="ui">
  <div id="hud" hidden>
    <button type="button" id="btnPause" class="fp-btn fp-round" aria-label="استراحة" title="استراحة (P / Esc)"><svg aria-hidden="true"><use href="#i-pause"/></svg></button>
  </div>

  <section id="scrTitle" class="screen" aria-label="بينبول الضفدع">
    <h1 class="logo"><span class="l1">بينبول</span><span class="l2">الضفدع</span></h1>
    <div class="howto">
      <span><span dir="ltr"><span class="sg-key">←</span> <span class="sg-key">→</span></span> اضرب الكرة</span>
      <span><span class="sg-key">مسافة</span> أطلق الكرة</span>
      <span><span class="sg-key wide">الفأرة</span> الزرّان يضربان أيضًا</span>
    </div>
    <div class="title-side">
      <button type="button" id="btnPlay" class="fp-btn fp-play ring" aria-label="العب"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
      <div class="title-chips">
        <span class="chip" id="titleLevel"><small>المرحلة</small><b>1</b></span>
        <span class="chip" id="titleStars"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></span>
      </div>
      <div class="title-btns">
        <button type="button" id="btnLevels" class="fp-btn fp-wide" aria-label="المراحل"><svg aria-hidden="true"><use href="#i-map"/></svg><span>المراحل</span></button>
        <button type="button" id="btnShop" class="fp-btn fp-wide shop" aria-label="المتجر"><svg aria-hidden="true"><use href="#i-shop"/></svg><span>المتجر</span><i class="dot" id="shopDot" hidden></i></button>
      </div>
    </div>
  </section>

  <section id="scrPause" class="screen dim" aria-label="استراحة" hidden>
    <div class="card">
      <h2>استراحة</h2>
      <button type="button" id="btnResume" class="fp-btn fp-go" aria-label="تابع"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
      <div class="row">
        <button type="button" id="btnHome" class="fp-btn fp-round big" aria-label="البداية"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
        <button type="button" id="btnRestart" class="fp-btn fp-round big" aria-label="أعد المرحلة"><svg aria-hidden="true"><use href="#i-again"/></svg></button>
      </div>
    </div>
  </section>

  <section id="scrResult" class="screen dim" aria-label="النتيجة" hidden>
    <div class="card result-card">
      <h2 id="resTitle">أحسنت!</h2>
      <div class="stars" id="resStars"><svg><use href="#i-star0"/></svg><svg><use href="#i-star0"/></svg><svg><use href="#i-star0"/></svg></div>
      <div class="res-score"><small>النقاط</small><b id="resScore">0</b></div>
      <div class="res-new" id="resNew" hidden>رقم قياسي جديد!</div>
      <div class="res-best" id="resBest"></div>
      <div class="res-unlock" id="resUnlock" hidden>جديد في المتجر!</div>
      <div class="row">
        <button type="button" id="btnMenu" class="fp-btn fp-round big" aria-label="القائمة"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
        <button type="button" id="btnAgain" class="fp-btn fp-round big" aria-label="مرة أخرى"><svg aria-hidden="true"><use href="#i-again"/></svg></button>
        <button type="button" id="btnNext" class="fp-btn fp-go" aria-label="المرحلة التالية"><svg aria-hidden="true"><use href="#i-next"/></svg></button>
      </div>
    </div>
  </section>

  <section id="scrLevels" class="screen dim" aria-label="المراحل" hidden>
    <div class="card levels-card">
      <div class="card-head">
        <button type="button" id="levelsBack" class="fp-btn fp-round" aria-label="رجوع"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
        <h2>المراحل</h2>
        <span class="chip small" id="levelsStars"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></span>
      </div>
      <div class="level-grid" id="levelGrid" role="group" aria-label="المراحل"></div>
    </div>
  </section>

  <section id="scrShop" class="screen dim" aria-label="المتجر" hidden>
    <div class="card shop-card">
      <div class="card-head">
        <button type="button" id="shopBack" class="fp-btn fp-round" aria-label="رجوع"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
        <h2>المتجر</h2>
        <span class="chip small" id="shopStars"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></span>
      </div>
      <h3>الكرات</h3>
      <div class="items skins" id="skinGrid" role="group" aria-label="الكرات"></div>
      <h3>البِرَك</h3>
      <div class="items themes" id="themeGrid" role="group" aria-label="البِرَك"></div>
      <p class="shop-tip">اجمع النجوم <svg aria-hidden="true"><use href="#i-star"/></svg> لتفتح المزيد!</p>
    </div>
  </section>

  <section id="scrError" class="screen dim" hidden>
    <div class="card"><h2>عذرًا!</h2><p>تعذّر تشغيل اللعبة. جرّب لعبة أخرى.</p></div>
  </section>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="../../shared/kit.js"></script>
<script src="../../shared/juice.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
