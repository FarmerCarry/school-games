<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7debd9"/>
      <stop offset="1" stop-color="#2fb8c9"/>
    </linearGradient>
    <radialGradient id="chrome" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c9d3e6"/>
      <stop offset="1" stop-color="#6d7a96"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#2fcf7a"/>
  <!-- the table: a wooden frame round a pond -->
  <path d="M30 400 L30 150 Q30 20 200 20 Q370 20 370 150 L370 400 Z" fill="#8a5a2b" stroke="#123536" stroke-width="6"/>
  <path d="M50 400 L50 156 Q50 40 200 40 Q350 40 350 156 L350 400 Z" fill="url(#pond)" stroke="#123536" stroke-width="5"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3">
    <ellipse cx="110" cy="250" rx="26" ry="8"/>
    <ellipse cx="300" cy="300" rx="22" ry="7"/>
    <ellipse cx="200" cy="330" rx="30" ry="9"/>
  </g>
  <!-- lily pads -->
  <path d="M86 300 A20 20 0 1 1 106 320 L96 306 Z" fill="#5fd068" stroke="#123536" stroke-width="3"/>
  <path d="M318 214 A16 16 0 1 0 334 230 L322 222 Z" fill="#5fd068" stroke="#123536" stroke-width="3"/>
  <!-- the frog head with its mouth wide open -->
  <g stroke="#123536" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="200" cy="146" rx="98" ry="68" fill="#6fdc5a"/>
    <circle cx="150" cy="86" r="30" fill="#6fdc5a"/>
    <circle cx="250" cy="86" r="30" fill="#6fdc5a"/>
    <circle cx="150" cy="84" r="19" fill="#ffffff"/>
    <circle cx="250" cy="84" r="19" fill="#ffffff"/>
    <path d="M128 150 Q200 104 272 150 Q262 206 200 210 Q138 206 128 150 Z" fill="#c2304f"/>
  </g>
  <circle cx="157" cy="91" r="8" fill="#123536"/>
  <circle cx="243" cy="93" r="8" fill="#123536"/>
  <circle cx="160" cy="88" r="2.6" fill="#ffffff"/>
  <circle cx="246" cy="90" r="2.6" fill="#ffffff"/>
  <path d="M150 186 Q200 166 250 186 Q232 204 200 205 Q168 204 150 186 Z" fill="#ff7aa0"/>
  <ellipse cx="114" cy="160" rx="15" ry="9" fill="#ff9aa8" opacity="0.7"/>
  <ellipse cx="286" cy="160" rx="15" ry="9" fill="#ff9aa8" opacity="0.7"/>
  <!-- the shiny ball, right in the mouth -->
  <circle cx="200" cy="160" r="24" fill="url(#chrome)" stroke="#123536" stroke-width="4"/>
  <ellipse cx="191" cy="150" rx="8" ry="5" fill="#ffffff" transform="rotate(-30 191 150)"/>
  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <path d="M200 228 L200 252"/>
    <path d="M178 236 L172 256"/>
    <path d="M222 236 L228 256"/>
  </g>
  <!-- the rubber duck -->
  <g stroke="#123536" stroke-width="4" stroke-linejoin="round">
    <path d="M262 262 Q262 238 288 238 Q312 238 310 262 Q330 258 338 244 Q348 268 330 286 Q300 302 270 290 Q254 280 262 262 Z" fill="#ffd93d"/>
    <path d="M262 252 L242 258 L262 266 Z" fill="#ff8a3d"/>
  </g>
  <circle cx="280" cy="252" r="6.5" fill="#ffffff" stroke="#123536" stroke-width="2.5"/>
  <circle cx="281" cy="253" r="3" fill="#123536"/>
  <!-- slingshots -->
  <path d="M74 300 L74 352 L112 368 Z" fill="#5fd068" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <path d="M326 300 L326 352 L288 368 Z" fill="#5fd068" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <!-- flippers with frog toes -->
  <g stroke="#123536" stroke-width="5" stroke-linejoin="round">
    <path d="M110 362 L176 392 A9 9 0 0 1 168 406 L102 384 A13 13 0 0 1 110 362 Z" fill="#ff8a3d"/>
    <path d="M290 362 L224 392 A9 9 0 0 0 232 406 L298 384 A13 13 0 0 0 290 362 Z" fill="#ff8a3d"/>
  </g>
  <circle cx="108" cy="373" r="4.5" fill="#ffffff" stroke="#123536" stroke-width="2"/>
  <circle cx="292" cy="373" r="4.5" fill="#ffffff" stroke="#123536" stroke-width="2"/>
</svg>
