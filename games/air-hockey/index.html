<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>هوكي الهواء</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Icons: every button is a picture, so a child who cannot read yet can play. -->
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <symbol id="i-play" viewBox="0 0 64 64"><path d="M22 11 Q18 9 18 14 L18 50 Q18 55 22 53 L52 35 Q56 32 52 29 Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 64 64"><rect x="15" y="12" width="12" height="40" rx="5"/><rect x="37" y="12" width="12" height="40" rx="5"/></symbol>
  <symbol id="i-again" viewBox="0 0 64 64"><path d="M50 30 A19 19 0 1 1 41 15" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><path d="M33 4 L52 13 L37 27 Z"/></symbol>
  <symbol id="i-home" viewBox="0 0 64 64"><path d="M8 32 L32 10 L56 32 L49 32 L49 54 L37 54 L37 40 L27 40 L27 54 L15 54 L15 32 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-next" viewBox="0 0 64 64"><path d="M12 12 L36 32 L12 52 Z M32 12 L56 32 L32 52 Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 64 64"><path d="M40 10 L18 32 L40 54" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-duo" viewBox="0 0 64 64"><circle cx="20" cy="22" r="10" fill="#3fa9ff" stroke="#1c2250" stroke-width="3.5"/><path d="M4 54 Q4 36 20 36 Q36 36 36 54 Z" fill="#3fa9ff" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><circle cx="44" cy="22" r="10" fill="#ff4f5e" stroke="#1c2250" stroke-width="3.5"/><path d="M28 54 Q28 36 44 36 Q60 36 60 54 Z" fill="#ff4f5e" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-brush" viewBox="0 0 64 64"><path d="M32 6 C14 6 4 20 6 34 C8 46 18 50 24 46 C30 42 26 36 32 34 C38 32 46 40 54 34 C62 28 56 6 32 6 Z" fill="#ffffff" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><circle cx="20" cy="22" r="5" fill="#ff4f7a"/><circle cx="34" cy="16" r="5" fill="#ffd23f"/><circle cx="46" cy="24" r="5" fill="#3ee39a"/><circle cx="18" cy="35" r="5" fill="#3fa9ff"/></symbol>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 5 L39 23.3 L58.6 24.4 L43.4 36.7 L48.5 55.6 L32 45 L15.5 55.6 L20.6 36.7 L5.4 24.4 L25 23.3 Z" stroke-linejoin="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 64 64"><path d="M20 28 L20 20 A12 12 0 0 1 44 20 L44 28" fill="none" stroke="currentColor" stroke-width="7"/><rect x="12" y="28" width="40" height="30" rx="7"/></symbol>
  <symbol id="i-mouse" viewBox="0 0 64 64"><rect x="14" y="4" width="36" height="56" rx="18" fill="#ffffff" stroke="#1c2250" stroke-width="4"/><path d="M32 4 L32 26 M14 26 L50 26" stroke="#1c2250" stroke-width="4"/><rect x="29" y="11" width="6" height="10" rx="3" fill="#ff4f7a"/></symbol>
</svg>

<canvas id="game" tabindex="0" aria-label="هوكي الهواء. حرّك المضرب بالفأرة أو بالأزرار W A S D واضرب القرص إلى مرمى الخصم."></canvas>

<!-- A 1280x720 layer laid exactly over the canvas (scaled by game.js). -->
<div id="ui">
  <div id="hud" hidden>
    <button type="button" id="pauseBtn" class="ah-btn ah-round" aria-label="استراحة" title="استراحة (Esc)"><svg aria-hidden="true"><use href="#i-pause"/></svg></button>
    <div id="board" dir="ltr">
      <div class="side s0"><div class="face" id="face0"></div><div class="who"><b id="name0">أنت</b><div class="pips" id="pips0"></div></div><div class="num" id="score0">0</div></div>
      <div class="side s1"><div class="num" id="score1">0</div><div class="who"><b id="name1"></b><div class="pips" id="pips1"></div></div><div class="face" id="face1"></div></div>
    </div>
    <div class="badge b0" id="badge0" hidden></div>
    <div class="badge b1" id="badge1" hidden></div>
    <div id="matchPoint" hidden>نقطة الفوز!</div>
  </div>

  <div id="pops" aria-hidden="true"></div>
  <div id="count" aria-hidden="true"></div>

  <!-- The wordless coach: the mouse and the keys that move your mallet. -->
  <div id="ghost" aria-hidden="true" hidden>
    <svg class="mouse"><use href="#i-mouse"/></svg>
    <span class="or">أو</span>
    <span class="keys" dir="ltr"><kbd class="up">W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
  </div>

  <section id="scrTitle" class="screen" aria-label="هوكي الهواء">
    <h1 class="logo"><span class="l1">هوكي</span><span class="l2">الهواء</span></h1>
    <div class="chip" id="titleStars" aria-label="النجوم"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></div>
    <div class="ladder-hdr" aria-hidden="true">اختر الخصم</div>
    <div id="ladder" role="group" aria-label="الخصوم"></div>
    <button type="button" id="btnPlay" class="ah-btn ah-play ring" aria-label="العب"><svg aria-hidden="true"><use href="#i-play"/></svg><span class="lbl">العب</span></button>
    <div class="small">
      <button type="button" id="btnDuo" class="ah-btn ah-tile" aria-label="لاعبان" title="لاعبان على لوحة مفاتيح واحدة"><svg aria-hidden="true"><use href="#i-duo"/></svg><span class="lbl">لاعبان</span></button>
      <button type="button" id="btnSkins" class="ah-btn ah-tile" aria-label="الألوان" title="المضارب والأقراص والطاولات"><svg aria-hidden="true"><use href="#i-brush"/></svg><span class="lbl">الألوان</span></button>
    </div>
    <div class="keyline" aria-hidden="true"><span>حركة: <b>الفأرة</b> أو <kbd dir="ltr">WASD</kbd></span><span class="sep">·</span><span>لاعبان: <kbd dir="ltr">WASD</kbd> + <kbd dir="ltr">↑←↓→</kbd></span></div>
  </section>

  <div id="vs" aria-hidden="true" hidden>
    <div class="vs-card l"><div class="face" id="vsFace0"></div><b id="vsName0"></b></div>
    <div class="vs-word">ضد</div>
    <div class="vs-card r"><div class="face" id="vsFace1"></div><b id="vsName1"></b></div>
  </div>

  <section id="scrPause" class="screen dim" aria-label="استراحة" hidden>
    <div class="card">
      <h2>استراحة</h2>
      <div class="row">
        <button type="button" id="btnHome" class="ah-btn ah-round big" aria-label="القائمة" title="القائمة"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
        <button type="button" id="btnResume" class="ah-btn ah-go" aria-label="تابع" title="تابع (Esc)"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
        <button type="button" id="btnRestart" class="ah-btn ah-round big" aria-label="من جديد" title="من جديد (R)"><svg aria-hidden="true"><use href="#i-again"/></svg></button>
      </div>
    </div>
  </section>

  <section id="scrResult" class="screen" aria-label="النتيجة" hidden>
    <div class="card result">
      <div class="res-faces" dir="ltr"><div class="face" id="resFace0"></div><div class="res-score"><b id="resMine">0</b><i>-</i><b id="resTheirs">0</b></div><div class="face" id="resFace1"></div></div>
      <h2 id="resTitle"></h2>
      <div class="stars" id="resStars" dir="ltr"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
      <div class="ribbon" id="resUnlock" hidden></div>
      <div class="row">
        <button type="button" id="btnResHome" class="ah-btn ah-round big" aria-label="القائمة" title="القائمة"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
        <button type="button" id="btnAgain" class="ah-btn ah-go" aria-label="العب مرة أخرى" title="العب مرة أخرى (Enter)"><svg aria-hidden="true"><use href="#i-again"/></svg></button>
        <button type="button" id="btnNext" class="ah-btn ah-go next" aria-label="الخصم التالي" title="الخصم التالي"><svg aria-hidden="true"><use href="#i-next"/></svg></button>
      </div>
    </div>
  </section>

  <section id="scrSkins" class="screen" aria-label="الألوان" hidden>
    <button type="button" id="btnSkinsBack" class="ah-btn ah-round" aria-label="رجوع" title="رجوع (Esc)"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
    <div class="chip" id="skinStars" aria-label="النجوم"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></div>
    <div class="shelf">
      <div class="shelf-row"><h3>المضرب</h3><div class="swatches" id="rowM" role="group" aria-label="المضرب"></div></div>
      <div class="shelf-row"><h3>القرص</h3><div class="swatches" id="rowP" role="group" aria-label="القرص"></div></div>
      <div class="shelf-row"><h3>الطاولة</h3><div class="swatches" id="rowT" role="group" aria-label="الطاولة"></div></div>
    </div>
  </section>

  <section id="scrError" class="screen dim" hidden>
    <div class="card"><h2>تعذّر تشغيل الرسوم ثلاثية الأبعاد على هذا الجهاز.</h2></div>
  </section>
  <div id="contextNotice" class="notice" role="status" hidden>توقفت الرسوم لحظة… انتظر قليلًا.</div>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="../../shared/kit.js"></script>
<script src="../../shared/webgl.js"></script>
<script src="../../shared/juice.js"></script>
<script src="../../lib/three/three.min.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="data.js"></script>
<script src="scene.js"></script>
<script src="game.js"></script>
</body>
</html>
