<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#2a1f7a"/>
      <stop offset="0.6" stop-color="#0d1240"/>
      <stop offset="1" stop-color="#050716"/>
    </radialGradient>
    <linearGradient id="rink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143270"/>
      <stop offset="1" stop-color="#0a1636"/>
    </linearGradient>
    <radialGradient id="blueBowl" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b8f0ff"/>
      <stop offset="0.55" stop-color="#35c8ff"/>
      <stop offset="1" stop-color="#1a7fb8"/>
    </radialGradient>
    <radialGradient id="redBowl" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffd0dc"/>
      <stop offset="0.55" stop-color="#ff5c7a"/>
      <stop offset="1" stop-color="#b8203f"/>
    </radialGradient>
    <radialGradient id="puck" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eafcff"/>
      <stop offset="1" stop-color="#a9d8e6"/>
    </radialGradient>
    <radialGradient id="glowC" r="50%">
      <stop offset="0" stop-color="#7ff3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7ff3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" r="50%">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35c8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bff6ff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff06a"/>
      <stop offset="1" stop-color="#ffb800"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- stadium lights -->
  <g opacity="0.5">
    <circle cx="30" cy="22" r="4" fill="#35c8ff"/><circle cx="80" cy="16" r="4" fill="#ff4fd8"/><circle cx="130" cy="22" r="4" fill="#fff06a"/>
    <circle cx="270" cy="22" r="4" fill="#35c8ff"/><circle cx="320" cy="16" r="4" fill="#ff4fd8"/><circle cx="370" cy="22" r="4" fill="#fff06a"/>
  </g>

  <!-- rink, tilted -->
  <g transform="rotate(-9 200 185)">
    <rect x="18" y="62" width="364" height="236" rx="46" fill="none" stroke="#35e0ff" stroke-width="14" opacity="0.35" filter="url(#soft)"/>
    <rect x="18" y="62" width="364" height="236" rx="46" fill="url(#rink)" stroke="#35e0ff" stroke-width="7"/>
    <rect x="18" y="62" width="364" height="236" rx="46" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <line x1="200" y1="66" x2="200" y2="294" stroke="#ff4fd8" stroke-width="5"/>
    <circle cx="200" cy="180" r="42" fill="none" stroke="#ff4fd8" stroke-width="5"/>
    <path d="M18 128 A 60 60 0 0 1 18 232" fill="none" stroke="#35c8ff" stroke-width="3" opacity="0.7"/>
    <path d="M382 128 A 60 60 0 0 0 382 232" fill="none" stroke="#ff6b6b" stroke-width="3" opacity="0.7"/>
    <!-- goals -->
    <rect x="370" y="140" width="22" height="80" rx="6" fill="#04050d"/>
    <rect x="360" y="140" width="22" height="80" fill="#ff6b6b" opacity="0.35"/>
    <circle cx="382" cy="140" r="6" fill="#ff5c7a"/><circle cx="382" cy="220" r="6" fill="#ff5c7a"/>
    <rect x="8" y="140" width="22" height="80" rx="6" fill="#04050d"/>
    <circle cx="18" cy="140" r="6" fill="#35c8ff"/><circle cx="18" cy="220" r="6" fill="#35c8ff"/>
  </g>

  <!-- red mallet (angry bot) -->
  <g transform="translate(318 118)">
    <ellipse cx="6" cy="8" rx="44" ry="42" fill="#000" opacity="0.35"/>
    <circle r="44" fill="#a4133c"/>
    <circle r="34" fill="url(#redBowl)"/>
    <circle r="22" fill="#ff8aa0" stroke="#7a0f2c" stroke-width="2" stroke-opacity="0.3"/>
    <circle cx="-8" cy="-2" r="7" fill="#fff"/><circle cx="8" cy="-2" r="7" fill="#fff"/>
    <circle cx="-11" cy="0" r="3.8" fill="#1a1333"/><circle cx="5" cy="0" r="3.8" fill="#1a1333"/>
    <path d="M-17 -13 L-3 -7 M17 -13 L3 -7" stroke="#1a1333" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-5 11 L5 9" stroke="#1a1333" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- puck trail + sparks -->
  <path d="M70 250 Q 150 220 222 196 L 226 222 Q 150 240 76 262 Z" fill="url(#trail)" opacity="0.8"/>
  <circle cx="232" cy="206" r="40" fill="url(#glowC)"/>
  <g stroke="#fff06a" stroke-width="4" stroke-linecap="round">
    <line x1="262" y1="178" x2="282" y2="164"/>
    <line x1="268" y1="206" x2="294" y2="204"/>
    <line x1="258" y1="232" x2="276" y2="246"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="252" y1="170" x2="258" y2="156"/>
    <line x1="274" y1="222" x2="288" y2="228"/>
  </g>
  <!-- puck -->
  <circle cx="236" cy="214" r="21" fill="#000" opacity="0.3"/>
  <circle cx="232" cy="208" r="21" fill="url(#puck)"/>
  <circle cx="232" cy="208" r="13" fill="none" stroke="#35c8ff" stroke-width="4"/>

  <!-- blue mallet (player, happy) -->
  <g transform="translate(118 262)">
    <circle r="72" fill="url(#glowC)" opacity="0.6"/>
    <ellipse cx="8" cy="10" rx="54" ry="51" fill="#000" opacity="0.35"/>
    <circle r="54" fill="#0a6fd6"/>
    <circle r="42" fill="url(#blueBowl)"/>
    <path d="M-44 -22 A 50 50 0 0 1 -16 -48" stroke="#fff" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>
    <circle r="27" fill="#7fe0ff" stroke="#0a4f8f" stroke-width="2" stroke-opacity="0.3"/>
    <circle cx="-10" cy="-3" r="9" fill="#fff"/><circle cx="10" cy="-3" r="9" fill="#fff"/>
    <circle cx="-6" cy="-5" r="4.8" fill="#1a1333"/><circle cx="14" cy="-5" r="4.8" fill="#1a1333"/>
    <circle cx="-7.5" cy="-7" r="1.6" fill="#fff"/><circle cx="12.5" cy="-7" r="1.6" fill="#fff"/>
    <path d="M-9 9 Q 0 18 9 9" stroke="#1a1333" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <g>
    <rect x="44" y="318" width="312" height="66" rx="33" fill="#1a1147" stroke="#ff4fd8" stroke-width="4"/>
    <text x="200" y="367" text-anchor="middle" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="bold" font-size="48"
          fill="url(#banner)" stroke="#7a1f6e" stroke-width="7" stroke-linejoin="round" paint-order="stroke">هوكي الهواء</text>
  </g>
</svg>
