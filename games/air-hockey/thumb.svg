<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#14296b"/>
      <stop offset="65%" stop-color="#081134"/>
      <stop offset="100%" stop-color="#050716"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8b0"/>
      <stop offset="40%" stop-color="#ff8a00"/>
      <stop offset="80%" stop-color="#ff2a00" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff2a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanMallet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ef9ff"/>
      <stop offset="55%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="#084eb8"/>
    </linearGradient>
    <linearGradient id="bossMallet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8fa3"/>
      <stop offset="55%" stop-color="#ff2a55"/>
      <stop offset="100%" stop-color="#870a28"/>
    </linearGradient>
  </defs>

  <!-- Cyber-Arena Rink -->
  <rect width="400" height="400" rx="34" fill="url(#bg)"/>
  <rect x="18" y="18" width="364" height="364" rx="28" fill="none" stroke="#00e5ff" stroke-width="5" stroke-opacity="0.85"/>
  <rect x="18" y="18" width="364" height="364" rx="28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Center Laser Line & Reactor Ring -->
  <line x1="200" y1="22" x2="200" y2="378" stroke="#ff2f92" stroke-width="6" stroke-opacity="0.35"/>
  <line x1="200" y1="22" x2="200" y2="378" stroke="#ff52a8" stroke-width="2.5"/>
  <circle cx="200" cy="196" r="56" fill="none" stroke="#ff2f92" stroke-width="5" stroke-opacity="0.35"/>
  <circle cx="200" cy="196" r="56" fill="none" stroke="#ff6ec7" stroke-width="2.5"/>

  <!-- Left Cyan Hero Cyber-Mech Mallet -->
  <g transform="translate(96 226)">
    <circle r="60" fill="#00e5ff" fill-opacity="0.22"/>
    <circle r="50" fill="#0b4aa8" stroke="#8cf6ff" stroke-width="3"/>
    <circle r="40" fill="url(#cyanMallet)"/>
    <circle r="24" fill="#121a40" stroke="#7ef9ff" stroke-width="2.5"/>
    <rect x="-15" y="-7" width="11" height="13" rx="4" fill="#5ef2ff"/>
    <rect x="4" y="-7" width="11" height="13" rx="4" fill="#5ef2ff"/>
    <circle cx="-11" cy="-3" r="2.5" fill="#ffffff"/>
    <circle cx="8" cy="-3" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Right Crimson Boss Dragon-Mech Mallet -->
  <g transform="translate(306 154)">
    <circle r="60" fill="#ff2a55" fill-opacity="0.24"/>
    <circle r="50" fill="#7a0d29" stroke="#ff9cb0" stroke-width="3"/>
    <circle r="40" fill="url(#bossMallet)"/>
    <!-- Saw blades -->
    <polygon points="0,-49 6,-39 -6,-39" fill="#ffd23f"/>
    <polygon points="49,0 39,6 39,-6" fill="#ffd23f"/>
    <polygon points="0,49 6,39 -6,39" fill="#ffd23f"/>
    <polygon points="-49,0 -39,6 -39,-6" fill="#ffd23f"/>
    <circle r="24" fill="#160c29" stroke="#ff6b8a" stroke-width="2.5"/>
    <!-- Boss horns & fierce laser eyes -->
    <polygon points="-14,-16 -28,-32 -20,-8" fill="#ff3355"/>
    <polygon points="14,-16 28,-32 20,-8" fill="#ff3355"/>
    <polygon points="-16,-3 -4,-8 -5,4 -15,3" fill="#ffe033"/>
    <polygon points="16,-3 4,-8 5,4 15,3" fill="#ffe033"/>
  </g>

  <!-- Blazing Fireball Comet Trail & Clash Shockwave -->
  <path d="M112,218 Q156,204 206,186 L196,162 Q150,188 106,208 Z" fill="#ff5500" fill-opacity="0.72"/>
  <path d="M128,214 Q166,200 206,186 L199,170 Q162,190 124,206 Z" fill="#ffe033" fill-opacity="0.88"/>
  <circle cx="204" cy="182" r="54" fill="url(#fireGlow)"/>
  <circle cx="204" cy="182" r="42" fill="none" stroke="#fff06a" stroke-width="3" stroke-dasharray="10 7"/>

  <!-- Lightning Sparks -->
  <polyline points="172,140 190,158 180,164 198,176" fill="none" stroke="#5ef2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="238,220 220,202 230,196 212,184" fill="none" stroke="#fff06a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blazing Laser Power-Puck -->
  <g transform="translate(204 182)">
    <circle r="25" fill="#ffffff" stroke="#ff6a00" stroke-width="4"/>
    <circle r="15" fill="none" stroke="#ff3d00" stroke-width="4"/>
    <polygon points="3,-10 -6,1 0,1 -3,10 6,-1 0,-1" fill="#ff6a00"/>
  </g>

  <!-- Arabic Title Banner -->
  <rect x="44" y="316" width="312" height="56" rx="28" fill="#060c28" fill-opacity="0.88" stroke="#00e5ff" stroke-width="2.5"/>
  <text x="200" y="354" text-anchor="middle" direction="rtl" font-family="Fredoka, sans-serif" font-weight="800" font-size="36" fill="#fff06a" stroke="#091540" stroke-width="5" paint-order="stroke">هوكي الهواء</text>
</svg>
