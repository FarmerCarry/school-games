<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#caf0f8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15b8eb"/>
      <stop offset="0.5" stop-color="#08599c"/>
      <stop offset="1" stop-color="#042654"/>
    </linearGradient>
  </defs>

  <rect width="400" height="112" fill="url(#sky)"/>
  <circle cx="332" cy="46" r="24" fill="#fff3b0"/>
  <path d="M18 112 Q65 76 112 112 Z" fill="#0962a8"/>
  <rect y="110" width="400" height="290" fill="url(#sea)"/>

  <!-- Underwater sunbeams -->
  <g fill="#fff" opacity="0.1">
    <polygon points="75,112 118,112 162,368 42,368"/>
    <polygon points="225,112 272,112 325,368 195,368"/>
  </g>

  <!-- Seafloor & Coral -->
  <path d="M46 372 Q38 334 54 336 Q66 322 72 372 Z" fill="#ff9f1c" stroke="#1b1640" stroke-width="4"/>
  <path d="M332 372 Q324 330 342 334 Q358 318 364 372 Z" fill="#ef476f" stroke="#1b1640" stroke-width="4"/>
  <path d="M0 366 Q100 354 200 366 T400 364 V400 H0 Z" fill="#ebca7e" stroke="#1b1640" stroke-width="5"/>

  <!-- Turbo Rocket Boat on surface -->
  <g transform="translate(132,56)">
    <rect x="34" y="8" width="48" height="26" rx="9" fill="#fff" stroke="#1b1640" stroke-width="4.5"/>
    <rect x="42" y="13" width="32" height="13" rx="5" fill="#4cc9f0"/>
    <rect x="4" y="20" width="24" height="15" rx="5" fill="#ffd166" stroke="#1b1640" stroke-width="4"/>
    <polygon points="12,30 128,30 112,56 26,56" fill="#ff4d6d" stroke="#1b1640" stroke-width="5" stroke-linejoin="round"/>
    <rect x="27" y="39" width="84" height="6" fill="#ffd166"/>
    <circle cx="70" cy="58" r="9" fill="#ffd166" stroke="#1b1640" stroke-width="4"/>
  </g>

  <!-- Surface wave -->
  <path d="M0 112 Q25 104 50 112 T100 112 T150 112 T200 112 T250 112 T300 112 T350 112 T400 112" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Harpoon Cable & Magnetic Claw -->
  <line x1="202" y1="115" x2="152" y2="288" stroke="#ffd166" stroke-width="5.5" stroke-linecap="round"/>
  <g transform="translate(152,288) rotate(16)">
    <path d="M0 -8 Q-20 8 -13 24 M0 -8 Q20 8 13 24" fill="none" stroke="#1b1640" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 -8 Q-20 8 -13 24 M0 -8 Q20 8 13 24" fill="none" stroke="#ffd166" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="9" fill="#ff4d6d" stroke="#1b1640" stroke-width="4"/>
  </g>

  <!-- Gleaming Sunken Treasure Chest -->
  <g transform="translate(96,304)">
    <rect x="0" y="14" width="84" height="48" rx="9" fill="#8d5524" stroke="#1b1640" stroke-width="5"/>
    <circle cx="24" cy="14" r="9" fill="#ffd166" stroke="#1b1640" stroke-width="3"/>
    <circle cx="42" cy="10" r="10" fill="#ffe66d" stroke="#1b1640" stroke-width="3"/>
    <circle cx="60" cy="14" r="9" fill="#ffd166" stroke="#1b1640" stroke-width="3"/>
    <rect x="-3" y="0" width="90" height="22" rx="8" fill="#ffb703" stroke="#1b1640" stroke-width="5"/>
    <rect x="35" y="14" width="14" height="18" rx="4" fill="#ffe66d" stroke="#1b1640" stroke-width="3.5"/>
  </g>

  <!-- Giant Cartoon Boss Shark -->
  <g transform="translate(274,232)">
    <polygon points="62,0 92,-28 80,0 92,28" fill="#ffd166" stroke="#1b1640" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="-8,-26 8,-62 28,-24" fill="#ffd166" stroke="#1b1640" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="0" cy="0" rx="68" ry="38" fill="#2ec4b6" stroke="#1b1640" stroke-width="5.5"/>
    <path d="M-54 8 Q-12 30 38 14" fill="#cbf3f0"/>
    <polygon points="-48,10 -14,10 -22,23 -32,12 -40,23" fill="#fff" stroke="#1b1640" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="-34" cy="-8" r="9" fill="#fff" stroke="#1b1640" stroke-width="3.5"/>
    <circle cx="-36" cy="-8" r="4.5" fill="#1b1640"/>
  </g>

  <!-- Lightning Fish -->
  <g transform="translate(76,188)">
    <polygon points="-24,0 -40,-14 -34,0 -40,14" fill="#fb5607" stroke="#1b1640" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="0" cy="0" rx="26" ry="16" fill="#ffbe0b" stroke="#1b1640" stroke-width="4"/>
    <circle cx="12" cy="-3" r="4.5" fill="#fff" stroke="#1b1640" stroke-width="2.5"/>
    <circle cx="13" cy="-3" r="2" fill="#1b1640"/>
  </g>
</svg>
