<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فقاعات بوب</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Icons: every button is a picture, so a child who cannot read yet can play. -->
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <symbol id="i-play" viewBox="0 0 64 64"><path d="M22 11 Q18 9 18 14 L18 50 Q18 55 22 53 L52 35 Q56 32 52 29 Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 64 64"><rect x="15" y="12" width="12" height="40" rx="5"/><rect x="37" y="12" width="12" height="40" rx="5"/></symbol>
  <symbol id="i-again" viewBox="0 0 64 64"><path d="M50 30 A19 19 0 1 1 41 15" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><path d="M33 4 L52 13 L37 27 Z"/></symbol>
  <symbol id="i-map" viewBox="0 0 64 64"><path d="M6 15 L22 8 L42 15 L58 8 L58 49 L42 56 L22 49 L6 56 Z"/><path d="M22 10 L22 47 M42 17 L42 54" stroke="#1c2250" stroke-width="4" opacity=".35"/><circle cx="32" cy="30" r="6" fill="#ff5d6c"/></symbol>
  <symbol id="i-home" viewBox="0 0 64 64"><path d="M8 32 L32 10 L56 32 L49 32 L49 54 L37 54 L37 40 L27 40 L27 54 L15 54 L15 32 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-hat" viewBox="0 0 64 64"><path d="M18 6 Q32 2 46 6 L44 40 L20 40 Z" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><path d="M4 44 Q32 34 60 44 Q60 54 32 54 Q4 54 4 44 Z" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><path d="M20 30 L44 30 L44 39 L20 39 Z" fill="#ff5d6c"/></symbol>
  <symbol id="i-cup" viewBox="0 0 64 64"><path d="M18 8 L46 8 L46 22 Q46 40 32 42 Q18 40 18 22 Z M18 13 Q6 13 8 24 Q10 32 19 32 M46 13 Q58 13 56 24 Q54 32 45 32" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><path d="M28 42 L36 42 L37 50 L27 50 Z M18 50 L46 50 L46 58 L18 58 Z" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><path d="M32 15 L34.5 21 L41 21.5 L36 25.5 L37.5 32 L32 28.5 L26.5 32 L28 25.5 L23 21.5 L29.5 21 Z" fill="#fff6c2"/></symbol>
  <symbol id="i-mouse" viewBox="0 0 64 64"><rect x="16" y="6" width="32" height="52" rx="16"/><path d="M32 8 L32 26 M17 26 L47 26" stroke="#1c2250" stroke-width="3.5"/><rect x="29" y="13" width="6" height="10" rx="3" fill="#ffd23f"/></symbol>
  <symbol id="i-x" viewBox="0 0 64 64"><path d="M16 16 L48 48 M48 16 L16 48" stroke="currentColor" stroke-width="11" stroke-linecap="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 5 L39 23.3 L58.6 24.4 L43.4 36.7 L48.5 55.6 L32 45 L15.5 55.6 L20.6 36.7 L5.4 24.4 L25 23.3 Z" stroke-linejoin="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 64 64"><path d="M20 28 L20 20 A12 12 0 0 1 44 20 L44 28" fill="none" stroke="currentColor" stroke-width="7"/><rect x="12" y="28" width="40" height="30" rx="7"/></symbol>
  <symbol id="i-crown" viewBox="0 0 64 64"><path d="M8 20 L20 34 L32 12 L44 34 L56 20 L52 50 L12 50 Z" stroke-linejoin="round"/><circle cx="32" cy="38" r="4" fill="#ff5d6c"/></symbol>
</svg>

<canvas id="game" tabindex="0" aria-label="فقاعات بوب"></canvas>

<!-- A 1280x720 layer laid exactly over the canvas (scaled by game.js). -->
<div id="ui">
  <div id="hud" hidden>
    <button type="button" id="btnPause" class="bb-btn bb-round" aria-label="استراحة" title="استراحة (P)"><svg aria-hidden="true"><use href="#i-pause"/></svg></button>
  </div>

  <section id="scrTitle" class="screen" aria-label="فقاعات بوب">
    <h1 class="logo"><span class="l1">فقاعات</span><span class="l2">بوب</span></h1>
    <button type="button" id="btnPlay" class="bb-btn bb-play ring" aria-label="العب"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
    <div class="chip" id="titleStars" aria-label="النجوم"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></div>
    <button type="button" id="btnCloset" class="bb-btn bb-side" aria-label="خزانة بوب"><svg aria-hidden="true"><use href="#i-hat"/></svg></button>
    <button type="button" id="btnHow" class="bb-btn bb-side" aria-label="كيف أمسك الفأرة؟"><svg aria-hidden="true"><use href="#i-mouse"/></svg></button>
  </section>

  <section id="scrGrip" class="screen" aria-label="كيف أمسك؟" hidden>
    <div class="grip-card" id="gripCard">
      <img id="gripImg" alt="" width="720" height="540" src="grip-mouse.webp">
      <i class="halo" id="halo1"></i><i class="halo" id="halo2"></i>
    </div>
    <div class="grip-dots" aria-hidden="true"><i></i><i></i></div>
    <button type="button" id="gripNext" class="bb-btn bb-go ring" aria-label="التالي"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
    <button type="button" id="gripSkip" class="bb-btn bb-round" aria-label="تخطَّ"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
  </section>

  <section id="scrMap" class="screen" aria-label="الخريطة" hidden>
    <button type="button" id="mapHome" class="bb-btn bb-round" aria-label="البداية"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
    <div class="chip" id="mapStars" aria-label="النجوم"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></div>
    <button type="button" id="mapCloset" class="bb-btn bb-round" aria-label="خزانة بوب"><svg aria-hidden="true"><use href="#i-hat"/></svg></button>
    <div id="islands"></div>
  </section>

  <section id="scrPause" class="screen dim" aria-label="استراحة" hidden>
    <div class="card">
      <button type="button" id="btnResume" class="bb-btn bb-go" aria-label="تابع اللعب"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
      <div class="row">
        <button type="button" id="btnRestart" class="bb-btn bb-round big" aria-label="ابدأ من جديد"><svg aria-hidden="true"><use href="#i-again"/></svg></button>
        <button type="button" id="btnMap" class="bb-btn bb-round big" aria-label="الخريطة"><svg aria-hidden="true"><use href="#i-map"/></svg></button>
      </div>
    </div>
  </section>

  <section id="scrResult" class="screen" aria-label="النتيجة" hidden>
    <div class="card result">
      <div class="stars3" id="resStars" aria-hidden="true"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
      <div class="score" id="resScore" hidden><b id="resNum">0</b><span class="best"><svg aria-hidden="true"><use href="#i-crown"/></svg><b id="resBest">0</b></span></div>
      <div class="newbest" id="resNewBest" hidden><svg aria-hidden="true"><use href="#i-crown"/></svg><span>رقم جديد!</span></div>
      <button type="button" class="bb-btn gift" id="resGift" aria-label="شيء جديد في خزانة بوب" hidden><canvas id="giftCanvas" width="132" height="132"></canvas><span>جديد!</span></button>
      <div class="row">
        <button type="button" id="resMap" class="bb-btn bb-round big" aria-label="الخريطة"><svg aria-hidden="true"><use href="#i-map"/></svg></button>
        <button type="button" id="resNext" class="bb-btn bb-go ring" aria-label="التالي"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
        <button type="button" id="resAgain" class="bb-btn bb-round big" aria-label="مرة أخرى"><svg aria-hidden="true"><use href="#i-again"/></svg></button>
      </div>
    </div>
  </section>

  <section id="scrCloset" class="screen" aria-label="خزانة بوب" hidden>
    <button type="button" id="closetBack" class="bb-btn bb-round" aria-label="رجوع"><svg aria-hidden="true"><use href="#i-map"/></svg></button>
    <div class="chip" id="closetStars" aria-label="النجوم"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></div>
    <div class="closet-panel">
      <div class="shelf" id="colors" role="group" aria-label="الألوان"></div>
      <div class="shelf" id="hats" role="group" aria-label="القبعات"></div>
    </div>
  </section>

  <!-- The wordless coach: a hand that shows the move after a few idle seconds. -->
  <div id="ghost" aria-hidden="true" hidden>
    <svg viewBox="0 0 80 100" width="84" height="105">
      <g fill="#1c2250" stroke="#1c2250" stroke-width="9" stroke-linejoin="round">
        <rect x="22" y="5" width="17" height="54" rx="8.5"/><rect x="37" y="36" width="15" height="30" rx="7.5"/>
        <rect x="50" y="40" width="14" height="28" rx="7"/><rect x="3" y="52" width="27" height="14" rx="7" transform="rotate(38 16 59)"/>
        <rect x="14" y="46" width="52" height="48" rx="19"/>
      </g>
      <g fill="#ffffff">
        <rect x="22" y="5" width="17" height="54" rx="8.5"/><rect x="37" y="36" width="15" height="30" rx="7.5"/>
        <rect x="50" y="40" width="14" height="28" rx="7"/><rect x="3" y="52" width="27" height="14" rx="7" transform="rotate(38 16 59)"/>
        <rect x="14" y="46" width="52" height="48" rx="19"/>
      </g>
      <path d="M41 48 L41 60 M54 52 L54 62" stroke="#1c2250" stroke-width="3" stroke-linecap="round" opacity=".45"/>
    </svg>
  </div>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="../../shared/kit.js"></script>
<script src="../../shared/juice.js"></script>
<script src="rules.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
