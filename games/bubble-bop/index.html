<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فقاعات بوب</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
<symbol id="i-play" viewBox="0 0 64 64"><path d="M22 11Q18 9 18 14V50Q18 55 22 53L52 35Q56 32 52 29Z"/></symbol>
<symbol id="i-pause" viewBox="0 0 64 64"><rect x="15" y="12" width="12" height="40" rx="5"/><rect x="37" y="12" width="12" height="40" rx="5"/></symbol>
<symbol id="i-again" viewBox="0 0 64 64"><path d="M50 30A19 19 0 1 1 41 15" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><path d="M33 4L52 13L37 27Z"/></symbol>
<symbol id="i-map" viewBox="0 0 64 64"><path d="M6 15L22 8L42 15L58 8V49L42 56L22 49L6 56Z"/><path d="M22 10V47M42 17V54" stroke="#1c2250" stroke-width="4" opacity=".35"/><circle cx="32" cy="30" r="6" fill="#ff5d6c"/></symbol>
<symbol id="i-home" viewBox="0 0 64 64"><path d="M8 32L32 10L56 32H49V54H37V40H27V54H15V32Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
<symbol id="i-hat" viewBox="0 0 64 64"><path d="M18 6Q32 2 46 6L44 40H20Z" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><path d="M4 44Q32 34 60 44Q60 54 32 54Q4 54 4 44Z" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><path d="M20 30H44V39H20Z" fill="#ff5d6c"/></symbol>
<symbol id="i-cup" viewBox="0 0 64 64"><path d="M18 8H46V22Q46 40 32 42Q18 40 18 22ZM18 13Q6 13 8 24Q10 32 19 32M46 13Q58 13 56 24Q54 32 45 32" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><path d="M28 42H36L37 50H27ZM18 50H46V58H18Z" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><path d="M32 15L34.5 21L41 21.5L36 25.5L37.5 32L32 28.5L26.5 32L28 25.5L23 21.5L29.5 21Z" fill="#fff6c2"/></symbol>
<symbol id="i-mouse" viewBox="0 0 64 64"><rect x="16" y="6" width="32" height="52" rx="16"/><path d="M32 8V26M17 26H47" stroke="#1c2250" stroke-width="3.5"/><rect x="29" y="13" width="6" height="10" rx="3" fill="#ffd23f"/></symbol>
<symbol id="i-x" viewBox="0 0 64 64"><path d="M16 16L48 48M48 16L16 48" stroke="currentColor" stroke-width="11" stroke-linecap="round"/></symbol>
<symbol id="i-star" viewBox="0 0 64 64"><path d="M32 5L39 23.3L58.6 24.4L43.4 36.7L48.5 55.6L32 45L15.5 55.6L20.6 36.7L5.4 24.4L25 23.3Z" stroke-linejoin="round"/></symbol>
<symbol id="i-lock" viewBox="0 0 64 64"><path d="M20 28V20A12 12 0 0 1 44 20V28" fill="none" stroke="currentColor" stroke-width="7"/><rect x="12" y="28" width="40" height="30" rx="7"/></symbol>
<symbol id="i-arrow" viewBox="0 0 64 64"><path d="M8 32L32 8V22H56V42H32V56Z" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/></symbol>
<symbol id="i-crown" viewBox="0 0 64 64"><path d="M8 20L20 34L32 12L44 34L56 20L52 50H12Z" stroke-linejoin="round"/><circle cx="32" cy="38" r="4" fill="#ff5d6c"/></symbol>
</svg>
<canvas id="game" tabindex="0" aria-label="فقاعات بوب"></canvas>
<div id="ui">
<div id="hud" hidden><button type="button" id="btnPause" class="bb-btn bb-round" aria-label="استراحة" title="استراحة (P)"><svg aria-hidden="true"><use href="#i-pause"/></svg></button></div>
<section id="scrTitle" class="screen" aria-label="فقاعات بوب">
<h1 class="logo"><span class="l1">فقاعات</span><span class="l2">بوب</span></h1>
<button type="button" id="btnPlay" class="bb-btn bb-play ring" aria-label="العب"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
<button type="button" id="btnParty" class="bb-btn bb-party" aria-label="حفلة الفقاعات 60 ثانية">حفلة الفقاعات ⚡</button>
<div class="chip" id="titleStars" aria-label="النجوم"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></div>
<button type="button" id="btnCloset" class="bb-btn bb-side" aria-label="خزانة بوب"><svg aria-hidden="true"><use href="#i-hat"/></svg><span class="lbl">قبعات</span></button>
<button type="button" id="btnTitleMap" class="bb-btn bb-side" aria-label="الخريطة"><svg aria-hidden="true"><use href="#i-map"/></svg><span class="lbl">الخريطة</span></button>
<button type="button" id="btnHow" class="bb-btn bb-side" aria-label="كيف أمسك الفأرة؟"><svg aria-hidden="true"><use href="#i-mouse"/></svg><span class="lbl">المساعدة</span></button>
</section>
<section id="scrGrip" class="screen" aria-label="كيف أمسك؟" hidden>
<div class="grip-card" id="gripCard"><img id="gripImg" alt="" width="720" height="540" loading="lazy"><i class="halo" id="halo1"></i><i class="halo" id="halo2"></i></div>
<div class="grip-dots" aria-hidden="true"><i></i><i></i></div>
<button type="button" id="gripNext" class="bb-btn bb-go ring" aria-label="التالي"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
<button type="button" id="gripSkip" class="bb-btn bb-round" aria-label="تخطَّ"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
</section>
<section id="scrMap" class="screen" aria-label="الخريطة" hidden>
<button type="button" id="mapHome" class="bb-btn bb-round" aria-label="البداية"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
<div class="chip" id="mapStars" aria-label="النجوم"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></div>
<button type="button" id="mapCloset" class="bb-btn bb-round" aria-label="خزانة بوب"><svg aria-hidden="true"><use href="#i-hat"/></svg></button>
<div id="islands"></div>
<button type="button" id="mapNext" class="bb-btn bb-round big page-btn" aria-label="العوالم 6 إلى 11"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
<button type="button" id="mapPrev" class="bb-btn bb-round big page-btn" aria-label="العوالم 1 إلى 5" hidden><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
</section>
<section id="scrPause" class="screen dim" aria-label="استراحة" hidden>
<div class="card"><button type="button" id="btnResume" class="bb-btn bb-go" aria-label="تابع اللعب"><svg aria-hidden="true"><use href="#i-play"/></svg></button><div class="row"><button type="button" id="btnMap" class="bb-btn bb-round big" aria-label="الخريطة"><svg aria-hidden="true"><use href="#i-map"/></svg></button><button type="button" id="btnRestart" class="bb-btn bb-round big" aria-label="ابدأ من جديد"><svg aria-hidden="true"><use href="#i-again"/></svg></button></div></div>
</section>
<section id="scrResult" class="screen" aria-label="النتيجة" hidden>
<div class="card result">
<div class="stars3" id="resStars" aria-hidden="true"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
<div class="score" id="resScore" hidden><b id="resNum">0</b><span class="best"><svg aria-hidden="true"><use href="#i-crown"/></svg><b id="resBest">0</b></span></div>
<div class="newbest" id="resNewBest" hidden><svg aria-hidden="true"><use href="#i-crown"/></svg><span>رقم جديد!</span></div>
<button type="button" class="bb-btn gift" id="resGift" aria-label="شيء جديد في خزانة بوب" hidden><canvas id="giftCanvas" width="132" height="132"></canvas><span>جديد!</span></button>
<div class="row"><button type="button" id="resMap" class="bb-btn bb-round big" aria-label="الخريطة"><svg aria-hidden="true"><use href="#i-map"/></svg></button><button type="button" id="resNext" class="bb-btn bb-go ring" aria-label="التالي"><svg aria-hidden="true"><use href="#i-play"/></svg></button><button type="button" id="resAgain" class="bb-btn bb-round big" aria-label="مرة أخرى"><svg aria-hidden="true"><use href="#i-again"/></svg></button></div>
<p class="party-hint" id="resHint" hidden><span dir="ltr"><span class="sg-key">Enter</span> / <span class="sg-key">Space</span></span> إعادة فورية ⚡</p>
</div>
</section>
<section id="scrCloset" class="screen" aria-label="خزانة بوب" hidden>
<button type="button" id="closetBack" class="bb-btn bb-round" aria-label="رجوع"><svg aria-hidden="true"><use href="#i-map"/></svg></button>
<div class="chip" id="closetStars" aria-label="النجوم"><svg aria-hidden="true"><use href="#i-star"/></svg><b>0</b></div>
<div class="closet-panel"><div class="shelf" id="colors" role="group" aria-label="الألوان"></div><div class="shelf" id="hats" role="group" aria-label="القبعات"></div></div>
</section>
<div id="ghost" aria-hidden="true" hidden><svg viewBox="0 0 80 100" width="84" height="105"><g fill="#1c2250" stroke="#1c2250" stroke-width="9" stroke-linejoin="round"><rect x="22" y="5" width="17" height="54" rx="8.5"/><rect x="37" y="36" width="15" height="30" rx="7.5"/><rect x="50" y="40" width="14" height="28" rx="7"/><rect x="3" y="52" width="27" height="14" rx="7" transform="rotate(38 16 59)"/><rect x="14" y="46" width="52" height="48" rx="19"/></g><g fill="#fff"><rect x="22" y="5" width="17" height="54" rx="8.5"/><rect x="37" y="36" width="15" height="30" rx="7.5"/><rect x="50" y="40" width="14" height="28" rx="7"/><rect x="3" y="52" width="27" height="14" rx="7" transform="rotate(38 16 59)"/><rect x="14" y="46" width="52" height="48" rx="19"/></g><path d="M41 48V60M54 52V62" stroke="#1c2250" stroke-width="3" stroke-linecap="round" opacity=".45"/></svg></div>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="../../shared/kit.js"></script>
<script src="../../shared/juice.js"></script>
<script src="rules.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
