<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2bb8ff"/>
      <stop offset="62%" stop-color="#9be8ff"/>
      <stop offset="100%" stop-color="#fff0b8"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ce073"/>
      <stop offset="100%" stop-color="#35a853"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="100%" stop-color="#e89438"/>
    </linearGradient>
    <linearGradient id="dinoBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6cf07a"/>
      <stop offset="100%" stop-color="#27a84f"/>
    </linearGradient>
    <linearGradient id="eggGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7b2"/>
      <stop offset="55%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#f28c18"/>
    </linearGradient>
  </defs>

  <!-- Radiant Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Warm Sun & Fluffy Clouds -->
  <circle cx="326" cy="70" r="42" fill="#ffe66d"/>
  <circle cx="326" cy="70" r="58" fill="#ffe66d" opacity="0.28"/>
  <g fill="#ffffff" opacity="0.92">
    <circle cx="72" cy="70" r="22"/><circle cx="96" cy="62" r="27"/><circle cx="122" cy="72" r="19"/>
    <rect x="72" y="68" width="50" height="24" rx="12"/>
  </g>
  <g fill="#ffffff" opacity="0.82">
    <circle cx="246" cy="112" r="16"/><circle cx="266" cy="106" r="20"/><circle cx="284" cy="114" r="14"/>
  </g>

  <!-- Rainbow Arc -->
  <path d="M 38 250 A 170 155 0 0 1 372 246" fill="none" stroke="#ff6ba9" stroke-width="10" opacity="0.45"/>
  <path d="M 48 250 A 160 145 0 0 1 362 246" fill="none" stroke="#ffd84d" stroke-width="10" opacity="0.48"/>
  <path d="M 58 250 A 150 135 0 0 1 352 246" fill="none" stroke="#4fe3c1" stroke-width="10" opacity="0.45"/>

  <!-- Curved Horizon Hills -->
  <ellipse cx="310" cy="300" rx="220" ry="110" fill="url(#hillBack)"/>
  <ellipse cx="145" cy="338" rx="260" ry="105" fill="url(#hillFront)"/>
  <path d="M 0 330 Q 200 282 400 326 L 400 400 L 0 400 Z" fill="#f7c45f"/>
  <path d="M 0 356 Q 200 318 400 352 L 400 400 L 0 400 Z" fill="#d97a30"/>

  <!-- Stylized Smooth Cactus & Bouncy Mushroom -->
  <g stroke="#24314a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 334 298 L 334 234 Q 334 220 346 220 Q 358 220 358 234 L 358 298 Z" fill="#32b859"/>
    <path d="M 334 264 L 320 264 Q 312 264 312 252 L 312 244 Q 312 236 319 236 Q 326 236 326 244 L 326 254 L 334 254" fill="#32b859"/>
    <circle cx="346" cy="218" r="7" fill="#ff6ba9"/>
  </g>
  <g stroke="#24314a" stroke-width="4.5" stroke-linejoin="round">
    <rect x="60" y="286" width="18" height="22" rx="6" fill="#fff2d2"/>
    <ellipse cx="69" cy="283" rx="28" ry="15" fill="#ff5578"/>
    <circle cx="58" cy="280" r="4.5" fill="#fff6e0" stroke="none"/>
    <circle cx="76" cy="276" r="5" fill="#fff6e0" stroke="none"/>
    <circle cx="84" cy="285" r="3.5" fill="#fff6e0" stroke="none"/>
  </g>

  <!-- Sonic Roar Wave Rings -->
  <ellipse cx="282" cy="184" rx="14" ry="34" fill="none" stroke="#fff3a0" stroke-width="6" opacity="0.9"/>
  <ellipse cx="308" cy="182" rx="20" ry="48" fill="none" stroke="#ff9f38" stroke-width="5" opacity="0.65"/>

  <!-- Floating Golden & Speckled Eggs (crisp vector shadow, no SVG filter) -->
  <ellipse cx="294" cy="182" rx="18" ry="5" fill="#1c2747" opacity="0.22"/>
  <ellipse cx="342" cy="193" rx="13" ry="4" fill="#1c2747" opacity="0.2"/>
  <g stroke="#24314a" stroke-width="5">
    <path d="M 294 126 C 306 126 313 146 313 154 C 313 166 304 172 294 172 C 284 172 275 166 275 154 C 275 146 282 126 294 126 Z" fill="url(#eggGold)"/>
    <ellipse cx="287" cy="145" rx="4" ry="7" fill="#ffffff" opacity="0.72" stroke="none"/>
    <path d="M 342 150 C 351 150 356 164 356 171 C 356 180 350 185 342 185 C 334 185 328 180 328 171 C 328 164 333 150 342 150 Z" fill="#fff6df"/>
    <circle cx="337" cy="168" r="3.5" fill="#38b6ff" stroke="none"/>
    <circle cx="347" cy="174" r="4" fill="#ff6ba9" stroke="none"/>
  </g>

  <!-- Soft Shadow under Leaping Dino -->
  <ellipse cx="176" cy="306" rx="58" ry="13" fill="#9c541f" opacity="0.38"/>

  <!-- Adorable Smooth Stylized Baby Dino -->
  <g transform="translate(172, 200) rotate(-8)">
    <!-- Rounded Dorsal Crests -->
    <g fill="#ff9f38" stroke="#24314a" stroke-width="5" stroke-linejoin="round">
      <circle cx="-48" cy="-16" r="10"/>
      <circle cx="-32" cy="-36" r="12"/>
      <circle cx="-8" cy="-56" r="11"/>
      <circle cx="16" cy="-62" r="10"/>
    </g>
    <!-- Back Leg -->
    <path d="M -20 44 L -32 74 Q -35 84 -22 86 L -4 86 Q 4 86 2 76 L -4 48 Z" fill="#239146" stroke="#24314a" stroke-width="5" stroke-linejoin="round"/>
    <!-- Wagging Smooth Tail -->
    <path d="M -38 20 Q -92 22 -106 -14 Q -80 -2 -44 -6 Z" fill="url(#dinoBody)" stroke="#24314a" stroke-width="5" stroke-linejoin="round"/>
    <!-- Chubby Pear Body -->
    <ellipse cx="-14" cy="18" rx="44" ry="48" fill="url(#dinoBody)" stroke="#24314a" stroke-width="5"/>
    <!-- Warm Cream Belly -->
    <ellipse cx="12" cy="24" rx="22" ry="34" fill="#fff3c4"/>
    <!-- Front Leg (jaunty leap!) -->
    <path d="M 6 44 L 22 68 Q 30 78 40 72 L 46 66 Q 52 58 42 50 L 22 36 Z" fill="#46d468" stroke="#24314a" stroke-width="5" stroke-linejoin="round"/>
    <!-- Tiny Cute Arm -->
    <path d="M 22 10 Q 44 10 42 22 Q 36 28 20 22 Z" fill="#5ce378" stroke="#24314a" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Smooth Rounded Head & Chubby Snout -->
    <path d="M -30 -34 C -30 -72 22 -76 48 -58 C 76 -48 82 -26 70 -10 C 56 6 20 6 -10 2 C -26 -2 -30 -16 -30 -34 Z" fill="url(#dinoBody)" stroke="#24314a" stroke-width="5" stroke-linejoin="round"/>
    <!-- Cute Smile & Cheek Blush -->
    <path d="M 38 -12 Q 56 -8 66 -18" fill="none" stroke="#24314a" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="26" cy="-16" rx="9" ry="5.5" fill="#ff7db5" opacity="0.72"/>
    <circle cx="58" cy="-34" r="3" fill="#1e7538"/>
    <!-- Big Expressive Glossy Eye -->
    <ellipse cx="24" cy="-38" rx="15" ry="18" fill="#1f2544"/>
    <circle cx="30" cy="-45" r="5.5" fill="#ffffff"/>
    <circle cx="20" cy="-31" r="2.8" fill="#ffffff"/>
    <!-- Mini Golden Crown Hat -->
    <path d="M -10 -66 L -14 -92 L 2 -78 L 12 -98 L 22 -78 L 36 -90 L 30 -64 Z" fill="#ffd23f" stroke="#24314a" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="11" cy="-74" r="4.5" fill="#ff4d79"/>
  </g>
</svg>
