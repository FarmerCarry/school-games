    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb0ff"/>
      <stop offset="0.62" stop-color="#9fdcff"/>
      <stop offset="1" stop-color="#ffe3a6"/>
    </linearGradient>
