<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" direction="rtl">
  <defs>
    <linearGradient id="deskBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3c687"/>
      <stop offset="100%" stop-color="#d29653"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#434968"/>
      <stop offset="100%" stop-color="#282d46"/>
    </linearGradient>
    <linearGradient id="kartRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7582"/>
      <stop offset="55%" stop-color="#ff384c"/>
      <stop offset="100%" stop-color="#b81d2d"/>
    </linearGradient>
    <linearGradient id="nitroFlame" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0%" stop-color="#fff7ae"/>
      <stop offset="45%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff4e00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5964"/>
      <stop offset="50%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Classroom Wooden Desk Surface -->
  <rect width="400" height="400" rx="32" fill="url(#deskBg)"/>
  <g stroke="#c28340" stroke-width="3" opacity="0.45">
    <line x1="0" y1="92" x2="400" y2="92"/>
    <line x1="0" y1="196" x2="400" y2="196"/>
    <line x1="0" y1="304" x2="400" y2="304"/>
  </g>

  <!-- Giant Classroom Props: Red Crayon & Pink/Blue Eraser -->
  <g transform="translate(68 118) rotate(-22)">
    <rect x="-52" y="-14" width="94" height="28" rx="6" fill="#ef4444" stroke="#1b1640" stroke-width="4"/>
    <polygon points="42,-13 64,0 42,13" fill="#ef4444" stroke="#1b1640" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-28" y="-12" width="48" height="24" fill="#fee2e2" opacity="0.75"/>
  </g>
  <g transform="translate(332 320) rotate(16)">
    <rect x="-42" y="-22" width="84" height="44" rx="10" fill="#fb7185" stroke="#1b1640" stroke-width="4"/>
    <rect x="10" y="-22" width="32" height="44" rx="8" fill="#38bdf8" stroke="#1b1640" stroke-width="4"/>
  </g>

  <!-- Sweeping Micro-Machines Track Curve -->
  <path d="M -30 330 Q 155 315 395 160" fill="none" stroke="#1b1640" stroke-width="148" stroke-linecap="round"/>
  <path d="M -30 330 Q 155 315 395 160" fill="none" stroke="#ffffff" stroke-width="134" stroke-linecap="round"/>
  <path d="M -30 330 Q 155 315 395 160" fill="none" stroke="#ff5964" stroke-width="134" stroke-dasharray="34 34" stroke-linecap="round"/>
  <path d="M -30 330 Q 155 315 395 160" fill="none" stroke="url(#roadGrad)" stroke-width="114" stroke-linecap="round"/>
  <path d="M -30 330 Q 155 315 395 160" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-dasharray="22 24" stroke-linecap="round"/>

  <!-- Wooden Centimeter Ruler Stunt Ramp -->
  <g transform="translate(154 274) rotate(-25)">
    <rect x="-78" y="-32" width="156" height="64" rx="10" fill="#fbbf24" stroke="#1b1640" stroke-width="4.5"/>
    <rect x="-66" y="-24" width="132" height="10" rx="4" fill="#fef08a"/>
    <g stroke="#1b1640" stroke-width="3">
      <line x1="-56" y1="-32" x2="-56" y2="-16"/>
      <line x1="-32" y1="-32" x2="-32" y2="-20"/>
      <line x1="-8" y1="-32" x2="-8" y2="-16"/>
      <line x1="16" y1="-32" x2="16" y2="-20"/>
      <line x1="40" y1="-32" x2="40" y2="-16"/>
      <line x1="64" y1="-32" x2="64" y2="-20"/>
    </g>
    <polyline points="-18,-10 0,4 -18,18" fill="none" stroke="#00e5ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="14,-10 32,4 14,18" fill="none" stroke="#00e5ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Rainbow Classroom Surprise Box & Gold Coins -->
  <g transform="translate(332 156) rotate(10)">
    <rect x="-28" y="-28" width="56" height="56" rx="13" fill="url(#boxGrad)" stroke="#1b1640" stroke-width="4.5"/>
    <text x="0" y="10" text-anchor="middle" font-family="Fredoka, Cairo, sans-serif" font-weight="900" font-size="32" fill="#1b1640">؟</text>
  </g>
  <g transform="translate(284 218)">
    <circle r="15" fill="#ffd23f" stroke="#1b1640" stroke-width="3.5"/>
    <circle r="9" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  </g>

  <!-- Blue & Orange Drift Sparks + Twin Nitro Flames -->
  <g transform="translate(208 206) rotate(-26)">
    <ellipse cx="-92" cy="-14" rx="58" ry="14" fill="url(#nitroFlame)"/>
    <ellipse cx="-92" cy="14" rx="58" ry="14" fill="url(#nitroFlame)"/>
    <circle cx="-68" cy="28" r="11" fill="#ff7b00"/>
    <circle cx="-88" cy="34" r="8" fill="#00e5ff"/>
    <circle cx="-54" cy="-30" r="9" fill="#00e5ff"/>

    <!-- Drop shadow -->
    <ellipse cx="4" cy="34" rx="64" ry="20" fill="#120e2e" opacity="0.38"/>

    <!-- Back Tires -->
    <rect x="-54" y="-44" width="34" height="16" rx="7" fill="#1e2436" stroke="#1b1640" stroke-width="4"/>
    <rect x="24" y="-44" width="34" height="16" rx="7" fill="#1e2436" stroke="#1b1640" stroke-width="4"/>

    <!-- Exhaust Pipes & Gold Spoiler -->
    <rect x="-72" y="-20" width="18" height="11" rx="4" fill="#cbd5e1" stroke="#1b1640" stroke-width="3.5"/>
    <rect x="-72" y="9" width="18" height="11" rx="4" fill="#cbd5e1" stroke="#1b1640" stroke-width="3.5"/>
    <rect x="-66" y="-36" width="20" height="72" rx="8" fill="#ffd23f" stroke="#1b1640" stroke-width="4.5"/>

    <!-- Chunky Zoomed-In Cartoon Kart Chassis -->
    <rect x="-58" y="-32" width="124" height="64" rx="24" fill="url(#kartRed)" stroke="#1b1640" stroke-width="5"/>
    <rect x="-42" y="-10" width="98" height="20" rx="8" fill="#ffd23f"/>
    <rect x="26" y="-22" width="24" height="8" rx="4" fill="#ffffff" opacity="0.55"/>

    <!-- Cockpit & Racer Helmet -->
    <rect x="-22" y="-21" width="46" height="42" rx="16" fill="#1e2436" stroke="#1b1640" stroke-width="4"/>
    <circle cx="0" cy="0" r="19" fill="#ffffff" stroke="#1b1640" stroke-width="4"/>
    <rect x="3" y="-13" width="15" height="26" rx="6" fill="#38bdf8" stroke="#1b1640" stroke-width="3"/>

    <!-- Front Tires -->
    <rect x="-54" y="28" width="34" height="16" rx="7" fill="#1e2436" stroke="#1b1640" stroke-width="4"/>
    <rect x="24" y="28" width="34" height="16" rx="7" fill="#1e2436" stroke="#1b1640" stroke-width="4"/>
  </g>

  <!-- Title Banner Badge -->
  <g transform="translate(200 56)">
    <rect x="-166" y="-34" width="332" height="68" rx="22" fill="#1b1640" opacity="0.92" stroke="#ffd23f" stroke-width="4.5"/>
    <text x="0" y="12" text-anchor="middle" font-family="Fredoka, Cairo, Tajawal, sans-serif" font-weight="900" font-size="42" fill="#ffd23f" stroke="#120e2e" stroke-width="2">سباق المكاتب</text>
  </g>
</svg>
