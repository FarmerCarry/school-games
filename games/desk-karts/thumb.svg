<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60c8ff"/>
      <stop offset="52%" stop-color="#9fe2ff"/>
      <stop offset="100%" stop-color="#d89b56"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5aa63"/>
      <stop offset="100%" stop-color="#b97236"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2eb88c"/>
      <stop offset="100%" stop-color="#1e8a68"/>
    </linearGradient>
    <linearGradient id="kartRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6670"/>
      <stop offset="100%" stop-color="#e0243a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff078"/>
      <stop offset="100%" stop-color="#ffae00"/>
    </linearGradient>
  </defs>

  <!-- Sunlit classroom sky + wooden desk surface -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <path d="M-20 175 L420 145 L420 420 L-20 420 Z" fill="url(#wood)" stroke="#4c2c12" stroke-width="6"/>

  <!-- Green cutting mat + sweeping track curve -->
  <path d="M18 206 L382 178 L394 390 L6 390 Z" fill="url(#road)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <path d="M-10 340 Q190 225 415 245" fill="none" stroke="#fff394" stroke-width="7" stroke-dasharray="18 14" stroke-linecap="round"/>

  <!-- Giant Yellow Pencil track barrier in background -->
  <g transform="translate(198,176) rotate(-7)">
    <rect x="-150" y="-14" width="235" height="28" rx="6" fill="#ffca28" stroke="#222842" stroke-width="5"/>
    <rect x="-150" y="-5" width="235" height="8" fill="#ffe47a"/>
    <rect x="-174" y="-14" width="26" height="28" fill="#d4dbe6" stroke="#222842" stroke-width="5"/>
    <rect x="-202" y="-13" width="30" height="26" rx="7" fill="#ff7da8" stroke="#222842" stroke-width="5"/>
    <polygon points="85,-14 134,0 85,14" fill="#f3cfa0" stroke="#222842" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="116,-5 134,0 116,5" fill="#222842"/>
  </g>

  <!-- Checkered gantry banner top-right -->
  <g transform="translate(292,102) rotate(6)">
    <rect x="-4" y="0" width="12" height="86" rx="4" fill="#22a7ff" stroke="#222842" stroke-width="4"/>
    <rect x="64" y="0" width="12" height="86" rx="4" fill="#ff4a5e" stroke="#222842" stroke-width="4"/>
    <rect x="-12" y="-10" width="96" height="24" rx="6" fill="#222842" stroke="#222842" stroke-width="4"/>
    <rect x="-6" y="-4" width="16" height="12" fill="#fff"/>
    <rect x="26" y="-4" width="16" height="12" fill="#fff"/>
    <rect x="58" y="-4" width="16" height="12" fill="#fff"/>
  </g>

  <!-- Pink bouncy eraser & stacked book ramp -->
  <g transform="translate(76,225) rotate(-14)">
    <rect x="-32" y="-16" width="64" height="32" rx="8" fill="#ff7aa8" stroke="#222842" stroke-width="5"/>
    <rect x="-32" y="-16" width="26" height="32" rx="5" fill="#32a4ff" stroke="#222842" stroke-width="5"/>
  </g>

  <!-- Turbo flames behind hero kart -->
  <path d="M74 282 L134 268 L128 308 Z" fill="#ff6b22" stroke="#222842" stroke-width="4" stroke-linejoin="round"/>
  <path d="M94 284 L132 275 L128 298 Z" fill="#fff059"/>
  <!-- Drift sparks -->
  <g fill="#4df5ff" stroke="#222842" stroke-width="2.5">
    <polygon points="108,314 114,302 122,316"/>
    <polygon points="84,305 92,296 98,308" fill="#ffe047"/>
    <polygon points="122,326 130,316 136,328" fill="#ffe047"/>
  </g>

  <!-- Hero 3D-shaded chunky Toy Kart -->
  <ellipse cx="206" cy="316" rx="84" ry="22" fill="#142336" opacity="0.32"/>
  <g transform="translate(206,272) rotate(-5)">
    <!-- Rear wing -->
    <rect x="-82" y="-44" width="28" height="12" rx="4" fill="#ffd54f" stroke="#222842" stroke-width="5"/>
    <rect x="-72" y="-32" width="10" height="22" fill="#dce5f2" stroke="#222842" stroke-width="4"/>
    <!-- Back tires -->
    <rect x="-68" y="4" width="38" height="32" rx="12" fill="#222842"/>
    <circle cx="-49" cy="20" r="8" fill="#ffd54f"/>
    <!-- Chassis -->
    <path d="M-74 12 L-64 -18 L48 -16 L84 4 L80 22 L-72 22 Z" fill="url(#kartRed)" stroke="#222842" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-56 -8 L48 -6 L68 6 L-58 6 Z" fill="#ffd54f" opacity="0.9"/>
    <!-- Front tire -->
    <rect x="30" y="6" width="36" height="30" rx="11" fill="#222842"/>
    <circle cx="48" cy="21" r="8" fill="#ffd54f"/>
    <!-- Cute big-eyed driver helmet -->
    <circle cx="-6" cy="-42" r="28" fill="#ffffff" stroke="#222842" stroke-width="6"/>
    <path d="M-24 -64 Q-4 -72 16 -60" fill="none" stroke="#ff4252" stroke-width="8" stroke-linecap="round"/>
    <rect x="-2" y="-52" width="26" height="18" rx="8" fill="#222842"/>
    <circle cx="8" cy="-43" r="5" fill="#fff"/>
    <circle cx="19" cy="-43" r="5" fill="#fff"/>
    <circle cx="10" cy="-43" r="2.6" fill="#222842"/>
    <circle cx="21" cy="-43" r="2.6" fill="#222842"/>
  </g>

  <!-- Gold spinning coin top-left -->
  <g transform="translate(66,132)">
    <circle r="22" fill="url(#gold)" stroke="#222842" stroke-width="5"/>
    <circle r="13" fill="none" stroke="#fff7b2" stroke-width="3"/>
  </g>
</svg>
