<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="58%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="goldEgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7b2"/>
      <stop offset="50%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd23f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky & Action Rays -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g opacity="0.24" fill="#ffffff">
    <polygon points="200,210 -20,70 40,20"/>
    <polygon points="200,210 150,-10 230,-10"/>
    <polygon points="200,210 360,20 420,85"/>
  </g>

  <!-- Distant Canyon Hills & Meadow -->
  <path d="M0 245 Q95 205 205 238 T400 225 L400 400 L0 400 Z" fill="#22c55e" stroke="#1b1640" stroke-width="5"/>
  <path d="M0 278 Q130 250 265 276 T400 265 L400 400 L0 400 Z" fill="url(#lawn)" stroke="#1b1640" stroke-width="5"/>

  <!-- Turbo Speed Track -->
  <path d="M-10 342 Q155 292 410 336 L410 392 Q155 348 -10 395 Z" fill="#f59e0b" opacity="0.38"/>
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="26" y1="298" x2="88" y2="292"/>
    <line x1="18" y1="330" x2="72" y2="326"/>
    <line x1="120" y1="364" x2="188" y2="358"/>
  </g>

  <!-- Funny Surprised T-Rex Guard (Right) -->
  <g transform="translate(314 236)">
    <ellipse cx="0" cy="64" rx="44" ry="13" fill="#1b1640" opacity="0.28"/>
    <!-- Body & Tail -->
    <path d="M18 36 L62 18 L42 54 Z" fill="#16a34a" stroke="#1b1640" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="0" cy="26" rx="34" ry="38" fill="#22c55e" stroke="#1b1640" stroke-width="5"/>
    <ellipse cx="-6" cy="30" rx="20" ry="24" fill="#86efac"/>
    <!-- Big Snout & Head -->
    <rect x="-46" y="-28" width="66" height="44" rx="18" fill="#22c55e" stroke="#1b1640" stroke-width="5"/>
    <!-- Spikes -->
    <polygon points="14,-28 24,-40 28,-22" fill="#ff9f1c" stroke="#1b1640" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="22,-14 34,-22 32,-6" fill="#ff9f1c" stroke="#1b1640" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Teeth -->
    <polygon points="-38,16 -31,26 -24,16" fill="#ffffff" stroke="#1b1640" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="-22,16 -15,25 -8,16" fill="#ffffff" stroke="#1b1640" stroke-width="3" stroke-linejoin="round"/>
    <!-- Wide Surprised Eye -->
    <circle cx="-12" cy="-10" r="11" fill="#ffffff" stroke="#1b1640" stroke-width="4"/>
    <circle cx="-15" cy="-10" r="5" fill="#1b1640"/>
    <circle cx="-17" cy="-13" r="2" fill="#ffffff"/>
    <!-- Speech Bubble -->
    <g transform="translate(-26 -64)">
      <rect x="-28" y="-22" width="56" height="38" rx="14" fill="#ffffff" stroke="#1b1640" stroke-width="4.5"/>
      <polygon points="-6,16 6,16 -2,28" fill="#ffffff" stroke="#1b1640" stroke-width="4" stroke-linejoin="round"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="800" font-size="24" fill="#ef4444" direction="rtl">؟!</text>
    </g>
  </g>

  <!-- Squeaky Decoy Duck -->
  <g transform="translate(242 328) rotate(-8)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#fde047" stroke-width="3.5" stroke-dasharray="6 5"/>
    <ellipse cx="0" cy="6" rx="15" ry="11" fill="#ffe135" stroke="#1b1640" stroke-width="4"/>
    <circle cx="8" cy="-6" r="10" fill="#ffe135" stroke="#1b1640" stroke-width="4"/>
    <polygon points="16,-8 25,-5 16,-1" fill="#ff7b00" stroke="#1b1640" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="10" cy="-8" r="2.5" fill="#1b1640"/>
  </g>

  <!-- Trailing 3-Egg Turbo Conga-Line -->
  <path d="M52 292 Q102 315 164 282" fill="none" stroke="#ffd23f" stroke-width="7" stroke-linecap="round"/>

  <!-- Egg 3: Cyber Egg -->
  <g transform="translate(46 286) rotate(-16)">
    <circle cx="0" cy="0" r="28" fill="url(#halo)"/>
    <path d="M0 -22 C17 -20 19 17 0 19 C-19 17 -17 -20 0 -22 Z" fill="#38bdf8" stroke="#1b1640" stroke-width="4.5"/>
    <path d="M-10 2 L0 -6 L10 2" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Egg 2: Spotted Dino Egg -->
  <g transform="translate(92 298) rotate(-8)">
    <circle cx="0" cy="0" r="32" fill="url(#halo)"/>
    <path d="M0 -25 C20 -22 21 19 0 21 C-21 19 -20 -22 0 -25 Z" fill="#4ade80" stroke="#1b1640" stroke-width="4.5"/>
    <circle cx="-6" cy="2" r="4.5" fill="#f43f5e"/>
    <circle cx="7" cy="-5" r="3.8" fill="#f43f5e"/>
    <circle cx="3" cy="9" r="3.2" fill="#fde047"/>
  </g>

  <!-- Egg 1: Glowing Golden Egg -->
  <g transform="translate(138 292) rotate(6)">
    <circle cx="0" cy="0" r="36" fill="url(#halo)"/>
    <path d="M0 -27 C22 -24 23 21 0 23 C-23 21 -22 -24 0 -27 Z" fill="url(#goldEgg)" stroke="#1b1640" stroke-width="4.5"/>
    <ellipse cx="-6" cy="-8" rx="4.5" ry="8" transform="rotate(18 -6 -8)" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Turbo Hero Runner (Center-Left, Dashing Fast!) -->
  <g transform="translate(192 268) rotate(-6)">
    <ellipse cx="0" cy="48" rx="36" ry="11" fill="#1b1640" opacity="0.3"/>
    <!-- Red Turbo Scarf -->
    <path d="M-16 4 L-58 -6 L-48 10 L-60 24 L-14 18 Z" fill="#ff3b5c" stroke="#1b1640" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Body & Helmet -->
    <circle cx="0" cy="4" r="34" fill="#2b8cff" stroke="#1b1640" stroke-width="5.5"/>
    <!-- Golden Visor Crest -->
    <path d="M-24 -18 Q4 -38 30 -12 L22 -2 Q2 -18 -18 -6 Z" fill="#ffd23f" stroke="#1b1640" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Determined Happy Eyes -->
    <circle cx="4" cy="4" r="9.5" fill="#ffffff" stroke="#1b1640" stroke-width="3.8"/>
    <circle cx="24" cy="4" r="9.5" fill="#ffffff" stroke="#1b1640" stroke-width="3.8"/>
    <circle cx="7" cy="4" r="4.8" fill="#1b1640"/>
    <circle cx="27" cy="4" r="4.8" fill="#1b1640"/>
    <circle cx="5" cy="1" r="2" fill="#ffffff"/>
    <circle cx="25" cy="1" r="2" fill="#ffffff"/>
    <!-- Big Grin -->
    <path d="M6 18 Q15 28 24 18" fill="none" stroke="#1b1640" stroke-width="4.2" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Stars -->
  <g fill="#ffd23f" stroke="#1b1640" stroke-width="3" stroke-linejoin="round">
    <polygon points="142,216 147,228 160,229 150,238 153,250 142,243 131,250 134,238 124,229 137,228"/>
    <polygon points="62,212 66,221 76,222 68,228 70,238 62,233 54,238 56,228 48,222 58,221"/>
  </g>

  <!-- Bold Cartoon Arabic Title Banner -->
  <g transform="translate(200 66)">
    <rect x="-152" y="-38" width="304" height="74" rx="26" fill="#1b1640" opacity="0.22" transform="translate(0 6)"/>
    <rect x="-152" y="-38" width="304" height="74" rx="26" fill="#ff3b5c" stroke="#1b1640" stroke-width="6"/>
    <rect x="-142" y="-30" width="284" height="24" rx="12" fill="#ffffff" opacity="0.22"/>
    <text x="0" y="14" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="800" font-size="48" direction="rtl" unicode-bidi="plaintext" stroke="#1b1640" stroke-width="9" paint-order="stroke fill" fill="#ffd23f">سباق البيض</text>
  </g>
</svg>
