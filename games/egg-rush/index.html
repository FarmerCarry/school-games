<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سباق البيض</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="game.css">
</head>
<body>
<canvas id="game" tabindex="0" aria-label="سباق البيض"></canvas>
<div id="ui">
  <div id="flash"></div>
  <div class="hud" id="hud" hidden>
    <div class="pill" id="coinPill" aria-label="العملات"><span class="coinrow"><i class="coin" aria-hidden="true"></i><b id="coins">0</b></span><span class="sub" id="speedLine">السرعة 4</span></div>
    <div class="pill" id="gatePill"><span class="sub">البوابة التالية</span><b id="gateLine">6</b></div>
    <div class="pill timer" id="timer" hidden>4:00</div>
    <div class="pill" id="p2coins" hidden>2: 0</div>
    <div class="grow" id="gads"></div>
    <button class="iconbtn" id="btnBook" type="button" aria-label="المجموعة">📖</button>
    <button class="iconbtn" id="btnShop" type="button" aria-label="المتجر">🛒</button>
    <button class="iconbtn" id="btnGear" type="button" aria-label="إعدادات">⚙</button>
    <button class="iconbtn" id="btnPause" type="button" aria-label="إيقاف مؤقت">⏸</button>
  </div>
  <div id="petbar" hidden><b id="petCount">+1</b><div id="petSlots"></div></div>
  <div id="dock" hidden>
    <div id="hint" hidden><span id="hintText"></span><button id="btnSkip" type="button">تخطَّ</button></div>
  </div>
  <div id="banner" hidden></div>

  <div class="ov" id="ovTitle">
    <div class="card">
      <h1>سباق البيض</h1>
      <p id="titleSub"></p>
      <div class="strip" aria-hidden="true">
        <svg viewBox="0 0 200 140">
          <rect width="200" height="140" rx="16" fill="#b6e7a0"/>
          <ellipse cx="118" cy="78" rx="28" ry="36" fill="#fff6d8" stroke="#2a2348" stroke-width="4"/>
          <path d="M46 96c18-8 28-28 30-46 8 6 20 8 28 4-6 22-8 40-2 58-16 6-36 4-56-16z" fill="#ffd7b5" stroke="#2a2348" stroke-width="4"/>
          <circle cx="108" cy="84" r="6" fill="#7ec8ff"/>
        </svg>
        <svg viewBox="0 0 200 140">
          <rect width="200" height="140" rx="16" fill="#d7f3c8"/>
          <ellipse cx="96" cy="88" rx="40" ry="28" fill="#fff" stroke="#2a2348" stroke-width="4"/>
          <path d="M78 70l6-22 10 16z" fill="#ff5a3c" stroke="#2a2348" stroke-width="3"/>
          <path d="M70 84h16M108 84h16" stroke="#2a2348" stroke-width="4" stroke-linecap="round"/>
          <text x="148" y="48" font-size="28" font-family="Fredoka, sans-serif" fill="#7eb6ff">Zzz</text>
        </svg>
        <svg viewBox="0 0 200 140">
          <rect width="200" height="140" rx="16" fill="#ffe7a8"/>
          <path d="M70 96c0-28 18-48 30-48s30 20 30 48z" fill="#fff6d8" stroke="#2a2348" stroke-width="4"/>
          <path d="M86 70l10 16 8-18 8 18 12-14" fill="none" stroke="#2a2348" stroke-width="3"/>
          <ellipse cx="118" cy="58" rx="16" ry="14" fill="#ffe14a" stroke="#2a2348" stroke-width="4"/>
          <circle cx="112" cy="56" r="2" fill="#2a2348"/><circle cx="124" cy="56" r="2" fill="#2a2348"/>
          <path d="M114 64c4 4 10 4 14 0" fill="none" stroke="#2a2348" stroke-width="2"/>
        </svg>
      </div>
      <div class="row">
        <button class="sg-btn big" id="btnPlay" type="button">▶</button>
        <button class="sg-btn secondary" id="btn2p" type="button">تحدي العشّين</button>
      </div>
    </div>
  </div>

  <div class="ov" id="ovPause" hidden>
    <div class="card">
      <h2>استراحة</h2>
      <p>الحيوانات تنتظرك، والبيضة في أمان.</p>
      <div class="row">
        <button class="sg-btn big" id="btnResume" type="button">استمرار</button>
        <button class="sg-btn secondary" id="btnMenu" type="button">القائمة</button>
      </div>
    </div>
  </div>

  <div class="ov" id="ovResult" hidden>
    <div class="burst" id="resultBurst" aria-hidden="true"></div>
    <div class="card">
      <div class="stars" id="resultStars" aria-hidden="true"></div>
      <h2 id="resultTitle">انتهى التحدي</h2>
      <p id="resultNew" hidden>رقم جديد!</p>
      <p id="resultSub"></p>
      <div class="grid mini" id="resultBook" hidden></div>
      <div class="row">
        <button class="sg-btn big" id="btnReplay" type="button">العب مرة أخرى</button>
        <button class="sg-btn secondary" id="btnResultMenu" type="button">القائمة</button>
      </div>
    </div>
  </div>

  <div class="ov" id="ovShop" hidden>
    <div class="card shop panel">
      <h2>المتجر</h2>
      <div id="shopList"></div>
      <div class="row"><button class="sg-btn secondary" id="btnShopClose" type="button">إغلاق</button></div>
    </div>
  </div>

  <div class="ov" id="ovBook" hidden>
    <div class="card shop panel">
      <h2>المجموعة</h2>
      <p id="bookSub"></p>
      <div class="grid" id="bookGrid"></div>
      <div id="penList"></div>
      <div class="row"><button class="sg-btn secondary" id="btnBookClose" type="button">إغلاق</button></div>
    </div>
  </div>

  <div class="ov" id="ovSet" hidden>
    <div class="card panel">
      <h2>إعدادات</h2>
      <p class="looklab">القميص</p>
      <div class="row" id="shirtRow"></div>
      <p class="looklab">القبعة</p>
      <div class="row" id="hatRow"></div>
      <div class="toggle"><span>خطف تلقائي للبيضة</span><button class="sg-btn" id="togGrab" type="button">لا</button></div>
      <div class="toggle"><span>المشي بالنقر</span><button class="sg-btn" id="togMove" type="button">لا</button></div>
      <div class="toggle"><span>الثعلب الليلي</span><button class="sg-btn" id="togFox" type="button">نعم</button></div>
      <div class="row"><button class="sg-btn secondary" id="btnSetClose" type="button">إغلاق</button></div>
    </div>
  </div>

  <div class="ov" id="ovCard" hidden>
    <div class="card panel">
      <div id="cardNew" hidden>جديد!</div>
      <h2 id="cardName"></h2>
      <p id="cardRate"></p>
      <div class="row" id="cardPens"></div>
      <div class="row"><button class="sg-btn" id="btnCardClose" type="button">حسنًا</button></div>
    </div>
  </div>
</div>
<script src="../../shared/kit.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="ui.js"></script>
</body>
</html>
