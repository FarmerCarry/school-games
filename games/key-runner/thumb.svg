    <text x="200" y="80" font-size="66" fill="#1c2250" stroke="#1c2250" stroke-width="16">عدّاء</text>
    <text x="200" y="76" font-size="66" fill="#ffd23f">عدّاء</text>
    <text x="200" y="138" font-size="58" fill="#1c2250" stroke="#1c2250" stroke-width="16">المفاتيح</text>
    <text x="200" y="134" font-size="58" fill="#ffffff">المفاتيح</text>
