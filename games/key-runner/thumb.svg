    <rect x="12" y="272" width="94" height="56" rx="12" fill="#3a4168" stroke="none"/>
  </g>
  <text x="20" y="300" font-family="Fredoka, 'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="30" fill="#ffffff">F</text>
  <text x="98" y="322" font-family="Fredoka, 'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="32" fill="#ffffff" text-anchor="end">ب</text>
  <circle cx="200" cy="296" r="92" fill="url(#glow)"/>
  <g stroke="#1c2250" stroke-width="5">
