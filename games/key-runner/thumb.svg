<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc0ff"/>
      <stop offset="1" stop-color="#d2f4ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe14d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe14d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="338" cy="150" r="34" fill="#fff27a" stroke="#1c2250" stroke-width="5"/>
  <path d="M-10 262 Q40 214 100 236 Q160 258 210 222 Q270 186 330 226 Q370 250 410 230 L410 300 L-10 300 Z" fill="#a3e86f"/>
  <path d="M-10 280 Q60 250 130 268 Q200 286 260 258 Q330 232 410 262 L410 320 L-10 320 Z" fill="#57bd4b" stroke="#1c2250" stroke-width="4"/>
  <!-- speed lines -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="10" y="150" width="70" height="7" rx="3.5"/>
    <rect x="34" y="176" width="54" height="7" rx="3.5"/>
    <rect x="0" y="202" width="64" height="7" rx="3.5"/>
  </g>
  <!-- posts and water -->
