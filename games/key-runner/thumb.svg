    <circle cx="1" cy="-10" r="6.5" fill="#1c2250"/><circle cx="27" cy="-10" r="6.5" fill="#1c2250"/>
    <circle cx="3" cy="-13" r="2.4" fill="#ffffff"/><circle cx="29" cy="-13" r="2.4" fill="#ffffff"/>
    <path d="M6 2 Q14 12 22 2 Z" fill="#7a1f3d" stroke="#1c2250" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-30 -28 Q-28 -52 2 -52 Q30 -52 32 -28 Z" fill="#3fa2ff" stroke="#1c2250" stroke-width="4" stroke-linejoin="round"/>
    <path d="M22 -32 Q46 -36 54 -26 Q40 -22 22 -24 Z" fill="#2a7fd6" stroke="#1c2250" stroke-width="4" stroke-linejoin="round"/>
