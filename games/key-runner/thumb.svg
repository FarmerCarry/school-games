    <ellipse cx="16" cy="40" rx="13" ry="8" fill="#7a3a10" stroke="#1c2250" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="40" ry="38" fill="#ff8a3d" stroke="#1c2250" stroke-width="6"/>
