    <rect x="152" y="262" width="96" height="58" rx="12" fill="#ffe14d" stroke="none"/>
  </g>
  <text x="162" y="292" font-family="Fredoka, 'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="32" fill="#1c2250">J</text>
  <text x="240" y="314" font-family="Fredoka, 'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="36" fill="#1c2250" text-anchor="end">ت</text>
  <path d="M186 228 L214 228 L200 248 Z" fill="#ffe14d" stroke="#1c2250" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#1c2250" stroke-width="5">
