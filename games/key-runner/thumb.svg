  <text x="268" y="214" font-family="Fredoka, 'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="46" fill="#ffffff" stroke="#1c2250" stroke-width="9" stroke-linejoin="round" paint-order="stroke">+1</text>
  <g fill="#ffd23f" stroke="#1c2250" stroke-width="3" stroke-linejoin="round">
    <path d="M250 176 L254 186 L264 187 L256 193 L259 203 L250 197 L241 203 L244 193 L236 187 L246 186 Z"/>
    <path d="M344 196 L347 203 L354 204 L349 208 L351 215 L344 211 L337 215 L339 208 L334 204 L341 203 Z"/>
