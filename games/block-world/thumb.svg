<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f93f0"/>
      <stop offset="1" stop-color="#bfe8ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd23a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ff8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3fe6dc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dirt" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#8a5a36"/>
      <rect x="3" y="4" width="4" height="3" fill="#6e4527"/>
      <rect x="12" y="11" width="5" height="3" fill="#6e4527"/>
      <rect x="14" y="2" width="3" height="2" fill="#a07048"/>
      <rect x="5" y="14" width="3" height="3" fill="#a07048"/>
    </pattern>
    <pattern id="stone" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#5e5e68"/>
      <rect x="2" y="3" width="6" height="3" fill="#6e6e78"/>
      <rect x="11" y="12" width="6" height="3" fill="#4c4c56"/>
      <rect x="13" y="4" width="3" height="3" fill="#71717b"/>
      <rect x="4" y="13" width="3" height="3" fill="#4c4c56"/>
    </pattern>
    <pattern id="leaf" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#3a9e32"/>
      <rect x="2" y="3" width="6" height="4" fill="#56c244"/>
      <rect x="11" y="10" width="6" height="4" fill="#56c244"/>
      <rect x="12" y="2" width="4" height="3" fill="#2a7a25"/>
      <rect x="3" y="12" width="4" height="4" fill="#2a7a25"/>
      <rect x="2" y="3" width="2" height="2" fill="#86e070"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <!-- sun & clouds -->
  <circle cx="330" cy="150" r="70" fill="url(#sun)"/>
  <rect x="306" y="126" width="48" height="48" fill="#ffe45c"/>
  <rect x="314" y="134" width="32" height="32" fill="#fff4a8"/>
  <g fill="#ffffff">
    <rect x="18" y="140" width="80" height="20" rx="10"/>
    <circle cx="44" cy="140" r="16"/><circle cx="70" cy="134" r="20"/>
  </g>
  <!-- far hills -->
  <path d="M0 250 L40 210 L80 232 L130 190 L180 226 L230 196 L290 230 L340 200 L400 226 L400 300 L0 300 Z" fill="#8fc0a8"/>
  <!-- tree -->
  <rect x="44" y="200" width="20" height="80" fill="#7a5230"/>
  <rect x="50" y="200" width="4" height="80" fill="#5e3e20"/>
  <path d="M14 220 v-20 h10 v-20 h10 v-10 h40 v10 h10 v20 h10 v20 h-10 v10 h-70 v-10 Z" fill="url(#leaf)"/>
  <!-- ground: grass steps -->
  <path d="M0 280 H120 V260 H240 V280 H300 V250 H400 V400 H0 Z" fill="url(#dirt)"/>
  <path d="M0 280 H120 V260 H240 V280 H300 V250 H400 V262 H300 V292 H240 V272 H120 V292 H0 Z" fill="#5cc23c"/>
  <path d="M0 290 H120 V270 H240 V290 H300 V260 H400 V264 H300 V294 H240 V274 H120 V294 H0 Z" fill="#3f942a"/>
  <!-- underground cave with ores -->
  <path d="M0 330 H400 V400 H0 Z" fill="url(#stone)"/>
  <path d="M170 350 h60 v-10 h40 v20 h20 v40 H150 v-30 h20 Z" fill="#26263a"/>
  <circle cx="215" cy="378" r="40" fill="url(#glow)"/>
  <g>
    <rect x="30" y="345" width="20" height="20" fill="#5e5e68"/>
    <rect x="34" y="349" width="6" height="6" fill="#ffd23a"/><rect x="42" y="356" width="5" height="5" fill="#ffd23a"/><rect x="34" y="349" width="2" height="2" fill="#fffbc0"/>
    <rect x="330" y="350" width="20" height="20" fill="#5e5e68"/>
    <rect x="333" y="353" width="7" height="6" fill="#3fe6dc"/><rect x="341" y="360" width="6" height="6" fill="#3fe6dc"/><rect x="333" y="353" width="2" height="2" fill="#e8ffff"/>
    <rect x="90" y="370" width="20" height="20" fill="#5e5e68"/>
    <rect x="93" y="374" width="6" height="5" fill="#e07a3c"/><rect x="101" y="381" width="5" height="5" fill="#e07a3c"/>
  </g>
  <!-- big diamond sparkle in cave -->
  <g transform="translate(200 360)">
    <path d="M6 0 h18 l8 8 l-17 22 l-17 -22 Z" fill="#3fe6dc" stroke="#1a8f8c" stroke-width="2"/>
    <path d="M6 0 h8 l-6 8 h-8 Z" fill="#b8fffb"/>
  </g>
  <!-- block being mined with pop particles -->
  <rect x="262" y="210" width="40" height="40" fill="url(#dirt)" stroke="#3f2a18" stroke-width="2"/>
  <rect x="262" y="210" width="40" height="10" fill="#5cc23c"/>
  <path d="M282 222 l6 8 l-4 6 l8 6 M282 230 l-8 6" stroke="#2a1a0c" stroke-width="3" fill="none"/>
  <rect x="310" y="196" width="10" height="10" fill="#8a5a36"/>
  <rect x="318" y="178" width="7" height="7" fill="#5cc23c"/>
  <rect x="300" y="182" width="8" height="8" fill="#6e4527"/>
  <!-- player -->
  <g transform="translate(206 260)">
    <rect x="-12" y="-36" width="11" height="26" fill="#3b4a8c"/>
    <rect x="1" y="-36" width="11" height="26" fill="#2f3c78"/>
    <rect x="-13" y="-12" width="12" height="12" fill="#3a2a1a"/>
    <rect x="1" y="-12" width="12" height="12" fill="#3a2a1a"/>
    <rect x="-14" y="-68" width="28" height="34" fill="#2fb5a8"/>
    <rect x="-14" y="-68" width="28" height="5" fill="#5fd8cc"/>
    <rect x="-16" y="-100" width="32" height="32" fill="#f2c49b"/>
    <rect x="-18" y="-104" width="36" height="11" fill="#5a3418"/>
    <rect x="-18" y="-104" width="10" height="22" fill="#5a3418"/>
    <rect x="4" y="-88" width="9" height="9" fill="#ffffff"/>
    <rect x="8" y="-86" width="5" height="6" fill="#1d2340"/>
    <rect x="1" y="-76" width="7" height="3" fill="#ff9a9a"/>
    <!-- arm + pickaxe raised -->
    <g transform="translate(6 -62) rotate(-60)">
      <rect x="0" y="-5" width="26" height="10" fill="#27978c"/>
      <rect x="22" y="-5" width="7" height="10" fill="#f2c49b"/>
      <g transform="translate(28 0) rotate(20)">
        <rect x="-3" y="-4" width="40" height="8" fill="#7a5230"/>
        <path d="M30 -24 q16 24 0 48 l-8 -2 q12 -22 0 -44 Z" fill="#4ef0e6" stroke="#1fa8a4" stroke-width="2"/>
      </g>
    </g>
  </g>
  <!-- pig -->
  <g transform="translate(355 250)">
    <rect x="-18" y="-10" width="7" height="10" fill="#e0899c"/><rect x="8" y="-10" width="7" height="10" fill="#e0899c"/>
    <rect x="-22" y="-32" width="38" height="23" fill="#f7a8ba"/>
    <rect x="10" y="-40" width="20" height="20" fill="#f7a8ba"/>
    <rect x="24" y="-30" width="10" height="8" fill="#ee7f98"/>
    <rect x="19" y="-35" width="4" height="4" fill="#1d2340"/>
  </g>
  <!-- logo -->
  <g font-family="Fredoka, 'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-weight="900" text-anchor="middle">
    <g transform="translate(200 62) rotate(-4)">
      <rect x="-150" y="-42" width="300" height="70" rx="16" fill="#1d2340" opacity="0.35" transform="translate(4 6)"/>
      <rect x="-150" y="-42" width="300" height="70" rx="16" fill="#5cc23c"/>
      <rect x="-150" y="-6" width="300" height="34" rx="0" fill="#946340"/>
      <rect x="-150" y="-10" width="300" height="6" fill="#3f942a"/>
      <rect x="-150" y="-42" width="300" height="70" rx="16" fill="none" stroke="#ffffff" stroke-width="5"/>
      <text x="0" y="16" font-size="54" fill="#1d2340" opacity="0.4" transform="translate(3 4)">BLOCK</text>
      <text x="0" y="16" font-size="54" fill="#ffffff" stroke="#1d2340" stroke-width="3" paint-order="stroke">BLOCK</text>
    </g>
    <g transform="translate(212 118) rotate(3)">
      <rect x="-118" y="-34" width="236" height="56" rx="14" fill="#1d2340" opacity="0.35" transform="translate(4 6)"/>
      <rect x="-118" y="-34" width="236" height="56" rx="14" fill="#ffcc00"/>
      <rect x="-118" y="-6" width="236" height="28" fill="#8e8e96"/>
      <rect x="-118" y="-10" width="236" height="5" fill="#d49a10"/>
      <rect x="-118" y="-34" width="236" height="56" rx="14" fill="none" stroke="#ffffff" stroke-width="5"/>
      <text x="0" y="12" font-size="44" fill="#ffffff" stroke="#1d2340" stroke-width="3" paint-order="stroke">WORLD</text>
    </g>
  </g>
</svg>
