<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عالم المكعبات</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" tabindex="0" aria-label="عالم المكعبات: الأسهم للحركة والحفر التلقائي والنفاثة، ومسافة أو النقر لتفجير TNT."></canvas>
<button type="button" id="pausebtn" class="pbtn" hidden aria-label="إيقاف مؤقت" title="إيقاف مؤقت (P / Esc)">❚❚</button>

<div id="ui">
  <!-- Minimal 1-Click Title Screen over Live Animated Mine -->
  <section id="title" class="ov" aria-label="عالم المكعبات">
    <div class="title-top">
      <div class="stat-pill gem-pill"><span>💎</span><b id="titleGems" dir="ltr">0</b></div>
      <div class="stat-pill star-pill"><span>★</span><b id="titleStars" dir="ltr">0</b></div>
      <div class="stat-pill win-pill" id="titleWinsPill" hidden><span>🏆</span><b id="titleWins" dir="ltr">0</b></div>
    </div>

    <div class="title-center">
      <h1 class="logo"><span class="lw g">عالم</span><span class="lw o">المكعبات</span></h1>
      <div class="tag">احفر بالنفاثة • فجّر TNT • اجمع 3 آثار واهرب!</div>

      <button type="button" id="playBtn" class="hero-play">▶ انطلق للمنجم!</button>

      <div class="mode-toggle" role="group" aria-label="وضع اللعب">
        <button type="button" id="modeSurv" class="mbtn on" aria-pressed="true">⚡ سباق 90 ثانية</button>
        <button type="button" id="modeFree" class="mbtn" aria-pressed="false">🧱 وضع حر</button>
      </div>

      <div class="keys-strip">
        <span><span dir="ltr"><span class="sg-key">WASD</span> / <span class="sg-key">الأسهم</span></span> حفر ونفاثة</span>
        <span class="sep">•</span>
        <span><span dir="ltr"><span class="sg-key">مسافة</span> / <span class="sg-key">نقر</span></span> تفجير TNT</span>
      </div>
    </div>
  </section>

  <!-- Minimal High-Contrast In-Game HUD -->
  <div id="hud" hidden>
    <div class="hud-left">
      <div class="relics-pill" id="relicsHud" aria-label="الآثار">
        <span class="r-slot" data-i="0">👑</span>
        <span class="r-slot" data-i="1">💎</span>
        <span class="r-slot" data-i="2">🌟</span>
        <b id="hudRelics" dir="ltr">0/3</b>
      </div>
      <div class="stat-pill gem-pill"><span>💎</span><b id="hudGems" dir="ltr">0</b></div>
      <div class="fuel-pill" title="وقود النفاثة">
        <span>🚀</span>
        <div class="fuel-bar"><i id="fuelFill"></i></div>
      </div>
    </div>

    <div class="hud-center">
      <div class="timer-pill" id="timerPill"><b id="hudTime" dir="ltr">90</b><span id="hudTimeUnit">ث</span></div>
      <div class="goal-pill" id="hudGoal">اجمع 3 آثار متوهجة!</div>
    </div>

    <button type="button" id="tntBtn" class="tnt-fab" aria-label="زرع قنبلة TNT" title="قنبلة TNT (مسافة أو نقر)">
      <span class="tnt-ico">💣</span>
      <span class="tnt-meta"><b>TNT</b><small id="tntAmmo" dir="ltr">3/3</small></span>
    </button>

    <!-- Free Sandbox 4-block quick-build bar -->
    <div id="sandboxBar" class="sandbox-bar" hidden role="group" aria-label="اختر مكعب للبناء (نقرة يمين)"></div>

    <div id="banner" class="mine-banner" hidden></div>
  </div>

  <!-- Pause Overlay -->
  <section id="pause" class="ov dim" aria-label="إيقاف مؤقت" hidden>
    <div class="panel pause-panel">
      <h2>استراحة</h2>
      <div class="pause-stats" id="pauseStats"></div>
      <div class="btn-row">
        <button type="button" class="sg-btn good" id="resumeBtn">▶ متابعة</button>
        <button type="button" class="sg-btn" id="restartBtn">↻ جولة جديدة</button>
        <button type="button" class="sg-btn secondary" id="quitBtn">🏠 الرئيسية</button>
      </div>
      <div class="hint2"><span dir="ltr"><span class="sg-key">P</span></span> متابعة • <span dir="ltr"><span class="sg-key">R</span></span> إعادة</div>
    </div>
  </section>

  <!-- Victory / Time-Up Result Card with 1-Click Upgrades (skybound-golf DNA!) -->
  <section id="result" class="ov dim" aria-label="نتيجة الجولة" hidden>
    <div class="panel result-panel">
      <h2 id="resTitle">هربت بالكنز!</h2>
      <div class="res-stars" id="resStars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
      <div class="res-summary">
        <div class="stat-pill gem-pill"><span>💎</span><b id="resGems" dir="ltr">0</b></div>
        <div class="stat-pill star-pill"><span>🏆</span><b id="resScore" dir="ltr">0</b></div>
        <div class="stat-pill" id="resBankPill"><span>🏦 رصيدك:</span><b id="resBank" dir="ltr">0</b></div>
      </div>
      <div id="resSub" class="res-sub"></div>

      <div class="up-head">⚡ طوّر معدّاتك للجولة القادمة</div>
      <div id="upgradeGrid" class="up-grid"></div>

      <div class="btn-row">
        <button type="button" class="hero-play small" id="againBtn">▶ جولة جديدة</button>
        <button type="button" class="sg-btn secondary" id="resultHome">🏠 الرئيسية</button>
      </div>
    </div>
  </section>
</div>

<div id="live" class="sr" aria-live="polite"></div>
<script src="../../shared/kit.js"></script>
<script src="../../shared/juice.js"></script>
<script src="data.js"></script>
<script src="world.js"></script>
<script src="render.js"></script>
<script src="game.js"></script>
</body>
</html>
