}.dots span{width:14px;height:14px;border-radius:50%;background:#ffffff4d}.dots span.on{background:#fff}.skins{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}.skins.trails{grid-template-columns:repeat(8,minmax(0,1fr))}.skin{position:relative;border-radius:18px;border:4px solid rgba(255,255,255,.35);background:#ffffff1f;cursor:pointer;padding:4px 2px 6px;font-family:inherit;color:#fff;display:flex;flex-direction:column;align-items:center}.skin canvas{width:76px;height:76px}.trails .skin canvas{width:100px;height:64px}.skin .nm{font-size:14px;font-weight:700;white-space:nowrap}.skin.sel{border-color:#ffe14d;background:#ffe14d40;box-shadow:0 0 0 3px #ffe14d}.skin:hover:not(.lock){background:#ffffff3d;border-color:#fff}.skin.lock canvas{filter:brightness(0) opacity(.35)}.skin .req{position:absolute;top:30px;left:0;right:0;font-size:20px;font-weight:700;color:#ffd21f;text-shadow:0 2px 0 #000}.skin .isnew{position:absolute;top:-8px;right:-6px;background:#ff3b6b;font-size:12px;padding:1px 6px;border-radius:8px}.panel.result{min-width:620px;position:relative}.rs-stars{display:flex;justify-content:center;gap:14px;margin:4px 0 6px}.rs-star{display:flex;flex-direction:column;align-items:center;width:150px}.rs-star svg{width:110px;height:110px;transform:scale(0)}.rs-star.show svg{animation:starpop .45s cubic-bezier(.2,1.8,.4,1) forwards}.rs-star.mid.show svg{animation-name:starpop2}@keyframes starpop2{0%{transform:scale(0) rotate(-90deg)}to{transform:translateY(-10px) scale(1.2) rotate(0)}}.rs-star .lb{font-size:18px;font-weight:700;opacity:.9}.rs-star.got .lb{color:#ffe14d}@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}.rs-stats{display:flex;justify-content:center;gap:26px;font-size:24px;margin:4px 0 6px}.rs-stats b{color:#ffe14d;font-size:30px}.rs-stats .pb{font-size:16px;opacity:.75;display:block}.newbest{position:absolute;top:-26px;right:-30px;background:#ff3b6b;color:#fff;font-size:26px;font-weight:700;padding: <body>
<canvas id="game" tabindex="0"></canvas>

<div id="ui">
  <button id="pauseBtn" class="hudbtn" type="button" aria-label="إيقاف مؤقت" hidden><span></span><span></span></button>

  <!-- TITLE -->
  <section id="scr-title" class="scr">
    <h1 class="logo" aria-label="الخطّاف الطائر">
      <b class="w1" style="--c:#ffd21f;--d:0">الخطّاف</b>
      <b class="w2" style="--c:#ff4fa3;--d:4">الطائر</b>
    </h1>
    <div class="title-btns">
      <button class="sg-btn big" id="btnPlay" type="button">▶ العب</button>
      <div class="row">
        <button class="sg-btn secondary" id="btnLevels" type="button">المراحل</button>
        <button class="sg-btn secondary" id="btnStyle" type="button">الأزياء<em class="newdot" id="styleNew" hidden>جديد</em></button>
        <button class="sg-btn secondary" id="btnEndless" type="button">بلا نهاية</button>
      </div>
    </div>
    <div class="title-info">
      <div class="howto">
        <span><span class="sg-key">انقر</span> أو <span class="sg-key">مسافة</span> اضغط مطولًا لتمسك الخطّاف</span>
        <span>ثم اتركه <b>لتطير!</b></span>
      </div>
      <div class="progress" id="titleProgress"></div>
    </div>
  </section>

  <!-- LEVEL SELECT -->
  <section id="scr-levels" class="scr" hidden>
    <div class="panel wide">
      <div class="panel-head">
        <button class="sg-btn secondary small" id="lvBack" type="button">→ رجوع</button>
        <h2 id="lvWorldName">العالم</h2>
        <div class="starcount" id="lvStars"></div>
      </div>
      <div class="worldnav">
        <button class="arrow" id="lvPrev" type="button" aria-label="العالم السابق">▶</button>
        <div class="grid" id="lvGrid"></div>
        <button class="arrow" id="lvNext" type="button" aria-label="العالم التالي">◀</button>
      </div>
      <div class="dots" id="lvDots"></div>
    </div>
  </section>

  <!-- STYLE / LOCKER -->
  <section id="scr-style" class="scr" hidden>
    <div class="panel wide">
      <div class="panel-head">
        <button class="sg-btn secondary small" id="stBack" type="button">→ رجوع</button>
        <h2>خزانة الأزياء</h2>
        <div class="starcount" id="stStars"></div>
      </div>
      <h3>الشخصيات</h3>
      <div class="skins" id="stSkins"></div>
      <h3>آثار الطيران</h3>
      <div class="skins trails" id="stTrails"></div>
    </div>
  </section>

  <!-- PAUSE -->
  <section id="scr-pause" class="scr dim" hidden>
    <div class="panel">
      <h2 class="bigtitle">استراحة</h2>
      <div class="col">
        <button class="sg-btn good" id="psResume" type="button">▶ تابِع</button>
        <button class="sg-btn" id="psRestart" type="button">↻ من جديد</button>
        <button class="sg-btn secondary" id="psLevels" type="button">المراحل</button>
        <button class="sg-btn secondary" id="psMenu" type="button">القائمة</button>
      </div>
      <p class="hint"><span class="sg-key">P</span> أو <span class="sg-key">Esc</span> للمتابعة · <span class="sg-key">R</span> من جديد</p>
    </div>
  </section>

  <!-- RESULT -->
  <section id="scr-result" class="scr dim" hidden>
    <div class="panel result">
      <div class="newbest" id="rsBest" hidden>رقم قياسي جديد!</div>
      <h2 class="bigtitle" id="rsTitle">اجتزت المرحلة!</h2>
      <div class="rs-stars" id="rsStars"></div>
      <div class="rs-stats" id="rsStats"></div>
      <div class="rs-unlock" id="rsUnlock" hidden></div>
      <div class="row">
        <button class="sg-btn secondary" id="rsLevels" type="button">المراحل</button>
        <button class="sg-btn" id="rsReplay" type="button">↻ أعِد</button>
        <button class="sg-btn good big2" id="rsNext" type="button">التالي ◀</button>
      </div>
      <p class="hint" id="rsHint"><span class="sg-key">Enter</span> التالي · <span class="sg-key">R</span> إعادة</p>
    </div>
  </section>
