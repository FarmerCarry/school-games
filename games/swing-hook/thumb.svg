      <path d="M0 -12 L-12 -6 L-23 -1"/>
      <path d="M-3 12 L-8 24 L-14 35"/>
      <path d="M3 12 L9 23 L16 33"/>
      <path d="M0 -12 L6 -24 L12 -35"/>
      <path d="M0 -12 L0 12" stroke-width="14"/>
    </g>
    <circle cx="0" cy="-25" r="15.5" fill="#23163f"/>
    <path d="M0 -12 L-12 -6 L-23 -1" stroke="#c4337a" stroke-width="6.5"/>
    <path d="M-3 12 L-8 24 L-14 35" stroke="#c4337a" stroke-width="6.5"/>
    <path d="M0 -12 L0 12" stroke="#ff4fa3" stroke-width="9"/>
    <path d="M3 12 L9 23 L16 33" stroke="#ff4fa3" stroke-width="6.5"/>
    <path d="M0 -12 L6 -24 L12 -35" stroke="#ff4fa3" stroke-width="6.5"/>
    <circle cx="12" cy="-35" r="3.6" fill="#ffc4e1"/>
    <circle cx="-23" cy="-1" r="3.6" fill="#ffc4e1"/>
    <circle cx="0" cy="-25" r="12.5" fill="#ffc4e1"/>
    <circle cx="-5" cy="-31" r="3.2" fill="#fff" opacity="0.6"/>
    <circle cx="-4.6" cy="-26.5" r="4" fill="#fff" stroke="#23163f" stroke-width="1.4"/>
    <circle cx="4.6" cy="-26.5" r="4" fill="#fff" stroke="#23163f" stroke-width="1.4"/>
    <circle cx="-3.4" cy="-27.5" r="2.1" fill="#23163f"/>
    <circle cx="5.8" cy="-27.5" r="2.1" fill="#23163f"/>
    <path d="M-4.5 -20 A4.5 4.5 0 0 0 4.5 -20 Z" fill="#23163f"/>
    <circle cx="-8" cy="-21" r="2.2" fill="#ff5a8c" opacity="0.4"/>
    <circle cx="8" cy="-21" r="2.2" fill="#ff5a8c" opacity="0.4"/>
    <path d="M6 -36 L14 -42 L15 -32 Z M6 -36 L-1 -43 L-2 -33 Z" fill="#ffe14d" stroke="#23163f" stroke-width="2.5"/>
    <circle cx="6" cy="-36" r="2.6" fill="#ffe14d" stroke="#23163f" stroke-width="2.5"/>
  </g>
  <!-- speed sparkles -->
  <g fill="#fff">
    <path d="M300 120 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5z"/>
    <path d="M110 150 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z"/>
    <path d="M330 290 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z"/>
  </g>
  <!-- water -->
  <path d="M0 338 Q25 328 50 338 T100 338 T150 338 T200 338 T250 338 T300 338 T350 338 T400 338 L400 400 L0 400Z" fill="#8fd0ff"/>
  <path d="M0 348 Q25 338 50 348 T100 348 T150 348 T200 348 T250 348 T300 348 T350 348 T400 348 L400 400 L0 400Z" fill="url(#sea)"/>
  <!-- logo -->
  <g font-family="'Arial Black', 'Segoe UI Black', 'Fredoka', Impact, sans-serif" font-weight="900" text-anchor="middle" transform="rotate(-5 200 356)">
    <text x="200" y="378" font-size="56" textLength="350" lengthAdjust="spacingAndGlyphs" fill="#2a1747" stroke="#2a1747" stroke-width="16" stroke-linejoin="round">SWING HOOK</text>
    <text x="200" y="372" font-size="56" textLength="350" lengthAdjust="spacingAndGlyphs" fill="#2a1747" stroke="#2a1747" stroke-width="16" stroke-linejoin="round">SWING HOOK</text>
    <text x="200" y="372" font-size="56" textLength="350" lengthAdjust="spacingAndGlyphs" fill="#ffd21f">SWING <tspan fill="#ff4fa3">HOOK</tspan></text>
  </g>
