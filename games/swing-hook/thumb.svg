<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2eaefc"/>
      <stop offset="1" stop-color="#bff0ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d95ff"/>
      <stop offset="1" stop-color="#1f5fd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff7a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="335" cy="62" r="80" fill="url(#glow)"/>
  <circle cx="335" cy="62" r="50" fill="#fff39a" opacity="0.35"/>
  <circle cx="335" cy="62" r="36" fill="#fff39a"/>
  <!-- clouds -->
  <g fill="#fff" opacity="0.95">
    <circle cx="60" cy="70" r="24"/><circle cx="88" cy="58" r="30"/><circle cx="118" cy="72" r="22"/><rect x="60" y="70" width="60" height="24" rx="12"/>
    <circle cx="300" cy="170" r="16"/><circle cx="320" cy="160" r="21"/><circle cx="342" cy="172" r="15"/><rect x="300" y="170" width="44" height="17" rx="8"/>
  </g>
  <!-- hills -->
  <path d="M0 300 C60 262 120 262 190 290 C260 318 320 262 400 276 L400 400 L0 400Z" fill="#8fe38a"/>
  <path d="M0 322 C80 300 150 318 230 312 C300 306 350 290 400 300 L400 400 L0 400Z" fill="#4fc760"/>
  <!-- other hooks -->
  <g stroke="#23244a" stroke-width="5">
