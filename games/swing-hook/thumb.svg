    <circle cx="356" cy="236" r="11" fill="#fff"/>
  </g>
  <circle cx="62" cy="168" r="4.5" fill="#ff4fa3"/>
  <circle cx="356" cy="236" r="4.5" fill="#ff4fa3"/>
  <!-- rainbow trail -->
  <g fill="none" stroke-linecap="round">
    <path d="M-20 340 C50 310 140 272 228 252" stroke="#ff3b3b" stroke-width="13" transform="translate(0 -24)"/>
    <path d="M-20 340 C50 310 140 272 228 252" stroke="#ff9a1f" stroke-width="13" transform="translate(0 -12)"/>
    <path d="M-20 340 C50 310 140 272 228 252" stroke="#ffe03a" stroke-width="13"/>
    <path d="M-20 340 C50 310 140 272 228 252" stroke="#35d45f" stroke-width="13" transform="translate(0 12)"/>
    <path d="M-20 340 C50 310 140 272 228 252" stroke="#1fa8ff" stroke-width="13" transform="translate(0 24)"/>
    <path d="M-20 340 C50 310 140 272 228 252" stroke="#9b5cff" stroke-width="13" transform="translate(0 36)"/>
  </g>
  <!-- rope -->
  <line x1="262" y1="66" x2="215" y2="160" stroke="#23244a" stroke-width="9" stroke-linecap="round"/>
  <line x1="262" y1="66" x2="215" y2="160" stroke="#fff3c4" stroke-width="4.5" stroke-linecap="round"/>
  <!-- main hook -->
  <circle cx="262" cy="62" r="30" fill="#ffe14d" opacity="0.45"/>
  <circle cx="262" cy="62" r="17" fill="#ffe14d" stroke="#23244a" stroke-width="6"/>
  <circle cx="262" cy="62" r="7" fill="#ff4fa3"/>
  <!-- stick figure (rotated, flying) -->
  <g transform="translate(236 250) rotate(-32) scale(2.5)" stroke-linecap="round" stroke-linejoin="round" fill="none">
