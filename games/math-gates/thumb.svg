<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a24"/>
      <stop offset="0.52" stop-color="#172c6e"/>
      <stop offset="1" stop-color="#090e2b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3178"/>
      <stop offset="1" stop-color="#0d1842"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="mech" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Deep Space Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.85">
    <circle cx="42" cy="36" r="2.5"/><circle cx="118" cy="24" r="2"/><circle cx="215" cy="34" r="3"/>
    <circle cx="348" cy="42" r="2.2"/><circle cx="76" cy="86" r="1.8"/><circle cx="290" cy="22" r="2"/>
  </g>

  <!-- Ringed Sci-Fi Planet -->
  <ellipse cx="322" cy="76" rx="54" ry="14" transform="rotate(-14 322 76)" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.55"/>
  <circle cx="322" cy="76" r="29" fill="#0ea5e9" stroke="#0b1026" stroke-width="4"/>
  <path d="M302 66 A24 24 0 0 1 338 60" fill="none" stroke="#bae6fd" stroke-width="4" stroke-linecap="round"/>

  <!-- Perspective Neon Star-Cruiser Highway -->
  <polygon points="118,148 282,148 392,400 8,400" fill="url(#road)"/>
  <polygon points="172,148 228,148 268,400 132,400" fill="#172b69"/>
  <g stroke="#00e5ff" stroke-width="6" stroke-linecap="round">
    <line x1="118" y1="148" x2="8" y2="400"/>
    <line x1="282" y1="148" x2="392" y2="400"/>
  </g>
  <g stroke="#7dd3fc" stroke-width="3" stroke-dasharray="12 10" opacity="0.55">
    <line x1="172" y1="152" x2="128" y2="400"/>
    <line x1="228" y1="152" x2="272" y2="400"/>
  </g>

  <!-- Left Holo-Gate (+10) -->
  <g transform="translate(36,92)">
    <rect x="8" y="14" width="136" height="106" rx="14" fill="url(#gBlue)" stroke="#7dd3fc" stroke-width="4"/>
    <rect x="4" y="6" width="144" height="20" rx="8" fill="#38bdf8" stroke="#0b1026" stroke-width="4"/>
    <rect x="0" y="12" width="14" height="114" rx="6" fill="#1e293b" stroke="#0b1026" stroke-width="4"/>
    <rect x="138" y="12" width="14" height="114" rx="6" fill="#1e293b" stroke="#0b1026" stroke-width="4"/>
    <text x="76" y="82" text-anchor="middle" font-family="Fredoka, system-ui, sans-serif" font-weight="800" font-size="46" fill="#fff" stroke="#0b1026" stroke-width="7" paint-order="stroke">+10</text>
  </g>

  <!-- Right Holo-Gate (×3) -->
  <g transform="translate(212,92)">
    <rect x="8" y="14" width="136" height="106" rx="14" fill="url(#gGold)" stroke="#fde047" stroke-width="4"/>
    <rect x="4" y="6" width="144" height="20" rx="8" fill="#ffd23f" stroke="#0b1026" stroke-width="4"/>
    <rect x="0" y="12" width="14" height="114" rx="6" fill="#1e293b" stroke="#0b1026" stroke-width="4"/>
    <rect x="138" y="12" width="14" height="114" rx="6" fill="#1e293b" stroke="#0b1026" stroke-width="4"/>
    <text x="76" y="82" text-anchor="middle" font-family="Fredoka, system-ui, sans-serif" font-weight="800" font-size="48" fill="#fff" stroke="#0b1026" stroke-width="7" paint-order="stroke">×3</text>
  </g>

  <!-- Laser Blaster Bolts -->
  <g stroke="#0b1026" stroke-width="3">
    <rect x="142" y="216" width="10" height="32" rx="5" fill="#fde047"/>
    <rect x="248" y="216" width="10" height="32" rx="5" fill="#00e5ff"/>
  </g>

  <!-- Wingman Mini-Mechs -->
  <g transform="translate(64,254) scale(0.76)" stroke="#0b1026" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="50" cy="112" rx="18" ry="12" fill="#38bdf8" stroke="none"/>
    <rect x="20" y="48" width="60" height="46" rx="14" fill="url(#mech)"/>
    <rect x="16" y="14" width="68" height="42" rx="16" fill="url(#mech)"/>
    <rect x="26" y="24" width="48" height="20" rx="8" fill="#0b1026"/>
    <circle cx="39" cy="34" r="5" fill="#00f0ff" stroke="none"/>
    <circle cx="61" cy="34" r="5" fill="#00f0ff" stroke="none"/>
  </g>
  <g transform="translate(260,254) scale(0.76)" stroke="#0b1026" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="50" cy="112" rx="18" ry="12" fill="#38bdf8" stroke="none"/>
    <rect x="20" y="48" width="60" height="46" rx="14" fill="url(#mech)"/>
    <rect x="16" y="14" width="68" height="42" rx="16" fill="url(#mech)"/>
    <rect x="26" y="24" width="48" height="20" rx="8" fill="#0b1026"/>
    <circle cx="39" cy="34" r="5" fill="#00f0ff" stroke="none"/>
    <circle cx="61" cy="34" r="5" fill="#00f0ff" stroke="none"/>
  </g>

  <!-- Hero Lead Battle-Mech -->
  <g transform="translate(132,216)" stroke="#0b1026" stroke-width="5.5" stroke-linejoin="round">
    <!-- Thruster Flames -->
    <ellipse cx="48" cy="158" rx="14" ry="20" fill="#00e5ff" stroke="none"/>
    <ellipse cx="88" cy="158" rx="14" ry="20" fill="#00e5ff" stroke="none"/>
    <ellipse cx="48" cy="154" rx="7" ry="12" fill="#fff" stroke="none"/>
    <ellipse cx="88" cy="154" rx="7" ry="12" fill="#fff" stroke="none"/>
    <!-- Boots -->
    <rect x="34" y="122" width="26" height="32" rx="10" fill="#1e3a8a"/>
    <rect x="76" y="122" width="26" height="32" rx="10" fill="#1e3a8a"/>
    <!-- Shoulder Cannons -->
    <rect x="6" y="68" width="26" height="40" rx="11" fill="#00e5ff"/>
    <rect x="104" y="68" width="26" height="40" rx="11" fill="#00e5ff"/>
    <!-- Torso & Reactor -->
    <rect x="26" y="66" width="84" height="64" rx="20" fill="url(#mech)"/>
    <circle cx="68" cy="98" r="14" fill="#ffd23f"/>
    <circle cx="65" cy="95" r="5" fill="#fff" stroke="none"/>
    <!-- Crest & Helmet -->
    <polygon points="56,22 68,2 80,22" fill="#ffd23f"/>
    <rect x="22" y="18" width="92" height="56" rx="22" fill="url(#mech)"/>
    <rect x="34" y="32" width="68" height="28" rx="11" fill="#0b1026"/>
    <!-- Glowing Visor Eyes -->
    <circle cx="53" cy="46" r="7.5" fill="#00f0ff" stroke="none"/>
    <circle cx="83" cy="46" r="7.5" fill="#00f0ff" stroke="none"/>
    <circle cx="51" cy="43" r="2.5" fill="#fff" stroke="none"/>
    <circle cx="81" cy="43" r="2.5" fill="#fff" stroke="none"/>
  </g>
</svg>
