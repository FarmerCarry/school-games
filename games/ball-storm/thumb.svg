<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1a72"/>
      <stop offset="1" stop-color="#a23ea8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <g id="face">
      <circle cx="-11" cy="-4" r="7" fill="#fff"/>
      <circle cx="11" cy="-4" r="7" fill="#fff"/>
      <circle cx="-9" cy="-3" r="3.6" fill="#24164a"/>
      <circle cx="13" cy="-3" r="3.6" fill="#24164a"/>
      <path d="M-7 8 Q0 14 7 8" fill="none" stroke="#24164a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="brick">
      <rect x="-27" y="-20" width="54" height="40" rx="10" stroke="#24164a" stroke-width="3.5"/>
      <rect x="-21" y="-16" width="42" height="12" rx="6" fill="url(#gloss)"/>
      <use xlink:href="#face"/>
    </g>
    <g id="ball">
      <circle r="10" fill="#fff" stroke="#24164a" stroke-width="2.5"/>
      <circle cx="2" cy="-2" r="5" fill="#2f8cff"/>
      <circle cx="2.5" cy="-2.5" r="2.4" fill="#24164a"/>
    </g>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- sprinkles -->
  <g stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M30 230 l10 -6" stroke="#ffe14f"/>
    <path d="M362 214 l-8 -8" stroke="#4fd8ff"/>
    <path d="M60 300 l4 10" stroke="#ff6fb5"/>
    <path d="M340 296 l10 4" stroke="#7dff9b"/>
    <path d="M190 210 l8 6" stroke="#ff9d4f"/>
    <path d="M110 190 l-6 8" stroke="#4fd8ff"/>
  </g>
  <!-- the smiley jelly wall -->
  <g>
    <use xlink:href="#brick" x="52" y="44" fill="#ffd23f"/>
    <use xlink:href="#brick" x="112" y="44" fill="#ff5c8a"/>
    <use xlink:href="#brick" x="172" y="44" fill="#4fd8ff"/>
    <use xlink:href="#brick" x="232" y="44" fill="#ffd23f"/>
    <use xlink:href="#brick" x="292" y="44" fill="#ff5c8a"/>
    <use xlink:href="#brick" x="352" y="44" fill="#7ee36b"/>
    <use xlink:href="#brick" x="52" y="92" fill="#b07cff"/>
    <use xlink:href="#brick" x="112" y="92" fill="#7ee36b"/>
    <use xlink:href="#brick" x="292" y="92" fill="#4fd8ff"/>
    <use xlink:href="#brick" x="352" y="92" fill="#ffd23f"/>
    <use xlink:href="#brick" x="52" y="140" fill="#ff9d4f"/>
    <use xlink:href="#brick" x="352" y="140" fill="#b07cff"/>
  </g>
  <!-- a brick going POP -->
  <g transform="translate(232 98) rotate(14)">
    <rect x="-24" y="-18" width="48" height="36" rx="10" fill="#ffd23f" stroke="#24164a" stroke-width="3.5"/>
    <path d="M-15 -7 l8 6 M-7 -7 l-8 6 M7 -7 l8 6 M15 -7 l-8 6" stroke="#24164a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cy="9" rx="6" ry="5" fill="#24164a"/>
  </g>
  <g fill="#fff">
    <circle cx="190" cy="120" r="5"/><circle cx="268" cy="136" r="4"/><circle cx="210" cy="148" r="3"/>
    <rect x="150" y="96" width="9" height="9" rx="2" fill="#ffe14f" transform="rotate(20 154 100)"/>
    <rect x="276" y="70" width="8" height="8" rx="2" fill="#4fd8ff" transform="rotate(-25 280 74)"/>
  </g>
  <!-- the ball storm with trails -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round">
    <path d="M200 316 L172 266"/><path d="M200 316 L228 262"/><path d="M200 316 L198 250"/>
    <path d="M150 230 L132 196"/><path d="M250 226 L270 190"/><path d="M196 200 L194 164"/>
    <path d="M100 262 L86 232"/><path d="M304 256 L318 226"/><path d="M160 170 L150 140"/>
    <path d="M240 172 L250 142"/>
  </g>
  <use xlink:href="#ball" x="172" y="266"/>
  <use xlink:href="#ball" x="228" y="262"/>
  <use xlink:href="#ball" x="198" y="250"/>
  <use xlink:href="#ball" x="132" y="196"/>
  <use xlink:href="#ball" x="270" y="190"/>
  <use xlink:href="#ball" x="194" y="164"/>
  <use xlink:href="#ball" x="86" y="232"/>
  <use xlink:href="#ball" x="318" y="226"/>
  <use xlink:href="#ball" x="150" y="140"/>
  <use xlink:href="#ball" x="250" y="142"/>
  <use xlink:href="#ball" x="112" y="282"/>
  <use xlink:href="#ball" x="292" y="286"/>
  <use xlink:href="#ball" x="236" y="206"/>
  <use xlink:href="#ball" x="160" y="214"/>
  <!-- the jelly paddle with googly eyes -->
  <g transform="translate(200 340)">
    <rect x="-82" y="-16" width="164" height="34" rx="17" fill="#ff7a59" stroke="#24164a" stroke-width="4"/>
    <rect x="-72" y="-11" width="144" height="9" rx="4.5" fill="url(#gloss)"/>
    <ellipse cx="-50" cy="6" rx="9" ry="5" fill="#ff4f7a" opacity="0.7"/>
    <ellipse cx="50" cy="6" rx="9" ry="5" fill="#ff4f7a" opacity="0.7"/>
    <circle cx="-22" cy="-18" r="15" fill="#fff" stroke="#24164a" stroke-width="3.5"/>
    <circle cx="22" cy="-18" r="15" fill="#fff" stroke="#24164a" stroke-width="3.5"/>
    <circle cx="-19" cy="-24" r="7" fill="#24164a"/>
    <circle cx="25" cy="-24" r="7" fill="#24164a"/>
    <path d="M-10 6 Q0 14 10 6" fill="none" stroke="#24164a" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- the big x3 capsule -->
  <g transform="translate(318 340) rotate(-12)">
    <rect x="-62" y="-32" width="124" height="64" rx="32" fill="#ff3d9a" stroke="#24164a" stroke-width="5"/>
    <rect x="-50" y="-24" width="100" height="16" rx="8" fill="url(#gloss)"/>
    <text x="0" y="17" text-anchor="middle" font-family="Fredoka, 'Arial Rounded MT Bold', Arial, sans-serif" font-weight="700" font-size="46" fill="#fff" stroke="#24164a" stroke-width="3" paint-order="stroke">×3</text>
  </g>
</svg>
