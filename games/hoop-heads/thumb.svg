<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="0.45" stop-color="#e0487a"/>
      <stop offset="1" stop-color="#3b1a8f"/>
    </radialGradient>
    <radialGradient id="head" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c8ff8a"/>
      <stop offset="1" stop-color="#3fa82a"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffb46a"/>
      <stop offset="1" stop-color="#e2561a"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d1a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#fff27a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- sunburst -->
  <g fill="#fff" opacity="0.1" transform="translate(190 170)">
    <path d="M0 0 L-30 -260 L30 -260 Z"/>
    <path d="M0 0 L-30 -260 L30 -260 Z" transform="rotate(30)"/>
    <path d="M0 0 L-30 -260 L30 -260 Z" transform="rotate(60)"/>
    <path d="M0 0 L-30 -260 L30 -260 Z" transform="rotate(90)"/>
    <path d="M0 0 L-30 -260 L30 -260 Z" transform="rotate(120)"/>
    <path d="M0 0 L-30 -260 L30 -260 Z" transform="rotate(150)"/>
    <path d="M0 0 L-30 -260 L30 -260 Z" transform="rotate(180)"/>
    <path d="M0 0 L-30 -260 L30 -260 Z" transform="rotate(210)"/>
    <path d="M0 0 L-30 -260 L30 -260 Z" transform="rotate(240)"/>
    <path d="M0 0 L-30 -260 L30 -260 Z" transform="rotate(270)"/>
    <path d="M0 0 L-30 -260 L30 -260 Z" transform="rotate(300)"/>
    <path d="M0 0 L-30 -260 L30 -260 Z" transform="rotate(330)"/>
  </g>
  <!-- floor -->
  <path d="M0 322 H400 V400 H0 Z" fill="#c2410c"/>
  <path d="M0 322 H400 V330 H0 Z" fill="#ff8a4a"/>

  <!-- hoop -->
  <rect x="352" y="30" width="16" height="150" rx="4" fill="#fff" stroke="#1d1235" stroke-width="5"/>
  <rect x="368" y="92" width="32" height="12" fill="#39405e"/>
  <rect x="352" y="104" width="16" height="36" fill="#ff4d6d"/>
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M262 132 L278 196 M284 134 L292 196 M306 134 L306 196 M328 134 L320 196 M348 132 L334 196"/>
    <path d="M268 156 L344 156 M272 178 L340 178"/>
    <path d="M278 196 L334 196"/>
  </g>
  <ellipse cx="305" cy="130" rx="46" ry="11" fill="none" stroke="#1d1235" stroke-width="12"/>
  <ellipse cx="305" cy="130" rx="46" ry="11" fill="none" stroke="#ff6a1a" stroke-width="7"/>

  <!-- body (dunking, arm up to the ball) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 300 L128 340 M176 300 L200 334" stroke="#1d1235" stroke-width="20"/>
    <path d="M150 300 L128 340 M176 300 L200 334" stroke="#7ddc4a" stroke-width="12"/>
    <rect x="108" y="332" width="36" height="18" rx="9" fill="#b55cff" stroke="#1d1235" stroke-width="5"/>
    <rect x="188" y="326" width="36" height="18" rx="9" fill="#b55cff" stroke="#1d1235" stroke-width="5"/>
    <rect x="132" y="236" width="64" height="72" rx="18" fill="#2f7bff" stroke="#1d1235" stroke-width="6"/>
    <rect x="132" y="264" width="64" height="8" fill="#fff"/>
    <path d="M142 250 L104 290" stroke="#1d1235" stroke-width="20"/>
    <path d="M142 250 L104 290" stroke="#7ddc4a" stroke-width="12"/>
  </g>

  <!-- fire trail + ball -->
  <g stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M214 44 L236 64"/><path d="M236 28 L252 54"/><path d="M196 70 L220 84"/>
  </g>
  <circle cx="262" cy="104" r="34" fill="url(#ball)" stroke="#1d1235" stroke-width="6"/>
  <g stroke="#3a1a0a" stroke-width="4" fill="none">
    <path d="M228 104 H296 M262 70 V138"/>
    <path d="M240 78 Q254 104 240 130 M284 78 Q270 104 284 130"/>
  </g>
  <ellipse cx="250" cy="90" rx="10" ry="5" fill="#fff" opacity="0.5" transform="rotate(-30 250 90)"/>

  <!-- big alien head -->
  <g stroke="#1d1235" stroke-width="7" stroke-linecap="round">
    <path d="M122 100 L96 44"/>
    <path d="M190 96 L214 42"/>
  </g>
  <circle cx="96" cy="40" r="15" fill="#ff5fae" stroke="#1d1235" stroke-width="6"/>
  <circle cx="214" cy="38" r="15" fill="#ffd23f" stroke="#1d1235" stroke-width="6"/>
  <ellipse cx="160" cy="176" rx="92" ry="88" fill="url(#head)" stroke="#1d1235" stroke-width="8"/>
  <ellipse cx="118" cy="128" rx="26" ry="12" fill="#fff" opacity="0.35" transform="rotate(-30 118 128)"/>
  <!-- eyes looking up at the ball -->
  <ellipse cx="136" cy="160" rx="22" ry="30" fill="#1d1235" transform="rotate(12 136 160)"/>
  <ellipse cx="196" cy="156" rx="22" ry="30" fill="#1d1235" transform="rotate(-12 196 156)"/>
  <circle cx="144" cy="144" r="8" fill="#fff"/>
  <circle cx="204" cy="140" r="8" fill="#fff"/>
  <!-- big grin -->
  <path d="M120 206 Q166 262 214 204 Z" fill="#7a1030" stroke="#1d1235" stroke-width="6" stroke-linejoin="round"/>
  <path d="M128 210 H206 L200 220 H134 Z" fill="#fff"/>
  <ellipse cx="168" cy="236" rx="20" ry="9" fill="#ff7a9a"/>
  <ellipse cx="100" cy="200" rx="14" ry="8" fill="#2f9e1a" opacity="0.5"/>
  <ellipse cx="232" cy="196" rx="14" ry="8" fill="#2f9e1a" opacity="0.5"/>

  <!-- dunking arm in front of the head -->
  <g stroke-linecap="round">
    <path d="M226 246 Q262 200 262 142" stroke="#1d1235" stroke-width="20" fill="none"/>
    <path d="M226 246 Q262 200 262 142" stroke="#7ddc4a" stroke-width="12" fill="none"/>
  </g>
  <circle cx="262" cy="136" r="13" fill="#7ddc4a" stroke="#1d1235" stroke-width="5"/>
  <!-- sparkles -->
  <g fill="#fff27a">
    <path d="M330 222 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
    <path d="M40 90 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z"/>
    <path d="M300 40 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
  </g>

  <!-- logo -->
  <g font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="bold" text-anchor="middle" direction="rtl">
    <text x="200" y="382" font-size="50" fill="#1d1235" stroke="#1d1235" stroke-width="14" stroke-linejoin="round">سلة الرؤوس</text>
    <text x="200" y="382" font-size="50" fill="#ffd23f">سلة الرؤوس</text>
  </g>
</svg>
