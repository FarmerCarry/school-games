<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8984c"/>
      <stop offset="100%" stop-color="#b85d19"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="45%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="55%" stop-color="#ff5400"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </radialGradient>
  </defs>

  <!-- Vibrant twilight streetball sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="90" cy="82" r="46" fill="#ffd23f" opacity="0.28"/>
  <g fill="#ffffff" opacity="0.6">
    <circle cx="52" cy="48" r="2.5"/><circle cx="150" cy="36" r="2"/>
    <circle cx="240" cy="54" r="3"/><circle cx="332" cy="42" r="2"/>
  </g>

  <!-- City silhouette -->
  <path d="M0 285V205h48v80zm54 0V172h56v113zm62 0V214h52v71zm58 0V184h64v101zm70 0V210h54v75zm60 0V165h96v120z" fill="#140d30" opacity="0.72"/>

  <!-- Hardwood Street Court -->
  <rect x="0" y="285" width="400" height="115" fill="url(#court)" stroke="#1b1640" stroke-width="5"/>
  <ellipse cx="200" cy="342" rx="95" ry="24" fill="#2b7fff" fill-opacity="0.45" stroke="#fff7e6" stroke-width="4"/>
  <line x1="200" y1="285" x2="200" y2="400" stroke="#fff7e6" stroke-width="4"/>

  <!-- Right Backboard & Spring Hoop -->
  <path d="M376 315V138l-34 18" fill="none" stroke="#1b1640" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M376 315V138l-34 18" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="334" y="88" width="14" height="98" rx="6" fill="#f8fafc" stroke="#1b1640" stroke-width="4"/>
  <rect x="337" y="132" width="8" height="32" fill="#ff5420"/>

  <!-- Swishing Net -->
  <path d="M274 166l10 46h36l12-46" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M286 166l8 46M303 166v46M320 166l-8 46M279 188h47" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="270" y1="165" x2="334" y2="165" stroke="#1b1640" stroke-width="11" stroke-linecap="round"/>
  <line x1="270" y1="165" x2="334" y2="165" stroke="#ff5420" stroke-width="6" stroke-linecap="round"/>

  <!-- Meteor Super-Dunk Flame Trail -->
  <path d="M62 248Q145 92 268 134" fill="none" stroke="#ff5400" stroke-width="28" stroke-linecap="round" opacity="0.55"/>
  <path d="M74 242Q150 104 268 134" fill="none" stroke="#ffd23f" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <circle cx="272" cy="134" r="52" fill="url(#fireGlow)"/>

  <!-- Flying Big-Head Athlete (Robo-Dunker!) -->
  <g transform="translate(182, 188) rotate(-14)">
    <!-- Fluttering headband tail -->
    <path d="M-42 -58Q-74 -64 -88 -46" fill="none" stroke="#1b1640" stroke-width="11" stroke-linecap="round"/>
    <path d="M-42 -58Q-74 -64 -88 -46" fill="none" stroke="#ff477e" stroke-width="6" stroke-linecap="round"/>
    <!-- Sneakers with rocket flames -->
    <path d="M-26 36l-16 20 18-6zM14 32l-12 22 18-8z" fill="#ff6d00"/>
    <rect x="-32" y="18" width="28" height="15" rx="7" fill="#00d4ff" stroke="#1b1640" stroke-width="4"/>
    <rect x="4" y="14" width="28" height="15" rx="7" fill="#00d4ff" stroke="#1b1640" stroke-width="4"/>
    <!-- Jersey -->
    <rect x="-24" y="-24" width="48" height="40" rx="14" fill="#1f6feb" stroke="#1b1640" stroke-width="4.5"/>
    <rect x="-19" y="6" width="38" height="5" fill="#00f2fe"/>
    <!-- Dunking Arm -->
    <path d="M18 -14L68 -48" stroke="#1b1640" stroke-width="13" stroke-linecap="round"/>
    <path d="M18 -14L68 -48" stroke="#b8c8de" stroke-width="7" stroke-linecap="round"/>
    <!-- Antenna -->
    <line x1="0" y1="-108" x2="0" y2="-124" stroke="#1b1640" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-127" r="7" fill="#00f2fe" stroke="#1b1640" stroke-width="3.5"/>
    <!-- Big Cartoon Head -->
    <circle cx="0" cy="-64" r="46" fill="#b8c8de" stroke="#1b1640" stroke-width="5"/>
    <rect x="-43" y="-88" width="86" height="14" rx="7" fill="#ff477e" stroke="#1b1640" stroke-width="3.5"/>
    <!-- Glowing Visor -->
    <rect x="-10" y="-72" width="44" height="21" rx="9" fill="#0b132b" stroke="#1b1640" stroke-width="3.5"/>
    <circle cx="6" cy="-61" r="5.5" fill="#ffd23f"/>
    <circle cx="24" cy="-61" r="5.5" fill="#ffd23f"/>
    <path d="M4 -42a9 9 0 0 0 18 0z" fill="#ef476f" stroke="#1b1640" stroke-width="3"/>
  </g>

  <!-- Blazing Basketball Above Rim -->
  <g transform="translate(274, 132)">
    <circle r="24" fill="url(#ball)" stroke="#1b1640" stroke-width="4"/>
    <path d="M-23 0h46M0 -23v46M-16 -17q14 17 0 34M16 -17q-14 17 0 34" fill="none" stroke="#2b0900" stroke-width="2.6"/>
    <ellipse cx="-8" cy="-9" rx="7" ry="4" transform="rotate(-28 -8 -9)" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Impact Stars -->
  <g fill="#ffd23f" stroke="#1b1640" stroke-width="2.5">
    <polygon points="318,86 323,98 336,99 326,107 329,120 318,113 307,120 310,107 300,99 313,98"/>
    <polygon points="228,82 232,91 241,92 234,98 236,107 228,102 220,107 222,98 215,92 224,91"/>
  </g>
</svg>
