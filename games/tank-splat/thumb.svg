<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <pattern id="chk" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#fff7e6"/>
      <rect width="20" height="20" fill="#fcecca"/>
      <rect x="20" y="20" width="20" height="20" fill="#fcecca"/>
    </pattern>
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#6a4cf0"/>
      <rect width="14" height="28" fill="#7a5cff"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <g id="treads">
      <rect x="-44" y="-43" width="88" height="27" rx="13" fill="#453d5e" stroke="#2a2240" stroke-width="6"/>
      <rect x="-44" y="16" width="88" height="27" rx="13" fill="#453d5e" stroke="#2a2240" stroke-width="6"/>
      <g fill="#7b7398">
        <rect x="-34" y="-37" width="6" height="15"/><rect x="-20" y="-37" width="6" height="15"/><rect x="-6" y="-37" width="6" height="15"/><rect x="8" y="-37" width="6" height="15"/><rect x="22" y="-37" width="6" height="15"/>
        <rect x="-34" y="22" width="6" height="15"/><rect x="-20" y="22" width="6" height="15"/><rect x="-6" y="22" width="6" height="15"/><rect x="8" y="22" width="6" height="15"/><rect x="22" y="22" width="6" height="15"/>
      </g>
    </g>
  </defs>

  <!-- background -->
  <rect width="400" height="400" rx="0" fill="url(#stripes)"/>
  <rect x="18" y="18" width="364" height="364" rx="30" fill="#2a2240" opacity="0.25" transform="translate(0 8)"/>
  <rect x="18" y="18" width="364" height="364" rx="30" fill="url(#chk)" stroke="#2a2240" stroke-width="6"/>
  <rect x="18" y="18" width="364" height="364" rx="30" fill="url(#glow)"/>

  <!-- floor paint -->
  <g fill="#ff5fa8" opacity="0.9">
    <circle cx="92" cy="92" r="26"/><circle cx="116" cy="78" r="12"/><circle cx="70" cy="112" r="11"/><circle cx="112" cy="110" r="9"/><circle cx="130" cy="60" r="5"/><circle cx="56" cy="80" r="5"/>
  </g>
  <g fill="#3b8cff" opacity="0.9">
    <circle cx="330" cy="300" r="22"/><circle cx="352" cy="286" r="10"/><circle cx="312" cy="318" r="10"/><circle cx="348" cy="320" r="6"/><circle cx="300" cy="286" r="5"/>
  </g>
  <g fill="#ffc61f" opacity="0.9">
    <circle cx="200" cy="330" r="14"/><circle cx="216" cy="322" r="7"/><circle cx="186" cy="342" r="6"/>
  </g>

  <!-- maze walls -->
  <g stroke="#2a2240" stroke-width="5" stroke-linejoin="round">
    <rect x="160" y="18" width="18" height="120" rx="8" fill="#7c62ff"/>
    <rect x="18" y="232" width="130" height="18" rx="8" fill="#7c62ff"/>
    <rect x="262" y="176" width="120" height="18" rx="8" fill="#7c62ff"/>
    <rect x="262" y="176" width="18" height="100" rx="8" fill="#7c62ff"/>
  </g>
  <g fill="#a894ff">
    <rect x="165" y="24" width="6" height="106" rx="3"/>
    <rect x="24" y="237" width="118" height="6" rx="3"/>
    <rect x="268" y="181" width="108" height="6" rx="3"/>
  </g>

  <!-- aim trail with bounce -->
  <path d="M204 190 L181 128 L250 138" fill="none" stroke="#35c957" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>

  <!-- red tank, splatted -->
  <g transform="translate(318 104) rotate(150) scale(0.95)">
    <use href="#treads"/>
    <rect x="-36" y="-25" width="72" height="50" rx="16" fill="#ff4f63" stroke="#2a2240" stroke-width="6"/>
    <rect x="8" y="-10" width="44" height="20" rx="8" fill="#f4f1fb" stroke="#2a2240" stroke-width="6"/>
    <rect x="38" y="-13" width="18" height="26" rx="7" fill="#ff3d55" stroke="#2a2240" stroke-width="6"/>
    <circle cx="-4" cy="0" r="25" fill="#ff4f63" stroke="#2a2240" stroke-width="6"/>
  </g>
  <g stroke="#2a2240" stroke-width="3.5">
    <ellipse cx="306" cy="98" rx="11" ry="12" fill="#fff"/><ellipse cx="332" cy="100" rx="11" ry="12" fill="#fff"/>
  </g>
  <circle cx="301" cy="104" r="5" fill="#2a2240"/><circle cx="327" cy="106" r="5" fill="#2a2240"/>
  <ellipse cx="320" cy="126" rx="7" ry="9" fill="#2a2240"/>
  <path d="M352 70 q8 10 0 16 q-8 -6 0 -16z" fill="#7fd8ff" stroke="#2a2240" stroke-width="3"/>
  <g stroke="#2a2240" stroke-width="4" stroke-linecap="round"><path d="M282 70 l-8 -10"/><path d="M296 60 l-3 -12"/><path d="M270 86 l-12 -4"/></g>
  <!-- flying paint ball -->
  <circle cx="232" cy="140" r="7" fill="#35c957" opacity="0.35"/>
  <circle cx="248" cy="135" r="9" fill="#35c957" opacity="0.55"/>
  <circle cx="266" cy="130" r="14" fill="#35c957" stroke="#2a2240" stroke-width="5"/>
  <circle cx="261" cy="124" r="4.5" fill="#fff"/>
  <g fill="#35c957" opacity="0.8"><circle cx="186" cy="122" r="4"/><circle cx="188" cy="134" r="3"/></g>

  <!-- hero green tank -->
  <ellipse cx="146" cy="262" rx="70" ry="54" fill="#2a2240" opacity="0.2"/>
  <g transform="translate(140 246) rotate(-40) scale(1.25)">
    <use href="#treads"/>
    <rect x="-36" y="-25" width="72" height="50" rx="16" fill="#3fd15d" stroke="#2a2240" stroke-width="6"/>
    <rect x="-28" y="-19" width="40" height="9" rx="4.5" fill="#a4f5b0"/>
    <rect x="8" y="-10" width="44" height="20" rx="8" fill="#f4f1fb" stroke="#2a2240" stroke-width="6"/>
    <rect x="38" y="-13" width="18" height="26" rx="7" fill="#35c957" stroke="#2a2240" stroke-width="6"/>
    <circle cx="-4" cy="0" r="25" fill="#3fd15d" stroke="#2a2240" stroke-width="6"/>
    <circle cx="-11" cy="-8" r="8" fill="#a4f5b0"/>
    <ellipse cx="6" cy="-11" rx="9" ry="10" fill="#fff" stroke="#2a2240" stroke-width="3.5"/>
    <ellipse cx="6" cy="11" rx="9" ry="10" fill="#fff" stroke="#2a2240" stroke-width="3.5"/>
    <circle cx="10" cy="-11" r="5" fill="#2a2240"/><circle cx="10" cy="11" r="5" fill="#2a2240"/>
    <circle cx="11.5" cy="-13" r="1.8" fill="#fff"/><circle cx="11.5" cy="9" r="1.8" fill="#fff"/>
  </g>
  <!-- party hat -->
  <g transform="translate(128 196) rotate(-8)">
    <path d="M-17 4 L0 -40 L17 4 Z" fill="#ff5fa8" stroke="#2a2240" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-12 -8 L12 -8 M-7 -22 L7 -22" stroke="#ffe14d" stroke-width="5"/>
    <circle cx="0" cy="-42" r="7" fill="#5fe0ff" stroke="#2a2240" stroke-width="4"/>
  </g>
  <!-- muzzle burst -->
  <g fill="#35c957" stroke="#2a2240" stroke-width="3">
    <circle cx="206" cy="196" r="6"/><circle cx="196" cy="182" r="4"/><circle cx="216" cy="210" r="4"/>
  </g>

  <!-- logo -->
  <g font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="bold" text-anchor="middle">
    <text x="200" y="376" font-size="60" fill="#2a2240" stroke="#2a2240" stroke-width="16" stroke-linejoin="round">دبابات الألوان</text>
    <text x="200" y="370" font-size="60" fill="#ffd21f" stroke="#2a2240" stroke-width="10" stroke-linejoin="round" paint-order="stroke">دبابات الألوان</text>
  </g>
</svg>
