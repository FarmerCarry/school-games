<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جزيرة الفوضى</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Icons: every button is a picture, so a child who cannot read yet can play. -->
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <symbol id="i-play" viewBox="0 0 64 64"><path d="M22 11 Q18 9 18 14 L18 50 Q18 55 22 53 L52 35 Q56 32 52 29 Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 64 64"><rect x="15" y="12" width="12" height="40" rx="5"/><rect x="37" y="12" width="12" height="40" rx="5"/></symbol>
  <symbol id="i-again" viewBox="0 0 64 64"><path d="M50 30 A19 19 0 1 1 41 15" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><path d="M33 4 L52 13 L37 27 Z"/></symbol>
  <symbol id="i-home" viewBox="0 0 64 64"><path d="M8 32 L32 10 L56 32 L49 32 L49 54 L37 54 L37 40 L27 40 L27 54 L15 54 L15 32 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-next" viewBox="0 0 64 64"><path d="M8 26 L34 26 L34 12 L58 32 L34 52 L34 38 L8 38 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-two" viewBox="0 0 64 64"><circle cx="21" cy="30" r="14"/><circle cx="44" cy="30" r="14"/><path d="M4 58 Q21 40 38 58 Z M27 58 Q44 40 61 58 Z"/></symbol>
  <symbol id="i-hat" viewBox="0 0 64 64"><path d="M18 8 Q32 2 46 8 L44 40 L20 40 Z" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><path d="M4 44 Q32 34 60 44 Q60 54 32 54 Q4 54 4 44 Z" stroke="#1c2250" stroke-width="3.5" stroke-linejoin="round"/><path d="M20 30 L44 30 L44 39 L20 39 Z" fill="#ff5d6c"/></symbol>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 5 L39 23.3 L58.6 24.4 L43.4 36.7 L48.5 55.6 L32 45 L15.5 55.6 L20.6 36.7 L5.4 24.4 L25 23.3 Z" stroke-linejoin="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 64 64"><path d="M20 28 L20 20 A12 12 0 0 1 44 20 L44 28" fill="none" stroke="currentColor" stroke-width="7"/><rect x="12" y="28" width="40" height="30" rx="7"/></symbol>
  <symbol id="i-coin" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#ffd23f" stroke="#1c2250" stroke-width="5"/><circle cx="32" cy="32" r="16" fill="none" stroke="#e8a317" stroke-width="5"/><path d="M27 22 L27 42 M37 22 L37 42" stroke="#e8a317" stroke-width="5" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 64 64"><path d="M12 34 L26 48 L53 17" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-crown" viewBox="0 0 64 64"><path d="M8 20 L20 34 L32 12 L44 34 L56 20 L52 50 L12 50 Z" stroke-linejoin="round"/><circle cx="32" cy="38" r="4" fill="#ff5d6c"/></symbol>
</svg>

<canvas id="game" tabindex="0" aria-label="جزيرة الفوضى"></canvas>

<!-- A 1280x720 layer laid exactly over the canvas (scaled by game.js). -->
<div id="ui">
  <div id="hud" hidden>
    <button type="button" id="btnPause" class="ci-btn ci-round" aria-label="استراحة" title="استراحة (P)"><svg aria-hidden="true"><use href="#i-pause"/></svg></button>
  </div>

  <section id="scrTitle" class="screen" aria-label="جزيرة الفوضى">
    <h1 class="logo"><span class="l1">جزيرة</span><span class="l2">الفوضى</span></h1>
    <div class="chip coins" id="titleCoins" aria-label="العملات"><svg aria-hidden="true"><use href="#i-coin"/></svg><b>0</b></div>
    <button type="button" id="btnPlay" class="ci-btn ci-play ring" aria-label="العب"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
    <button type="button" id="btnWardrobe" class="ci-btn ci-side" aria-label="الخزانة"><svg aria-hidden="true"><use href="#i-hat"/></svg></button>
    <button type="button" id="btnDuo" class="ci-btn ci-side" aria-label="لاعبان"><svg aria-hidden="true"><use href="#i-two"/></svg></button>
    <div class="isles" id="isles" role="group" aria-label="الجزر"></div>
  </section>

  <section id="scrWardrobe" class="screen" aria-label="الخزانة" hidden>
    <button type="button" id="wardBack" class="ci-btn ci-round" aria-label="رجوع"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
    <div class="chip coins" id="wardCoins" aria-label="العملات"><svg aria-hidden="true"><use href="#i-coin"/></svg><b>0</b></div>
    <div class="ward-panel">
      <div class="shelf" id="shelfColor" role="group" aria-label="الألوان"></div>
      <div class="shelf" id="shelfHat" role="group" aria-label="القبعات"></div>
      <div class="shelf" id="shelfExtra" role="group" aria-label="الإضافات"></div>
    </div>
  </section>

  <!-- The disaster picture card with its 3-2-1 countdown. -->
  <div id="card" aria-live="polite" hidden>
    <canvas id="cardPic" width="440" height="220"></canvas>
    <b id="cardName"></b>
    <span id="cardTip"></span>
    <em id="cardCount" aria-hidden="true"></em>
  </div>

  <section id="scrPause" class="screen dim" aria-label="استراحة" hidden>
    <div class="card pause-card">
      <button type="button" id="btnResume" class="ci-btn ci-go" aria-label="تابع اللعب"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
      <div class="row">
        <button type="button" id="btnMenu" class="ci-btn ci-round big" aria-label="القائمة"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
        <button type="button" id="btnRestart" class="ci-btn ci-round big" aria-label="ابدأ من جديد"><svg aria-hidden="true"><use href="#i-again"/></svg></button>
      </div>
      <p class="keys"><span class="sg-key">P</span></p>
    </div>
  </section>

  <section id="scrResult" class="screen" aria-label="النتيجة" hidden>
    <div class="card result">
      <h2 id="resTitle"></h2>
      <div class="stars3" id="resStars" aria-hidden="true"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
      <div class="sheet" id="resSheet"></div>
      <div class="newbest" id="resNew" hidden><svg aria-hidden="true"><use href="#i-crown"/></svg><span id="resNewText">رقم جديد!</span></div>
      <div class="row">
        <button type="button" id="resMenu" class="ci-btn ci-round big" aria-label="القائمة"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
        <button type="button" id="resAgain" class="ci-btn ci-go ring" aria-label="مرة أخرى"><svg aria-hidden="true"><use href="#i-again"/></svg></button>
        <button type="button" id="resNext" class="ci-btn ci-round big" aria-label="الجزيرة التالية" hidden><svg aria-hidden="true"><use href="#i-next"/></svg></button>
      </div>
    </div>
  </section>

  <!-- The wordless coach: a hand that shows the next button after a few idle seconds. -->
  <div id="hand" aria-hidden="true" hidden>
    <svg viewBox="0 0 80 100" width="84" height="105">
      <g fill="#1c2250" stroke="#1c2250" stroke-width="9" stroke-linejoin="round">
        <rect x="22" y="5" width="17" height="54" rx="8.5"/><rect x="37" y="36" width="15" height="30" rx="7.5"/>
        <rect x="50" y="40" width="14" height="28" rx="7"/><rect x="3" y="52" width="27" height="14" rx="7" transform="rotate(38 16 59)"/>
        <rect x="14" y="46" width="52" height="48" rx="19"/>
      </g>
      <g fill="#ffffff">
        <rect x="22" y="5" width="17" height="54" rx="8.5"/><rect x="37" y="36" width="15" height="30" rx="7.5"/>
        <rect x="50" y="40" width="14" height="28" rx="7"/><rect x="3" y="52" width="27" height="14" rx="7" transform="rotate(38 16 59)"/>
        <rect x="14" y="46" width="52" height="48" rx="19"/>
      </g>
    </svg>
  </div>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="../../shared/kit.js"></script>
<script src="../../shared/juice.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
