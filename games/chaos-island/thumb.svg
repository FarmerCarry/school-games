<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fbcff"/>
      <stop offset="1" stop-color="#b8f0ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd0e8"/>
      <stop offset="1" stop-color="#1287b8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#e8ad55"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="44" cy="196" r="20"/><circle cx="70" cy="188" r="24"/><circle cx="96" cy="198" r="17"/>
    <circle cx="330" cy="150" r="18"/><circle cx="352" cy="142" r="22"/><circle cx="376" cy="152" r="15"/>
  </g>
  <!-- the sea and the island -->
  <rect y="318" width="400" height="82" fill="url(#sea)"/>
  <path d="M0 330 Q25 322 50 330 T100 330 T150 330 T200 330 T250 330 T300 330 T350 330 T400 330" fill="none" stroke="#eafcff" stroke-width="4"/>
  <path d="M34 312 L366 312 Q386 314 390 340 L396 400 L4 400 L10 340 Q14 314 34 312 Z" fill="url(#sand)" stroke="#1c2250" stroke-width="6" stroke-linejoin="round"/>
  <path d="M34 312 L366 312" stroke="#fff1c4" stroke-width="5"/>
