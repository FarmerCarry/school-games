<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4800"/>
      <stop offset="55%" stop-color="#ff9e00"/>
      <stop offset="100%" stop-color="#ffee32"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="40%" stop-color="#ff5400"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>
  </defs>

  <!-- Sky & radial action burst -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.16">
    <polygon points="200,200 0,30 70,0"/>
    <polygon points="200,200 175,0 235,0"/>
    <polygon points="200,200 335,0 400,40"/>
    <polygon points="200,200 400,170 400,235"/>
    <polygon points="200,200 0,175 0,240"/>
  </g>

  <!-- Erupting Pirate Volcano -->
  <path d="M55 325 L148 105 L252 105 L345 325 Z" fill="#4a251d" stroke="#1b1640" stroke-width="8" stroke-linejoin="round"/>
  <path d="M148 105 L172 152 L200 124 L228 156 L252 105 Z" fill="#ff5400" stroke="#1b1640" stroke-width="6" stroke-linejoin="round"/>
  <!-- Lava plume -->
  <path d="M168 105 Q150 42 112 34 Q165 24 200 62 Q235 20 286 36 Q250 48 232 105 Z" fill="#ffd000" stroke="#1b1640" stroke-width="6" stroke-linejoin="round"/>
  <!-- Skull cavern -->
  <circle cx="200" cy="212" r="32" fill="#e5e7eb" stroke="#1b1640" stroke-width="6"/>
  <circle cx="188" cy="208" r="8" fill="#ff4800"/>
  <circle cx="212" cy="208" r="8" fill="#ff4800"/>
  <rect x="188" y="228" width="24" height="12" rx="4" fill="#e5e7eb" stroke="#1b1640" stroke-width="5"/>

  <!-- Streaking Volcano Meteor -->
  <g transform="translate(76 82) rotate(-32)">
    <path d="M-18 -8 L38 -22 L28 22 L-18 14 Z" fill="#ffee32"/>
    <circle cx="0" cy="3" r="22" fill="#ff5400" stroke="#1b1640" stroke-width="6"/>
    <circle cx="-4" cy="3" r="12" fill="#7f1d1d" stroke="#1b1640" stroke-width="4"/>
  </g>

  <!-- Main Pirate Battle Deck -->
  <rect x="42" y="284" width="316" height="40" rx="14" fill="#78350f" stroke="#1b1640" stroke-width="8"/>
  <rect x="50" y="288" width="300" height="13" rx="6" fill="#d97706"/>

  <!-- Ticking Fuse Bomb Punched Away -->
  <g transform="translate(314 176) rotate(18)">
    <path d="M0 -24 Q14 -40 26 -30" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
    <circle cx="27" cy="-29" r="8" fill="#ff0054"/>
    <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#1b1640" stroke-width="7"/>
    <circle cx="-8" cy="-8" r="6" fill="#64748b"/>
  </g>

  <!-- Comic Impact Burst -->
  <polygon points="262,175 276,154 285,176 308,170 292,190 308,208 284,204 274,225 264,202 242,205 256,188 244,170" fill="#ffee32" stroke="#1b1640" stroke-width="5" stroke-linejoin="round"/>

  <!-- Leaping Pirate Brawler Hero -->
  <g transform="translate(168 205) rotate(-8)">
    <!-- Electric Shield Aura -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#00f5d4" stroke-width="6" stroke-dasharray="18 10"/>
    <!-- Boots -->
    <rect x="-26" y="30" width="20" height="15" rx="7" fill="#1e293b" stroke="#1b1640" stroke-width="6"/>
    <rect x="6" y="26" width="20" height="15" rx="7" fill="#1e293b" stroke="#1b1640" stroke-width="6"/>
    <!-- Hero Body -->
    <rect x="-32" y="-26" width="64" height="60" rx="26" fill="#ff9f1c" stroke="#1b1640" stroke-width="7"/>
    <rect x="-31" y="12" width="62" height="10" fill="#1b1640"/>
    <rect x="-8" y="9" width="16" height="15" rx="3" fill="#ffd166" stroke="#1b1640" stroke-width="4"/>
    <!-- Eyes -->
    <ellipse cx="-6" cy="-4" rx="7" ry="9" fill="#fff" stroke="#1b1640" stroke-width="4"/>
    <ellipse cx="14" cy="-4" rx="7" ry="9" fill="#fff" stroke="#1b1640" stroke-width="4"/>
    <circle cx="-4" cy="-4" r="4" fill="#1b1640"/>
    <circle cx="16" cy="-4" r="4" fill="#1b1640"/>
    <!-- Pirate Bandana -->
    <path d="M-34 -18 Q0 -34 34 -18 L32 -6 L-32 -6 Z" fill="#ef233c" stroke="#1b1640" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-34 -14 L-56 -24 L-48 -4 Z" fill="#ef233c" stroke="#1b1640" stroke-width="5" stroke-linejoin="round"/>
    <!-- Giant Mech Shockwave Hammer -->
    <g transform="translate(46 -12) rotate(28)">
      <rect x="-5" y="-28" width="10" height="52" rx="4" fill="#78350f" stroke="#1b1640" stroke-width="5"/>
      <rect x="-24" y="-48" width="48" height="28" rx="8" fill="#ffd000" stroke="#1b1640" stroke-width="6"/>
    </g>
  </g>

  <!-- Mecha-Shark Fin in Rising Magma Sea -->
  <path d="M68 342 L94 298 L124 344 Z" fill="#00b4d8" stroke="#1b1640" stroke-width="7" stroke-linejoin="round"/>
  <path d="M0 342 Q50 326 100 342 T200 342 T300 342 T400 342 L400 400 L0 400 Z" fill="url(#lava)" stroke="#1b1640" stroke-width="7"/>
</svg>
