    <path d="M50 246 L130 300 M130 246 L50 300" fill="none" stroke-width="9"/>
    <path d="M50 246 L130 300 M130 246 L50 300" fill="none" stroke="#c9874a" stroke-width="4"/>
    <rect x="26" y="222" width="128" height="18" rx="6" fill="#c9874a"/>
  </g>
  <!-- the palm tree -->
  <g stroke="#1c2250" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M300 314 Q312 260 296 212 L312 210 Q330 262 318 314 Z" fill="#c08347"/>
    <path d="M304 210 Q262 184 226 214 Q262 200 304 222 Z" fill="#3a9a35"/>
    <path d="M304 210 Q350 182 384 214 Q346 200 304 222 Z" fill="#3a9a35"/>
    <path d="M304 212 Q270 160 236 168 Q276 176 302 222 Z" fill="#5cc94a"/>
    <path d="M304 212 Q340 158 378 170 Q338 178 306 222 Z" fill="#5cc94a"/>
    <circle cx="296" cy="222" r="9" fill="#8a5a2b"/><circle cx="314" cy="224" r="9" fill="#8a5a2b"/>
  </g>
  <!-- a shadow where the marshmallow will land, and the marshmallow -->
  <ellipse cx="218" cy="314" rx="34" ry="9" fill="#1c2250" opacity="0.3"/>
  <ellipse cx="218" cy="314" rx="40" ry="11" fill="none" stroke="#1c2250" stroke-width="6"/>
  <ellipse cx="218" cy="314" rx="40" ry="11" fill="none" stroke="#ff4d4d" stroke-width="3"/>
  <g>
    <circle cx="212" cy="196" r="9" fill="#ffb3de"/><circle cx="206" cy="176" r="7" fill="#b5f0ff"/><circle cx="214" cy="160" r="5" fill="#fff3a8"/>
    <rect x="190" y="200" width="56" height="52" rx="22" fill="#fff6fb" stroke="#1c2250" stroke-width="5"/>
    <ellipse cx="218" cy="208" rx="24" ry="7" fill="#ffd9ec"/>
    <ellipse cx="210" cy="228" rx="4" ry="5.5" fill="#1c2250"/><ellipse cx="226" cy="228" rx="4" ry="5.5" fill="#1c2250"/>
    <ellipse cx="218" cy="240" rx="4" ry="3.5" fill="#1c2250"/>
  </g>
