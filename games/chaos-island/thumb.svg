  <path d="M0 360 Q20 348 40 360 T80 360 T120 360 T160 360 T200 360 T240 360 T280 360 T320 360 T360 360 T400 360 L400 400 L0 400 Z" fill="#7cf06a" fill-opacity="0.7" stroke="#1c2250" stroke-width="5"/>
  <path d="M10 368 Q30 360 50 368" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
  <path d="M250 370 Q270 362 290 370" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
  <!-- the title -->
  <g font-family="Fredoka, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="700" text-anchor="middle" direction="rtl">
    <text x="200" y="66" font-size="52" fill="#1c2250" stroke="#1c2250" stroke-width="14" stroke-linejoin="round">جزيرة</text>
    <text x="200" y="62" font-size="52" fill="#ffffff">جزيرة</text>
    <text x="200" y="134" font-size="76" fill="#1c2250" stroke="#1c2250" stroke-width="16" stroke-linejoin="round">الفوضى</text>
    <text x="200" y="128" font-size="76" fill="#ffd23f" stroke="#ffffff" stroke-width="2" paint-order="stroke" stroke-linejoin="round">الفوضى</text>
  </g>
</svg>
