  <g stroke="#1c2250" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="78" cy="214" rx="10" ry="7" fill="#c7962d" stroke-width="4"/>
    <ellipse cx="100" cy="214" rx="10" ry="7" fill="#c7962d" stroke-width="4"/>
    <ellipse cx="89" cy="186" rx="28" ry="30" fill="#ffd23f" stroke-width="6"/>
    <ellipse cx="80" cy="174" rx="9" ry="6" fill="#ffffff" opacity="0.6" stroke="none"/>
    <ellipse cx="81" cy="182" rx="8" ry="10" fill="#ffffff" stroke-width="3.5"/>
    <ellipse cx="100" cy="182" rx="8" ry="10" fill="#ffffff" stroke-width="3.5"/>
    <circle cx="83" cy="180" r="4.5" fill="#1c2250" stroke="none"/><circle cx="102" cy="180" r="4.5" fill="#1c2250" stroke="none"/>
    <path d="M84 198 Q91 205 98 198" fill="none" stroke-width="4"/>
    <path d="M66 164 Q66 138 89 136 Q112 138 112 164 Z" fill="#ff5d6c" stroke-width="4"/>
    <path d="M104 160 Q126 152 134 164 Q120 170 104 166 Z" fill="#ff5d6c" stroke-width="4"/>
    <circle cx="89" cy="136" r="4" fill="#ffffff" stroke-width="2.5"/>
  </g>
  <!-- a friend bonked by a coconut: spinning stars -->
  <g stroke="#1c2250" stroke-linejoin="round">
    <ellipse cx="348" cy="294" rx="22" ry="21" fill="#4fc3ff" stroke-width="5"/>
    <circle cx="341" cy="290" r="6" fill="#ffffff" stroke-width="3"/><circle cx="356" cy="290" r="6" fill="#ffffff" stroke-width="3"/>
    <path d="M338 290 l6 0 M353 290 l6 0" stroke-width="3"/>
    <ellipse cx="348" cy="303" rx="4" ry="4.5" fill="#1c2250" stroke="none"/>
    <path d="M326 260 l4 -9 l4 9 l9 1 l-7 6 l2 9 l-8 -5 l-8 5 l2 -9 l-7 -6 Z" fill="#ffe14d" stroke-width="2.5"/>
    <path d="M362 252 l3 -7 l3 7 l7 1 l-5 4 l1 7 l-6 -4 l-6 4 l1 -7 l-5 -4 Z" fill="#ffe14d" stroke-width="2.5"/>
