<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ea8ff"/>
      <stop offset="0.65" stop-color="#8ce3ff"/>
      <stop offset="1" stop-color="#1cc4ec"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19c6ee"/>
      <stop offset="1" stop-color="#0b77c4"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf2e"/>
      <stop offset="1" stop-color="#ff4820"/>
    </linearGradient>
  </defs>
  <!-- Sunny tropical sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <!-- Puffy clouds -->
  <g fill="#ffffff" opacity="0.92">
    <circle cx="72" cy="74" r="24"/><circle cx="96" cy="68" r="28"/><circle cx="122" cy="76" r="20"/>
    <circle cx="318" cy="86" r="22"/><circle cx="342" cy="80" r="26"/><circle cx="364" cy="88" r="18"/>
  </g>
  <!-- Ocean & glowing lava wave -->
  <rect y="286" width="400" height="114" fill="url(#sea)"/>
  <path d="M0 320 Q50 302 100 320 T200 320 T300 320 T400 320 V400 H0 Z" fill="url(#lava)" opacity="0.92"/>
  <path d="M0 336 Q55 322 110 336 T220 336 T330 336 T400 332" fill="none" stroke="#ffe973" stroke-width="6" stroke-linecap="round"/>

  <!-- Floating 3D Tropical Island -->
  <polygon points="58,284 342,284 306,336 94,336" fill="#9c623d" stroke="#1e2547" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="200" cy="284" rx="154" ry="30" fill="#f7d57c" stroke="#1e2547" stroke-width="5"/>
  <ellipse cx="200" cy="274" rx="134" ry="24" fill="#52d14b" stroke="#1e2547" stroke-width="5"/>

  <!-- Background volcano -->
  <polygon points="74,264 114,174 146,174 186,264" fill="#6b566d" stroke="#1e2547" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="130" cy="174" rx="16" ry="5" fill="#ff7426" stroke="#1e2547" stroke-width="4"/>

  <!-- Central Striped Lighthouse & Stone Shelter -->
  <rect x="166" y="182" width="68" height="86" rx="8" fill="#eceaf2" stroke="#1e2547" stroke-width="5"/>
  <rect x="178" y="218" width="44" height="50" rx="6" fill="#35e6ff" stroke="#1e2547" stroke-width="4"/>
  <rect x="162" y="170" width="76" height="16" rx="6" fill="#ff5468" stroke="#1e2547" stroke-width="5"/>
  <rect x="178" y="132" width="44" height="38" fill="#ffffff" stroke="#1e2547" stroke-width="5"/>
  <rect x="178" y="148" width="44" height="14" fill="#ff4b5c"/>
  <rect x="184" y="106" width="32" height="26" fill="#ffe45c" stroke="#1e2547" stroke-width="5"/>
  <polygon points="178,108 200,82 222,108" fill="#ff4b5c" stroke="#1e2547" stroke-width="5" stroke-linejoin="round"/>

  <!-- Palm Tree right -->
  <path d="M300 264 Q316 218 308 176" fill="none" stroke="#9e6238" stroke-width="14" stroke-linecap="round"/>
  <g fill="#42cc4c" stroke="#1e2547" stroke-width="4" stroke-linejoin="round">
    <path d="M308 176 Q348 158 366 184 Q336 184 308 176 Z"/>
    <path d="M308 176 Q268 154 252 178 Q280 182 308 176 Z"/>
    <path d="M308 176 Q326 138 352 146 Q332 162 308 176 Z"/>
    <path d="M308 176 Q290 138 268 148 Q286 164 308 176 Z"/>
  </g>

  <!-- Swirling mini tornado left -->
  <g stroke="#1e2547" stroke-width="4">
    <ellipse cx="86" cy="212" rx="28" ry="8" fill="#8ceeff"/>
    <ellipse cx="89" cy="228" rx="21" ry="6" fill="#c9f8ff"/>
    <ellipse cx="84" cy="242" rx="14" ry="5" fill="#8ceeff"/>
    <ellipse cx="88" cy="254" rx="8" ry="3.5" fill="#c9f8ff"/>
  </g>

  <!-- Falling fiery meteor top-right -->
  <path d="M332 94 L276 144 L292 160 L348 110 Z" fill="#ff9f24"/>
  <circle cx="274" cy="154" r="22" fill="#ff4620" stroke="#1e2547" stroke-width="5"/>
  <circle cx="268" cy="148" r="7" fill="#ffe14d"/>

  <!-- Cute Chunky Islander Hero jumping joyfully with Crown! -->
  <g transform="translate(200,210)">
    <rect x="-18" y="4" width="36" height="30" rx="9" fill="#2ea8ff" stroke="#1e2547" stroke-width="5"/>
    <rect x="-26" y="8" width="10" height="20" rx="5" fill="#2ea8ff" stroke="#1e2547" stroke-width="4" transform="rotate(24 -20 12)"/>
    <rect x="16" y="8" width="10" height="20" rx="5" fill="#2ea8ff" stroke="#1e2547" stroke-width="4" transform="rotate(-24 20 12)"/>
    <rect x="-20" y="-32" width="40" height="38" rx="12" fill="#ffe2be" stroke="#1e2547" stroke-width="5"/>
    <circle cx="-8" cy="-14" r="4.5" fill="#1e2547"/><circle cx="8" cy="-14" r="4.5" fill="#1e2547"/>
    <circle cx="-6.5" cy="-16" r="1.8" fill="#fff"/><circle cx="9.5" cy="-16" r="1.8" fill="#fff"/>
    <ellipse cx="-13" cy="-6" rx="4" ry="2.4" fill="#ff85a8"/><ellipse cx="13" cy="-6" rx="4" ry="2.4" fill="#ff85a8"/>
    <path d="M-6 -6 Q0 0 6 -6" fill="none" stroke="#1e2547" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Golden Crown -->
    <polygon points="-16,-32 -18,-50 -6,-40 0,-54 6,-40 18,-50 16,-32" fill="#ffcf2e" stroke="#1e2547" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Bold Arabic Logo -->
  <text x="200" y="64" text-anchor="middle" direction="rtl" font-family="Fredoka, 'Baloo Bhaijaan 2', sans-serif" font-size="46" font-weight="700" fill="#ffe84d" stroke="#1e2547" stroke-width="10" paint-order="stroke fill">جزيرة الفوضى</text>
</svg>
