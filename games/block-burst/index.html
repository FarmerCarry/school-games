<title>انفجار المكعبات</title>

<style>:root{--ink: #1b0f3a;--yel: #ffd21f;--pink: #ff5fa8;--grn: #3ddc5a;--blu: #3b7bff;--pur: #7a3cff;--card: #2a1d6b}body{background:#1a1245}#game{z-index:1;cursor:default}#fx{position:absolute;z-index:30;pointer-events:none}#ui{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;pointer-events:none;z-index:5;font-family:var(--sg-font)}.scr{position:absolute;inset:0;pointer-events:auto}.scr[hidden]{display:none!important}button{font-family:var(--sg-font)}.music-btn{right:62px!important;font-size:20px}.music-btn.off{opacity:.55}.music-btn.off:after{content:"";position:absolute;left:8px;right:8px;top:19px;height:3px;background:#ff5a5f;transform:rotate(-40deg);border-radius:2px}.music-btn{position:fixed}#scrTitle{display:flex;flex-direction:column;align-items:center}.logo{position:relative;margin-top:20px;text-align:center;line-height:1;animation:logoIn .6s cubic-bezier(.2,1.6,.4,1) both}.logo-blocks{display:flex;justify-content:center;gap:6px;height:56px;margin-bottom:-6px}.logo-blocks i{display:block;width:52px;height:52px;background-size:100% 100%;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35));animation:blockBob 1.6s ease-in-out infinite}.logo-blocks .b1{transform:rotate(-10deg);animation-delay:0s}.logo-blocks .b2{animation-delay:.2s}.logo-blocks .b3{transform:rotate(10deg);animation-delay:.4s}.logo-top,.logo-bot{font-weight:700;color:#fff;-webkit-text-stroke:14px var(--ink);paint-order:stroke fill;text-shadow:0 9px 0 var(--ink)}.logo-top{font-size:94px;color:var(--yel);transform:rotate(-3deg);padding-bottom:0}.logo-bot{font-size:72px;color:#fff;margin-top:-16px;transform:rotate(2deg)}.logo-bot{background:none}@keyframes logoIn{0%{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}@keyframes blockBob{0%,to{translate:0 0}50%{translate:0 -9px}}.modes{display:flex;gap:34px;margin-top:10px}.mode{position:relative;width:330px;height:206px;border:5px solid var(--ink);border-radius:30px;cursor:pointer;color:#fff;box-shadow:0 display:block;font-size:17px;font-weight:700;line-height:1;opacity:.75;margin-top:-4px}.lvl .ls{display:flex;justify-content:center;gap:1px;margin-top:8px;direction:ltr}.lvl .ls i{width:22px;height:22px;background:#cfcbe6;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}.lvl .ls i.on{background:#ffc21f}.lvl.locked{background:#8f8aad;cursor:default;box-shadow:0 5px #1b0f3a99}.lvl.locked:hover{transform:none}.lvl.locked .ln{opacity:.3}.lvl.locked .lk,.lvl.locked .ls{visibility:hidden}.lvl.locked:after{content:"🔒";position:absolute;left:0;right:0;top:70px;font-size:32px}.lvl.next{background:var(--yel)}.lvl.next:before{content:"العب!";position:absolute;top:-16px;left:50%;translate:-50% 0;font-size:15px;font-weight:700;color:#fff;background:var(--pink);border:3px solid var(--ink);border-radius:10px;padding:0 8px 2px;white-space:nowrap;animation:goPulse2 .9s ease-in-out infinite}#hud{pointer-events:none}.hbtn{position:absolute;left:14px;top:12px;width:56px;height:56px;border-radius:18px;border:4px solid var(--ink);background:#fff;cursor:pointer;pointer-events:auto;box-shadow:0 5px 0 var(--ink)}.hbtn:hover{transform:translateY(-2px)}.ico-pause{display:block;width:20px;height:22px;margin:0 auto;border-left:7px solid var(--ink);border-right:7px solid var(--ink);box-sizing:border-box}.ovl{display:flex;align-items:center;justify-content:center;background:#0a06229e}.panel{position:relative;min-width:440px;background:linear-gradient(180deg,#3d2a9a,#2a1d6b);border:5px solid var(--ink);border-radius:34px;padding:22px 40px 26px;text-align:center;box-shadow:0 10px 0 var(--ink),0 30px 60px #00000080;animation:panelIn .42s cubic-bezier(.2,1.5,.4,1) both}.panel.wide{min-width:600px}.panel h2{margin:0 0 6px;font-size:58px;font-weight:700;color:var(--yel);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);line-height:1.2}@keyframes panelIn{0%{transform:scale(.5) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}.col{display:flex;flex-direction:column;align-items:stretch;gap:12px;margin-top:16px}.col.row{flex-direction:row;justify-content:center;flex-wrap:wrap}.pbtn{font-size:25px;font-weight:700;color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:999px;padding:4px 26px 8px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s;white-space:nowrap}.pbtn:hover{transform:translateY(-3px) scale(1.03)}.pbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}.pbtn.g{background:var(--grn)}.pbtn .sg-key{font-size:13px;padding:0 6px;min-width:0;vertical-align:3px}.pbtn[hidden]{display:none}.newbest{display:inline-block;font-size:30px;font-weight:700;color:var(--ink);background:var(--yel);border:4px solid var(--ink);border-radius:999px;padding:0 24px 4px;transform:rotate(-3deg);animation:goPulse2 .8s ease-in-out infinite}.newbest[hidden]{display:none}.bigscore{font-size:96px;font-weight:700;line-height:1.1;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);direction:ltr}.stats{display:flex;gap:14px;justify-content:center;margin-top:6px}.sbox{min-width:140px;background:#1b0f3a99;border:3px solid rgba(255,255,255,.18);border-radius:18px;padding:4px 14px 8px}.sbox label{display:block;font-size:17px;font-weight:700;opacity:.8}.sbox b{display:block;font-size:34px;line-height:1.1}.unlockbar{margin:14px auto 0;max-width:520px;font-size:18px;font-weight:700}.unlockbar:empty{display:none}.unlockbar .ub{position:relative;height:22px;margin-top:6px;background:#1b0f3acc;border:3px solid var(--ink);border-radius:999px;overflow:hidden}.unlockbar .ub i{position:absolute;top:0;bottom:0;right:0;background:linear-gradient(90deg,#ffb31f,var(--yel));border-radius:999px;transition:width 1s ease-out}.winsub{font-size:24px;font-weight:700;opacity:.9}.bigstars{display:flex;justify-content:center;gap:10px;margin:10px 0 6px;direction:ltr}.bigstars i{width:86px;height:86px;background:#1b0f3a;clip- <body>
<canvas id="game" tabindex="0"></canvas>

<div id="ui">
  <!-- ================= TITLE ================= -->
  <section id="scrTitle" class="scr">
    <div class="logo">
      <div class="logo-blocks" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
      <div class="logo-top">انفجار</div>
      <div class="logo-bot">المكعبات</div>
    </div>

    <div class="modes">
      <button type="button" class="mode classic" id="btnClassic">
        <span class="mode-art art-classic" aria-hidden="true"></span>
        <span class="mode-name">كلاسيكي</span>
        <span class="mode-sub" id="classicSub">الأفضل: 0</span>
        <span class="mode-go" id="classicGo">▶ العب</span>
        <span class="mode-key"><span class="sg-key">Enter</span></span>
      </button>
      <button type="button" class="mode adv" id="btnAdv">
        <span class="mode-art art-adv" aria-hidden="true"></span>
        <span class="mode-name">مغامرة</span>
        <span class="mode-sub" id="advSub"><i class="st"></i> 0 / 60</span>
        <span class="mode-go">▶ 20 مرحلة</span>
        <span class="mode-key"><span class="sg-key">A</span></span>
      </button>
    </div>
    <button type="button" class="newgame" id="btnNew" hidden>🔄 لعبة كلاسيكية جديدة</button>

    <div class="skins-card">
      <div class="skins-h">أشكال المكعبات</div>
      <div class="skins" id="skins"></div>
    </div>

    <div class="howto">
      <span class="hk"><span class="sg-key">اسحب</span> القطع إلى اللوحة</span>
      <span class="hk">املأ صفًا أو عمودًا لتفجيره 💥</span>
      <span class="hk"><span dir="ltr"><span class="sg-key">P</span><span class="sg-key">Esc</span></span> إيقاف</span>
      <span class="hk"><span class="sg-key">M</span> الصوت</span>
    </div>
  </section>

  <!-- ================= ADVENTURE MAP ================= -->
  <section id="scrMap" class="scr" hidden>
    <div class="map-head">
      <button type="button" class="back" id="btnMapBack">→ رجوع <span class="sg-key">Esc</span></button>
      <div class="map-title">المغامرة</div>
      <div class="map-stars"><i class="st big"></i> <b id="mapStars">0</b> / 60</div>
    </div>
    <div class="worlds" id="worlds"></div>
  </section>

  <!-- ================= HUD ================= -->
  <section id="hud" class="scr" hidden>
    <button type="button" class="hbtn" id="btnPause" aria-label="إيقاف مؤقت"><span class="ico-pause"></span></button>
  </section>

  <!-- ================= PAUSE ================= -->
  <section id="scrPause" class="scr ovl" hidden>
    <div class="panel">
      <h2>استراحة</h2>
      <div class="col">
        <button type="button" class="pbtn g" id="btnResume">▶ تابع اللعب <span class="sg-key">P</span></button>
        <button type="button" class="pbtn" id="btnRestart">🔄 من جديد <span class="sg-key">R</span></button>
        <button type="button" class="pbtn" id="btnMusic">🎵 الموسيقى: <b id="musicState">تعمل</b></button>
        <button type="button" class="pbtn" id="btnPauseMenu">🏠 القائمة</button>
      </div>
    </div>
  </section>

  <!-- ================= GAME OVER (classic) ================= -->
  <section id="scrOver" class="scr ovl" hidden>
    <div class="panel wide">
      <h2 id="overHead">لا مساحة!</h2>
      <div class="newbest" id="overNewBest" hidden>🏆 رقم قياسي جديد!</div>
      <div class="bigscore" id="overScore">0</div>
      <div class="stats">
        <div class="sbox"><label>الأفضل</label><b id="overBest">0</b></div>
