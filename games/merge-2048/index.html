<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دمج 2048</title>

<style>:root{--ink: #22123f;--cream: #fffaf0;--pink: #ff4f9a;--yel: #ffd23f;--grn: #4fdc7a;--blu: #4fb8ff}body{background:#3b1fa3;transition:background-color .4s}#game{z-index:1;cursor:grab}#game:active{cursor:grabbing}#ui{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;pointer-events:none;z-index:5}.scr{position:absolute;inset:0}.scr[hidden]{display:none!important}button,.card,.panel{pointer-events:auto}button{font-family:var(--sg-font)}.sg-key{border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);color:var(--ink)}.outl{-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}.logo{position:absolute;left:0;right:0;top:22px;display:flex;justify-content:center;align-items:center;gap:22px;pointer-events:none}.logo-ar{font-size:96px;font-weight:700;color:#fff;line-height:1;-webkit-text-stroke:14px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);transform:rotate(-4deg);animation:bob 1.8s ease-in-out infinite;padding-bottom:10px}.logo-tiles{display:flex;gap:10px}.lt{width:86px;height:86px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:700;color:#fff;border:5px solid var(--ink);box-shadow:inset 0 -9px #00000038,inset 0 8px #ffffff4d,0 8px 0 var(--ink);text-shadow:0 4px 0 rgba(0,0,0,.25);animation:tilebob 1.6s ease-in-out infinite;line-height:1}.lt1{background:#ff8a3d;animation-delay:0s}.lt2{background:#ff2e63;animation-delay:.12s}.lt3{background:#b84dff;animation-delay:.24s}.lt4{background:#ffc400;animation-delay:.36s}@keyframes bob{0%,to{translate:0 0}50%{translate:0 -8px}}@keyframes tilebob{0%,to{transform:translateY(0) rotate(0)}40%{transform:translateY(-9px) rotate(-4deg)}60%{transform:translateY(-9px) rotate(3deg)}}.tagline{position:absolute;left:0;right:0;top:136px;text-align:center;font-size:24px;font-weight:700;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;pointer-events:none}.card{background:#fffaf0f5;color:var(--ink);border:5px soli on:column;gap:14px}.mini-logo{text-align:center;font-size:46px;font-weight:700;color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;line-height:1;transform:rotate(-3deg);margin-bottom:-4px}.mini-logo b{color:var(--yel)}.box{background:#fffaf0f5;color:var(--ink);border:5px solid var(--ink);border-radius:22px;box-shadow:0 6px #22123f99;padding:4px 12px 8px;text-align:center;position:relative}.box label{display:block;font-size:19px;font-weight:700;opacity:.7}.box b{display:block;font-size:46px;line-height:1.05;direction:ltr}.box.best b{font-size:34px}.box.bump{animation:bump .22s ease-out}@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.1) rotate(-1.5deg)}to{transform:scale(1)}}.plus{position:absolute;left:22%;top:44px;font-size:32px;font-weight:700;color:var(--grn);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;pointer-events:none;animation:floatup .9s ease-out forwards;direction:ltr;white-space:nowrap}@keyframes floatup{0%{transform:translate(-50%) scale(.6);opacity:0}15%{transform:translate(-50%,-12px) scale(1.15);opacity:1}to{transform:translate(-50%,-64px) scale(1);opacity:0}}.goalrow{display:flex;align-items:center;justify-content:center;gap:10px}#goalTile{width:60px;height:60px}.goaltxt{font-size:34px;font-weight:700;direction:ltr}.bar{height:16px;border-radius:10px;background:#e6e0f0;border:3px solid var(--ink);overflow:hidden;margin:6px 4px 2px}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff4f9a);transition:width .3s}.hbtn{font:inherit;font-weight:700;font-size:24px;cursor:pointer;border:5px solid var(--ink);border-radius:22px;background:#fff;color:var(--ink);padding:8px 12px 10px;box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;gap:8px;transition:transform .08s;text-align:start}.hbtn .ic{font-size:26px}.hbtn .sg-key{margin-inline-start:auto;font-size:15px}.hbtn:hover{transform:translateY(-2px) scale(1.02);filter:brightness(.97)}.hbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}.hbtn.undo{background:var(--yel);font-size:28px}.hbtn.undo.empty{background:#d8d2e2;color:#6b6380}.hbtn.shake{animation:shake .35s}.hbtn.warn{background:var(--pink);color:#fff}.dots{display:inline-flex;gap:4px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--ink);display:inline-block}.dots i.off{background:transparent;border:2px solid var(--ink);opacity:.4}.hints{margin-top:4px;font-size:18px;font-weight:700;color:#fff;background:#22123f80;border-radius:18px;padding:8px 12px;line-height:1.9}.hints .sg-key{font-size:14px}.ovl{background:#180a3880;display:flex;align-items:center;justify-content:center;pointer-events:auto}.ovl.win{background:#180a3859}.panel{background:var(--cream);color:var(--ink);border:6px solid var(--ink);border-radius:30px;box-shadow:0 10px #22123fb3;padding:18px 34px 24px;text-align:center;min-width:470px;animation:popin .35s cubic-bezier(.2,1.6,.4,1) both}@keyframes popin{0%{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}.panel h2{margin:0 0 6px;font-size:54px;line-height:1.15;color:var(--yel);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill}.panel .sub{font-size:24px;font-weight:700;margin-bottom:10px}.col{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:10px}.pbtn{font:inherit;font-weight:700;font-size:28px;cursor:pointer;border:5px solid var(--ink);border-radius:24px;padding:6px 20px 8px;min-width:320px;color:var(--ink);box-shadow:0 6px 0 var(--ink);background:#fff;transition:transform .08s}.pbtn.g{background:var(--grn)}.pbtn.y{background:var(--yel)}.pbtn[hidden]{display:none}.pbtn:hover{filter:brightness(1.05);transform:translateY(-2px) scale(1.02)}.pbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}.pbtn small{font-size:18px;opacity:.7}.pbtn .sg-key{font-size:15px;vertical-align:middle;margin-inline-start:8px}.res{display:flex;justify-content:center;gap:12px;margin:8px 0 4px}.rbox{background:#fff;border:4px solid var(--ink);border-radius:18px;padding:4px 12px 8px;min-width:128px;display:flex;flex-direction:column;align-items:center;justify-content:center}.rbox label{font-size:18px;font-weight:700;opacity:.7}.rbox b{font-size:40px;direction:ltr;line-height:1.1}.rbox canvas{width:60px;height:60px}.newbest{display:inline-block;font-size:28px;font-weight:700;color:#fff;background:var(--pink);border:4px solid var(--ink);border-radius:18px;padding:0 16px;margin:2px 0 6px;animation:pulse .8s infinite}.newbest[hidden]{display:none}.hint{font-size:19px;font-weight:700;min-height:26px;color:#6a2db0}.wintile canvas{width:130px;height:130px;animation:spinpop .8s cubic-bezier(.2,1.6,.4,1) both}@keyframes spinpop{0%{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}#toast{position:absolute;left:50%;top:8px;transform:translate(-50%,-120px);background:var(--cream);color:var(--ink);border:5px solid var(--ink);border-radius:22px;box-shadow:0 6px #22123f99;padding:6px 22px;font-size:26px;font-weight:700;white-space:nowrap;transition:transform .35s cubic-bezier(.2,1.5,.4,1),opacity .25s;pointer-events:none;z-index:30;opacity:0}#toast.show{transform:translate(-50%);opacity:1}</style>

<body>
<canvas id="game" tabindex="0"></canvas>

<div id="ui">
  <!-- ============ TITLE ============ -->
  <section id="scrTitle" class="scr">
    <div class="logo">
      <div class="logo-ar">دمج</div>
      <div class="logo-tiles" dir="ltr"><span class="lt lt1">2</span><span class="lt lt2">0</span><span class="lt lt3">4</span><span class="lt lt4">8</span></div>
    </div>

    <div class="card side" id="sizeCard">
      <h3>📐 حجم اللوحة</h3>
      <div class="sizes" id="sizes"></div>
    </div>

    <div class="card side" id="themeCard">
      <h3>🎨 الأشكال</h3>
      <div class="themes" id="themes"></div>
      <div class="besttile" id="bestTileLine"></div>
    </div>

    <div class="playrow">
      <button type="button" class="bigbtn" id="btnPlay"><span id="playLbl">▶ العب</span><small id="playSub"></small></button>
      <button type="button" class="midbtn" id="btnNewT" hidden>🔄 لعبة جديدة</button>
    </div>

    <div class="howto">
      <span class="hk"><span dir="ltr"><span class="sg-key">←</span><span class="sg-key">↑</span><span class="sg-key">→</span><span class="sg-key">↓</span></span> أو <span dir="ltr"><span class="sg-key">W</span><span class="sg-key">A</span><span class="sg-key">S</span><span class="sg-key">D</span></span> حرّك</span>
      <span class="hk"><span class="sg-key">اسحب</span> بالفأرة</span>
      <span class="hk"><span class="sg-key">U</span> تراجع</span>
      <span class="hk"><span class="sg-key">P</span> إيقاف</span>
      <span class="hk"><span class="sg-key">Enter</span> ابدأ</span>
    </div>
    <div class="tagline">ادمج الأرقام المتشابهة… واصنع 2048!</div>
  </section>

  <!-- ============ HUD ============ -->
  <section id="hud" class="scr" hidden>
    <div class="hud-right">
      <div class="mini-logo"><span>دمج</span> <b dir="ltr">2048</b></div>
      <div class="box" id="scoreBox"><label>النقاط</label><b id="score">0</b></div>
      <div class="box best" id="bestBox"><label>الأفضل <span id="sizeLbl" dir="ltr">4×4</span></label><b id="best">0</b></div>
      <div class="box goal">
        <label>الهدف</label>
        <div class="goalrow"><canvas id="goalTile" width="120" height="120"></canvas><div class="goaltxt" id="goalTxt">2048</div></div>
        <div class="bar"><div id="goalBar"></div></div>
      </div>
    </div>
    <div class="hud-left">
      <button type="button" class="hbtn undo" id="btnUndo"><span class="ic">↶</span> تراجع <span class="dots" id="undoDots"><i></i><i></i><i></i></span><span class="sg-key">U</span></button>
      <button type="button" class="hbtn" id="btnTheme"><span class="ic">🎨</span> <span id="themeName">أرقام</span><span class="sg-key">T</span></button>
      <button type="button" class="hbtn" id="btnRestart"><span class="ic">🔄</span> <span id="restartLbl">لعبة جديدة</span></button>
      <button type="button" class="hbtn" id="btnPause"><span class="ic">⏸</span> إيقاف<span class="sg-key">P</span></button>
      <div class="hints">
        <div><span dir="ltr"><span class="sg-key">←</span><span class="sg-key">↑</span><span class="sg-key">→</span><span class="sg-key">↓</span></span> حرّك</div>
        <div><span class="sg-key">اسحب</span> بالفأرة</div>
      </div>
    </div>
  </section>

  <!-- ============ PAUSE ============ -->
  <section id="scrPause" class="scr ovl" hidden>
    <div class="panel">
      <h2>استراحة ☕</h2>
      <div class="col">
        <button type="button" class="pbtn g" id="btnResume">▶ تابع اللعب <span class="sg-key">P</span></button>
        <button type="button" class="pbtn" id="btnPauseRestart">🔄 لعبة جديدة <span class="sg-key">R</span></button>
        <button type="button" class="pbtn" id="btnPauseMenu">🏠 القائمة</button>
      </div>
    </div>
  </section>

  <!-- ============ GAME OVER ============ -->
  <section id="scrOver" class="scr ovl" hidden>
    <div class="panel">
      <h2 id="overHead">لا توجد حركات!</h2>
      <div class="newbest" id="overBest" hidden>🏆 رقم قياسي جديد!</div>
      <div class="res">
        <div class="rbox"><label>النقاط</label><b id="overScore">0</b></div>
        <div class="rbox"><label>أكبر بلاطة</label><canvas id="overTile" width="120" height="120"></canvas></div>
        <div class="rbox"><label>الأفضل</label><b id="overBestVal">0</b></div>
      </div>
      <div class="hint" id="overHint"></div>
      <div class="col">
        <button type="button" class="pbtn g" id="btnAgain">🔄 حاول مجدداً <span class="sg-key">Enter</span></button>
        <button type="button" class="pbtn y" id="btnOverUndo">↶ تراجع خطوة <small id="overUndoN"></small> <span class="sg-key">U</span></button>
        <button type="button" class="pbtn" id="btnOverMenu">🏠 القائمة <span class="sg-key">Esc</span></button>
      </div>
    </div>
  </section>

  <!-- ============ WIN ============ -->
  <section id="scrWin" class="scr ovl win" hidden>
    <div class="panel">
      <div class="wintile"><canvas id="winTile" width="220" height="220"></canvas></div>
      <h2>أحسنت! وصلت إلى <span dir="ltr" id="winNum">2048</span>!</h2>
      <div class="sub">أنت بطل الدمج! 🎉</div>
      <div class="col">
        <button type="button" class="pbtn g" id="btnKeep">🚀 استمر في اللعب <span class="sg-key">Enter</span></button>
        <button type="button" class="pbtn" id="btnWinNew">🔄 لعبة جديدة <span class="sg-key">R</span></button>
      </div>
    </div>
  </section>
