<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معركة الهلام</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../shared/game.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="ui">
  <button id="pauseBtn" class="rbtn" type="button" aria-label="إيقاف مؤقت" hidden>❚❚</button>

  <!-- ============ TITLE ============ -->
  <section id="scrTitle" class="scr">
    <div class="logo"><span class="w1">معركة</span> <span class="w2">الهلام</span></div>
    <div class="tag">كُل الحبوب، اكبَر، والتهم الجميع!</div>

    <button id="btnPlay" class="play" type="button">▶ العب!</button>
    <div class="enter-hint">تحرّك بالفأرة أو <span dir="ltr"><span class="sg-key">WASD</span></span> · انقسم <span dir="ltr"><span class="sg-key">Space</span></span> · اقذف <span dir="ltr"><span class="sg-key">E</span></span></div>

    <div class="card dock" id="skinBox">
      <div class="skrow">
        <button class="arr" id="skPrev" type="button" aria-label="السابق">▶</button>
        <canvas id="skinPrev" width="200" height="200"></canvas>
        <button class="arr" id="skNext" type="button" aria-label="التالي">◀</button>
      </div>
      <div class="skmeta">
        <div id="skName">نعناع</div>
        <div id="skLock"></div>
        <button id="btnSkins" class="mini" type="button">🎨 الأشكال <b id="skCount" dir="ltr">0/0</b></button>
      </div>
    </div>

    <div class="card dock" id="arenaBox">
      <div id="arenaList"></div>
    </div>
  </section>

  <!-- ============ SKINS ============ -->
  <section id="scrSkins" class="scr dim center" hidden>
    <div class="card skinsPanel">
      <h2>خزانة الأشكال <small id="skCount2" dir="ltr"></small></h2>
      <div id="skinGrid"></div>
      <div id="skinInfo">&nbsp;</div>
      <button id="btnSkinsBack" class="pbtn g" type="button">تم ✔</button>
    </div>
  </section>

  <!-- ============ PAUSE ============ -->
  <section id="scrPause" class="scr dim center" hidden>
    <div class="card ppanel">
      <h2>استراحة</h2>
      <div class="col">
        <button id="btnResume" class="pbtn g" type="button">▶ تابع اللعب <small>(P)</small></button>
        <button id="btnRestart" class="pbtn y" type="button">↻ جولة جديدة <small>(R)</small></button>
        <button id="btnMenu1" class="pbtn" type="button">القائمة الرئيسية</button>
      </div>
    </div>
  </section>

  <!-- ============ GAME OVER ============ -->
  <section id="scrOver" class="scr center" hidden>
    <div class="card opanel">
      <div class="ohead">
        <canvas id="killerCv" width="120" height="120"></canvas>
        <div>
          <div class="osmall">أوه لا!</div>
          <h2 id="oTitle">التهمك بطبوط!</h2>
        </div>
      </div>
      <div id="newBest" class="newbest" hidden>🏆 رقم قياسي جديد! 🏆</div>
      <div class="stats">
        <div class="stat"><b id="stMass">0</b><span>أكبر حجم</span></div>
        <div class="stat"><b id="stTime">0:00</b><span>مدة البقاء</span></div>
        <div class="stat"><b id="stRank">#1</b><span>أفضل ترتيب</span></div>
        <div class="stat"><b id="stEat">0</b><span>كرات التهمتها</span></div>
      </div>
      <div id="oBest" class="obest"></div>
      <div id="oUnlocks"></div>
      <div id="oGoal" class="goal"></div>
      <div class="obtns">
        <button id="btnAgain" class="play small" type="button">العب مجددًا</button>
        <button id="btnMenu2" class="pbtn" type="button">القائمة</button>
      </div>
      <div class="enter-hint2"><span dir="ltr"><span class="sg-key">Enter</span> <span class="sg-key">مسافة</span> <span class="sg-key">R</span></span> للعب مجددًا</div>
    </div>
  </section>
</div>
<script src="../../shared/kit.js"></script>
<script src="skins.js"></script>
<script src="game.js"></script>
</body>
</html>
