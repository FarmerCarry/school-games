<stop offset=".55" stop-color="#ff9f1c" stop-opacity=".22"/>
<stop offset="1" stop-color="#ff8a1a" stop-opacity="0"/>
</radialGradient>
<radialGradient id="orb" cx="35%" cy="32%" r="65%">
