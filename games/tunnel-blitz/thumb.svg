<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="68%">
<stop offset="0" stop-color="#3c0c7a"/>
<stop offset=".45" stop-color="#140744"/>
<stop offset="1" stop-color="#051c3d"/>
</radialGradient>
<radialGradient id="core" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#fff"/>
<stop offset=".28" stop-color="#ffd6ff" stop-opacity=".9"/>
<stop offset=".65" stop-color="#ff4fd8" stop-opacity=".35"/>
<stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
</radialGradient>
<radialGradient id="orbHalo" cx="50%" cy="50%" r="50%">
