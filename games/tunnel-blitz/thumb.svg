<stop offset=".48" stop-color="#ffd23f"/>
<stop offset="1" stop-color="#ff8a1a"/>
</radialGradient>
<linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff"/>
<stop offset=".4" stop-color="#5af0ff"/>
<stop offset="1" stop-color="#5af0ff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="vig" cx="50%" cy="45%" r="72%">
<stop offset=".58" stop-color="#000" stop-opacity="0"/>
<stop offset="1" stop-color="#07021c" stop-opacity=".6"/>
</radialGradient>
<clipPath id="tile"><rect width="400" height="400"/></clipPath>
</defs>
<g clip-path="url(#tile)">
<rect width="400" height="400" fill="url(#bg)"/>
